# 사용자 승인 2026-08-08 — "LGBM으로 보정치 실험했던 내용 CatBoost위에서도 돌려서 베타값 찾아줘"
# + 재측 범위 "전부 다시" + 제출 준비 "zip까지 대기"
exp_id: exp_034
date: "2026-08-08"
title: "iter 승계 정책 교정 — 행 수 대비 argmin 곡선을 적합해 fold_2024·배포 iter를 다시 뽑는다"
base_exp: "exp_030 (C5_B3) · exp_033 (블록 자기 조기 종료 실측)"

# ---------------------------------------------------------------------------
scope_note: >
  ⚠️ **이건 보정 축 실험이 아니라 base 결함 교정이다.** 사용자가 승인한 것은 "보정치 실험을
  CatBoost 위에서 다시 돌려 β를 찾는 것"인데, exp_033이 **그 답을 못 내게 막는 결함**을
  base에서 찾았다. 두 가지가 걸린다:
  ① **채택 문턱이 부풀어 있다** — C5_B3의 시드 std가 구 base의 7.9배라 문턱이 46.61476점이 됐고
     격자 18칸 어디도 못 넘는다. 유력한 원인은 fold_2024 스태커 iter 481이 **시드 7·2024에서
     아직 내려가는 중**이라 시드마다 곡선의 다른 지점에서 멈춘 것이다.
  ② **제출 빌드가 같은 정책을 써야 한다** — 빌드는 `≤2024` 전체로 재학습하고 조기 종료를
     쓸 수 없으므로 iter를 외삽해야 하는데, 그 외삽 규칙이 지금 깨진 것으로 실측됐다.
  → **이 결함을 안 고치면 β도 못 고르고 zip도 근거 없이 만들게 된다.** 그래서 범위를 넓혔다.

hypothesis: >
  exp_033이 **행 수 선형 스케일 iter 승계 정책이 깨진다**는 것을 실측했다. 블록 2022에서
  스태커 정책값 282 vs 자기 argmin 80·140(2.0~3.5배 과대), 셀 `is_rev_only` 788 vs 230·240
  (3.3배 과대), `is_wayoff_true` 526 vs 625·725(**반대 방향으로 과소**).
  **한 방향으로 틀린 게 아니라 셀마다 부호가 다르다** → 선형 스케일이라는 함수 형태가 틀렸다.

  지금 **honest argmin이 세 크기에서 관측돼 있다**:
    653,728행(≤2021) · 870,752행(≤2022) · (fold_2024는 1,116,277행 — 미관측)
  스태커 argmin이 653,728 → 870,752에서 **110 → 362**(행 1.33배에 argmin 3.3배)로
  **강하게 초선형**이다. 481은 그 추세의 훨씬 아래다.
  → **`log(argmin)` 대 `log(행수)`를 적합해 외삽**하면 정직하게(fold_2024 valid를 안 보고)
  더 나은 iter를 뽑을 수 있다. 점 두 개로는 못 믿으므로 **세 번째 점을 만든다.**

# ---------------------------------------------------------------------------
stages:
  A_third_point:
    what: "블록 2021 유닛(train ≤2020, 약 430,000행) × 시드 42·7을 자기 조기 종료로 생성"
    why: >
      점 두 개짜리 외삽은 기울기를 못 가른다. 세 점이면 **로그-로그 선형이 맞는지 자체를
      검증**할 수 있다(잔차로). 안 맞으면 그 사실이 결론이고, 다른 형태를 찾아야 한다.
    cap: 1650
    invariant: "argmin이 cap에 닿으면 그 유닛 무효 — cap 올려 재실행"

  B_fit_curve:
    what: "셀 4개 + 스태커 각각에 대해 `log(argmin) ~ log(n_train)` 적합"
    report: >
      **적합의 잔차와 R²를 반드시 보고하라.** 점 셋이라 과적합이 자명하므로 R²가 높은 것은
      증거가 아니다 — **잔차의 크기**와 **세 점이 한 직선 위에 있는가**를 보라.
      로그-로그가 안 맞으면 대안(포화형·상수)도 함께 적합해 대조하라.
    honest: "⚠️ fold_2024·fold_2023 valid를 이 적합에 쓰지 마라. 블록 관측만 쓴다"

  C_rebuild:
    what: "적합에서 뽑은 iter로 **fold_2024 유닛 × 시드 42/7/2024를 재생성**"
    measure: >
      **핵심 산출물은 새 base의 시드 std다.** exp_030 구성의 3.881563e-05에서 줄어드는가.
      줄어들면 exp_033이 잰 +38.28802점이 문턱을 넘을 수 있다.
    also: "무보정 fold_2024 Brier 3시드 — 구 구성(724.98404)보다 좋아지는가"

  D_offset_recheck:
    what: "새 base 위에서 exp_033의 k×대상 격자 18칸 + β를 다시 적합·평가"
    reuse: "exp_033 `src/grid_c5.py` 승계. 학습 0건, 계산 1분 미만"
    discipline: "선택은 공급 블록에서만. fold_2024는 선택 후 진단으로 읽는다"

  E_deploy_iter:
    what: "배포용(`≤2024` 전체, 약 1,370,000행) iter를 같은 적합에서 뽑아 **기록만** 한다"
    why: "제출 빌드가 쓸 값이다. 이 실험은 빌드를 하지 않는다 — 근거만 남긴다"
    caution: >
      ⚠️ **외삽 구간이 관측 밖이다.** 적합은 430k~1,116k에서 만들어지는데 배포는 1,370k다.
      **외삽 배율과 그 위험을 명시하라.** 빌드할 때 "근거가 약하다"고 붙일지 판단할 재료다.

# ---------------------------------------------------------------------------
validation:
  primary_metric: "fold_2024 valid_all(R+F) Brier"
  gate: >
    ⚠️ **재현 게이트를 걸 수 없다** — 이 실험은 base를 **의도적으로 바꾼다.**
    대신 ① 블록 2023 s42가 exp_033 stage 3와 **bit-identical**인지(코드 경로 동일성)
    ② 새 fold_2024 유닛이 exp_030 구성과 **다른** 값을 내는지(안 바뀌면 iter가 안 바뀐 것)
    ③ 라벨 격리·as-of 재검증(`train.csv` 2차 읽기)을 전부 다시 통과할 것.
  adoption: >
    새 base가 exp_030 구성을 이겼는지는 **3시드 부호 일치 AND |평균Δ| ≥ exp_030 구성 시드
    std × 3**으로 판정한다. **완화 금지.**
    ⚠️ 단 이 실험의 주 산출물은 "이겼는가"가 아니라 **"시드 std가 줄었는가"**다. 그건 채택
    판정이 아니라 측정이므로 값을 그대로 보고하라.
  never: "fold_2024 valid로 iter를 고르는 경로 없음 — 적합은 블록 관측만 쓴다"

# ---------------------------------------------------------------------------
runtime:
  where: a5000
  expected_min: 85                          # 70~105
  eta_basis: >
    ⚠️ **exp_033이 ETA를 넘긴 원인을 반영했다** — "자기 조기 종료는 고정 iter의 약 3배"이며,
    exp_033 실측으로 stage-3 유닛은 653,728행 **13.9~14.1분**, 870,752행 **19.4~19.5분**
    (4-wide 경합 기준).
    - Stage A 블록 2021 (약 430k행) × 2시드, 동시 2: 행 수 비례로 **9~11분**
    - Stage B 적합: 계산 초 단위
    - Stage C fold_2024(1,116,277행) × 3시드, 동시 3: 870k의 1.282배 → 유닛당 **25~27분**,
      동시 실행이라 **벽시계 27~32분**. ⚠️ 새 iter가 지금보다 크면 더 걸린다 — 추세대로면
      스태커가 481 → 1000대이므로 **+5~10분** 여유를 둔다
    - Stage D 격자·β: **1분 미만**(exp_033 실측 0.638분)
    - 코드: exp_033 `block_self.py`·`grid_c5.py` 승계 접합 → **15~25분**
    - 회수·집계·리포트: **12분**
    → **70~105분.**
  concurrency: "동시 3~4, fit당 스레드 6 고정. ⚠️ exp_035(사후 변환)이 같은 서버에서 돌 수 있다 — 그쪽은 계산 1분 미만이라 경합 무시 가능"

deliverables: [metrics.json, report.md, "src/ (승계 sha + 신규)", "pred/ (블록 2021 2개 + 새 fold_2024 3개 + 채택 후보)", "curves/ (블록 2021 곡선 + iter 적합 + 새 k 곡면 + β 곡선)"]

audit:
  required: false
  why: "감사된 경로 위의 iter 정책 변경. 새 소스·조인·타깃 파생 없음"
  but: "⚠️ **제출로 가면 예외 없이 감사.** CatBoost 표면 셋이 실제 후보 경로에 있다"

risks:
  - "⚠️ **점 셋으로 외삽한다.** 로그-로그가 맞다는 보장이 없고, 배포 구간(1,370k)은 관측 밖이다. **적합의 잔차를 보고 안 맞으면 안 맞는다고 보고하라** — 억지로 외삽하지 마라"
  - "시드 std가 안 줄면 문턱이 높은 것은 **iter 탓이 아니라 이 구성 고유의 성질**이다. 그 경우 오프셋은 이 base 위에서 채택 불가이고, 그 사실이 결론이다"
  - "새 iter로 base가 오히려 나빠질 수 있다. 그러면 exp_030 구성을 유지하고 그 사실을 기록한다"
  - "블록 2021은 학습행이 430k로 작아 argmin이 매우 짧을 수 있다. 그래도 점으로서는 유효하나 **외삽 지렛대가 커져 기울기 오차가 증폭**된다 — 잔차로 판단하라"
  - "C5는 미튜닝 첫 시도값이다. 모든 수치는 그 설정 위에서만 유효하다"
