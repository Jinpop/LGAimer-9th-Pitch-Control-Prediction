# 사용자 승인 2026-08-08 "B하자" — 제출 빌드의 iter 근거 확정
exp_id: exp_036
date: "2026-08-08"
title: "1.1M행에서 스태커의 검열되지 않은 argmin 측정 — 배포 iter의 근거를 만든다"
base_exp: "exp_030 (C5_B3) · exp_034 (검열 발견)"

# ---------------------------------------------------------------------------
why: >
  **exp_034가 지금까지의 iter 논의 전체를 떠받치던 수가 검열돼 있음을 밝혔다.**
  exp_030의 fold_2024 유닛은 스태커를 **481까지만** 학습했고, 그 결과 시드 7·2024의
  argmin이 **정확히 481**로 나왔다. argmin이 cap과 같다는 것은 **곡선이 아직 안 꺾였다**는
  뜻이다. → **스태커의 진짜 fold_2024 argmin은 "≥481"까지만 알려져 있다.**

  같은 실험이 그 대가를 실측했다 — 스태커를 481에서 240으로 자른 것만으로 **−26.85795점**
  (`curves/loss_decomposition.json`, 셀을 고정한 채 잰 값이라 귀속이 깨끗하다).
  481도 같은 방향으로 손해를 보고 있을 수 있고, **제출 빌드의 iter는 481에서 스케일된다.**

  ⚠️ 그리고 exp_034가 적합한 법칙(스태커 241)은 **채택되지 않았다** — base를 −23.02235점
  악화시켰고 손실 전부가 스태커를 일찍 끊은 데서 왔다. 즉 **법칙도 481도 근거가 없다.**
  이 실험은 그 공백을 메운다.

goal: "제출 빌드가 쓸 스태커 iter에 **관측된 근거**를 만든다. 지금은 검열된 하한뿐이다"

# ---------------------------------------------------------------------------
design:
  unit: "fold_2024 (train ≤2023, 1,116,277행 → valid 2024) B3-C5 유닛"
  seeds: [42, 7, 2024]
  cells: >
    **셀 iter는 exp_030 값으로 고정한다** — `{is_mid_only 577, is_rev_only 1346,
    is_both 449, is_wayoff_true 897}`. 이 실험의 변인은 **스태커 하나**다.
    ⚠️ 셀까지 같이 바꾸면 exp_034가 겪은 귀속 불가에 다시 빠진다.
  stacker_cap: 3000
  cap_rationale: >
    481의 **6.2배**. exp_034가 관측한 블록 argmin(432k→65, 653k→106, 870k→362)의
    증가 추세를 1,116k로 밀면 어떤 형태를 쓰든 1000 아래이나, **그 법칙 자체가 기각됐으므로
    형태에 기대지 않는다.** 3000은 "곡선이 꺾이는 것을 볼 만큼 넉넉한가"만 보고 잡았다.
  invariant: >
    ⚠️ **argmin이 3000에 닿으면 이 실험은 실패다.** 그 경우 cap을 6000으로 올려 재실행하고
    그 사실을 기록하라. **검열된 값을 또 만들어 오지 마라 — 그게 이 실험의 존재 이유다.**

# ---------------------------------------------------------------------------
questions:
  Q1:
    ask: "스태커의 fold_2024 argmin은 얼마이고, **내부 극값인가**"
    matters: "이게 이 실험의 전부다. 세 시드 각각과 평균을 내라"
  Q2:
    ask: "481에서 그 argmin까지 얼마를 흘리고 있었는가"
    matters: >
      exp_030 구성(=제출 후보 L·M의 base)이 **얼마나 덜 학습된 상태였는지**의 크기다.
      점수로 환산해 보고하라.
  Q3:
    ask: "진짜 argmin에서 시드 std는 얼마인가"
    matters: >
      exp_034가 **같은 구성 안에서도 자르는 지점에 따라 시드 std가 10.36배 흔들린다**고
      실측했다(k=190에서 3.75e-06, k=481에서 3.88e-05). 진짜 argmin에서의 값이 채택 문턱의
      정직한 분모다. ⚠️ **이 값으로 과거 판정을 소급해 뒤집지 마라** — 사전 등록 규칙이다.
      새 분모는 **앞으로만** 쓴다.
  Q4:
    ask: "그 argmin에서 오프셋(`S400_self` @ β 0.59072)은 여전히 이득인가"
    matters: "제출 후보 M의 근거다. β는 공급 블록에서 재적합한다 — fold_2024로 고르지 않는다"
    cheap: "저장된 예측 위 사후 변환, 계산 1분 미만"

# ---------------------------------------------------------------------------
deploy_iter:
  what: "Q1의 argmin에서 배포용(`≤2024` 전체, 1,369,784행) 스태커 iter를 산출한다"
  how: >
    ⚠️ **행 수 선형 스케일도, exp_034의 적합 법칙도 쓰지 마라 — 둘 다 실측으로 깨졌다.**
    관측된 argmin 계열(432k·653k·870k·1,116k, 이제 마지막이 검열되지 않음)을 그대로 놓고
    **1,369,784로의 외삽을 여러 형태로 내되 그 폭(범위)을 보고하라.**
    단일 값을 확정하지 말고 **범위와 각 형태의 근거**를 제시한다 — 고르는 것은 지휘자·사용자다.
  honesty: >
    ⚠️ 배포 크기는 여전히 **관측 밖**이다. 이 실험이 없애는 것은 "fold_2024 argmin을 모른다"는
    구멍이지 "배포 argmin을 안다"가 아니다. **그 구별을 리포트에 분명히 적어라.**

# ---------------------------------------------------------------------------
method:
  reuse: "exp_030 `src/b3_cat.py` 승계(sha 기록). 셀 학습도 exp_030과 동일 경로"
  save: "스태커 학습곡선 **전체**(라운드별 valid Brier)를 시드마다 저장. 이 실험의 핵심 산출물이다"
  leak: "복원 라벨은 타깃 전용. OOF는 시간순. as-of forward-chaining. `train.csv` 2차 읽기로 재검증"
  never: "fold_2024 valid로 **셀** iter나 β를 고르지 않는다. 스태커 argmin은 이 실험이 재는 대상이지 고르는 대상이 아니다"

validation:
  gate: >
    스태커를 481 라운드에서 평가한 값이 exp_030을 재현해야 한다 —
    seed 42 **0.24803936078925748**, seed 7 **0.24798335833269683**,
    seed 2024 **0.24796480043729760**, 각 abs_diff < 5e-6.
    ⚠️ 기대값을 `exp_030/metrics.json`에서 **읽어** assert하라. 전사 금지.
    이 게이트가 통과하면 **같은 곡선을 더 멀리 그린 것**임이 증명된다.
  no_adoption_call: >
    ⚠️ **이 실험은 채택 판정을 하지 않는다.** 측정이다. argmin이 481보다 크면 그것은
    "더 좋은 구성을 찾았다"가 아니라 **"기존 구성이 덜 학습돼 있었다"**는 사실이다.
    새 구성을 배포 후보로 삼으려면 별도 판정이 필요하며 그건 지휘자·사용자 몫이다.

runtime:
  where: a5000
  expected_min: 30                          # 22~40
  eta_basis: >
    exp_034 실측 — fold_2024 유닛(1,116,277행, 셀 4 + 스태커) **16.73 / 18.18 / 17.98분**
    (3-wide 경합, 스태커 241라운드). 이번은 스태커를 **3000라운드**까지 밀어야 한다.
    exp_034의 스태커 초/라운드 실측 **0.06163초**(exp_031 `S400_self` 유닛 기준)로 잡으면
    3000라운드는 약 **3.1분** — 셀 학습과 OOF가 시간의 대부분이라 유닛당 **20~26분**.
    시드 3개 동시 → **벽시계 22~35분** + 오프셋 재적합 1분 미만 + 회수·리포트 5분.
    → **22~40분.**
  contention: >
    ⚠️ **submission-packager가 대기 중이고 leak-auditor가 병행 중일 수 있다.**
    원격 디렉터리를 `~/SungjinPark/experiments/exp_036/`로 분리하고
    **다른 프로세스를 kill하지 마라.** 동시 3개 · fit당 스레드 6 고정.

deliverables: [metrics.json, report.md, "src/ (승계 sha)", "curves/ (스태커 곡선 전체 × 3시드)", "pred/ (진짜 argmin에서의 예측 3개)"]

audit:
  required: false
  why: "exp_030과 동일 경로. cap만 늘렸다. 새 소스·조인·타깃 파생 없음"
  note: "⚠️ 이 결과로 제출 빌드의 iter가 바뀌면 그 빌드는 감사 대상이다(제출 전 예외 없음)"

risks:
  - "⚠️ **argmin이 3000에서도 안 꺾이면 실패다.** cap을 올려 재실행하고 기록하라. 그 경우 '스태커는 우리가 잰 범위에서 계속 좋아진다'가 결론이고, 그 자체가 중요한 사실이다"
  - "진짜 argmin이 481보다 훨씬 크면 **제출 후보 L·M의 로컬 수치(724.98404 / 763.27205)도 덜 학습된 모델의 값**이다. 즉 새 iter로 다시 재야 한다 — 비용이 더 든다"
  - "반대로 481 근처에서 꺾이면 exp_030 구성이 사실상 옳았던 것이고 빌드를 그대로 진행하면 된다"
  - "배포 크기(1,369,784행)는 여전히 관측 밖이다. 이 실험은 그 구멍을 메우지 않는다"
  - "C5는 미튜닝 첫 시도값이다. 모든 수치는 그 설정 위에서만 유효하다"
