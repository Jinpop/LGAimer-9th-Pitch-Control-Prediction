# 사용자 승인 2026-08-07 "던져" — 단, 발사 전 사실 정정으로 목적이 바뀌었음(아래 correction 참조)
exp_id: exp_029
date: "2026-08-07"
title: "배포 중인 `k400×league` 선택을 3시드로 재확인 + 격자 양쪽 감싸기 (학습 0건)"
base_exp: "exp_023 (선택 곡면 원본) · exp_024 arm B (승격) · exp_026 (k 확장, league만)"

correction: >
  ⚠️ **이 실험은 처음에 "`d_s`의 k × 대상 격자를 full로 훑은 적이 없다"는 지휘자의 오독에서
  출발했다.** 확인 결과 `exp_023/metrics.json`에 `k_grid = [0, 30, 55, 111, 200, 400, 800]`이
  `self`·`league` **양쪽 다** 들어 있다. full 격자는 이미 존재한다.
  오독의 출처: exp_028 리포트 §10의 "exp_026은 league 고정에 k만 훑었다"(exp_026에 한해 참)를
  지휘자가 `d_s` 전체로 넓혀 읽었다. **정정 후 남는 진짜 공백으로 목적을 다시 세웠다.**

hypothesis: >
  **exp_023의 선택 곡면은 seed 42 단독이다.** 그런데 후보 J(LB 899.2884396705)와 K가 배포한
  `k=400 × league`가 바로 그 단일 시드 곡면에서 골라졌다. **출하된 선택이 시드 하나짜리
  근거 위에 서 있다.** exp_024가 3시드로 승격시킨 것은 *그 한 칸*이지 *곡면 전체*가 아니다.
  → 곡면 자체를 3시드로 다시 그려 **argmin이 여전히 k400×league인지** 확인한다.

  덧붙여 두 공백을 같이 메운다:
  ① **k 1600·3200은 `league`만 확장됐다**(exp_026). `self` 쪽 고 k 구간은 미지다.
  ② exp_026의 **k 격차**(블록 면 argmin 400 vs fold_2024 면 argmin 1600, 1.58490점)가
     league에서만 관측됐다. `self`에서도 같은 어긋남이 나는지 모른다.

  ③ 그리고 exp_028이 `d_r`에서 **모든 k에서 `self` > `league`**를 관측했다 — `d_s`와 정반대다.
     **백오프 대상이 축에 종속적**이라면, `d_s`의 league 우위가 고 k 구간에서도 유지되는지가
     열려 있다. k≤800에서만 확인된 사실이다.

# ---------------------------------------------------------------------------
grid:
  k: [0, 30, 55, 111, 200, 400, 800, 1600, 3200, 6400]
  target: [self, league]
  arms: 20
  seeds: [42, 7, 2024]
  why_6400: >
    exp_026이 league를 3200까지 늘렸을 때 fold_2024 면이 **아직 감싸지지 않았을** 가능성이
    남았다. 6400을 넣어 **양쪽에서 감싸는 것을 확인**한다. exp_028의 `d_r` 곡면은 k=400에서
    내부 최대로 깔끔히 감싸졌으므로 `d_s`도 같은 형태를 기대할 근거가 있다.
  cost_note: "격자는 벡터 연산이라 칸을 늘리는 비용이 사실상 0이다 — exp_023이 14칸을 0.4분에 처리했다"

# ---------------------------------------------------------------------------
questions:
  Q1:
    ask: "3시드 블록 곡면의 argmin이 여전히 `k400 × league`인가"
    matters: "아니면 **배포 중인 선택이 단일 시드 우연**이었다는 뜻이다. 그 경우 즉시 보고 대상"
    how: "시드별 블록 곡면 3개를 각각 그리고, 시드마다 argmin을 내라. 3시드 평균 곡면의 argmin도 따로"
  Q2:
    ask: "`self`의 고 k 구간(1600·3200·6400)은 어떤 모양인가 — league와 교차하는가"
    matters: "exp_028이 `d_r`에서 self 우위를 봤다. `d_s`에서 고 k에 교차점이 있으면 '축 종속'이 아니라 'k 종속'일 수 있다"
  Q3:
    ask: "블록 면 argmin과 fold_2024 면 argmin의 격차가 `self`에서도 나는가"
    matters: "league에서만 나면 리그 백오프 특유의 문제, 양쪽 다 나면 곡면 추정 일반의 문제"
    discipline: "⚠️ **fold_2024 면은 진단으로만 본다.** 이 값으로 k나 대상을 고르지 않는다"
  Q4:
    ask: "곡면이 **양쪽에서 감싸졌는가** (내부 극값인가)"
    matters: "경계에서 최적이면 격자를 더 늘려야 하고, 그때까지 그 선택은 무효다(규약 #3 cap 적응화의 격자판)"

# ---------------------------------------------------------------------------
selection_discipline:
  rule: >
    **선택은 공급 블록(2022+2023)에서만.** fold_2024는 선택이 끝난 뒤 진단으로 읽는다.
    exp_023이 확립한 규율이고, 그때 정직하게 고른 대가가 2.66995점으로 측정됐다.
  report: "블록 선택과 fold_2024 오라클 선택이 갈리면 그 격차를 점수로 보고하라. 갈려도 블록 선택을 따른다"
  no_new_deployment: >
    ⚠️ **이 실험은 새 배포 후보를 만들지 않는다.** 목적은 이미 출하된 선택의 재확인이다.
    3시드 곡면이 다른 칸을 가리키면 그건 **보고 대상**이지 자동 교체 사유가 아니다 —
    교체는 별도 실험(3시드 승격 + 감사 + packager)을 거친다.

# ---------------------------------------------------------------------------
method:
  no_training: true
  reuse:
    base_pred: "exp_024 `pred/` — B3 base × 시드 42/7/2024 (fold_2024) + 블록 2022·2023"
    code: >
      **exp_028 `src/fit_solo.py`를 뼈대로 승계**하라(sha `a3b9f98c72203b0fa997fb9fcf4c25e4759264ba8f1520aaf467f149ee54592f`).
      성공축 경로는 이미 그 안에 있다 — 격자만 확장하면 된다. 승계 7모듈은 바이트 보존하고 sha 기록.
    assert: "규약 #5 — sha256 대조 후 재사용, 불일치 시 중단"
  float_form: "전개형 `d=(s−n·overall)/(n+k)`, 리그항 `L·(k/(n+k))`. 미적중 행에서 d=0.0을 k 격자 10개 전부에 assert"
  beta: "칸마다 공급 블록에서 닫힌 해로 재적합. β는 변인이 아니라 종속 산출값"

validation:
  primary_metric: "fold_2024 valid_all(R+F) Brier (진단) / 블록 Brier (선택)"
  gate: >
    `k400 × league`가 exp_024 arm B를 재현해야 한다 — seed42 **0.24799968498605615**,
    seed7 **0.24801856644746204**, seed2024 **0.2480065100917605**, 각 abs_diff < 5e-6.
    `k111 × self`도 exp_022 BK1f를 재현해야 한다 (fold_2024 Brier 0.2480377446210693).
    `k0_self == k0_league`를 assert (구조상 동일 — exp_023이 확인한 성질)
  segments: "argmin 칸과 배포 칸에 한해 valid_R/valid_F · 투수손 1/2 · 적중/미적중"

# ---------------------------------------------------------------------------
runtime:
  where: a5000
  expected_min: 14                          # 10~18
  eta_basis: >
    학습 0건. 실측 계보 — exp_023(격자 14칸 × 1시드) **0.4분**, exp_025(arm 5 × 3시드) 0.35분,
    exp_026(arm 8 × 3시드 + 신규 표 2종) 0.52분, exp_028(arm 7 + 격자 18칸 × 3시드) **1.10분**.
    이번은 **격자 20칸 × 3시드 = 60평가 + 블록 곡면 3개**. 신규 집계표는 없고(성공축 표는
    승계), 격자는 벡터 연산이다 → **계산 0.8~1.3분**.
    코드는 `fit_solo.py`에서 격자 확장 + 시드별 곡면 분리뿐이라 **8~14분**. 회수·집계 3분.
    → **10~18분.**
  contention: >
    ⚠️ **exp_027이 같은 서버에서 학습 중이다**(동시 3개 × 스레드 6). 원격 작업 디렉터리를
    `~/SungjinPark/experiments/exp_029/`로 분리하고 `OMP_NUM_THREADS=2`로 돌려라.
    **exp_027의 프로세스를 kill하거나 그 디렉터리에 쓰지 마라.**

deliverables: [metrics.json, report.md, "src/ (승계 sha + 신규분)", "curves/ (시드별 블록 곡면 3개 + fold_2024 곡면)"]

audit:
  required: false
  why: "exp_023/024/026과 동일 경로. 새 소스·새 조인·새 타깃 파생 없음. 격자 확장과 시드 추가뿐"
  note: "제출로 갈 때는 예외 없이 감사"

risks:
  - "3시드 곡면이 여전히 k400×league를 가리킬 가능성이 높다 — 그러면 **출하된 선택이 재확인된 것**이고 그 자체가 값어치다. '아무것도 안 나왔다'로 적지 마라"
  - "다른 칸을 가리키면 **배포 중인 후보 J·K의 근거가 흔들린다.** 그 경우 즉시 보고하고, 교체는 별도 절차(3시드 승격 + 감사 + packager)를 밟는다. 이 실험이 직접 교체하지 않는다"
  - "k=6400에서도 감싸지지 않으면 격자를 더 늘려야 하고, 그때까지 고 k 구간의 결론은 무효다"
  - "블록 곡면이 시드마다 다른 argmin을 내면 **곡면 자체가 시드에 민감**하다는 뜻이다 — 그건 k 선택 전체의 신뢰도 문제이며 별도로 서술하라"
