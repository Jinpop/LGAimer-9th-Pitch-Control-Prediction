## stage 1 — OOT 시드 8개 (정직면 측정용)
## ══════════════════════════════════════════════════════════════
마스크: "🔴 `(s <= 2023) & ~((s <= 2022) & (g == 'F'))` = **1,116,277행** → 예측 season==2024 전체 **253,507행**. 둘 다 assert."
시드: "배포 42·777·2024·101 **밖의** 8개 — 1·7·13·77·202·404·808·1234 (겹치면 안 된다)"
합성: "🔴 배포 규약과 같게 — **확률의 로짓평균**(v6 는 `expit(W_LGB·lg + W_CAT·lg + ...)` 이므로 Cat 내부도 로짓평균)"
산출: "`p_cat12_oot2024.npy` (배포 4 + 새 8 = 12시드) 및 `p_cat4_oot2024.npy` 재현본"
🔴 대조: "팀원 납품 `p_cat_oot2024.npy`(4시드 OOT)와 우리 4시드 재현본을 대조하라. 여기가 계열 동일성의 실물 증거다."

## ══════════════════════════════════════════════════════════════
## stage 2 — 정직면 측정 (이 실험의 답)
## ══════════════════════════════════════════════════════════════
방법: >
  p_v6 를 두 판으로 조립해 **블렌드 전체**에서 잰다 —
    v6_4  = expit(0.05·lg(lgb) + 0.68·lg(**cat4**)  + 0.12·lg(leaf))/0.85 재정규화
    v6_12 = expit(0.05·lg(lgb) + 0.68·lg(**cat12**) + 0.12·lg(leaf))/0.85 재정규화
  (NN 자리는 양쪽 다 비운다 — 그래야 **cat 시드 수 하나만** 다른 변인이 된다)
  블렌드: `z = 0.70·((1.10)·(0.70·lg(v6) + 0.30·lg(q)) − 0.10·lg(ebm) + 0.03·off) + 0.25244·lg(AA81) + 0.04756·lg(T70)`
  `p = expit(α·z + β·z²)`, α 1.07911 · β −0.059151, 재센터링 후 채점.
  🔴 배포 상수 그대로. **이 실험은 상수를 건드리지 않는다.**
주지표: "Δ = score(v6_12) − score(v6_4), 정직면 재센터링 눈금"
필수_보조:
  - "팔 눈금 Δ: cat12 단독 − cat4 단독"
  - "🔴 **시드 곡선 실측**: 4·6·8·10·12 시드에서 각각 재서 1/n 모형과 맞는지. 안 맞으면 외삽이 틀린 것이다"
  - "🔴 **전이 배율 적용**: exp_072 실측 **0.3929~0.5463**(범위로). 단일 배율 모형 금지(S2)"
사전_등록_판정: >
  🔴 **정직면 Δ ≥ +1.0 이면 배포 시드 8개를 추가로 학습해 후보를 만든다.** 미만이면 이 축을 닫는다.
  근거: 전이 배율 하한 0.3929 를 곱하면 LB +0.39 — 슬롯 하나의 최소 기대값. 결과 보고 바꾸지 않는다(S8).

