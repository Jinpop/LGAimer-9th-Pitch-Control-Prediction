exp_id: exp_077
date: "2026-08-21"
type: "시드 확장. 학습 있음. 제출물 없음(측정 먼저)."
목표: "v6 내부 CatBoost 를 4시드 → 12시드로 늘렸을 때의 이득을 정직면에서 **측정**한다."

## ══════════════════════════════════════════════════════════════
## 왜 이 표적인가
## ══════════════════════════════════════════════════════════════
근거_1_실적: "후보 Q 가 **시드 1→3 만으로 LB +15.0163932159** 를 벌었다(우리 역사상 2위 단일 이득). 시드 축은 이 대회에서 검증된 축이다."
근거_2_지분: >
  BN 이후 실효 지분 — z = 0.539·lg(v6) + 0.231·lg(Q) − 0.070·lg(EBM) + 0.25244·lg(AA) + 0.04756·lg(T70),
  v6 내부는 0.05 LGB / **0.68 Cat** / 0.15 NN / 0.12 Leaf.
  → **v6-Cat 실효 지분 0.539 × 0.68 = 0.3665 로 블렌드 최대 단일 성분.** 그런데 시드가 **4개**뿐이다.
  (우리 AA 는 18시드로 천장 근처, 나머지는 전부 3~4시드)
근거_3_곡선: "지휘자 실측(AA81 3시드): score(n) = 887.58 − 35.99/n. **4→12 시드 예측 이득 = 35.99×(1/4−1/12) = +6.00 팔 눈금.** T70 도 같은 모양(1→3 +10.56)."
근거_4_가능: "팀원이 **배포 아티팩트에서 직접 읽은** 하이퍼파라미터를 1차 README 에 전부 적어 보냈다. 우리는 A5000 이 놀고 있고 팀원은 코어 2개다."
근거_5_소명: "🔴 **'시드를 더 평균했다'는 Phase 3 소명이 필요 없다.** 새 정보도, 새 상수도, 새 자유도도 없다."

## ══════════════════════════════════════════════════════════════
## 🔴 stage 0 — 재현 게이트. 학습 전에 한다.
## ══════════════════════════════════════════════════════════════
왜: "우리가 만든 시드가 **배포 4시드와 같은 계열**이 아니면 평균이 오염된다. BM·exp_071 교훈."
G0a_하이퍼: >
  `mate/model/cat_42.cbm` 을 `get_all_params()` 로 읽어 1차 README 기재값과 대조하라 —
  354 iter · lr 0.06 · depth 6 · l2 10 · Bernoulli subsample 0.8 · one_hot_max_size 2
  · border_count 64 · Plain · has_time False · cat_features 인덱스 [4,10,13,14,45].
  **불일치하면 중단하고 보고.** README 가 아니라 **아티팩트가 정본**이다.
G0b_피처: "v6 가 쓰는 열 목록을 배포 아티팩트에서 읽어(`get_feature_names()` 또는 `lgb_cats.json`) 우리 프레임과 대조. 없는 열이 있으면 그 사실을 먼저 보고."
G0c_범주형_규약: >
  🔴 1차 README 경고 — **팔마다 다르고 틀리면 예외 없이 조용히 전 범주가 NaN 이 된다**:
  `Cat: X[c].astype(str) + cat_features=[4,10,13,14,45]`.
  우리 재적합이 이 규약을 따르는지 **범주 미매핑 행 수를 세어** 확인하라.
G0d_동일성: >
  🔴 **배포 시드 하나를 우리 코드로 재적합해 배포본과 대조**하라.
  판정 기준은 바이트 동일이 **아니다**(S17 — LightGBM `.txt` 도 `.cbm` 도 재학습으로 바이트 재현 안 된다).
  **잎값 상관 ρ 와 예측 상관**을 내고, **배포 시드끼리의 상관을 재현 상한으로** 삼아라(NN 사양서 §5 규약 승계).
  우리 재적합이 배포 시드쌍 상관 대역 안이면 같은 계열이다.
🔴 정지점: "G0a 불일치 또는 G0d 에서 우리 재적합이 배포 시드쌍 대역 **밖**이면 중단하고 보고하라. 학습을 더 하지 마라."

