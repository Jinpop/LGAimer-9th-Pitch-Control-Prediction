## 🔴 통과 시의 출하 비용 — 미리 적어둔다
## ══════════════════════════════════════════════════════════════
비용: >
  배포용 시드는 **≤2024 마스크**(`~((s<=2022)&(g=='F'))` = 1,369,784행)로 따로 학습해야 한다.
  그리고 `mate/` 안에 `cat_*.cbm` 8개가 추가되고 **`mate/v6_infer.py` 의 평균 루프를 고쳐야 한다** —
  "파트너 패키지 바이트 그대로 출하"가 **코드 수준에서** 깨진다. C단이고 감사가 무겁다.
  ⚠️ 그러나 **새 정보·새 상수·새 자유도가 0** 이라 소명은 가장 쉬운 종류다.
사전_확인: "stage 0 에서 `v6_infer.py` 의 시드 평균 루프가 **파일 목록 기반인지 하드코딩인지** 확인해 보고하라. 하드코딩이면 상이 파일이 하나 더 는다."

