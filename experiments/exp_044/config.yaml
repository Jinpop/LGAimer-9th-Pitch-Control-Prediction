# 사용자 승인 2026-08-11 "가자"
exp_id: exp_044
title: "셀별·스태커별 개별 하이퍼파라미터 탐색 + 새 base의 시드 σ를 n=9로 재측정"
date: "2026-08-11"

# ⚠️ 번호: 041·042는 팀원 A가 썼고 우리 HPO 1차도 exp_042로 나갔다(충돌).
#    산출물은 사후 수정하지 않으므로 그대로 두고, 우리 번호는 044부터 쓴다. 043은 비워둔다.

# ---------------------------------------------------------------------------
question: >
  exp_042는 **셀 하나(`is_wayoff_true`) · 시드 하나**에서 설정을 골라 **다섯 모델 전부**에 얹었다.
  세 군데가 비어 있다:
    ① 셀 4개는 서로 다른 문제다 — 필요 학습량이 378~1887로 **5배** 갈린다
    ② 스태커는 입력이 **네 셀의 확률 + 피처**라 성격이 아예 다른데 근거 없이 같은 설정을 썼다
    ③ 탐색이 시드 하나라 순위에 잡음이 섞였다 (상위 10개 폭 3.578e−05)
  **그리고 새 base의 시드 σ를 아직 모른다** — exp_042가 n=3에서 3.75배 안정(3.8816e−05 → 1.0362e−05)을
  관측했으나 exp_039가 자유도 2 추정치는 2.9배로 흔들린다고 실측했다.

# ---------------------------------------------------------------------------
# 🔴 이 실험의 진짜 산출물은 σ다 (2026-08-11 사용자와 합의)
# ---------------------------------------------------------------------------
why_sigma_is_the_point: >
  사용자 계획: 이후 **피처 추가 · NN/LGBM 앙상블 · 구종 모델**을 시도한다.
  🔴 **하이퍼파라미터는 피처 세트에 종속이라 지금 찾은 8차원 점은 피처가 바뀌면 낡는다.**
  NN·LGBM은 자기 탐색이 따로 필요해 이 작업이 전이되지도 않는다.
  **버려지지 않는 것은 둘뿐이다:**
    ① **잡음 바닥 σ** — 앞으로의 모든 판정이 이 분모를 쓴다. 문턱이 46.62면 exp_037(+30.96222)처럼
       **진짜 신호를 계속 기각**한다. σ는 설정의 성질이라 피처가 바뀌어도 대체로 따라온다.
    ② **파라미터의 "모양"**(더 깊게·더 강한 정규화·열 표본) — 점이 아니라 방향이라 덜 낡는다.
       ⚠️ **이건 추론이지 측정이 아니다.**
  → **따라서 셀 탐색 예산을 줄이고 σ에 쓴다.** "점을 정밀하게 찾기"는 명시적으로 포기한다.

# ---------------------------------------------------------------------------
phase_1_cells:
  targets: ["is_mid_only", "is_rev_only", "is_both", "is_wayoff_true"]
  independence: "셀 4개는 각자 자기 이진 타깃의 모델이라 **서로 독립**이다. 따로 탐색해도 된다"
  fold: "fold_2023 (train ≤2022 → valid 2023). 🔴 fold_2024는 열지 마라 — fold-oracle(후보 O 결함)"
  objective: "그 셀 자기 이진 타깃의 logloss"
  n_trials: 55                            # 사전 등록. 결과를 본 뒤 늘리지 마라
  sampler: "Optuna TPESampler(seed=42), batched ask/tell, 10 워커 × threads 2"

  seed_policy:                            # ㉯ 2단계
    stage_screen: "55 trial 전부 **시드 42 단독**"
    stage_confirm: "상위 **15개**만 시드 7·2024를 추가해 **3시드 평균 logloss로 재순위**"
    pick: "재순위 1위를 그 셀의 설정으로 채택"
    ⚠️: >
      **약점을 명시한다**: TPE가 **잡음 섞인 1시드 신호로 탐색을 유도**하므로 "잡음으로 좋아 보이는
      구역"으로 갈 수 있다. 재평가는 **최종 선택만** 지키고 **탐색 경로는 못 지킨다.**
      전부 3시드(㉮)면 그것까지 막지만 17.5시간이고, 점은 어차피 피처가 바뀌면 낡는다.

  search_space:
    narrow_fraction: 0.75
    narrow: >
      exp_042 상위 10개가 뭉친 구역에 여유를 준 것:
      `depth 7~10` · `l2_leaf_reg 10~80(log)` · `learning_rate 0.008~0.030(log)` ·
      `subsample 0.70~0.95` · `rsm 0.45~0.95` · `random_strength 0.3~1.3` ·
      `min_data_in_leaf 1~150` · `one_hot_max_size 2~10`
    wide_fraction: 0.25
    wide: "exp_042 원본 공간 그대로 (`depth 4~10` · `l2 1~100` · `lr 0.01~0.10` · `subsample 0.6~1.0` · `rsm 0.5~1.0` …)"
    🔴_why_reserve: >
      **좁힌 구역은 `is_wayoff_true` 한 셀에서, 그것도 1시드로 찾은 것이다.**
      다른 세 셀이 같은 구역을 원한다는 근거가 없다 — `is_mid_only`는 argmin 240, `is_rev_only`는 1200으로
      **문제 크기부터 다르다.** 25%를 넓은 공간에 남겨 잠김을 막는다.
    🔴_diagnostic: >
      **어느 셀의 최종 1위가 `wide` 쪽에서 나오면 즉시 보고하라** — 그 셀에 대해 좁힘이 틀렸다는 신호이고,
      *"exp_042의 구역이 셀 간에 전이되지 않는다"* 는 별도의 발견이다.

  iter_policy: >
    `iterations`는 탐색 대상이 아니다. 각 trial이 **자기 검증곡선에서 조기 종료**한다.
    🔴 **cap 3300에서 시작하라** — exp_042가 cap 1650에서 **21.3%(32/150)를 검열**했다.
    cap에 닿으면 **무효 처리하고 cap을 올려 다시 돌려라.** 검열된 곡선에 적합하는 것이
    exp_034가 −23.02235점을 맞은 원인이다. **arm별 iter를 전부 기록하라.**

phase_2_stacker:
  depends_on: "phase 1 — 스태커 입력이 **새 셀들의 OOF 확률**이므로 셀이 확정된 뒤에만 가능하다"
  n_trials: 55
  seed_policy: "phase 1과 동일 (55 × 1시드 → 상위 15 × 3시드)"
  🔴_search_space: >
    **좁히지 마라. 넓은 공간을 쓴다.**
    근거: 스태커의 입력은 원 피처가 아니라 **네 셀의 확률 + 피처**다. 문제의 성격이 셀과 다르므로
    셀에서 찾은 구역을 물려줄 근거가 없다. **exp_042가 스태커에 셀 설정을 얹은 것이 바로 이 실험이 고치는 것이다.**
  note: "스태커 fit은 셀보다 싸다(exp_042 stage-1 새 설정 argmin 350). 55 trial이 부담이 아니다"

# ---------------------------------------------------------------------------
phase_3_promotion:
  what: "다섯 개 새 설정을 fold_2024에서 대조군과 겨루고, **동시에 새 base의 σ를 n=9로 잰다**"
  control: >
    **exp_042 탐색 1위를 다섯 전부에 얹은 것** (= 후보 Z의 설정).
    🔴 이렇게 두면 Δ가 **"셀별 맞춤 vs 한 벌 공유"** 를 정확히 분리한다.
    ⚠️ 현행(depth 6) 설정이 아니다 — 그건 exp_042가 이미 이겼다.
  seeds: [42, 7, 2024, 1, 13, 101, 777, 2025, 31337]     # 사전 등록, 9개, 양 arm 모두
  n_units: 18                             # 2 arm × 9 시드
  metric: "fold_2024 valid_all(R+F) Brier + 환산 점수"
  ⚠️_no_valid_F: "**valid_F로 판정하지 마라** — F 세그먼트가 LB와 네 번 연속 어긋났다. 세그먼트 값은 기록만"

  🔴_sigma_and_threshold:                 # 값을 보기 전에 등록한다
    sigma_recipe: "σ = **대조군 arm 9시드** Brier의 std(**ddof=1**) → 환산 점수로 변환"
    threshold: "3σ"
    verdict: "**3시드 이상 부호 일치가 아니라 9시드 전부의 부호 + |평균Δ| ≥ 3σ**"
    ⚠️_not_circular: >
      σ는 **대조군 arm에서만** 나오고 처리군의 평균과 독립이다. 기존 규칙(*대조군 시드 std × 3*)과 같은 형태다.
      **분자를 본 뒤 분모를 고르는 것이 아니다** — 레시피가 여기 먼저 적혀 있다.
    🔴_forward_only: >
      **이 σ는 앞으로만 적용한다.** exp_043 이하의 과거 판정을 새 σ로 다시 계산하지 마라
      (exp_033/exp_036 ddof 사고의 본질이 그것이다). 새 σ가 적용되는 첫 실험은 **exp_045**다.
    ⚠️_scope: >
      새 σ는 **이 base·이 피처 세트**의 값이다. 피처가 바뀌면 다시 재야 한다.
      "σ가 3.75배 줄었다"를 영구 사실로 적지 마라.

# ---------------------------------------------------------------------------
runtime:
  expected_h: 12                          # 11~13
  eta_basis: >
    🔴 **exp_042의 ETA 실패에서 배운 대로 "공간에서 가장 비싼 구석"으로 잡는다**
    (대조군 fit으로 매기면 안 된다 — 그게 60~90분 → 224분 초과의 원인이었다).
    - 셀 탐색: 4셀 × (55 + 15×2) = **340 fit**. exp_042 실측 fit 중앙 9.04분·최대 13.21분(threads 2, 10-wide).
      셀별 argmin이 240~1200으로 갈리므로 평균 **약 8분**으로 잡으면 340×8÷10 = **4.5시간**.
      ⚠️ cap 1650 → 3300이라 검열되던 꼬리가 더 길게 돈다. **상단은 6시간으로 본다.**
    - 스태커: 55 + 30 = 85 fit + 셀 OOF 재생성 1회 → **1~1.5시간**
    - 승격 18유닛: exp_042 hpo fold_2024 유닛 실측 **66.6~66.7분**, 3-wide 6웨이브 → **6.7시간**
    → **총 12.2~14.2시간.** (원 권고 15~16h에서 셀 예산을 줄여 낮췄다)
  concurrency: "탐색 10 워커 × threads 2 (탐색 한정 예외). **승격은 threads 6 · 동시 3 고정**"
  ⚠️: "첫 셀이 끝나면 실측으로 ETA를 갱신해 `logs/eta_update.txt`에 남긴다"

# ---------------------------------------------------------------------------
deliverables:
  - "`metrics.json` — 셀 4개 + 스태커 각각의 상위 10 · 1위 · `param_importances` · 좁힘/넓힘 출처 · 검열 통계"
  - "**셀별 1위 설정 5벌**과 exp_042 단일 설정의 차이 표"
  - "승격 9시드 × 2 arm의 Brier·환산·Δ, **σ(ddof=1)와 문턱**, 판정"
  - "🔴 **새 σ를 `EXPERIMENTS.md` 기록 규칙의 σ 경계선에 등재**(적용은 exp_045부터)"
  - "실측 시간 → `orchestration/실행시간_실측.md`"

do_not:
  - "🔴 **fold_2024를 탐색에 쓰지 마라** (fold-oracle = 후보 O 결함)"
  - "🔴 **n_trials를 결과를 본 뒤 늘리지 마라** (55 사전 등록)"
  - "🔴 **σ 레시피·문턱·시드를 값을 본 뒤 고치지 마라**"
  - "🔴 **새 σ로 과거 판정을 다시 계산하지 마라** — 적용은 exp_045부터"
  - "🔴 **스태커 공간을 셀 구역으로 좁히지 마라** — 그게 이 실험이 고치는 오류다"
  - "⚠️ **제출물(zip)을 만들지 마라.** 승격이 통과하면 지휘자가 별도 빌드를 설계한다"
  - "⚠️ 자기가 쓴 리터럴을 자기가 assert하지 마라 (2026-08-10 규약 4) — 게이트는 관측된 상태를 봐야 한다"
  - "⚠️ 산출물에 다른 파일의 상태를 확인 없이 단정문으로 쓰지 마라"
  - "⚠️ **후보 Z의 작업 영역(`~/SungjinPark/build_Z/`)을 건드리지 마라.** Z가 끝난 뒤 시작한다"
