exp_id: exp_059
date: "2026-08-19"
hypothesis: >
  팀원 `sp_*` 6열(투수·타자 개인 × 상황 로짓 편차, EB 수축 k=75)이
  **현행 블렌드 잔차 위에** 오프셋으로 남은 신호를 갖는가.
  판정은 방향(부호)까지이고 크기는 LB 로 잰다.
base_exp: 후보 BG (배포 블렌드, LB 1112.251888309)

동기: >
  🔴 **지휘자 자기정정에서 나온 실험이다.** "08-16 22축 스크리닝에서 이미 음성"이라고
  판단했으나 확인하니 두 겹으로 틀렸다:
    ① 22축 목록도 코드도 남아 있지 않다 (08-16 은 exp 번호조차 없다 —
       exp_052 08-15 와 exp_053 08-17 사이 공백). 남은 것은 대장 한 줄 요약뿐이다.
    ② 대조군 "투수손×타자손"은 exp_023 계보의 `L(투수손, 타자손)` = **리그 테이블**로
       읽힌다. `sp_pit_bhand` 는 **투수 개인 792명 × 타자손**이고 코드가 리그 주효과를
       의도적으로 뺀다(`lgc`). 다른 구조다.
    ③ 정찰 문서가 스스로 적었다 — *"우리 22축 스크리닝은 **우리 팔** 잔차 기준 음성 —
       **블렌드** 잔차는 미측정. 부분 빈칸."* 현 배포는 5팔 블렌드다.

🔴_발사_전_확인한_사실_기대치를_낮춘다: >
  `arms/capture.log` 실측 — 파트너 v6 팔의 **LightGBM·CatBoost·leaf 는 이미 99열
  (= sp_* 포함)을 본다** ("SP columns attached (22 new)", "features_sp=99").
  즉 sp_* 는 블렌드에 **없는 것이 아니라 과소 대표**돼 있다.

  | 팔 | 가중 | sp_* 를 보는가 |
  |---|---|---|
  | v6 내부 CatBoost·LGBM·leaf | 0.327 | ✅ 본다 |
  | v6 내부 NN | 0.058 | ❌ (77열) |
  | Q | 0.385 | ❌ (capture.log "base features=77") |
  | 우리 AA + T70 | 0.300 | ❌ (81열 = 51 + ins16 + p6/idea/i3 14) |
  | EBM | −0.070 | 미확인 |
  → **가중의 약 2/3 가 이 신호를 못 본다.** 잔차에 남아 있다면 그 몫이다.
  ⚠️ 반대로 0.327 이 이미 흡수했을 수도 있다. 그것을 가리는 것이 이 실험이다.

측정면:
  주면_A_블렌드_표본내:
    프레임: "tr2024 보정 프레임 (train season==2024, 253,507행)"
    r0: "후보 BG/BH 빌드가 이 프레임에서 계산한 현행 블렌드 예측 (assemble_bh.py 산출물 재사용, sha 대조 후)"
    ⚠️_성질: >
      이 프레임은 **다섯 팔 전부에 표본 내**다(우리 AA 팔만 해도 표본 내가 1163.68점 유리).
      따라서 **크기는 못 믿는다.** 쓰는 것은 부호뿐이며, 그 용도로는 실적이 있다 —
      BA·BB·BC·BE 네 후보에서 표본내 M 의 부호가 LB 선형항 부호를 **4/4** 맞혔다
      (크기 비는 0.047~0.714 로 15배 흩어졌다).
  교차면_B_팔_out_of_time:
    프레임: "fold_2024 (train ≤2023 → valid 2024), 우리 AA 팔 3시드 평균 예측"
    목적: >
      A 면의 표본내 편향을 밖에서 한 번 본다. 08-16 22축 스크리닝과 **같은 눈금**이라
      그 결과와 직접 비교 가능하다 (그 코드는 없지만 프로토콜은 대장에 기록돼 있다).
    ⚠️: "이 면은 팔이지 블렌드가 아니다. A 와 B 가 갈리면 그 자체가 정보다(팔이 흡수했나 vs 블렌드에 남았나)"

후보_방향: >
  `splits.py` 의 6열 전부. **중심화(δ − mean δ) 필수** — BH 에서 밟은 함정이다
  (비중심화하면 26/26 이 양수로 나오고 중심화하면 12/26 만 남았다).
  | 열 | 내용 |
  |---|---|
  | sp_pit_bhand | 투수 개인 × 타자손 |
  | sp_bat_phand | 타자 개인 × 투수손 |
  | sp_pit_strk2 | 투수 개인 × 2스트라이크 |
  | sp_pit_ball3 | 투수 개인 × 3볼 |
  | sp_pit_bhand_all | 투수 개인 전체 수준 (로짓) |
  | sp_bat_phand_all | 타자 개인 전체 수준 (로짓) |
  ➕ 대조군 2개: ① 무작위 순열 δ (귀무) ② `asof_pitcher_success_rate` 중심화
     (팔이 확실히 보는 열 — "흡수됐으면 0 이 나온다"의 눈금)

sp_표_생성:
  코드: "~/Downloads/sp_def/splits.py 무수정 (sha 기록)"
  as_of: >
    🔴 **연도별 루프.** A·B 두 면 모두 2024 행이므로 표는 `splits.build(train[season<2024])`.
    배포용 `deploy_splits.npz`(≤2024)를 쓰면 자기 답을 본다 — 쓰지 않는다.
  검증_게이트: >
    G1. 생성한 표로 만든 sp_* 6열의 mean/sd 가 sp_def README §6 통계와 **분포 수준에서 정합**
        (§6 은 전 기간 1,475,092행 값이라 2024 단면과 정확히 같지 않다 — 자릿수 대조용)
    G2. 2019 행 NaN 237,413 (README §4-1) — 이번 면은 2024 단면이라 해당 없음, 결측 0 확인
    G3. `splits.apply` 가 내놓는 10열 중 `_n` 4열도 함께 보관 (미지 주체 플래그)

판정:
  1차_방향: "표본내 M 의 부호 + 투수 블록 부트스트랩 t (1000회). |t| ≥ 2 를 통과선으로 사전 등록"
  2차_크기: "🔴 하지 않는다. 표본내 크기는 LB 로 전이되지 않는다(비 0.047~0.714). 통과 축이 있으면 LB 프로브 1점으로 꼭지점을 푼다"
  정지점: >
    중심화 후 |t| ≥ 2 인 축이 **0개**면 이 축을 닫고 기록만 남긴다.
    (BH 계열과 달리 여기서는 8차원 가중을 적합하지 않는다 — 축마다 스칼라 하나다)
  ⚠️_선별_누수_고지: >
    `sp_*` 의 k=75 와 4축 자체가 **fold_2024 BSS 와 2023~24 전이상관으로 선택**됐다
    (splits.py 주석 자백). 즉 A·B 두 면 다 그 선택에 이미 쓰였다.
    → **이 실험은 sp_* 를 검증하지 않는다. "이미 고른 sp_* 가 우리 블렌드 잔차에
      남아 있는가"만 잰다.** 통과하더라도 채택 근거는 LB 이지 이 t 가 아니다.

runtime:
  where: a5000
  학습: 0건
  expected_min: 50            # 40~60, 아래 근거
  eta_근거: >
    실측표 대조 —
      · 사후 상수축 사전계산(보정 프레임 25만행 로드 + 격자) **3분** (후보 BA)
      · 잔차 프로브 1건(블록 부트스트랩 1000회) **4분** (resid_tm)
      · exp_023 오프셋 격자(학습 없음) 계산 24초 / **벽시계 22분** — 벽시계 지배항은 코드 작성
    이번 추가분: sp 표 생성(train 1.47M행 groupby 4축) 5~10분.
    → 계산 10~15분 + 코드 작성·검증 25~40분 = **벽시계 40~60분, 중앙 50분**.
    ⚠️ exp_022·exp_023 이 각각 첫 발사에서 부동소수 항등성 버그로 죽었다.
       같은 계열(닫힌 해 오프셋)이므로 재발사 1회를 ETA 안에 포함했다.

산출물:
  - metrics.json   # 축 6 + 대조군 2 × (M, t, β*, 표본내 최대이득) × 면 A·B
  - report.md
  - sp_tables/     # 생성한 season<2024 표 + sha
감사: >
  🔴 **이 실험 자체는 감사 대상이 아니다** (제출물이 아니고 학습도 없다).
  단 통과 축이 나와 후보를 빌드하면 그때 **필수** — `sp_*` 는 타깃 파생 경로다
  (`splits.build` 가 `control_success` 를 직접 읽는다).

# ── 2026-08-20 증설 (플랜 승인분) — 같은 면 A 위에 방향 4개 추가 ──
증설_방향:
  필수_1_팔_불일치_퍼짐: >
    δ = 행별 팔 로짓 표준편차(sd_arms)의 중심화 방향. 원료는 서버
    `arms/X_arms.npy` (5×253,507)가 아니라 **BG 빌드의 현행 팔 벡터**
    (X_arms 는 AR 시절 캡처라 AA 팔 구성이 다르다 — c_aa/T70 분할 전).
    assemble_az/bh 산출물에서 현행 6성분(v6·Q·EBM·AA·T70·off)을 회수해 계산.
    회수 불가면 X_arms 로 재되 "구 팔 구성" 단서를 결과에 명기.
  필수_2_beta_f_방향: >
    δ = d_form_eb 벡터 (β_f 축의 이동 방향). 출하 form_offset 모듈 + 2024말
    동결표(k=100)로 tr2024 프레임에서 생성 — 우리 코드라 캡처 비용 낮음.
    ⚠️ 이 축은 AF 가 +27.95 를 냈고 AI 에서 ins_* 16열과 묶여 꺼졌다 —
    단독 부호가 잰 적 없다. 이번 스크린이 그 첫 측정이다.
  스트레치_3_모드_오프셋: >
    δ = AA 셀 모델의 모드 확률 4열 (외부 정찰 ② danny +63.7 의 우리판).
    tr2024 프레임 위 셀 확률 벡터가 기존 빌드 산출물(OOF/pred)에 있으면 재사용,
    없으면 셀 부스터 추론 1회. **캡처 비용이 30분을 넘으면 착수하지 말고
    '유보'로 보고** — 별도 실험으로 뺀다.
  스트레치_4_beta_ins_방향: >
    δ = mate 안쪽 ins 오프셋 벡터. mate 계측 추론 1회가 필요하므로
    30분 규칙 동일 적용.
판정_공통: "본문 판정 절과 동일 — 중심화 + 투수 블록 부트스트랩 1000회, |t|≥2 사전 등록. 크기 사용 금지(S2·S5)"
