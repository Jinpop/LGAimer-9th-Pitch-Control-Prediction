exp_id: exp_092
date: 2026-08-24
title: "딥 팔의 rho 를 명시적으로 벌린다 — 피처 부분집합·손실·타깃"
학습_건수: "약 120~200 fit (fit 1건 약 12초, 1스레드 x 다중 레인)"
제출물: "없음 (통과 지점의 배포 가중치는 다음 빌드에서)"

왜: |
  🔴 **S100**: exp_091 이 22지점을 훑었는데 **전부 `rho(z_mate)` 를 올리거나 그대로 뒀고 어느 것도 기준선을 못 이겼다**(최대 t +0.79).
     가장 선명한 것 — dropout 0.2 는 팔을 **단독으로 +14.3점 낫게** 만들면서 **혼합 이득을 −3.25점 깎았다**(rho 0.9142 → 0.9268).
  🔑 **즉 팔을 '더 좋게' 만드는 손잡이는 대개 겹침을 늘려 이득을 깎는다.**
     지금까지 훑은 것이 전부 그 계열이었으므로, **안 해본 것은 rho 를 *명시적으로 벌리는* 설계**다.
  ⚠️ 그리고 이건 exp_054("다양성이 성능 격차를 못 메운다")와 모순이 아니다 —
     그쪽은 **약한 팔**의 다양성이었고, 여기는 **이미 +5.08 을 낸 강한 팔**의 겹침을 줄이는 것이다.

면: "exp_089/090/091 의 정직면 그대로. 기준점 928.501461058684 abs_diff 0.0 재현 확인 후 시작"
고정: "학습량 OOT 1632스텝 · 5시드 · 현행 구조(폭 256·깊이 3 — S101 로 출하 제약) · dropout 0 · wd 0 · lr 1e-3 상수"

축_셋:
  D_피처_부분집합:
    무엇: "99열 중 일부만 주고 학습. 어느 계열을 빼면 mate 와 덜 겹치는가"
    지점: |
      D0 전체 99 (= 기준선)
      D1 mate v6 가 강한 계열 제외 — `sp_*`(구종 확률) 뺀다
      D2 `ins_*`(시즌 내 폼) 뺀다
      D3 `i3_anom_*`·`p6_*` 뺀다 (우리 frame99 와 팀원 프레임이 다른 바로 그 8열 — S95)
      D4 범주 5열만 + 상황 열 (희소 입력)
      D5 무작위 절반 x 3판 (귀무 대조 — 열을 줄이면 그냥 rho 가 내려가는지)
    🔴 D5_필수: "무작위 절반이 D1~D4 만큼 rho 를 내리면 **특정 계열 때문이 아니라 정보를 줄여서**다. 그 대조 없이 D1~D4 를 해석하지 마라"
  E_손실:
    지점: "BCE(현행) · focal(gamma 1, 2) · label smoothing(0.02, 0.05)"
    왜: "타깃을 바꾸면 팔이 다른 부분집합을 잘 맞히게 된다 — exp_053 이 그 계열에서 로컬 +18.68 을 냈다(LB 는 −0.49 였으나 그건 **바깥 팔**이었다)"
  F_잔차_타깃:
    무엇: "🔴 원래 하고 싶은 것은 mate 로짓을 오프셋으로 두고 잔차를 학습하는 것인데, **학습 행(≤2023)에 대한 mate 의 out-of-time 예측이 없다.**"
    대안: "학습 행에 대해 우리가 가진 팔(AA·S1·S2·T70 의 ≤2023 OOF)로 오프셋을 만들어 근사한다. 없으면 이 축을 **미착수로 적고 건너뛴다** — 지어내지 마라"
    🔴 리크: "오프셋은 반드시 **그 행에 대해 out-of-time** 이어야 한다. 표본 내 오프셋을 쓰면 잔차가 인위적으로 작아져 전부 무의미해진다"

측정 (모든 지점 공통):
  - "w 격자 0~0.6 step 0.01 최적 w 와 이득 · w=0.20·0.36 고정 이득"
  - "🔴 `rho(z_mate)` — 이 실험의 머리 지표다. 이득과 나란히 적어라"
  - "팔 단독 재센터링 점수 (S99 — 단독 최고와 혼합 최고는 다르다)"
  - "투수 블록 부트스트랩 1000회 t — 🔴 exp_090/091 과 **같은 rng 시드 20260824·같은 추출 순서**로 짝지어라"
  - "🔑 부산물: 전 지점의 (rho, 혼합이득) 산점 — **관계가 단조인지, 그리고 어디서 꺾이는지**"

사전_등록_판정 (🔴 결과 보고 바꾸지 않는다 — S8):
  기준: "exp_090/091 의 1632스텝·5시드·현행 구조 = 혼합 이득 +13.714 (argmax w 0.36), rho 0.9142"
  통과: "짝지은 부트스트랩 t >= 2.0"
  기각: "전 지점 t < 2.0 → **딥 팔 개조 계열 전체 종료.** 현행이 실용 최적이고 남은 것은 학습량뿐이다"
  🔴 크기예측금지: "정직면 이득을 LB 로 환산해 적지 마라 (S93: 전이비 −0.57 ~ +1.77). 위치·부호·t 만 쓴다"
  🔴 출하제약: "폭·깊이는 건드리지 마라 (S101 — 팀원 deep_infer.py 가 하드코딩). 피처 열 수를 바꾸면 `_fold` 의 `reshape(256, 99, 96)` 도 깨진다 — **열을 빼는 대신 그 열을 0 으로 마스킹**해 99열 형상을 유지하라"

