# 🔴 설계 변경 (2026-08-26, 지휘자 작업 중 지시) — stage1 발사 뒤 도착
# ═════════════════════════════════════════════════════════════
stage2_정직면_혼합_화면:
  왜_바꿨나: |
    원 exp_103 실험자가 옳게 지적했다 — GPU CatBoost 스크린의 부트스트랩 1σ 가 14~18점이라
    2~3열 효과는 어느 방향이든 잡음 안이다. stage1 실측이 그것을 확인했다(합산 1σ 18.58점).
    정직면 혼합 화면은 1σ 가 약 3점이라 분해능이 5배 이상 좋고, exp_103 config 의
    stage2 가 원래 쓰려던 화면이기도 하다.
  설계:
    입력: "a5000:~/SungjinPark/exp102/work/X_f64o.npy (exp_097 이 고친 f64, 94열) + 3열"
    학습: "≤2023, 5시드(42/777/2024/101/7), 1632스텝 — 같은 시드 수·같은 학습 구간 (S72·S86)"
    기준선: "26.2698 (고친 면 2팔 최적, 1632스텝 w=0.43). 결함면 13.7143 안 씀"
    혼합: "치환 root((1−w)z_mate + w·z_arm) **그리고** 3자유도 root((1−w−w2)z_mate + w·z_base94 + w2·z_new) — 둘 다"
    형상: |
      🟢 S101 정정 — 형상이 막혀 있지 않다. 측정용이면 입력 97 로 굽기만 하면 된다.
      배포 `deep_infer._fold` 의 `reshape(256, 99, 96)` 상수만 일반화했고,
      n_num=94 에서 배포 `_fold` 와 max|Δ| = 0.0 임을 게이트로 확인했다.
  판본:
    ①_A1_base94: "94열 딥 팔 — exp_097/exp_102 산출물 재사용 (26.2698 기준선 자체)"
    ②_A2_form3: "94 + 3열"
    ③_A3_null3: "🔴 사전 등록 귀무 — 3열을 batter_id 안에서 순열 (지휘자 지정)"
    ③b_A3s_null3s: |
      보조 귀무 — 3열을 (season, batter_id) 안에서 순열. **더 엄격하다.**
      🔴 왜 붙였나: batter_id 안 순열은 시즌을 가로질러 2019 의 전-NaN 행을 2024 자리로 옮긴다.
      실측 2024 결측률 form3 9.83% vs null3 24.90% — null3 의 열이 그만큼 묽어져
      ②가 ③을 이기는 몫에 '희석' 이 섞인다. null3s 는 결측 패턴을 정확히 보존한다(99.05%).
      **문턱을 낮추지 않고 더 어려운 시험을 하나 더 붙인 것이다(S67 기준으로 강화).**
    ④_A4_rand3: "94열 중 무작위 3열(p6_curve·sit_cnt_dev·sp_pit_strk2) 복제·순열 — 개수 효과 대조"
  🔴_사전등록_문턱: "그대로 유지 — ② > ① AND ② > ③, 둘 다 짝지은 투수 블록 부트스트랩 t >= 2.0 (S8)"
  🔴_열_선택_근거_명시:
    규칙: "결과가 아니라 **기존 94열과의 max|ρ|** 로 골랐다. 감사관이 라벨을 안 보고 잰 값이다."
    bat_base_dev: "0.0479 (vs asof_batter_middle_rate)"
    bat_n_growth: "0.1704 (vs asof_batter_n)"
    bat_count_dev: "0.2690 (vs idea_cnt_te)"
    제외: "bat_phand_dev — 0.8999 (vs sp_bat_phand), 중복이라 뺐다. 원 실험자가 잡았다."
    S8: "부분집합을 성과 보고 고른 것이 아니다. exp_103 이 17열로 기각된 뒤 성과와 무관한 기준으로 지목된 셋이다."
  게이트:
    재현: "94열·seed42·1632스텝 재적합 → exp_097 z_F1632_f64o_s42 와 sha256 비트 동일"
    fold: "일반화 fold vs 배포 _fold, A·c0·T 전부 max|Δ| = 0.0"
    면: "A1 argmax 가 26.269817 (기대 26.2698, 차 1.74e-05) · w0 앵커 abs_diff < 1e-9"
  표준화_규약: |
    🔴 배포 팔의 것을 그대로 쓴다 — mate/deep_infer.py:62-63 `(x-mu)/sd` 후 `nan_to_num(nan=0)`.
    우리가 새로 정한 규약이 아니고 네 판본이 전부 같은 규칙을 받는다. mu/sd 는 ≤2023 행에서만.
    ⚠️ 대가: 2024 행의 9.30~9.76% 가 평균으로 채워져 '동결표에 없는 타자' 정보가 지워진다.
    batform2 에 그 플래그(bat_form_miss)가 있으나 ρ 기준 선택이 정확히 3열을 지목해 넣지 않았다.
  ETA: "30~40분 (지휘자 제시) → 실측 약 35분 (prep 2회 4분 + fit 20건 2분 48초 + 평가 49초 + 조립)"
  이_실험이_갈래를_닫는다: "지휘자 지시 — 통과하면 출하 설계, 실패하면 축을 닫는다."
