exp_id: exp_103b
title: "exp_103 의 3열 재선별 — 준중복 14열을 걷어내고 안 겹치는 3열만 단독 측정"
date: 2026-08-26
owner: orchestrator (지휘자 지시) / experiment-runner
parent: exp_103
training: "있음 — GPU CatBoost 4판본 × 3시드 (① base 는 exp_103 산출물 재사용)"

배경:
  exp_103_기각: "17열 일괄 투입. ② form − ① base = −28.942 (t −2.029) · ② − ③ 귀무 = −40.379 (t −2.287)"
  감사가_좁힌_원인: |
    17열 중 14열이 이미 배포된 `ins_b_*`·`sp_bat_phand`·`asof_batter_*` 의 준중복이다.
    `bat_cs_n` 은 `ins_b_n − 1` 로 대수적으로 정확히 같다 (ρ 1.0000).
    `bat_frozen_n0` 0.9887 · `bat_cs_dev_eb` 0.9520 · `bat_frozen_rate` 0.9157 ·
    `bat_phand_dev` 0.8999 · 나머지 0.80~0.87.
  기존_94열과_안_겹치는_것_셋:
    bat_base_dev: 0.048
    bat_n_growth: 0.170
    bat_count_dev: 0.269
  가설: |
    기각은 3열이 무가치해서가 아니라 **14열이 분기 후보를 잠식해서**일 수 있다 (S104·S175 의 자리).
    그 셋은 단독으로 시험된 적이 없다.

설계:
  피처: "🔴 새로 만들지 않는다. exp103/work/batform2.npy(17열)에서 3열만 슬라이스."
  행_독립성: "exp_103 out/s1_rowindep.json 게이트 4종 전부 max|Δ| = 0.0 — 열 부분집합은 새 계산 경로가 아니므로 승계."
  면: "GPU CatBoost, ≤2023(1,116,277행) 학습 → 2024(253,507행) 평가. exp_103 stage1 과 완전히 같은 하니스."
  하이퍼: "iterations 3000 · depth 6 · lr 0.05 · l2_leaf_reg 3.0 · Bernoulli subsample 0.8 · thread_count 3 · devices 1"
  시드: [42, 7, 2024]
  판본:
    ①_base: "기존 99열(수치 94 + 범주 5). exp103/work/p2_base.npy 재사용 — extra=None 이라 입력이 비트 동일."
    ②_form3: "① + 3열"
    ③_null_bat3: "① + 3열을 batter_id 안에서 순열 — 사전 등록 귀무 (지휘자 지정)"
    ③b_null_row3: "① + 3열을 시즌 안 행 단위 순열 — 보조 (exp_103 의 주 귀무 방식)"
    ④_rand3: "① + 기존 94열에서 뽑은 무작위 3열을 복제·순열 — 개수 효과 자체의 대조"
  부트스트랩: "짝지은 투수 블록, NBOOT 2000, RandomState(777) — exp_103 과 같은 draws"

🔴_사전등록_문턱:
  규칙: "② > ① **그리고** ② > ③(null_bat3), 둘 다 짝지은 투수 블록 부트스트랩 t >= 2.0"
  출처: "exp_103 config.yaml 과 동일. 낮추지 않는다 (S8)."
  ⚠️_검출한계_선언: |
    exp_103 에서 부트스트랩 1σ 가 14~18점이라 t≥2.0 은 약 30점 효과를 요구한다.
    3열로 30점이 나올 가능성은 낮다. **문턱 통과 여부와 별개로 ②−① · ②−③ 의
    점추정·부호·t 를 전부 적는다.** 못 넘으면 못 넘었다고 적는다.

함께_확인:
  1_mid_n: "bat_cs_mid_* 의 mid_n>=1 문제가 3열에 걸리는지 확인하고 기록만."
  2_안전성_논증: "bat_count_dev·bat_base_dev 는 'season < S 라벨에서 만든 EB 수축 타깃 인코딩, 추론 시점엔 동결 상수' — inseason.py 의 '라벨을 안 쓴다' 와 별개 주장이므로 그대로 적는다 (S177)."
  3_분포_이탈: "bat_n_growth 는 시간 단조 (S173). 실제 대회 표본 5행(≤2024 표 → 2025 행, 배포 구성)에서 값 분포 병기."

자원_규율:
  - "파일 삭제 0건 · 외부 프로세스 kill 0건"
  - "CPU 4코어 상한 (후보 CR 감사 동시 실행) — 단일 레인 thread_count 3"
  - "추론 시간 측정 안 한다"

ETA: "40분 (GPU fit 12건 × 약 120초 = 24분 + 로딩·부트스트랩·상관 약 5분 + 보조 확인 3분)"

