# 캠페인 6 — 사용자 지시 2026-08-05 "세 실패모드 따로 모델링해서 합치기"
# 세부 설계는 지휘자 판단, 판단 내역을 아래 design_decisions에 전부 명시
exp_id: exp_016
date: "2026-08-05"
hypothesis: >
  라벨은 물리적으로 다른 세 실패의 합집합이다(① 존 가운데 ② 존에서 크게 벗어남 ③ 포수 요구 반대).
  단일 이진 타깃으로 뭉쳐 학습하면 세 모드의 서로 다른 인자 구조가 평균돼 희석된다.
  모드별로 나눠 학습한 뒤 합치면 같은 47피처에서 더 많은 신호를 뽑을 수 있다.
base_exp: "exp_010 D"        # 대조군 = fold_2024 valid_all Brier 0.248261 (iter 750, P4 정직치)

# ─────────────────────────────────────────────────────────────
# 지휘자 설계 판단 (사용자 요청: 무엇을 어떻게 정했는지 명시)
# ─────────────────────────────────────────────────────────────
design_decisions:

  D1_행단위_모드라벨_복원:
    문제: "주최측은 모드별 라벨을 행 단위로 주지 않는다. 투수별 누적 비율(asof_*_rate)만 있다."
    해법: >
      EDA §0에서 `asof_rate × asof_n = Σ 과거 이벤트`가 정확히 성립하고 `n`이 행마다 +1씩
      증가함이 검증됐다(표본 12명 전원). 따라서 **같은 투수의 파일 순서상 연속 두 행에서
      누적수 차분**을 취하면 그 행의 이벤트를 복원할 수 있다:
        count_m[t] = round(asof_middle_rate[t] × asof_n[t])
        is_middle[t] = count_m[t+1] − count_m[t]        # 0 또는 1이어야 함
      middle·reverse·ball·strike 전부 동일하게 복원. way-off(케이스 ②)는
        is_wayoff = 1 − is_success − is_middle − is_reverse   (세 모드가 배타·전수라는 가정 하에)
    리크_경계: >
      ⚠️ **복원 라벨은 타깃으로만 쓴다. 절대 피처로 쓰지 않는다.**
      복원에 t+1 행을 쓰므로 피처로 쓰면 미래 정보 유입 = 명백한 리크다.
      학습 시점에만 필요하고 test에서는 예측만 하므로 타깃 사용은 규칙 위반이 아니다.
      코드에 이 경계를 assert/주석으로 명시하고, 피처 목록에 복원값이 없음을 검증할 것.
    한계: >
      각 투수의 마지막 행은 후속 행이 없어 복원 불가(792행, 0.05%) → 해당 행은 학습에서 제외.
      제공 컬럼에 반올림이 있다(exp_011에서 sum 차이 최대 0.0076 관측) → 차분이 정확히 0/1이
      아닌 행이 나올 수 있다. 그 비율을 반드시 보고하고, 임계 초과 시 D1 자체를 재검토.

  D2_게이트_먼저_검증:
    내용: >
      **학습 전에 복원 품질을 검증하고, 통과 못 하면 실험을 중단한다.**
      ① 차분이 {0,1} 밖인 행의 비율 (기대: <1%)
      ② 복원 is_success가 실제 control_success와 일치하는 비율 (기대: >99%. 이게 안 맞으면 복원 자체가 틀린 것)
      ③ **모드 간 배타성**: is_middle + is_reverse ≥ 2 인 행이 있는가.
         EDA §1에서 "범주 겹침 ~10%"가 관측됐으므로 **배타가 아닐 가능성이 실재한다.**
         겹치면 D4의 multiclass 안(B1)은 성립하지 않으므로 B2(독립 이진)만 진행.
      ④ is_wayoff의 비율이 exp_014의 residual(≈0.10)과 일치하는가 — 일치하면 residual 정체 규명

  D3_피처는_불변:
    내용: "제공 47컬럼 그대로. 피처를 건드리지 않는다 — 변경 변수는 '타깃 구조'뿐이다."
    근거: "exp_009·012·014에서 피처 추가는 세 번 다 base를 못 넘었다. 이번 실험의 가설은 피처가 아니라 타깃 분해에 있다."

  D4_합치는_방식_3안:
    B0: "대조군 — exp_010 D 그대로 (이진 success, 47피처). 0.248261 재현 게이트"
    B1: "4-class multiclass (success/middle/reverse/wayoff) → softmax의 P(success) 직접 사용. ※ D2-③ 배타성 통과 시에만"
    B2: "모드별 독립 이진 3개 → P(success) = 1 − ΣP(mode), [0,1] 클리핑. 배타성 불문 항상 가능"
    B3: "스태킹 — 모드별 예측 3개를 **추가 피처**로 넣어 이진 모델 재학습.
         ⚠️ 모드 예측을 만드는 모델은 fold의 train 구간에서만 학습하고, valid 구간 예측은 out-of-fold로 생성.
         train 구간 자기예측은 in-sample이므로 **train 구간도 내부 K-fold(시간순)로 OOF 생성**할 것."
    선택_근거: >
      B1은 모드가 배타일 때 가장 자연스럽고 확률 합=1이 자동 보장된다.
      B2는 배타성 없이도 가능하나 합이 1을 넘을 수 있어 클리핑·정규화가 필요하다.
      B3은 분해가 직접 이득을 못 내도 표현으로서 값어치가 있는지를 따로 본다.

  D5_하이퍼파라미터:
    내용: "모든 서브모델에 exp_010 D의 lgb_params를 그대로 쓴다(lr 0.01 / num_leaves 15 / min_data 5000 / ff 0.7 / seed 42 / deterministic)."
    근거: >
      튜닝을 섞으면 '타깃 분해의 효과'와 '튜닝의 효과'가 교락된다. 분해 자체의 값어치를
      먼저 보고, 이득이 있으면 그때 서브모델별 튜닝을 별도 실험으로.
      ⚠️ 단 모드별 base rate가 크게 다르므로(middle ~0.14, reverse ~0.22, wayoff ~0.10)
      D의 min_data_in_leaf 5000이 희소 모드에서 과도할 수 있다 — 이 경우를 보고하라.
    iter: "각 서브모델·각 안마다 exp_006 P4 정책(fold_2023 valid_all argmin → fold_2024 승계) 개별 적용. valid 2024 미참조."

  D6_판정_기준:
    주지표: "fold_2024 valid_all Brier (최종 P(success) 기준). 대조군 0.248261"
    시드: "최선 안은 seed {42,7,2024} 반복 — exp_014에서 delta가 시드 산포에 삼켜진 전례가 있다. delta가 산포보다 큰지 반드시 판정"
    부가: "모드별 서브모델의 개별 AUC·Brier도 보고 — 어느 모드가 예측 가능한지가 그 자체로 정보"

# ─────────────────────────────────────────────────────────────
validation:
  scheme: rolling-origin
  primary_metric: brier       # fold_2024 valid_all
  report_also:
    - "모드별 서브모델 성능(AUC·Brier·base rate)"
    - "복원 게이트 4항목 수치"
    - "시드 반복 산포"
    - "valid_R·valid_F 세그먼트"

test_reproducibility:
  status: "안전 (설계상)"
  reason: >
    최종 추론은 47컬럼 → 서브모델 예측 → 합성이며 전부 행 단위다.
    복원 라벨은 학습에만 쓰이고 추론 경로에 존재하지 않는다.
    5행 스텁으로 행 독립성을 실증할 것.

runtime:
  where: a5000
  expected_min: 60

targets:
  control: "exp_010 D — fold_2024 valid_all Brier 0.248261 / 환산 619.0"
  note: "LB 목표 거리는 환산 관계가 미확정이라(제출 3건 배율 1.104~1.323) 로컬 Brier로만 판단한다"
