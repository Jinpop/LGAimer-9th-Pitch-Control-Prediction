exp_id: exp_063
date: "2026-08-20"
hypothesis: >
  구종모델 파생 14열을 NN 입력에서 빼면 배포 불일치가 **구조상 정확히 0** 이 된다.
  그 대가로 잃는 성능이 얼마인가 — **그 크기가 (iii) 85열 노선을 택할지,
  (i) 팀원 매핑을 기다릴지를 가른다.**
base_exp: exp_061 (99열 4시드 앙상블 888.15660점)

🔴_이_실험이_존재하는_이유: >
  exp_062 게이트가 **실패**했다(Brier 차 −2.97796점, 문턱 |1점| 초과).
  원인은 파일 하나로 국소화됐다 — `mate/model/tables/pitchmodel6.txt`(+`pmcat6.json`·`anom_cnt.csv`).
  99열 중 어긋난 것은 **구종모델 파생 14열뿐**이고 나머지 30열 + ins 16 + sp 6 은 전부 일치했다.
  🔴 손해의 73% 가 "양쪽이 아는 투수" 구간에서 나오므로 **매핑 명단을 맞추는 것으로 복원 불가** —
  구종모델 자체가 다른 데이터로 적합됐다.

제외할_14열:
  p6: [p6_curve, p6_cutter, p6_fastball, p6_offspeed, p6_sinker, p6_slider]
  i3_anom: [i3_anom_curve, i3_anom_cutter, i3_anom_fastball, i3_anom_offspeed, i3_anom_sinker, i3_anom_slider, i3_anom_l1]
  idea: [idea_matchup_pitch]
  근거: >
    exp_062 비교 A 실측에서 `max|diff| > 0` 인 열 전량이다.
    ⚠️ `idea_cnt_te`·`i3_te48` 는 어긋나지 않았으므로 **남긴다**(둘 다 정확일치 100%).
  결과_입력폭: "99 → 85열 (dense 95 → 81 + 범주 4). 임베딩 5개 유지"

## ── 설계: exp_061 을 그대로 승계하고 열만 뺀다 ──
승계_고정:
  프레임: "~/SungjinPark/exp060_nn/cache/frame99.parquet — 전 열이 이미 있다. **재생성 불필요**(sha 4종 재확인 후 읽기 전용 사용)"
  구성: "256-128-64 / dropout 0.30 / max_lr 3e-3 / OneCycle 25에폭 — exp_061 stage 3 게이트가 고른 것"
  🔴_왜_lr_3e-3: >
    exp_061 사전 등록 낙점은 lr 1e-3 이었으나 **분할 B 부호 게이트가 그것을 기각했다**
    (두 분할 모두 낙점이 파일럿보다 나쁨: −2.57 / −14.47). 게이트의 결론을 따른다.
  시드: [42, 777, 2024, 101]
  분할_A: "train ≤2023 (마스크 season≤2022 & game_type=='F' 제외) 1,116,277행 → valid 2024 전체 253,507행"
  분할_B: "train 2020~2022 → valid 2023 중 game_type=='R' 219,839행"
  층수: "🔴 4층 고정 — 출하 `mate/nn_infer.py` 가 층 인덱스를 하드코딩한다"
  mu_sd: "학습 분할에서만 계산(valid 오염 금지)"

## ── 측정 ──
주지표: "fold_2024 valid_all Brier + 환산 (ref 0.2498069), 4시드 로짓평균"
필수_대조:
  - "🔴 **exp_061 99열 4시드 888.15660** 대비 차 — 이것이 '14열의 값어치'다"
  - "우리 배포 AA 팔 A1@1400 3시드 0.24787535671986385 = 773.21454 대비 차"
  - "🔴 **상관** — 85열 NN vs ① 우리 AA 팔 67열/81열 ② 팀원 Q ③ 현행 블렌드 로짓.
     exp_061 99열판은 AA 67열과 0.9014 였다. **14열을 빼면 상관이 오르는가 내리는가**가
     새 팔로서의 값어치를 가른다 — 점수가 조금 내려가도 상관이 함께 내려가면 이득일 수 있다"
  - "분할 B 에서도 같은 비교(부호 일치 확인). ⚠️ 분할 B 는 환산 ref 가 2024 눈금이라 **분할 안의 차만** 읽는다"

배포_재적합:
  조건: "아래 판정에서 85열 노선을 택할 경우에만. 이번 실험 범위에는 **넣지 않는다** — 지휘자 판단 후 별건"

## ── 사전 등록 판정 (S8 — 결과 보고 바꾸지 않는다) ──
판정_눈금: "S_14 = (85열 4시드 환산) − (99열 4시드 환산 888.15660). 음수면 14열이 값을 하고 있었다는 뜻"
- 🟢 **S_14 ≥ −5점**: 14열의 값어치가 작다 → **(iii) 85열 노선 채택.** 팀원 대기 없이 배포 재적합으로 진행.
  근거: 배포 불일치가 구조상 0 이 되므로 exp_062 가 잰 −2.98점 손실도 함께 사라진다 —
  실질 비교는 `S_14` 가 아니라 `S_14 + 2.98` 이다.
- 🟡 **−15 < S_14 < −5**: 애매하다. **상관 변화로 가른다** — 상관이 0.9014 아래로 내려가면 채택,
  올라가면 (i) 팀원 매핑을 기다린다.
- 🔴 **S_14 ≤ −15점**: 14열이 크다 → **(i) 노선.** 팀원 trackman 매핑 규약을 받아 99열로 재학습한다.
  그때까지 NN 후보를 만들지 않는다.
⚠️ **분할 A·B 부호가 갈리면** 위 판정을 적용하지 말고 그 사실을 보고하라(exp_061 stage 3 교훈).

