      · 분할 A 4시드 = 5.6분 · 분할 B 4시드 = 5.6분
      · 프레임 캐시 재생성 **불필요**(frame99 에 85열이 전부 있다, 열 선택만)
      · 상관·집계·변환 = 3분 · 코드 작성(exp_061 src 승계·열목록만 교체) = 10분
    → **벽시계 20~30분, 중앙 25분.**
