exp_id: exp_022
date: "2026-08-07"
title: "오프셋 커버리지 백오프 — 룩업 미적중 행 구제"
hypothesis: >
  현재 오프셋은 (pitcher_id, batter_hand) 셀이 동결표에 있는 행에만 걸린다.
  fold_2024 적중률 78.5%이므로 **21.5%의 행은 보정을 전혀 받지 못한다**(d_s = 0).
  야구에서 좌우 매치업 효과는 개인차 이전에 **리그 수준에서 이미 존재한다** —
  같은 손 타자를 상대할 때 유리한 경향이 투수 전반에 깔려 있다.
  따라서 개인 셀이 비었을 때 0을 주는 대신 **(pitcher_hand × batter_hand) 리그 평균
  편차**를 주면, 개인 정보가 없는 행에도 부호가 맞는 보정을 걸 수 있다.
base_exp: exp_020 E1 (exp_016 B3 스태킹 + 오프셋, seed 42) — G0가 대조군이자 재현 게이트

# ---------------------------------------------------------------------------
# 사전 근거
# ---------------------------------------------------------------------------
prior_evidence:
  coverage:
    fold_2024_hit_rate: 0.785
    source: "exp_019 D4"
    note: >
      exp_019 D4는 "커버리지가 100%가 되면 추가 −2.6~3.0e-05(환산 약 +11점)"으로
      정량화했다. ⚠️ 단 그 추정은 **미적중 행이 적중 행과 같은 품질의 보정을 받는다**는
      가정 위에 있다. 리그 평균 백오프는 개인 추정보다 품질이 낮으므로 **실제 이득은
      +11점보다 작을 것으로 예상**한다. 이 실험은 그 실제값을 재는 것이다.
  lb_evidence: >
    오프셋 축 자체는 LB에서 값이 확정돼 있다 — 후보 D→F 단일 변인 대조에서
    **+23.7405613443**. 즉 "보정이 통한다"는 이미 알고 있고, 이 실험은 그 보정을
    **더 많은 행에 거는 것**의 값을 묻는다.
  caveat: >
    2025 실제 적중률은 알 수 없다(hidden). 공개 test.csv 5행 중 4행이 미적중이었으나
    표본 5건이라 근거가 되지 못한다. 만약 2025 적중률이 fold_2024보다 낮다면
    이 축의 값은 로컬 측정치보다 **커진다**.

# ---------------------------------------------------------------------------
# 설계
# ---------------------------------------------------------------------------
method:
  current_form: >
    d_s = EB수축된 (pitcher_id, batter_hand) 조건부 편차.
    수축 대상은 **0**(= 그 투수의 무조건부 성공률)이고, 셀이 없으면 d_s = 0.
  league_table:
    key: "(pitcher_hand, batter_hand)"
    cells: 4                                # LL, LR, RL, RR
    value: >
      해당 조합의 리그 전체 성공률 − 같은 투수손 집단의 무조건부 성공률.
      즉 개인 편차와 **같은 단위·같은 부호 규약**을 갖는 리그 수준 편차.
    as_of: >
      학습 구간 행은 시즌 s에 대해 **시즌 ≤ s−1**만으로 산출(기존 개인 표와 동일
      forward-chaining). test는 ≤2024 동결. 학습/추론 구조를 같게 맞춘다.
    missing: "pitcher_hand 또는 batter_hand가 결측이면 d_s = 0 (기존과 동일)"

arms:
  - id: G0
    desc: "대조군 — 현행 오프셋 (미적중 행은 d_s = 0)"
    gate: "exp_020 E1 재현. fold_2024 valid_all Brier가 β=0.541136에서 0.248061과 abs_diff < 5e-6"
  - id: G1
    desc: "하드 백오프 — 미적중 행에만 리그 편차 투입. **적중 행은 G0와 완전히 동일**"
    why_primary: >
      **이 arm이 주 지표다.** 적중 행을 건드리지 않으므로 G1 − G0의 차이는
      **오직 미적중 21.5% 행에서만** 발생한다. 즉 '커버리지' 하나에 귀속 가능하다.
  - id: G2
    desc: "소프트 수축 — 수축 대상을 0에서 리그 편차로 교체 (적중 행도 값이 바뀜)"
    note: >
      G2는 G0 대비 **두 가지**가 바뀐다(미적중 행 구제 + 적중 행의 수축 목표 변경).
      따라서 G2가 좋아도 그 효과를 커버리지에 귀속시킬 수 없다. G1과의 차이로만
      '수축 목표 변경'의 몫을 읽는다.

  arm_diff_note: >
    G0→G1→G2는 d_s 산출식만 다르다. base 예측(B3 스태킹), iter, 시드, 마스크,
    clip 경계는 전부 동일. β는 arm마다 **각자 재적합**하며(선행 시즌 블록에서만),
    그 자체가 변인이 아니라 각 d_s 분포에 대한 종속 산출값이다 — 이 점을 report에 명시할 것.

beta_fit:
  form: "p' = clip(p + β·d_s, 1e-6, 1-1e-6)"
  estimator: "닫힌 해 (exp_019·exp_020과 동일 기계)"
  discipline: "β는 **선행 시즌 블록에서만** 적합. valid 2024를 보고 β를 고르는 경로 없음"
  supply_blocks: "최신 2개 (파이프라인 효율 규약 #6)"
  also_report: "각 arm의 오라클 β(사후 최적)도 함께 산출 — 전이 효율 계산용, 채택 근거로는 쓰지 않음"

# ---------------------------------------------------------------------------
validation:
  primary_metric: "fold_2024 valid_all(R+F) Brier"
  secondary: [valid_R, valid_F, "미적중 행 세그먼트 Brier", "적중 행 세그먼트 Brier"]
  base_predictions:
    reuse: true
    file: "~/SungjinPark/experiments/exp_020/pred/pred_E0_B3_P4iter_seed42_fold_2024.npy"
    why: >
      백오프는 **고정된 base 예측 위의 사후 변환**이다. 같은 예측 배열에 서로 다른
      d_s를 적용하므로 G1 − G0는 base 모델의 시드 잡음이 **완전히 상쇄되는 짝지은 비교**다.
    sha_assert: "규약 #5 — 재사용 전 sha256 대조 필수. 불일치 시 중단"

  seed_policy:
    stage_1: "seed 42 단독"
    rationale: >
      ⚠️ **사전 등록 기준(3시드 동부호 AND 3×시드std)을 이 실험에 그대로 적용하지 않는
      이유를 미리 밝힌다.** 그 기준은 **독립적으로 학습된 두 모델**을 비교할 때 base
      모델의 시드 잡음을 걸러내려고 만든 것이다. 이 실험은 **같은 예측 배열**에 두 가지
      d_s를 적용하는 짝지은 비교라 base 시드 잡음이 차분에서 소거된다.
      또한 예상 효과(2.6~3.0e-05)가 D 시드 std 3배 문턱(3.37e-05, exp_021 실측)
      **아래**라, 3시드를 돌려도 '측정 안 됨'이 나올 가능성이 높다 — 즉 그 기준은
      이 질문에 대해 **검출력이 없다**.
      **기준을 낮추는 것이 아니라 다른 질문에 다른 도구를 쓰는 것**이며, 대신
      stage 2에서 다른 base 위 재현을 확인한다.
    stage_2:
      condition: "stage 1에서 G1 − G0가 음수(개선)일 때만"
      what: "seed 7·2024의 B3를 재학습해 같은 백오프를 적용, 부호 재현 확인"
      cost: "B3 2블록 재학습 필요 (아래 runtime 참조)"
      approval: "**별도 승인 대상** — stage 1 결과를 보고 사용자가 판단"

  segment_report:
    required: true
    what: >
      미적중 행(21.5%)과 적중 행(78.5%)을 **나눠서** Brier를 보고하라.
      G1의 이득이 전부 미적중 세그먼트에서 나와야 설계대로 작동한 것이다.
      적중 세그먼트가 변했다면 하드 백오프 구현이 틀린 것이므로 즉시 중단.

# ---------------------------------------------------------------------------
runtime:
  where: a5000
  expected_min: 20                          # 15~25
  eta_basis: >
    실측표 'exp_019 2단 오프셋 = stage1 블록 5개 × 3시드 + 오프셋(닫힌 해) + 진단
    D0~D6 = **16.7분**'. 이번 stage 1은 **학습이 전혀 없다** — 기존 B3 예측 재사용 +
    리그표 groupby(1.37M행, 초 단위) + 닫힌 해 β 3회 + 세그먼트 집계.
    exp_019보다 가벼우므로 코드 작성·검증 포함 15~25분.
    stage 2를 하게 되면 B3 2블록 재학습이 추가되어 **+24~68분**
    (실측표 'B3 스태킹 1(seed×fold) 12~34분' × 2).

deliverables:
  - metrics.json      # arm별 Brier/BSS + 세그먼트 분해 + β(적합·오라클) + 커버리지 실측
  - report.md
  - src/{backoff.py, fit_offset.py}
  - "pred_G*.npy"

audit:
  required: true
  why: >
    **새 타깃 파생 집계**다 — (pitcher_hand × batter_hand) 리그 편차표는 라벨에서
    새로 만드는 통계이며 기존 개인 표와 다른 경로다. CLAUDE.md 감사 필요 조건
    '타깃 파생 피처 / 새 시계열 집계'에 해당.
  when: "stage 1 종료 후, 채택 여부와 무관하게"
  focus: "리그표의 forward-chaining이 valid 시즌 라벨을 포함하지 않는지 (런타임 assert 필수)"

risks:
  - "리그 평균 편차는 개인 편차보다 품질이 낮다. exp_019 D4의 +11점은 상한이며 실제는 그보다 작을 것"
  - "미적중 행은 대개 **표본이 적은 투수**(신인·저이닝)다. 이들의 참 편차가 리그 평균과 다르면 보정이 역효과일 수 있다"
  - "2025 적중률이 fold_2024와 다르면 로컬 측정치의 전이가 달라진다 — 측정 불가, 단서로만 기록"
