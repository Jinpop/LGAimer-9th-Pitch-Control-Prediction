기전: >
  exp_074·exp_075 가 **독립으로 두 번** 같은 것을 쟀다 —
  우리가 만든 **순수 동결 스칼라는 죽고**, 주최측 원본은 산다.
    · exp_074: `supp_fm_suc_g5` t +1.19  vs  `ctrl_prev3_suc` t **−3.95**
    · exp_075: `supp_bt_suc`   t +0.03  vs  `ctrl_asof_bsr`  t **−1.685** (r +0.9068 인데 부호 반대)
  **값을 한 `ins_*`(AI +17.63, 우리 역사상 최대 단일 이득)는 순수 동결이 아니다** —
  `주최측이 행마다 주는 as-of 값 − 동결 앵커` 다. 갱신 항을 **주최측이 test 에도 per-row 로 주므로**
  규칙 2-4 에 안 걸린다. **그것이 트릭 전부였다.**
🔴 그래서_묻는_것: >
  그 레시피가 **아직 안 닿은 층**이 둘 있다. 지휘자가 `data/test.csv` 에서 실측 확인했다 —
  `prev{1,3,5}_game_{success,middle}_rate` 6열과 `asof_pitcher_{pitchmix_n,fastball,breaking,offspeed}` 4열이
  **test 행에 실제 값으로 들어 있다.** `ins_*` 는 커리어 누적 5종에만 적용됐고 이 두 층은 건드린 적이 없다.
⚠️ 커버리지_경고: "지휘자 실측 — `real5` 5행 중 `prev{1,3,5}` 가 **3행 NaN(60%)**. 축이 닿는 행이 40% 대일 수 있다. 대역 수치를 배포 커버리지로 읽지 마라(exp_073·074·075 에서 세 번 갈렸다)."

