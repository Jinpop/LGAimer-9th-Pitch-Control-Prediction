exp_id: exp_093
date: 2026-08-25
title: "4셀 멀티헤드 MLP — 팀 레지스트리의 미시도 후보. rho 프로브 먼저(G-DIVERSITY)"
학습_건수: "stage0 1~2 fit · stage1 5 fit (통과 시에만). fit 1건 약 12초"
제출물: "없음 (stage1 통과 시 후보 설계는 별도)"

왜: |
  팀 레지스트리(`orchestration/팀문서/registry_2026-08-24.md`) 미해결 5건 중 하나 —
  **"4셀 멀티헤드 MLP — 팔 추가 범주(계수 0.574)의 미시도 후보 · 신경망 계열 x AA 라벨 분해"**(제132 §6).
  살아있는 범주는 **팔 추가(0.574)** 와 **가중(0.247)** 둘뿐이고, 이건 그 중 유일한 미시도다.

  🔴 **그러나 하드락 G-DIVERSITY 가 학습 전에 천장을 요구한다.** 제131 이 제126 곡선을 역산해 이미 계산해 뒀다:
     손익분기 `rho' = 0.9546` · **천장 G=0 에서도 +0.83(팔 추가) / +0.17(팔 개선)** · **재개조건 `rho' < 0.923`**.
  → **rho 프로브를 먼저 친다.** 0.923 을 못 넘으면 학습을 더 하지 않고 닫는다.

무엇이_다른가: |
  현 딥 팔은 99열 -> 단일 성공 로짓, BCE 다.
  이건 같은 입력에 **AA 라벨 분해 4셀**(`is_mid_only`·`is_rev_only`·`is_both`·`is_wayoff_true`)을 얹는다.
  셀이 상호배타이므로 **5분류 softmax**(4실패셀 + 성공)가 자연형이고, `p_succ = 1 - sum(4셀)` 로 읽는다.
  🔑 이건 구조 변경이 아니라 **목적함수·출력 구조 변경**이다 — 트리 팔(AA)이 쓰는 라벨 분해를 신경망이 처음 쓰는 것.
  ⚠️ 그래서 **팀 레지스트리 §8(손실함수 형태) 의 "logloss -> Brier 직접최적화 기각"과 다른 축이다** — 그쪽은 같은 단일 타깃의 손실만 바꿨다.

면: "exp_089/090/091/092 의 정직면 그대로. 기준점 928.501461058684 를 abs_diff 0.0 으로 재현 확인 후 시작"

재료 (전부 있다):
  구조: "exp_089 가 복원한 token-MLP (17키 형상 일치, 복제 rho 0.985651 / 천장 0.988034). 출력층만 1 -> 5 로"
  라벨: "AA76 키트의 `qlab.parquet` (셀 라벨 4종 + valid). 🔴 학습 전용 자산 — 어떤 산출물에도 새어나가면 안 된다"
  프레임: "CG 빌드가 푼 재구성 정본 — `sp_*` 6열·`idea_cnt_te`·`i3_te48` 는 `exp064/cache/frame99_ship.parquet` 에서 온다(S113)"
  학습량: "OOT 1632스텝(exp_090 고원 argmax). lr 1e-3 상수(S98 — 스케줄러 없음)"
  시드: "stage0 은 42 단독. stage1 은 42·777·2024·101·7"

stage0_rho프로브 (🔴 이것만 먼저):
  무엇: "4셀 멀티헤드를 시드 42 로 1 fit 학습해 정직면 로짓을 뽑고 rho 를 잰다"
  재는_것: |
    rho' = 현 딥 팔(같은 면·같은 학습량)의 로짓과의 상관.
    부가로 z_mate·mate v6·mate Q·AA_deployed 와의 rho 도.
    🔴 S86 — 학습 구간을 반드시 맞춰라(둘 다 <=2023). S72 — 시드 수도 맞춰라(둘 다 1시드 또는 둘 다 5시드).
  사전_등록_판정:
    통과: "rho' < 0.923 -> stage1 진행 (제131 의 재개조건 그대로)"
    기각: "rho' >= 0.923 -> **축 종료.** 제131 이 계산한 천장(+0.83)에도 못 미친다는 뜻이다. 학습을 더 하지 마라"
    🔴 결과를_보고_문턱을_바꾸지_않는다: "S8"

stage1_이득 (stage0 통과 시에만):
  무엇: "5시드로 확장해 정직면 혼합 이득과 t"
  기준선: "현 정직면 최고 구성(exp_090 1632스텝 5시드, 혼합 이득 +13.714 @ argmax w 0.36)"
  측정: "새 팔을 **추가**했을 때의 최적 가중과 이득, 투수 블록 부트스트랩 1000회 t. 🔴 exp_090/091/092 와 같은 rng 시드 20260824·같은 추출 순서로 짝지어라"
  사전_등록_판정:
    통과: "t >= 2.0"
    기각: "t < 2.0 -> 축 종료"
  🔴 크기예측금지: "정직면 이득을 LB 로 환산해 적지 마라. 이 계열 전이비는 우리 실측 0.478(학습량 축) / 레지스트리 0.574(팔 추가) 로 **둘 다 다른 양**이다. 위치·부호·t 만 쓴다"

