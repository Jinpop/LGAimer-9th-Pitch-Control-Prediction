exp_id: exp_054
date: "2026-08-18"
hypothesis: >
  모델 패밀리 다양성 — 같은 67열·같은 OOF 위의 **LightGBM 스태커**는 CatBoost 와
  귀납 편향이 달라 다른 행에서 틀리고, 그 다양성이 AX 3원 혼합 위에 얹힌다.
  exp_053 이 검증한 프로토콜(정직면·고정 w·3시드 문턱)을 그대로 재사용한다.
base_exp: exp_053

동기: >
  AX 감사까지 통과한 오늘의 결론 — 이득의 원천은 다양성이고 남은 벽은 팔 상관
  (0.95~0.98). 타깃 축(AX) 다음의 직교 축이 모델 패밀리다.
  🟢 lightgbm==4.7.0 은 **이미 zip 의 requirements.txt 에 있다** — 배포 위험 0.
  ❌ XGBoost 는 requirements 에 없어 새 설치 위험 → 이번 밤에는 제외.
  ❌ exp_016 B3 모드 스태킹 부활 — 51열 시대 구조라 재사용 0, 무인 진행 위험 커서 제외.

arms:
  - id: L0
    def: "LightGBM 67열 스태커, hard 타깃 (패밀리 다양성 단독)"
  - id: L2
    def: "LightGBM 67열 스태커, S2 평활 타깃 α0.85 (패밀리 × 타깃 복합 다양성)"
  params: "lr 0.03 · num_leaves 63 · min_data_in_leaf 200 · feature/bagging 0.8 · 1400라운드 고정 · 범주형 3열 native"

판정_프로토콜:
  면: "fold_2024 (양팔 다 ≤2023 학습 — 정직면)"
  기준: >
    **AX 안쪽 3원 (AA 0.50/S2 0.28/S1 0.22) 위에** L 팔을 w_L 로 얹었을 때의
    추가 이득. w_L 은 seed 42 곡면에서 고르고 **7·2024 에는 고정 적용**.
  문턱: "🔴 사전 등록 — 부호 3/3 그리고 평균 ≥ std(ddof=1) 3배. 결과 보고 안 바꾼다(S8)"
  정지점: "seed 42 에서 최적 w_L 의 추가 이득 < +3점이면 축을 닫고 보고"

배포_경로: "통과 시 배포 스태커 (시드 42/7/2024 × 승자 팔) → AX 위에 후보 AY — c 분할 확장, d_adj 재해, 게이트·감사·zip"

runtime:
  where: a5000
  stage_1: "~15분 (fold_2024 LGBM 스태커 2팔 × seed 42 — LGBM 1400 은 CatBoost 2.4분보다 빠름)"
  stage_2: "~25분 (2팔 × 2시드)"
  배포: "~25분 (6 fit, 동시 3)"
