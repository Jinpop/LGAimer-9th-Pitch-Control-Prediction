# 🔴 사용자 승인 완료 (2026-08-15, "발사하자")
exp_id: exp_049
date: "2026-08-15"
title: "팀원 Q의 나머지 14열을 우리 R 스태커에 — AA를 '더 나은 Q'로 만든다"
base_exp: "exp_048 (A1 = 67열, 이번 대조군) · exp_030 (C5_B3) · exp_045 이후 σ"
외부_입력: "teammate_v19/submit_v19_qp6.zip 의 `model/tables/` + `teammate_v19/extracted/repro/`(feats.py·build_p6.py·pipeline.py)"

motivation:
  사용자_제안: >
    **2026-08-15 사용자 발상.** v19에서 Q를 우리 AA로 교체하려는데, 지금은 우열이 갈린다 —
    우리가 나은 것 셋(9시드 / 스태커 1400 / R·F 분할), 그들이 나은 것 하나(**피처 77열 vs 우리 63열**).
    **그 하나를 없애면 교체가 명백한 업그레이드가 된다.**
  없는_14열: >
    `p6_*` 6(구종 6분류 예측 확률, `model/tables/pitchmodel6.txt`) ·
    `idea_matchup_pitch` 1(팀원 주력 피처) · `i3_anom_*` 7(이상치 계열, `anom_cnt.csv`).
    63 + 14 = **77열 = Q와 동일**.
  왜_되겠는가: >
    exp_048이 같은 형태로 16열을 붙여 **+102.86285점**(12.03σ)을 얻었다. 길이 나 있다.
    ⚠️ **그 수치를 이번 기대값으로 쓰지 마라** — `ins_*`는 우리가 갖지 못한 시간 축이었고,
    이 14열은 성격이 다르다(구종 예측·매치업·이상치). **exp_047이 아홉 축을 전부 기각한 전례**도 있다.

changed_vs_control:
  the_one: "R 갈래 **스태커** 입력 67열 → **81열** (`p6_*` 6 + `idea_matchup_pitch` 1 + `i3_anom_*` 7)"
  대조군: "🔴 **exp_048 A1**(67열 @1400, 3시드 평균 Brier 0.24787535671986385 / 773.21454). exp_030 대비 Δ를 이 실험 성과로 적지 말 것"
  불변:
    - "🔴 셀 모델 4개 동결(47열) · OOF 승계(sha 대조) · 스태커 반복 **1400 고정**"
    - "마스크 · fold 정의 · 시드 42·7·2024 · CatBoost 파라미터 · 라이브러리"
  ⚠️_1400을_다시_고르지_않는_이유: "exp_034가 로컬로 반복 수를 다시 적합해 −23.02235를 잃었고, AH가 이 축에서 fold_2024와 LB의 부호가 두 구간 모두 갈림을 확인했다"
  ⚠️_딸림_변인: "스태커 입력 열 수(the_one의 정의) · 적합 시간 · 모델 크기 · **새 14열의 결측 구간**(아래)"

# ---------------------------------------------------------------------------
# 🔴 STAGE 0 — 인수 검사. 남의 피처를 우리 파이프라인에 넣기 전에
# ---------------------------------------------------------------------------
stage0_인수검사:
  🔴_왜: "팀원의 자체 검증을 **상속하지 않는다.** exp_048에서 같은 규율을 적용했고 그때 앵커 함정이 실재했다"
  G0a_행_독립성: >
    14열 생성 경로가 **행별 lookup + 산술뿐**인지 AST로.
    `groupby`·`sort`·`cumsum`·`diff`·`rolling`·`quantile`·`mean()`·`np.unique`가 **적용(apply) 경로에** 없을 것.
    ⚠️ `p6_*`는 **LightGBM 모델 추론**이다 — 모델이 행별로 도는지, 배치 통계를 안 쓰는지 확인하라.
  G0b_전체_셔플_항등: "프레임을 셔플해 생성 → 원본과 행별 값 비트 동일"
  G0c_단독_행: "임의 100행·1행만 단독으로 생성 → 전체 프레임 결과와 비트 동일"
  G0d_🔴_as_of_경계: >
    **이게 이번 실험의 핵심 위험이다.** 세 계열의 표가 **언제까지의 데이터로** 만들어졌는지 확정하라.
    - fold_2024 검증행(2024)에는 **season<2024로 만든 표**여야 한다
    - 출하 시에는 ≤2024 표
    **표가 ≤2024 하나뿐이고 시즌별 판본이 없으면**, fold_2024 측정에 쓸 수 없다 →
    **재현팩 코드로 season<2024 판본을 우리가 만들어야** 한다. 만들 수 있는지 먼저 확인하고 **못 만들면 즉시 보고**하라.
    ⚠️ exp_048에서 팀원이 남긴 앵커 함정이 실재했다(2024행에 배포 앵커를 쓰면 전 행이 0으로 뭉갬).
  G0e_라벨_복원: >
    상시 단서 §S10. 14열이 라벨을 읽지 않는지 **열 접근 추적**으로 확인하라
    (exp_048 감사관이 쓴 방법 — 대리 프레임으로 읽은 열을 기록).
    ⚠️ "동일 튜플이 두 라벨을 갖는가"로 잡지 마라 — 연속형 열에서는 전부 단일 튜플이 되어 **실수를 재는 검사**가 된다.
  G0f_결측: "커버리지와 결측 구조. **sentinel 금지** — 결측이면 NaN, 필요하면 플래그 열 별도"
  eta: "40~60분 (표 생성·판본 확인 포함)"

# ---------------------------------------------------------------------------
# STAGE 1 — fold_2024 측정. OOF가 저장돼 있어 싸다
# ---------------------------------------------------------------------------
stage1:
  🟢_학습_대부분이_끝나_있다: >
    fold_2024 OOF 3개가 `~/SungjinPark/build_AH/localref/oof/`에 있고 exp_048이 sha 대조 후 썼다.
    **셀 모델도 OOF도 재생성하지 마라.** 스태커만 적합한다.
  arms:
    A0: "대조군 = exp_048 A1 (67열 @1400). **저장 예측 재사용 + sha 대조**로 재현 확인만"
    A1: "**81열**(67 + 14) @1400 — 처치군"
    A2: "🔵 선택 — 14열을 계열별로 나눈 LOO(하나씩 빼기): `p6_*`만 / `idea_matchup_pitch`만 / `i3_anom_*`만. **묶음이 통과하면 몫을 낸다**"
  seeds: [42, 7, 2024]
  측정: "valid_all Brier + 환산 점수. 세그먼트 R/F는 보조만 (§S7)"
  추가로_남길_것:
    - "14열 각각의 gain 순위 — `idea_matchup_pitch`는 팀원 base에서 5위였고 `ins_p_success`에 밀렸다. 우리 base에서는?"
    - "🔴 기존 열과의 상관 — 특히 `p6_*`와 우리 `asof_pitcher_{fastball,breaking,offspeed}_rate`(구종 배합)는 **겹칠 가능성이 크다**"
    - "커버리지(세그먼트 R/F별)"
  eta: "20~30분 (81열이면 시드당 3.0~3.4분, 동시 3개·경합 1.35)"

pre_registered_decision_rule:
  sigma_score: 8.55113
  threshold_3sigma: 25.65339
  rule: "3시드 전부 부호 일치 AND |평균Δ| ≥ 25.65339점 → 채택"
  대조군: "A0 = exp_048 A1"
  ⚠️: "판정 후 σ·ddof를 바꾸지 않는다. **결과를 보고 문턱을 바꾸지 않는다**(§S8)"
  🔴_묶음_판정_주의: >
    **exp_047 교훈**: 계단(전진 추가)만으로 묶음을 채택하지 않는다. 묶음이 통과하면 **A2 LOO로 몫을 낸다**.
    exp_047에서 `sit` 축의 부호가 뒤집힌 전례가 있다.

