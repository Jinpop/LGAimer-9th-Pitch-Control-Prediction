# ───────────────────── 사전 등록 (S8 — 결과를 보고 바꾸지 않는다) ─────────────────────
사전등록:
  행동_문턱: "현 기반 단독 꼭지점 >= +1.4점 AND 기존 축과 max|rho| <= 0.4 → 작은 진폭(0.2배) 프로브 1발 자격. 미달이면 닫는다."
  문턱_출처: "exp_110 next_suggestion 1순위. 이 실험이 정하지 않았다."

  수축상수_k:
    🔴_원칙: "표본 내 선택 금지. exp_110 할인 ②가 지목한 결함이 그것이다(5후보를 2024 표본 내에서 골랐다)."
    규칙: |
      k = sigma2_within / sigma2_between, 적률법(method of moments)으로 ★표 재료(<=2023)에서만★ 추정한다.
        sigma2_within  = 그룹 내 잔차분산의 풀링 추정 = sum_g sum_i (r_i - m_g)^2 / (N - G)
        sigma2_between : E[ sum_g n_g (m_g - mbar)^2 ] = (G-1) sigma2_within + (N - sum_g n_g^2 / N) sigma2_between
                         를 sigma2_between 에 대해 푼다 (음수면 0 으로 절단 → k = inf → 축 사망).
      축마다 따로 계산하고, 계산된 k 를 그대로 쓴다. 2024 행은 이 계산에 한 값도 들어가지 않는다.
    민감도: "5점 격자 [20,60,200,600,2000] 의 꼭지점을 ★참고로만★ 병기한다. 선택에 쓰지 않는다."

  귀무_대조_둘: # S104·S175·S179 — 귀무를 하나만 쓰면 판정이 아니다
    N1_identity_permute: "타자 식별자 대응을 무작위 치환 — 표 항목이 엉뚱한 타자의 2024 행에 붙는다. 그룹 크기 분포는 양쪽 다 보존. 20 draw."
    N2_resid_permute:    "표 재료의 잔차를 ★시즌 안에서★ 치환한 뒤 같은 절차로 표를 짓는다. 그룹 구조·크기·커버리지 완전 보존. 20 draw. (S182 — 시즌을 가로지르지 않는다)"
    판정: "관측 꼭지점이 두 귀무의 p95 를 모두 넘어야 신호로 읽는다."

  교차적합: # S178·S190 — 부트스트랩만으로 판정하지 않는다
    단위: "★타자★ 반분할 (이 축은 타자 키다). 20 반복 x 2 폴드."
    절차: "폴드 A 행에서 u 를 적합(u = L_A/G_A), 폴드 B 행에서 실현 이득 2*K*L_B*u - K*G_B*u^2 을 잰다. 절반 걸음(0.5u)도 함께(S193)."
    보고: "표본 밖 평균 ± sd · 양수 비율 · 최악값."

  부호: "🔴 이 계열은 라벨 EB 수축 표라 부호를 프레임에서 읽지 않는다(S213 rho 0.66~0.83, S206). 크기만 보고한다."

# ───────────────────── 규약 ─────────────────────
규약:
  빈티지: "표 <=2023 → 행 2024. 배포는 <=2024 → 2025. 명시(S32·S49)."
  기반: "build_CU/work/calp_PAR.npy = 후보 CS3 를 캘프레임에서 돌린 저장 벡터. ★패키지 재실행 0★"
  캘프레임: "build_AC/work/tr2024 (train season==2024, 253,507행) · ins 앵커 anchor_lt2024 스왑 · lookup_d/n 을 <=2023 키 1,202 로 제한 (exp_109/build_CU 33_cal.py 관례 그대로)"
  표_재료: "e110_ax22.py 와 동일 — 2022+2023 행, exp_030 51열 C5B3 예측 + deployed_offset(beta R .597044/F .492041), 잔차 평균 제거"
  🔴_한계: "표 재료의 잔차원은 51열 옛 팔이다. 현 블렌드의 <=2023 예측이 존재하지 않는다(패키지 실행 없이는 만들 수 없다). §진단에서 그 대가를 직접 잰다."
  전파: |
    꼭지점 K*L^2/G 는 전체 배율에 불변이다 — c 가 상수면 정확히 상쇄된다.
    c 를 세 방식으로 계산해 나란히 낸다:
      (a) c = 1        확률공간 직접 오프셋 (22축 스크린 관례, 비교 기준)
      (b) c = 실측 할선 (p_CT - p_CR)/(u*w_sp), exp109/work 저장분 — 로짓 pre-alpha 축의 실제 행별 기울기
      (c) c = alpha * p(1-p)  해석식 (alpha = 1.07911)
  🔴_S57_주의: "이 축은 ★셀 지시자가 아니다★ — 타자 표는 행마다 다른 연속값이고 커버리지가 ~100% 라 f(1-f)=0 이다. S201 이 sp 축에서 겪은 것과 같은 자리. 검산은 연속형 K_G = K*mean(c^2)*Var(w) 로 한다. f 는 세어서 보고한다."
  하니스_양성대조: "같은 코드로 exp_048 67열 기반을 재현해 exp_110 §4 값(+6.975/+6.743/+6.625)과 대조한다. 안 맞으면 측정 무효."

