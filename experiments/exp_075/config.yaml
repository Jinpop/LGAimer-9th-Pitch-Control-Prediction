🔴 트리가_못_만드는_형태:
  bt_x_psr:  "`asof_pitcher_success_rate` × `asof_batter_success_rate` (**곱**)"
  bt_d_psr:  "`asof_pitcher_success_rate` − `asof_batter_success_rate` (**차**)"
  근거: >
    스태커는 CatBoost 이고 분기가 축 평행이라 **곱·차를 직접 못 만든다.**
    `ins_*` 가 값을 한 이유가 정확히 이것이었다 — 성분(누적·앵커)이 둘 다 있었는데도
    **차분한 형태**가 새 정보였다. 같은 논리를 투수×타자 상호작용에 적용한다.
플래툰:
  bt_hand_dev: "타자의 좌완 상대 성공률 − 우완 상대 성공률 (**플래툰 스플릿**). 도메인에서 큰 효과이고 차분 형태다"
대조군:
  ctrl_asof_bsr: "🔴 주최측 `asof_batter_success_rate`. **핵심 비교 상대** — 우리 축이 이것과 겹치는가. 살아 있어야 스크린이 타자 축을 잡을 힘이 있는 것이다"
  ctrl_asof_psr: "BJ 가 이미 산 축. 교정용 — 통과가 정상이며 '흡수 안 됨'으로 읽지 마라"
  perm_shuffle:  "🔴 **결측 보존 순열**로 만들어라. exp_074 에서 NaN 을 섞은 순열이 +1.96 을 내 대조군이 오작동했다. 200회 분포로 귀무 눈금을 함께 보고하라"

