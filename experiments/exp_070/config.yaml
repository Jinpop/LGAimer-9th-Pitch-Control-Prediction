## 측정 — 두 구조를 같은 면에서
## ══════════════════════════════════════════════════════════════
구조_A_현행_중첩_상수_전면_재해:
  형태: >
    z_p = (1−w_ebm)·( w_v6·lg(p_v6_3arm) + (1−w_v6)·lg(p_q) ) + w_ebm·lg(p_ebm) + β_ins·off
    z   = w_out·z_p + c_aa·lg(AA81) + c_t70·lg(T70)
    자유도 6: w_v6 · w_ebm · β_ins · w_out · c_aa · c_t70
  대조군: "배포 상수 (0.5, −0.10, 0.03, 0.7, 0.25244, 0.04756)"
  산출: "argmax 6개 + 배포 대비 Δ점수 + 각 축의 1축 조건부 곡선"
구조_B_탈중첩_평면:
  형태: "z = Σ w_i·lg(p_i),  i ∈ {lgb, cat, leaf, q, ebm, AA81, T70} + β_ins·off — 자유도 8"
  묻는_것: "중첩(팀원 내부 가중 고정)이 평면 대비 몇 점을 잃고 있는가 = **구조 상금의 크기**"
  ⚠️ 배포_비용_명시: "구조 B 출하는 mate/ 코드 수정(C단)이 필요하다. 상금이 작으면 안 간다 — 그 판단용 측정이다."
구조_C_보조_우리팔_유무:
  형태: "구조 A 에서 c_aa=c_t70=0 (팀원 것만) vs 전체 — 우리 팔의 정직한 한계 기여"

