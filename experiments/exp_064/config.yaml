hypothesis: >
  exp_062 가 잰 배포 불일치는 **우리가 만든 것이다.**
  팀원 `rebuild_tables.py` 의 `build_vintage()` 가 명시한다 —
  `pitchmodel6.txt` · `pmcat6.json` · `anom_cnt.csv` **3종은 빈티지가 없고 전 연도가 배포본 한 벌을 그대로 쓴다**.
  우리는 그것을 자체 685쌍 지도로 **재구축**했고 그래서 어긋났다.
  → **배포본 3개를 복사해 14열만 다시 계산하면 diff 가 구조상 0 이 된다.**

🔴_재구축은_애초에_정답이_될_수_없었다: >
  핸드오프 `rebuild_tables.py::verify()` 가 배포본 대조 기준을 **`min ρ > 0.99`** 로 잡아 뒀다.
  주석: "ρ=1.000000 이 아닌 것은 LightGBM bagging RNG 가 스레드 수·버전에 의존하기 때문".
  **`.cbm` 과 같은 계열 — 바이트 재현이 안 된다.** 복사만이 diff 0 을 준다.
  (CLAUDE.md §제출물 검증 3단의 `.cbm` 조항과 같은 성질. 이 계열을 하나 더 등재한다.)

