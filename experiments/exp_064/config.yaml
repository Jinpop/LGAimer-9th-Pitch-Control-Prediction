🔴_사전_등록_판정_범위: >
  **이 실험은 팔 채택을 판정하지 않는다.** 산출은 ① 게이트 통과 여부 ② NN 단독 점수 ③ 상관.
  팔로 쓸지는 **블렌드 위에서 재는 별도 측정**이 필요하고 그건 다음 실험이다.
  여기서 점수가 좋다고 채택으로 넘어가지 않는다(S8).

🔴_측정_편향_기록_필수: >
  트랙맨은 **2019~2024 뿐이고 2025 는 없다**(실측 255,957/279,126/301,032/307,637/315,100/334,226).
  배포 p6 는 ≤2024 트랙맨으로 적합됐으므로 —
    · valid **2024** 행 → 그 투수의 2024 레퍼토리를 p6 가 **학습 때 봤다**
    · test **2025** 행 → 2025 트랙맨이 없어 **못 봤다**
  **같은 열이 로컬에서 유리하고 배포에서 아니다.** 규칙 위반은 아니다(구종은 타깃 파생이 아님).
  그러나 **fold_2024 점수 중 p6 계열 13열의 몫은 배포에서 그만큼 안 나온다** —
  이 실험의 exp_063 대비 이득은 **배포 이득의 상한**으로 읽어야 한다. report.md 에 명시할 것.

