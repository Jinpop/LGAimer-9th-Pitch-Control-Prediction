exp_id: exp_083
date: 2026-08-22
title: "이미 계산되고 버려지는 중간값 전수 조사 — 팀원 +2.68 의 일반형"
학습_건수: 0
제출물: "없음 (지휘자가 결과로 후보를 고른다)"

왜: |
  팀원이 **Q 셀 4개가 스태커 입력으로 이미 계산되고 있다**는 것을 보고 부스터 호출 증가분 0 으로
  꺼내 써 **+2.6766924977** 을 냈다(팀 신기록). 지휘자는 같은 축을 08-20 에 "출하 실현성 불투명"으로 닫았다 (S55).
  🔑 그렇다면 **파이프라인 전체에 같은 종류가 더 있는가.** 부스터를 새로 부르지 않고 꺼낼 수 있는
  per-row 중간값을 전부 세고, 각각이 **새 방향인지** 를 잰다.

조사_대상 (각각 "이미 계산되는가 / 꺼내는 비용 / 새 방향인가" 셋을 답할 것):
  A_우리_AA팔_셀:
    무엇: "`aa_infer.py` 가 스태커 입력으로 만드는 셀 확률. `model/meta.json` 의 `cell_model_order`"
    🔑: "🔴 **파트너 Q 셀과 같은 4종인가?** 같다면 **다른 모델로 추정한 같은 신호**다 — 팀원 `lg_mr` 과 상관이 1 이 아니면 새 자유도다. 이게 이 실험의 1순위다"
  B_EBM_피처별_기여:
    무엇: "`mate/infer_ebm6.py` 가 최종 로짓을 만들 때 피처별 shape 함수 값을 더한다 — 그 항들이 per-row 로 존재한다"
    🔑: "가산 모델이라 분해가 정확하다. 어느 피처 기여가 잔차를 설명하는가"
  C_v6_Leaf_경로:
    무엇: "`W_LEAF = 0.12` 팔. 잎 인덱스 → LR. 잎 인덱스 자체·LR 부분합이 per-row 값이다"
  D_v6_NN_은닉:
    무엇: "159차원 입력 → 256-128-64. 마지막 은닉층 64차원이 per-row 로 계산된다"
    ⚠️: "64차원을 다 쓰면 자유도가 폭발한다. **주성분 1~3개**만 볼 것"
  E_시드_산포:
    무엇: "시드별 예측의 **분산**은 이미 계산되고(평균 낼 때) 버려진다. 행별 모델 불확실도다"
    🔑: "불확실한 행에서 예측을 중앙으로 당기는 오프셋 — 새 자유도이고 부스터 비용 0"
  F_클립_카운터:
    무엇: "`n_clip_p`·`n_moved` 등 진단 카운터가 만들어지는 **마스크**. per-row 불린이다"

각_후보에_낼_것:
  - "이미 계산되는가 (코드 줄번호). **아니면 즉시 탈락** — 부스터를 새로 부르면 이 실험의 전제 밖이다"
  - "꺼내는 데 필요한 코드 변경 규모 (몇 파일·몇 줄). 팀원 판례는 4파일"
  - "per-row 벡터를 실제로 뽑아 **δ = p(1−p)·(v − mean_train(v))** 를 만들고 `K·G_jj`"
  - "🔴 **기존 축 전부와의 최대 |ρ|**: exp_078 15축 + q_beta + q_league 4 + 셀 8 + 팀원 b·c. **0.5 를 넘으면 새 방향이 아니다**"
  - "🔴 **정직면 이득을 내되 S54 를 적용하라** — 라벨 정의에 닿는 양(A·B 일부)은 정직면이 부풀린다. **팀원 b 의 전이비 0.05153 으로 환산한 값을 병기**하라"
  - "`K·Q=1` 진폭과 그 0.2배 (S42)"

사전_등록_판정:
  A: "최대 |ρ| ≤ 0.5 이고 전이비 환산 기대 LB ≥ +1.0 인 축이 1개 이상 → 그 축 프로브 빌드"
  B: "≥ +0.4 인 축만 → 잡음바닥급이므로 기존 캠페인에 합류"
  C: "없음 → 이 계열 종료"
  🔴: "결과를 보고 문턱을 바꾸지 않는다 (S8)"

운영:
  스레드: 6 고정
  파일_삭제: "🔴 금지. 산출물은 ~/SungjinPark/exp083/ 아래에만"
  🔴 규칙2_4: "꺼내는 값은 **그 행 자신의 것**이어야 한다. 다른 행 참조·test 분포 집계가 필요한 후보는 즉시 탈락시키고 그 이유를 적어라"
