exp_id: exp_085
date: 2026-08-23
title: "새 귀납 편향 팔 — 인수분해(FM) · ID 임베딩 NN, stage 0 관문 둘"
학습_건수: "2 arm × fold_2024 × seed 42 (관문용, 본 학습 아님)"
제출물: "없음 (관문 통과 시 별도 승인 후 본 학습)"

왜: |
  "새 모델을 써보자"는 축은 세 번 측정됐고 세 번 다 닫혔다 —
    exp_054 LightGBM 팔 (같은 67열·같은 OOF): 최적 가중 **0.00**, 이득 정확히 0
    exp_053 → 후보 AX (타깃 평활 새 팔 3개): 로컬 +18.68 → **LB −0.4869**
    exp_055 → 후보 AY (T70 자기 증류):        로컬 +9.86  → **LB −0.9928**
    exp_052 트랙맨 teacher 증류: soft label·피처 증류 두 경로 다 기각
  🔑 **그런데 셋 다 "같은 열 위의 트리 계열"이었다.** 바꾼 것은 타깃이지 표현이 아니다.
  장부의 다른 문장: "잔차를 46열로 예측하면 조기 종료가 `best_iter = 1`" — 기존 피처가 포화다.
  → **알고리즘을 바꾸는 것과 표현을 바꾸는 것은 다른 실험이다.** 트리는 투수·타자 ID 를
  인코딩된 스칼라 하나로만 쪼갠다. 이 실험은 그 ID 를 **벡터로 학습하는 팔**이 기존 팔들과
  실제로 다른 방향인지만 잰다. 통과 못 하면 반나절에 닫는다 (exp_052 판례).

면: "fold_2024 — train season ≤ 2023 → valid 2024, valid_all(R+F 전체) Brier. 시드 42 단독"

arm:
  F1_FM:
    무엇: "인수분해 기계 — pitcher_id × batter_id 등 ID 쌍의 저계수 쌍선형 상호작용 + 기존 열 선형항"
    구조: "임베딩 차원 k = 16. 쌍: (pitcher_id, batter_id) · (pitcher_id, batter_hand) · (pitcher_id, pitch_type) · (batter_id, pitch_type)"
    🔑: "트리가 가장 표현하기 어려운 형태. 장부 언급 0회 — 진짜 미착수"
  F2_EMB:
    무엇: "ID 임베딩 MLP — pitcher_id/batter_id/pitch_type 임베딩(dim 16~32) ⊕ 기존 수치열 → 256-128-64 → sigmoid"
    🔑: "팀원 v6 의 NN 은 159차원 **수치 입력**만 받는다. ID 를 벡터로 학습하는 팔은 우리 블렌드에 없다"

구현_제약:
  라이브러리: "torch 2.7.1 (평가 서버 버전) 단독. 새 외부 의존성 금지"
  🔴 리크: "shift(1) 강제 · 현재 행 TrackMan 금지 · 랜덤 KFold 금지"
  🔴 규칙2_4: "임베딩 표는 **train 에서만** 학습한다. 미등장 ID 는 학습된 <UNK> 행으로 — test 분포를 보고 정하지 않는다. 추론은 행별 독립"
  ⚠️ 결측: "수치열 결측을 sentinel 로 채우지 않는다. <UNK> 임베딩은 어휘 기제이지 수치 sentinel 이 아니다"

사전_등록_관문 (🔴 결과를 보고 바꾸지 않는다 — S8):
  G0a_단독성능:
    측정: "fold_2024 valid_all Brier 를 기존 최약 팔과 비교"
    문턱: "기존 최약 팔 대비 **−500점 이내**"
    근거: "exp_054 는 −336 / −275점에서 최적 가중이 0.00 이 나왔다. 그보다 나쁘면 볼 것 없다"
  G0b_다양성:
    측정: "같은 면 위 기존 팔 예측(AA · mate v6 · Q · T70 · S1 · S2)과의 로짓 상관, 최대 |ρ|"
    문턱: "**≤ 0.93**"
    근거: "현 팔 최대 상관 0.9776. exp_053 새 팔은 AA 와 0.95~0.96 이었고 LB −0.4869 로 죽었다. 0.95 계열은 이미 시험돼 실패했다 — 그보다 낮아야 새 것이다"
  판정:
    통과: "두 관문 **다** 통과한 arm 이 1개 이상 → 본 학습 승인 요청 (지휘자가 사용자에게)"
    기각: "하나라도 미달 → **이 계열 종료**, 대장에 기록. 파라미터 재탐색 금지(낚시 방지)"
  ⚠️ 부가: "관문은 판정이 아니다. 통과해도 그것은 '볼 가치가 있다'는 뜻이지 채택이 아니다 (exp_052 판례)"

