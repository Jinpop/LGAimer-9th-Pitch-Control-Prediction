  - "arm 예측을 기존 3원 블렌드 위에 얹었을 때의 최적 가중과 그 이득 (같은 면, 닫힌 해)"
  - "ID 미등장률: valid 2024 에서 train ≤2023 에 없는 pitcher_id · batter_id 비율"
