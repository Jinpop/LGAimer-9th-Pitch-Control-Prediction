exp_id: exp_097
title: "부동소수 정밀도 감사 — 배포 경로 전수(점수) + 정직면 재판독(방법)"
date: 2026-08-25
owner: orchestrator

배경:
  촉발: |
    exp_096 이 우리 정직면 입력에서 float32 표준화 결함을 찾았다(S134). `prep089.py:132-133` 이
    float32 배열에 111만 행 `nanmean/nanstd` 를 걸어 `season` sd 를 **1.4238 → 19.616 (13.8배)** 로
    냈다 — 그 열이 사실상 죽었다. 팀원 배포 `prep.json` 은 깨끗해서 **출하 점수는 안 깎였다.**
  🔑_그런데_이_질문을_아무도_안_했다: |
    **배포 경로 안에는 같은 종류의 누산이 없는가?**
    우리 패키지는 245,789행(추론) · 1,475,092행(동결표 생성) 규모로 평균·분산·EB 수축·앵커 통계·
    롤링 집계를 수없이 만든다. 그중 하나라도 float32 로 누산되면 **그것은 측정면이 아니라 출하 점수를 깎는다.**
    이건 S55 의 형태다 — *"새 신호를 만들 수 없다"* 와 *"이미 있는 신호가 새는 것을 못 봤다"* 는 다른 판정이다.
  왜_지금인가: |
    마감 6.9일, 필요 총량 +27~38. 사후 상수(exp_078)·딥 가중과 잔여 per-row 신호(exp_095)·
    새 팔 계열(exp_096)이 전부 닫혔다. **남은 것 중 값이 클 수 있고 비용이 낮은 것이 이것뿐이다.**

# ─────────────────────────────────────────────────────────────
stageA_배포_경로_정밀도_감사:     # 🔴 이것이 점수 단계다. 먼저 한다.
  대상: "부모 CH 패키지 = `~/Downloads/submit_CF_3axis.zip` (내부 candidate 키는 CH · LB 1140.3283619813)"
  방법:
    A1_전수_열거: |
      출하 `.py` 전부를 통독해 **여러 행에 걸친 누산**을 하나도 빼지 말고 열거한다 —
      `mean/std/var/sum/nanmean/nansum/cumsum/groupby.agg/rolling/expanding/dot/@/matmul/einsum`,
      그리고 pandas 집계(`transform`, `agg`, `apply`).
      대상 파일: `script.py` · `mate/script.py` · `mate/v6_infer.py` · `mate/q_infer.py` ·
      `mate/deep_infer.py` · `aa_infer.py` · 그 밖에 zip 안 모든 `.py`.
      🔴 **기억으로 하지 말고 코드에서 하라 (G-LEDGER).** 각 항목에 파일:행 을 붙인다.
    A2_dtype_판정: |
      각 누산 지점에서 **입력 배열의 실제 dtype 과 누산 dtype** 을 실행 중에 찍는다(정적 독해로 추정 금지 —
      pandas/numpy 는 조용히 승격하거나 안 하거나 한다). 누산 원소 수도 함께 찍는다.
      위험도 = f32 여부 × 원소 수 × 값의 크기(대수 상쇄가 큰 열일수록 나쁘다).
    A3_실측_오차: |
      f32 로 누산되는 지점 전부에 대해 **같은 입력을 float64 로 다시 누산**해 차이를 잰다.
      보고 단위 셋: ① 절대차 ② 그 열의 참 sd 대비 비 ③ **최종 확률에 미치는 max|Δp| 와 K·mean(Δp²)**
      (마지막 것이 점수 단위다 — K = 400309.19882517256).
    A4_고침_후보: |
      max|Δp| 가 **1e-6 을 넘는** 지점만 고침 후보로 올린다. 각각에 대해
      ① 한 줄 고침(`.astype(np.float64)` 또는 `dtype=np.float64`)이 가능한가
      ② 그 고침이 **동결표를 다시 만들어야 하는가**(만들어야 하면 재학습 비용이 붙는다)
      ③ 고쳤을 때 정직면 이득이 얼마인가 — **부호까지** 낸다.
      🔴 **고치면 반드시 좋아진다고 가정하지 마라.** 팔·상수가 전부 결함 있는 값 위에서 적합됐으므로
      결함을 고치면 그 상수들의 꼭지점이 옮겨간다(S97·S123 이 실측한 형태다). **정직면에서 부호를 확인하고 보고하라.**
  판정_문턱_사전등록:
    보고_대상: "max|Δp| > 1e-6 인 지점 전부 (부호·크기 무관하게 표로)"
    출하_후보_승격: "정직면 이득 ≥ +2.0 **그리고** 짝지은 투수 블록 부트스트랩 t ≥ 2.0"
    ⚠️: "결과를 보고 문턱을 바꾸지 않는다 (S8)"
  ETA: "코드 통독·계측 60분 · f64 재누산·확률 전파 40분 · 정직면 평가 30분 → 약 2시간 20분"

# ─────────────────────────────────────────────────────────────
stageB_정직면_재판독:            # 방법 단계. stageA 다음.
  왜: "exp_089·090·091·092·093·095 가 전부 결함 입력 위에 있다. 그 결론들이 유지되는지 값싸게 확인한다."
  🔴_먼저_할_것:
    - "`prep089.py` 를 f64 로 고친 판본으로 OOT 입력을 다시 만든다 (exp_096 이 이미 `work/X_f64_oot23.npy` 를 만들어 뒀다 — 재사용하고 sha 를 적어라)."
    - "🔴 **결함이 `season` 한 열만인지 99열 전수로 확인하라.** exp_096 은 `season` 만 보고했다. 각 열의 f32 mu/sd 대 f64 mu/sd 를 표로 내라."
    - "🔴 **팀원 배포 `prep.json` 도 99열 전수로 확인하라.** exp_096 은 `season` 만 대조했다. 배포 쪽이 한 열이라도 어긋나면 그것은 stageA 사안이다."
  B1_학습량_argmax_재판독:
    질문: "고친 면에서, **배포 가중 `w_deep = 0.40` 에서** 딥 팔의 최적 학습량은 어디인가?"
    ⚠️_지휘자_정정: |
      exp_096 보고서가 *"배포 w_deep = 0.20 이 너무 낮을 가능성"* 이라 적었는데 **틀렸다.**
      부모 CH 의 `mate/model/blend.json` 은 **`w_deep = 0.40`** 이다(S130, 지휘자가 zip 을 열어 직접 확인).
      0.20 은 CE 시절 값이다. **재판독은 0.40 을 기준으로 하라.**
    격자: "OOT 스텝 {816, 1088, 1360, 1632, 2176, 2720, 3264, 4080} × 5시드, `w` 는 0.20~0.60"
    🔑_눈금이_하나_있다: |
      **CE 가 이 축의 LB 실측점이다** — 배포 720 → 2160 스텝(OOT 환산 데이터비 1.324), `w = 0.20` 고정,
      LB **+4.8280402096**. 결함면에서 그 이동의 정직면 Δ 가 +10.102 여서 전이비 0.4779 가 나왔다(S111).
      **고친 면에서 같은 이동을 다시 재면 전이비가 새로 나온다.** 그 비를 써서
      "지금 위치 → 새 argmax" 이동의 LB 를 예측하라. 예측이 **검출한계 +1.4 아래면 후보를 만들지 마라.**
  B2_기존_결론_재확인:
    - "exp_095 의 `v = 0`(바깥 딥 슬롯 무가치) 이 고친 면에서도 성립하는가 — 격자를 다시 돌려라."
    - |
      🔑 exp_092 의 수수께끼를 푼다 — *"최고 혼합 지점이 이름 붙인 계열이 아니라 **무작위 16열 마스크**(+14.892)였다"*.
      **그 마스크에 결함 열(`season` 등 f32 누산이 망친 열)이 들어 있었는가?** 들어 있었다면 그 이득은
      다양성이 아니라 **결함 제거**였고, S104 의 해석도 그만큼 다시 써야 한다. 마스크 목록이 `exp_092` 산출물에 있다.
    - "exp_090 의 학습량 argmax 1632 · S96 의 t 값 · S97 의 `(학습량, w)` 동반 이동이 고친 면에서 어떻게 되는가 — 표로."
  ETA: "입력 재생성·전수 대조 30분 · 40 fit(딥 fit 약 12~20초) 20분 · 격자·부트스트랩 40분 → 약 1시간 30분"

자원_규율:
  - "🔴 GPU 2레인 중 **cuda:0 만** 써라 — `cuda:1` 에서 exp_096 laneH(어텐션)가 아직 돈다. 그것을 죽이지 마라."
  - "🔴 CPU 4코어 상한. 같은 서버에서 CJ·CG2·CK·CL 감사가 돈다. **단독 추론 시간 측정 금지**(경합, S120)."
  - "🔴 파일 삭제 0건 · 외부 프로세스 kill 0건 — 사용자 승인 없이는 어느 쪽도 하지 않는다."
  - "디스크 여유 297G(95% 사용). 중간 배열은 float32 로 저장하되 **누산은 f64** 로(이 실험의 주제다)."

보고:
  - "🔴 stageA 결과를 먼저, 결론 한 줄로. `max|Δp| > 1e-6` 지점이 **0건이면 0건이라고 명확히 적어라** — 그것도 결과다."
  - "정직면 크기를 LB 로 환산하지 마라(S54·S78). 단 **B1 의 CE 앵커로 유도한 전이비는 예외** — 그건 같은 축의 실측 눈금이다."
  - "빌더·앞선 에이전트 보고를 재서술하지 말고 **네가 잰 값**을 적어라. 값이 다르면 그 자체가 발견이다."

