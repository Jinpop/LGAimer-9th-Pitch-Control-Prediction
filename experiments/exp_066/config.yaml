## 이 실험이 존재하는 이유 — 하나뿐인 양성 측정을 검정한다
## ══════════════════════════════════════════════════════════════
왜: >
  NN 을 쓰라고 말한 측정은 exp_065 면 A **하나뿐**이다(면 B 는 w*=0 을 줬고 오염됐다고 보지만
  그건 "믿을 수 없다"이지 "넣어라"가 아니다).
  🔴 그 하나뿐인 측정이 **AA 구버전(exp_048 67열, 799.88136)** 을 상대로 잰 것이다.
  우리에겐 더 센 판(exp_049 81열, 838.44)이 있고, exp_065 러너가 보고서에 스스로 남겼다 —
  "더 센 상대에서는 면 A 이득이 줄어든다(재확인 여지)". 사전 등록을 지키느라 그때는 안 바꿨다.
  → **+108 이 상대가 약해서 나온 것인지 지금 판정한다. C단 하루치를 쓰기 전에.**

