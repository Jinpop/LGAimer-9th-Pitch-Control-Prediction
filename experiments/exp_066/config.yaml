① 본론_AA_판본_교체:
  형태: "p = expit(w·lg(NN) + (1−w)·lg(AA81)), d 없음 — exp_065 면 A 와 **같은 형태**"
  재료:
    NN: "~/SungjinPark/exp064/out/preds/A99ship_seedavg.npy (+ 개별 4시드). exp_065 재현 대조 필수"
    AA81: "exp_049 (81열) out-of-time 2024 예측. 🔴 경로를 먼저 찾아 sha 를 기록하라"
    AA67_대조: "exp_048 A1@1400 3시드 — exp_065 값(0.247808741181198 / 799.88136) 재현되는지 먼저 확인"
  🔴_두_이득을_나눠_적어라:
    vs_AA단독: "**이게 판정 대상.** 'AA 위에 NN 을 얹으면 얼마인가' — 상대가 세지면 기계적으로 줄어든다"
    vs_NN단독: "'NN 위에 AA 를 얹으면 얼마인가' — 상대가 세지면 **늘어날 수도** 있다. 둘은 다른 양이다"
  참고_exp_065_값: "AA67 상대: vs AA단독 +108.39147 · vs NN단독 +11.88913 · w*=0.75 · corr 0.897922"

② 부수_T70_세번째_팔:
  🔴 배포 T70 은 못 쓴다: "build_AY/seeds/seed_*_T70 은 n_full 1,369,784행 = 2024 포함 적합(표본내)"
  재적합: >
    `~/SungjinPark/run_t70_fits.sh` 를 **split_A 마스크로** 다시 돌린다.
    마스크: (s <= 2023) & ~((s <= 2022) & (g == 'F')) → 1,116,277행. 시드 42/7/2024, alpha 0.70, c67, 1400 라운드.
    실측 시드당 3.43분, 동시 3개 → 약 5분.
  판정: "3팔(NN+AA81+T70) 최적점이 2팔보다 나은가. 지분 0.04756짜리라 작을 것으로 예상 — 크게 나오면 의심하라"
  🔴 정지점: "T70 재적합이 15분을 넘으면 ② 를 버리고 ① 만 완주해 보고하라. ① 이 본론이다."

③ 파생: "우리 재료만의 정직면 최고점. ② 에서 자동으로 나온다. LB 프로브 시작점 근거로만 쓴다."

