# 사용자 승인 2026-08-07 — "27 성능 괜찮으면 제출용도 만들어" + 야간 권한 "B3 재구축까지"
# 전제 조건 충족: exp_027에서 C5가 3시드 채택(+62.43446점, 문턱의 20.2배)
exp_id: exp_030
date: "2026-08-07"
title: "B3 스태킹의 밑단을 CatBoost C5로 교체 — 새 base 생성 (오프셋·감사·zip은 범위 밖)"
base_exp: "exp_016 B3 (아키텍처) · exp_024 (산출물 규격) · exp_027 C5 (모델 스펙)"

hypothesis: >
  exp_027이 flat 대 flat에서 **C5(CatBoost, has_time=True, ID 수치형)**가 LGBM 대조군 L1을
  **+62.43446점** 이기는 것을 3시드로 확인했다(문턱의 20.2배).
  그러나 그것은 **flat 비교**다. 배포 중인 것은 **B3 모드 스태킹 + 오프셋**이고 B3(0.2480)는
  이미 flat LGBM(0.2483)보다 낫다. **C5의 0.2481012는 B3보다 나쁘다.**
  → 물음은 "C5로 갈아탈까"가 아니라 **"B3의 밑단을 C5로 바꾸면 그 +62점이 얼마나 남는가"**다.
  스태킹은 모드 분해라는 별개의 구조 이득을 이미 쓰고 있으므로 **겹칠 수도, 누적될 수도 있다.
  예측 불가이며 이 실험이 답한다.**

# ---------------------------------------------------------------------------
# 범위 — 야간 권한 경계 (사용자가 명시적으로 그은 선)
# ---------------------------------------------------------------------------
scope:
  in: "B3 아키텍처를 CatBoost C5로 재구축해 **새 base 예측을 만드는 것**까지"
  out: >
    ⚠️ **오프셋 β 재적합 · 리크 감사 · zip 빌드 · 제출은 하지 않는다.**
    사용자가 "판단 지점이라 깨서 정할 일"로 명시했다. β는 새 base 위에서 처음부터 다시
    재야 하고(현 0.5704는 B3 LGBM 위 값), 그건 별도 실험이다.
  but_produce: >
    **β 공급 블록(2022·2023) 예측은 만든다.** 이건 β를 정하는 것이 아니라 β를 정할 때
    필요한 stage-1 원자료다. 안 만들면 아침에 β 실험이 학습부터 다시 해야 한다.

# ---------------------------------------------------------------------------
# 무엇을 바꾸고 무엇을 그대로 두는가 (변경 변인 규율)
# ---------------------------------------------------------------------------
variables:
  changed: "셀 이진 4개와 스태커의 **모델 가족과 하이퍼파라미터**를 LGBM에서 CatBoost C5로 교체"
  unchanged: >
    B3 **아키텍처 그대로** — 셀 4개(mid_only·rev_only·both·wayoff_true) → 시간순 OOF →
    스태커. 피처 47열 그대로. 복원 라벨 경로 그대로(`labels.py` 바이트 승계).
    exp_004 마스크·fold 정의·평가 코드 그대로. 오프셋 미적용.
  note: >
    **셀과 스태커를 동시에 바꾸므로 이 실험 하나로는 "셀 교체의 몫"과 "스태커 교체의 몫"을
    가를 수 없다.** 규약대로 **"이 조합의 효과"로만 서술**하라. 가르는 것은 후속이며,
    이득이 나온 뒤에나 값어치가 있다.

model_spec:
  source: "exp_027 arm C5 — `experiments/exp_027/src/train.py`의 `ARMS[\"C5\"]`에서 **읽어 승계**하라. 전사하지 말 것"
  params: "has_time=True · ID **수치형**(cat_features에서 제외) · depth 6 · l2_leaf_reg 10 · lr 0.03 · boosting_type Plain · bootstrap Bernoulli 0.8 · one_hot_max_size 10 · task_type CPU"
  warning: >
    ⚠️ **이 하이퍼파라미터는 튜닝된 적이 없다.** exp_027 리포트 ⑨가 명시했듯 lr·boosting_type·
    bootstrap·subsample·one_hot_max_size 5개는 러너가 정한 첫 시도값이다. C5의 실제 상한은
    더 높을 수 있다. **이 실험은 그 탐색을 하지 않는다** — 아키텍처 교체 하나만 잰다.

# ---------------------------------------------------------------------------
# iter 정책 — 여기가 이 실험의 가장 큰 설계 위험이다
# ---------------------------------------------------------------------------
iter_policy:
  problem: >
    exp_016/exp_024의 **셀 1150 / 스태커 650(또는 7700)은 LGBM의 lr에서 나온 값**이라
    CatBoost로 그대로 옮길 수 없다. exp_027에서 C5의 fold_2023 argmin은 **400**이었고
    L1은 **750**이었다 — 같은 데이터에서도 절반이다.
  solution:
    stage_1: >
      **fold_2023(train ≤2022 → valid 2023), seed 42로 B3-CatBoost를 한 번 돌려 argmin을 뽑는다.**
      셀 4개는 각자의 조기 종료로, 스태커도 조기 종료로. cap은 규약 #3 적응화 —
      **CatBoost argmin이 170~400 범위였으므로 cap 1650**으로 시작한다(exp_027 ⑧의 계산값).
      ⚠️ argmin이 cap에 닿으면 **그 유닛은 무효**다. cap을 올려 재실행하고 기록하라.
    stage_2: >
      **fold_2024 valid를 보고 iter를 정하지 않는다.** stage 1의 fold_2023 argmin에
      학습행 비율 **1,116,277 / 870,752 = 1.2820**을 곱해 고정한다.
      블록 유닛도 같은 방식으로 각자의 학습행 비율을 적용하라(exp_024가 블록에 240/170을
      쓴 것과 같은 계열의 정책).
  why: "fold_2024가 유일한 비교 기준인데 그 위에서 iter를 고르면 기준이 오염된다"

# ---------------------------------------------------------------------------
units:
  stage_1:
    - "fold_2023 B3-C5, seed 42, 조기 종료 → 셀 4개 + 스태커의 argmin"
  stage_2:
    - "fold_2024 B3-C5 × 시드 42 / 7 / 2024 (train ≤2023, 1,116,277행) — **채택 판정용**"
    - "블록 2023 B3-C5 × 시드 42 / 7 (train ≤2022) — β 공급"
    - "블록 2022 B3-C5 × 시드 42 / 7 (train ≤2021) — β 공급"
  why_blocks_2seeds: "규약 #6 — β 공급 블록은 최신 2개. exp_024가 같은 구성을 썼다"
  total: "stage 1 = 1유닛 · stage 2 = 7유닛"

# ---------------------------------------------------------------------------
validation:
  primary_metric: "fold_2024 valid_all(R+F) Brier — 유일한 비교 기준"
  controls:
    - id: LGBM_B3
      value: "exp_024 arm B의 **무보정** base — exp_024 `pred/`에서 sha 대조 후 읽어라. 재학습 금지"
      role: "**주 대조군.** `C5_B3 − LGBM_B3` = 밑단 교체가 스태킹 위에서 남긴 몫"
    - id: C5_flat
      value: "exp_027 C5 3시드 평균 0.2481012381 (682.79214)"
      role: "flat 대비 스태킹이 더해주는 몫"
    - id: L1_flat
      value: "exp_027 L1 3시드 평균 0.2482572037 (620.35768)"
      role: "flat 눈금의 바닥"
  adoption: >
    3시드 부호 일치 AND |평균Δ| ≥ 대조군(LGBM_B3) 시드 std × 3. **완화 금지.**
    paired std도 병기하라 — 다만 여기서는 arm마다 모델이 완전히 다르므로 exp_026/028처럼
    문턱이 과보수적이지 않다.
  segments: "valid_R / valid_F · 투수손 1/2 · 셀별 OOF 품질(모드별 AUC 또는 Brier)"
  leak_boundary: >
    **복원 라벨(`is_*`)은 타깃 전용.** 설계행렬에 들어가면 즉시 abort(assert).
    OOF는 **시간순**으로만 만든다 — 랜덤 KFold 금지. train 구간 자기예측 금지(exp_016 D4 규정).
  gate: >
    ⚠️ **LGBM_B3 대조군을 재학습하지 마라.** exp_024 `pred/`를 sha256 대조 후 읽고,
    그 3시드 Brier가 **0.24799968498605615 / 0.24801856644746204 / 0.2480065100917605**의
    **무보정 대응값**과 일치하는지 확인하라(그 셋은 오프셋 적용 후 값이다 — exp_024
    `metrics.json`에서 무보정 base 값을 **읽어** 쓰고, 기억으로 채우지 마라).

# ---------------------------------------------------------------------------
runtime:
  where: a5000
  expected_min: 130                         # 115~150
  eta_basis: >
    **단위 근거 두 개를 곱한다.**
    ① exp_024 실측 — LGBM B3 fold_2024 유닛 **12.4~13.2분**(로드·stash 4분 + OOF 4시즌
       63/170/300/400초 + 스태커 650라운드 3분). 블록 유닛은 2.0~3.2분.
    ② exp_027 실측 — C5의 초/라운드는 **0.066**, LGBM L1은 **0.0354** → **1.86배**.
       ⚠️ CatBoost 평균(0.14658)을 쓰면 안 된다. **C5는 ID 수치형이라 CTR 계산이 없어
       CatBoost 중 가장 빠른 구성**이고(C4는 0.270으로 4배 느리다), 우리가 쓰는 것은 C5다.
    로드·stash 4분은 가족 무관 → 유닛당 4 + (933s × 1.86)/60 + 3 × 1.86 ≈ **38.5분**.
    - stage 1 (fold_2023 1유닛, 조기종료라 cap까지 안 감): **25~40분**
    - stage 2 fold_2024 3유닛 **동시 3개**: **38~45분**
    - stage 2 블록 4유닛 (데이터 1/3~2/3, 동시 3개): **15~20분**
    - 코드 작성(어댑터는 exp_027에서 승계, B3 골격은 exp_024에서 승계 — 접합만): **25~35분**
    - 집계·회수·리포트: **10분**
    → **115~150분.**
  uncertainty: >
    ⚠️ **가장 불확실한 것은 stage 1이다.** CatBoost 셀 모델의 argmin이 얼마일지 모른다.
    희소 타깃(모드 셀)에서 조기 종료가 언제 걸리는지 실측이 없다.
    **첫 셀 모델이 끝나는 즉시 실측을 확인하고 추정을 넘으면 갱신 보고하라.**
  contention: "exp_027·028·029는 전부 끝났다. 서버 단독 사용. 동시 3개 · fit당 스레드 6"

# ---------------------------------------------------------------------------
stop_conditions:
  hard: >
    **stage 2의 3시드 결과가 나오면 거기서 멈춘다.** 오프셋 β를 적합하지 말고, zip을 만들지 말고,
    감사를 부르지 마라. 사용자가 깨서 정할 판단 지점이다.
  on_failure: >
    C5_B3가 LGBM_B3를 **못 이기면** 그대로 보고하고 멈춰라. "밑단 교체의 +62점은 스태킹 위에서
    사라진다"는 것도 값어치 있는 답이다 — 그 경우 우리는 **B3의 모드 분해가 이미 같은 신호를
    먹고 있었다**는 것을 배운다.
  on_cap_hit: "argmin이 cap에 닿은 유닛은 무효다. cap을 올려 재실행하고 그 사실을 기록하라"

deliverables:
  - metrics.json
  - report.md
  - "src/ (승계 sha: exp_027 어댑터 + exp_024 B3 골격 + labels.py 등 + 신규 접합부)"
  - "pred/ — **fold_2024 × 3시드 + 블록 2022·2023 × 2시드 = 7개 예측 벡터. 로컬 회수 필수**"
  - "curves/ — 셀 4개 + 스태커의 학습곡선·argmin (stage 1·2 전부)"

audit:
  required: false
  why: "실험 자체는 이미 감사된 피처·라벨 경로 위의 모델 가족 교체다"
  but: >
    ⚠️ **제출로 갈 때 감사 표면이 셋 늘어난다**(exp_027 ⑩이 열거) —
    ① CatBoost 미지 범주의 test 처리가 test로 vocab을 만드는가(규칙 2-4)
    ② `has_time` ordered TS가 학습 구간 밖을 참조하는가
    ③ 새 추론 코드의 행 독립성.
    **감사 없이 제출 경로에 올리지 마라.**

risks:
  - "flat의 +62.43446점이 스태킹 위에서 **거의 안 남을 수 있다.** B3의 모드 분해가 이미 같은 신호를 먹고 있다면 그렇다. 예측 불가이고 그것이 이 실험의 존재 이유다"
  - "⚠️ **C5 하이퍼파라미터가 미튜닝**이라 이 실험의 결과는 C5 계열의 하한에 가깝다. 지면 '가족이 졌다'가 아니라 '이 설정이 졌다'로 서술하라"
  - "셀과 스태커를 동시에 바꾸므로 **귀속 불가**. '이 조합의 효과'로만 서술"
  - "이득이 나와도 **오프셋 β를 새 base에서 다시 재야** 배포 후보가 된다. 현 0.5704는 B3 LGBM 위 값이고, 전이 비는 축마다 0.06~1.00으로 흩어져 있어 예측 불가다"
  - "stage 1의 argmin 추정이 크게 빗나가면 stage 2 전체가 잘못된 iter로 돌아간다. **stage 1 곡선을 눈으로 확인하고 argmin이 내부 극값인지 판정한 뒤** stage 2를 발사하라"
