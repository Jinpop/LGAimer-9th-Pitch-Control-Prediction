# 🔴 사용자 승인 완료 (2026-08-15, "해봐" — 구조 시각화·변경 설명 검수 후)
exp_id: exp_051
date: "2026-08-15"
title: "셀 업그레이드 47→63열 — ins_* 16열을 셀 4개에도 준다"
base_exp: "exp_048 (A1 = 67열 스태커·47열 셀, 이번 대조군) · exp_030 (C5_B3 구조) · exp_045 이후 σ"

motivation:
  근거_둘: >
    ① exp_048이 같은 `ins_*` 16열을 **스태커에만** 넣고 팔 눈금 **+102.86285점(12.03σ)**을 얻었다 —
    신호는 증명돼 있고, 묻는 것은 "실패 모드를 판정하는 **셀이 직접 보면** 더 나오는가"뿐이다.
    ② 팀원 Q는 **셀이 77열 전부**를 보는 구조이고 우리와 나란히 비교된 적이 없다(CV_LB §팔 이름표) —
    이것이 우리 팔과 Q 사이에 남은 유일한 구조 격차다.
  기전_가설: >
    트리는 자기가 못 보는 피처와의 상호작용을 만들 수 없다. "폼이 떨어진 투수는 특정 실패 모드가 는다"류의
    조건부 신호는 현행 구조에서 스태커 한 층에서만 학습된다. ⚠️ **가설이지 측정이 아니다** —
    반대 가능성(셀 이진 타깃에는 폼 신호가 잡음이고 OOF만 흔들린다)도 열려 있다.
  ⚠️_기대값_경고: "+102.86을 이번 기대값으로 쓰지 마라 — 같은 정보를 **두 번째 위치**에 넣는 실험이라 한계 이득은 그보다 훨씬 작을 수 있다"

changed_vs_control:
  the_one: "R 갈래 **셀 4개**(mid_only·rev_only·both·wayoff_true)의 입력 47열 → **63열**(+`ins_*` 16)"
  종속_재산출:
    - "**OOF 4열 재생성** — 셀이 바뀌므로. 대조군과 같은 forward-chaining 방식·같은 블록 경계"
    - "**스태커 재적합** — 새 OOF를 받으므로. 입력 목록은 67열 그대로(새 열 없음), 반복 1400 고정"
  대조군: >
    🔴 **exp_048 A1** (셀 47 · 스태커 67 @1400, 시드 42/7/2024,
    3시드 평균 Brier **0.24787535671986385** = 773.21454). 저장 예측 재사용 + sha 대조.
    exp_030 대비 Δ를 이 실험 성과로 적지 말 것.
  불변:
    - "🔴 **14열은 넣지 않는다** (AM에서 LB 유죄 용의, AN 판정 대기 — 후보 AN 제출 전)"
    - "스태커 입력 목록 67열 · 반복 1400 · C5_B3 구조 · CatBoost 파라미터 · 마스크 · fold 정의 · 시드 42/7/2024 · 라이브러리"
    - "F 갈래 미투입"
  🔴_셀_iter_규약: >
    **대조군 OOF를 만들 때 쓰인 셀 iter·파라미터를 산출물에서 읽어 그대로 쓴다**
    (`~/SungjinPark/build_AH/localref/` 및 exp_048 기록 — **기억이나 추정으로 정하지 마라**).
    63열 셀의 최적 iter가 다를 수 있음은 **딸림 변인으로 기록**만 한다 — 이번에 iter를 다시 고르면
    변인이 둘이 된다(exp_034가 iter 재적합으로 −23.02를 잃은 전례).
  ⚠️_딸림_변인: "셀 입력 열 수(the_one의 정의) · 셀 적합 시간 · OOF 값 전체 · 스태커가 받는 OOF 분포"

# ---------------------------------------------------------------------------
# STAGE 0 — 인수 검사 (가벼움 — 새 피처 소스 없음)
# ---------------------------------------------------------------------------
stage0:
  🟢_ins_16열은_이미_감사된_경로다: "exp_048 인수검사 + AI 빌드 C단 감사 통과분. **재감사하지 않는다**"
  G0a_매트릭스_승계_sha: >
    셀 학습에 쓸 ins_* per-season 매트릭스(시즌 s 행 = ≤s−1 앵커)가 **exp_048이 스태커 학습에 쓴 것과
    바이트 동일**인지 sha 대조. 새로 만들지 말고 승계하라. 없으면 exp_048 생성 코드로 재생성 후
    exp_048 기록 sha와 대조 — **다르면 중단·보고**.
  G0b_valid_행_앵커: "fold_2024 검증행(2024)은 **≤2023 앵커** — exp_048과 동일 규약. 배포 앵커(≤2024)를 쓰면 전 행 0으로 축퇴한다(exp_048 함정 실재)"
  G0c_결측: "sentinel 금지 — ins 미적중은 NaN 또는 기존 규약의 실값(`ins_p_n=0`은 '미등판' 실값) 그대로"
  eta: "10~20분"

# ---------------------------------------------------------------------------
# STAGE 1 — 셀 재학습 + OOF 재생성 + 스태커 재적합, fold_2024 3시드
# ---------------------------------------------------------------------------
stage1:
  arms:
    A0: "대조군 = exp_048 A1. **재학습 없음** — 저장 예측 sha 대조로 재현 확인만"
    T1: "처치군 = 셀 63열 → OOF 재생성 → 스태커 67열 @1400"
  seeds: [42, 7, 2024]
  측정: "fold_2024 valid_all Brier + 환산 점수(±0.2002 단서). R/F 세그먼트는 보조만(§S7)"
  추가로_남길_것:
    - "셀 4개 각각의 자기 지표(logloss/AUC) 변화 — 어느 실패 모드가 폼 신호를 먹는가"
    - "OOF 4열의 대조군 대비 이동량(행별 |Δ| 분포) — 스태커 입력이 실제로 얼마나 달라졌나"
    - "63열 셀에서 ins_* 16열의 gain 점유율"
  eta: "70~110분 — 유닛(셀4+OOF+스태커) 15~20분 × 3시드 동시 3(exp_047 실측 유닛 15.6~20.1분 기준, fold_2024 행수라 상한 쪽) + 준비·회수"

pre_registered_decision_rule:
  sigma_score: 8.55113
  threshold_3sigma: 25.65339
  rule: "3시드 전부 부호 일치 AND |평균Δ| ≥ 25.65339점 → 채택"
  대조군: "A0 = exp_048 A1 (0.24787535671986385)"
  ⚠️: "판정 후 σ·ddof를 바꾸지 않는다. 결과를 보고 문턱을 바꾸지 않는다(§S8). σ가 47열 base에서 잰 값이라는 단서는 exp_048·049와 같은 조건으로 승계"

out_of_scope:
  - "🔴 **배포 빌드를 만들지 않는다.** 결과를 보고 사용자가 판단한다"
  - "셀 iter·스태커 반복 재선택 금지 · 14열(81열 셀) 금지 · F 갈래 미투입"
  - "블렌드 전달률 추정 금지 — 팔 눈금과 블렌드 눈금은 다르다(§S4)"

audit:
  required: false
  근거: "새 피처 소스·새 조인·타깃 파생·새 시계열 집계 없음 — 이미 감사된 피처를 같은 파이프라인의 다른 모델에 투입(CLAUDE.md §5 생략 조건). 🔴 **배포 후보로 가면 그때 감사 필수**"

