# 🔴 사용자 승인 대기 — 미발사
exp_id: exp_048
date: "2026-08-14"
title: "팀원 ins_* 16열을 우리 R 갈래 스태커에 투입 — 오프셋 형태에서 트리 피처 형태로"
base_exp: "exp_030 (C5_B3 47열 base) · exp_046 (같은 신호의 우리 판본·대체재 관계 실측) · exp_045 이후 σ"
외부_입력: "teammate_v19/신규피처_배포팩.zip 의 `ins/` (inseason.py + deploy_anchor.npz + anchor_lt2024.npz)"

# ---------------------------------------------------------------------------
# 왜 이 실험인가
# ---------------------------------------------------------------------------
motivation:
  구멍: >
    **우리는 우리가 발견한 신호를 약한 형태로 배포하고 있다.**
    exp_046이 같은 신호를 두 형태로 재서 **A1(트리) +45.17 · A1+A2 동시 투입 −20.16**을 얻었고
    **트리가 신호의 91%를 흡수**함을 확인했다 — 둘은 대체재다. 그런데 AF·AG·AH는 전부
    **오프셋 형태**(`β_f = 0.19`, 스칼라 하나)로 싣고 있다. exp_047이 이걸 고치려던 실험인데
    승인 대기로 멈춰 있었다.
  왜_우리_것을_안_쓰는가: >
    팀원 팩이 더 넓고(4열 → 16열) **동결표가 이미 만들어져 있다**(배포용 `deploy_anchor.npz` ≤2024,
    검증용 `anchor_lt2024.npz` season<2024). 같은 산술을 두 번 구현할 이유가 없고,
    **두 계보가 같은 부품을 쓰면 감사와 비교가 쉬워진다.**
  팀원_실측: "LGB +75.7 · Cat +44.4 · EBM +265.2 · AA 스태커 +60.8 · 블렌드 +66.9 → LB 1019.87 → 1060.65"
  ⚠️_그_수치를_우리_기대값으로_쓰지_말_것: >
    다른 base·다른 눈금에서 잰 값이고, **우리는 이미 같은 신호의 오프셋 판본을 갖고 있다**(AF +27.9504851031).
    우리가 얻을 것은 그 전부가 아니라 **트리 형태 − 오프셋 형태의 차이**다.

# ---------------------------------------------------------------------------
# 변경 변인 — 그리고 딸려 오는 것을 미리 등재한다
# ---------------------------------------------------------------------------
changed_vs_control:
  the_one: "R 갈래 **스태커** 입력에 `ins_*` 16열 추가 (51열 → 67열)"
  불변:
    - "🔴 **셀 모델 4개는 동결** — 47열 그대로, 바이트 동일. 팀원 권고(`셀 모델은 동결 가능`)와 일치하고 비용도 여기서 갈린다"
    - "🔴 **스태커 반복 1400 고정** — AH와 같은 값. 열이 늘면 최적 반복도 바뀌지만 **이번엔 안 건드린다**"
    - "OOF 산출 경로·마스크·fold 정의·시드·라이브러리"
  ⚠️_1400을_다시_고르지_않는_이유: >
    **exp_034가 로컬로 반복 수를 다시 적합해 배포에 실었다가 −23.02235점을 잃었다.**
    그리고 오늘 AH가 **이 축에서 fold_2024가 배포 순위를 반대로 읽는다**를 두 구간에서 확인했다
    (상시 단서 §S1의 구체 사례). 로컬로 고르면 틀린 방향으로 고르게 된다.
    → 반복 수는 **고정 상수로 승계**하고, 이 실험은 열 추가 하나만 묻는다.
  ⚠️_불가피한_딸림_변인:
    - "스태커 입력 열 수 51 → 67 (이게 the_one의 정의이므로 별개가 아님)"
    - "스태커 학습 시간·모델 크기"
    - "**오프셋 `β_f`와의 상호작용은 이 실험에서 측정되지 않는다**" # 아래 참조

# ---------------------------------------------------------------------------
# 🔴 오프셋 처리 — 이 실험의 범위 밖이지만 미리 못 박는다
# ---------------------------------------------------------------------------
offset_interaction:
  사실: "`β_f = 0.19` 오프셋은 **블렌드 단계**에 붙어 있고, 이 실험이 재는 R 갈래 스태커 안에는 없다"
  따라서: "이 실험의 Δ는 **오프셋과 무관하게 깨끗하다** — R 갈래 단독 눈금이다"
  🔴_그러나_배포에서는_충돌한다: >
    exp_046 A1+A2가 **−20.16**이었다. 트리가 신호를 먹으면 오프셋은 같은 것을 두 번 미는 셈이 된다.
    → **배포 빌드로 넘어갈 때 `β_f`를 함께 결정해야 하고, 그러면 변인이 둘이 된다.**
    이 실험은 **거기까지 가지 않는다.** 여기서는 R 갈래 Δ만 확정하고,
    배포 형태(β_f 제거 · 재적합 · 유지 중 무엇)는 **별도 계획서로 사용자 승인을 받는다.**

# ---------------------------------------------------------------------------
# STAGE 0 — 인수 검사. 남의 코드를 우리 파이프라인에 넣기 전에
# ---------------------------------------------------------------------------
stage0_인수검사:
  🔴_왜: "팀원의 자체 검증을 **상속하지 않는다.** 우리 제출물에 들어갈 것은 우리가 검사한다"
  G0a_행_독립성: >
    `inseason.apply`가 행별 lookup + 산술뿐인지 AST로 확인
    (`groupby`·`sort`·`cumsum`·`diff`·`rolling`·`quantile`·`mean()`·`np.unique`가 **apply 경로에** 없을 것).
    ⚠️ 지휘자 예비 확인: `groupby` 2건은 `build_anchor`(train 전용)에 있고 `apply`는 깨끗했다 —
    **그 확인을 근거로 쓰지 말고 다시 하라.**
  G0b_전체_셔플_항등: "test 프레임을 셔플해 apply → 원본과 행별 값 비트 동일"
  G0c_단독_행: "임의 100행만 단독으로 apply → 전체 프레임 결과와 비트 동일"
  G0d_🔴_앵커_경계: >
    **fold_2024 검증에는 `anchor_lt2024.npz`(season<2024)를 쓴다.** `deploy_anchor.npz`(≤2024)를
    쓰면 2024 행의 `ins_n = n − 앵커`가 음수가 되어 0에 뭉개진다 — 팀원이 실제로 이 함정에 빠져
    모델이 −414로 나왔다고 기록해 두었다. **표의 시즌 경계를 코드로 검증하라.**
  G0e_라벨_복원_경로: >
    🔴 이 산술은 라벨 복원 경로와 **같은 재료**(`asof_pitcher_n` × rate의 차분)를 쓴다.
    상시 단서 §S10 — 경로는 실재하고 우리는 쓰지 않는다. **`apply` 출력이 라벨을 담고 있지 않은지**
    직접 확인하라: 산출 16열과 `control_success`의 행별 상호정보/완전분리 여부.
  G0f_결측_처리: "미지 선수의 처리가 sentinel인지 확인. 팀원 문서는 `편차 0.0 = 리그 후퇴`라 하는데 **그것이 sentinel인지 의미 있는 값인지** 판단하고 필요하면 `has_ins` 플래그를 별도 열로 준다"
  eta: "20~30분"

# ---------------------------------------------------------------------------
# STAGE 1 — fold_2024 로컬 측정. OOF가 저장돼 있어 싸다
# ---------------------------------------------------------------------------
stage1:
  🟢_학습_대부분이_이미_끝나_있다: >
    fold_2024 OOF 3개가 **어제 AH 빌드가 저장해 뒀다**
    (`~/SungjinPark/build_AH/localref/oof/`, 102,328,192 B, 시드 42·7·2024).
    **셀 모델도 OOF도 다시 만들지 않는다.** 스태커만 다시 적합한다.
    ⚠️ 승계 전 sha 대조. 없거나 안 맞으면 **재생성하되 그 사실을 보고**하라(시드당 +15분).
  arms:
    A0: "대조군 = 스태커 51열 @1400. **이미 측정돼 있다** — 0.248132315233192 / 670.35169 (3시드 평균, `local_reference_AH.json`). 재실행해 sha 대조만 하라"
    A1: "스태커 **67열**(51 + ins_* 16) @1400 — 이 실험의 처치군"
    A2: "스태커 67열 @655 · @1000 — 🔵 **선택**. 열이 늘면 곡선이 어떻게 움직이는지 남긴다(판정에는 안 쓴다)"
  seeds: [42, 7, 2024]
  측정: "valid_all Brier + 환산 점수. 세그먼트 valid_R·valid_F는 보조로만 (상시 단서 §S7)"
  추가로_남길_것:
    - "16열 각각의 gain 순위 — 팀원은 `ins_p_success`가 gain 1위였다고 한다. 우리 base에서도 그런가"
    - "🔴 **`d_form_eb`(exp_046 우리 판본)와의 상관** — 같은 신호의 두 구현이 얼마나 겹치는지"
    - "커버리지(`ins_p_n > 0` 비율), 세그먼트 R/F별"
  eta: "25~40분"

# ---------------------------------------------------------------------------
# 판정 — 사전 등록 (상시 단서 §S8: 결과를 보고 바꾸지 않는다)
# ---------------------------------------------------------------------------
pre_registered_decision_rule:
  sigma_score: 8.55113
  threshold_3sigma: 25.65339
  rule: "3시드 전부 부호 일치 AND |평균Δ| ≥ 25.65339점 → 채택"
  대조군: "A0 (51열 @1400)"
  ⚠️: "판정 후 σ·ddof를 바꾸지 않는다"
  🔴_로컬이_음수여도: >
    **오늘 AH가 이 눈금의 한계를 보여줬다** — 반복 수 축에서 fold_2024는 배포와 부호가 갈렸다.
    다만 **그것은 규모 의존 축의 성질**이고 피처 추가는 그 성질이 없다(§AH 상세 참조).
    → 로컬 판정을 그대로 쓰되, **음수가 나오면 배포로 가지 않고 여기서 멈춘다.**

