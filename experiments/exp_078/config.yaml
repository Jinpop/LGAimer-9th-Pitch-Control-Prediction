exp_id: exp_078
date: 2026-08-21
title: "LB 눈금 전 축 동시 꼭지점 (이미 산 L 재고 회수) + v6 내부 4팔 축 신설 진단"
학습_건수: 0
제출물: "없음 (지휘자가 결과를 보고 빌드 여부를 결정)"

배경:
  근거_따름정리: |
    submissions/CV_LB.md (2026-08-17 AW 절) — "K개 사후 축의 동시 최적점은 같은 base 의
    LB K점으로 결정된다 — 교차항 mean(δⁱ·δʲ) 도 전부 계산되기 때문이다."
    1축 실증: w_ebm 축에서 1점 + 계산 곡률로 나머지 점을 오차 4.44e-16 재현.
    검증: AW 가 2점째로 상대오차 0.375%. 동시 해 실현률 84% (BL 2/2).
  아직_안_한_것: |
    우리는 축을 하나씩 "조건부로" 닫았고, 진 제출은 "축이 죽었다"로 되돌렸다.
    그러나 gain(u*) = K·L²/G 는 L 의 부호·크기와 무관하게 항상 ≥ 0 이다.
    → 진 제출도 전부 L 측정치이고, 그 축의 꼭지점 이득은 미회수 상태다.
  표적_목록:
    - "외곽 w_v6 = 0.7 — AK 3점 적합이 꼭지점 0.62094 를 냈으나 착륙 안 함 (+0.49307 방치)"
    - "beta_ins = 0.03 — AT(0.06) 가 −1.0314113487, 기울기 −34.3804/단위. 착륙 안 함"
    - "BH 세그먼트 퍼짐 축 — −3.2 로 '죽었다' 판정 후 되돌림. 꼭지점 미회수"
    - "BI·BJ·BK 오프셋 3축 — BL 이 2축만 동시 착륙. 3축째 미회수"
    - "alpha·beta_skew·c_aa·c_T70·내부 w_v6·w_ebm — 각각 조건부 최적, 동시 최적 아님"
  신설_축_근거: |
    mate/v6_infer.py:29  W_LGB, W_CAT, W_NN, W_LEAF = 0.05, 0.68, 0.15, 0.12
    주석이 "fold_2024 검증에서 최적화된 블렌딩 비중" — 팀원이 자기 면에서 고른 값이고
    LB 로 한 번도 안 옮겼다. 같은 성격의 상수 w_ebm(팀원 선택 0.15)을 LB 최적(−0.10)으로
    옮겼을 때 +9.09 였다. v6 는 최종 로짓 지분 0.539 로 최대 성분이고 여기에 자유도가 3 개다.
    ⚠️ 반례도 있다 — 내부 w_v6(팀원 0.5)는 거의 옳았다(꼭지점 0.6668, +1.89).
    따라서 이번 단계는 **측정이 아니라 진단**이다: L 이 없으므로 착륙에 넣지 않는다.

프레임:
  대리면: "tr2024 보정 프레임 253,507행 (exp_072 와 동일, sha 핀 승계)"
  🔴_한계: "표본내 프레임이다. 순위 근거가 아니라 δ·G 계산용 대리면이다 (AW 가 0.375% 로 검증)"
  base: "BO 출하 상수 (w_v6_inner 0.6668397489, d_adj 0.02875748759679648, alpha 1.07911, beta_skew -0.059151, c_aa 0.25244, c_T70 0.04756, w_ebm -0.1, beta_ins 0.03, 외곽 w_v6 0.7)"

stage0_게이트:
  G0a: "exp_072 가 기록한 tr2024 파트너 sha ab38ec13… 재현 (프레임·산술 동일성)"
  G0b: "BO 출하 d_adj 0.02875748759679648 를 용해기로 재현, |diff| < 1e-15"
  G0c: "BN 표본내 Brier 0.24552396647966293 재현 (exp_072 기록값과 abs_diff 0.0)"
  중단_조건: "G0a~G0c 중 하나라도 실패하면 즉시 정지하고 보고. 이후 단계 진행 금지"

stage1_델타_사전:
  정의: "각 축 j 에 대해 δ_j = ∂p_final/∂u_j 를 BO base 에서 수치미분(중심차분, h 는 축별 자연 눈금의 1e-3)"
  축_목록:
    - {id: alpha,        base: 1.07911,       h: 0.002}
    - {id: beta_skew,    base: -0.059151,     h: 0.002}
    - {id: c_aa,         base: 0.25244,       h: 0.002}
    - {id: c_T70,        base: 0.04756,       h: 0.002}
    - {id: w_out,        base: 0.7,           h: 0.002, 비고: "외곽 파트너 지분. c_aa+c_T70 합 제약을 어떻게 잡는지 명시할 것"}
    - {id: w_v6_inner,   base: 0.6668397489,  h: 0.002}
    - {id: w_ebm,        base: -0.1,          h: 0.002}
    - {id: beta_ins,     base: 0.03,          h: 0.002}
