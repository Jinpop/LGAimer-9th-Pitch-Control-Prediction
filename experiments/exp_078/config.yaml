    - {id: off_BJ,       base: 0.0,           h: 0.002}
    - {id: off_BK,       base: 0.0,           h: 0.002}
    - {id: seg_spread_BH, base: 0.0,          h: 0.002, 비고: "BH 가 실제로 옮긴 세그먼트 퍼짐 차등. 출하 산술로 재구성"}
    - {id: v6_CAT_vs_NN,   base: 0.0, h: 0.002, 신설: true}
    - {id: v6_CAT_vs_LEAF, base: 0.0, h: 0.002, 신설: true}
    - {id: v6_CAT_vs_LGB,  base: 0.0, h: 0.002, 신설: true}
  🔴_S14_주의: "arms/*.npy 는 이름이 p_* 여도 로짓일 수 있다. 값 범위로 확인하고 로그에 min/max 를 남길 것"
  자기검사: "축별로 u 를 h 만큼 옮겨 만든 p 와 δ 선형근사의 차를 보고 (exp_072 linearity 표와 같은 형식)"
  산출: "G = mean(δᵢδⱼ) 전체 행렬 (대칭), 조건수, 각 축의 rms(δ)"

stage2_L_회수:
  방법: |
    각 역사적 LB 점 k 는 부모 base_p 에서 축 j 를 u_k 만큼 옮겨 g_k 점을 얻었다.
      g_k = K·[2·u_k·L_j(base_p) − u_k²·G_jj(base_p)]
    → L_j(base_p) = [g_k/K + u_k²·G_jj(base_p)] / (2·u_k)
    현 base 로 이동:
      L_j(BO) = L_j(base_p) + mean(δ_j · (p_base_p − p_BO))
    (δ_j 는 각 base 에서 다시 계산한다 — p(1−p) 가 달라진다)
  대상_LB점:
    - {후보: AK, 축: w_out,        부모: AJ, base_비고: "🔴 팔 구성이 현재와 다르다. 이동 보정 크기를 반드시 보고"}
    - {후보: AO, 축: w_ebm,        부모: AK}
    - {후보: AR, 축: w_ebm,        부모: AO}
    - {후보: AT, 축: beta_ins,     부모: AR}
    - {후보: AP, 축: w_v6_inner,   부모: AO}
    - {후보: AQ, 축: w_v6_inner,   부모: AO}
    - {후보: AZ, 축: "c_aa+c_T70", 부모: AY}
    - {후보: BA, 축: alpha,        부모: AZ}
    - {후보: BB, 축: alpha,        부모: BA}
    - {후보: BC, 축: beta_skew,    부모: BB}
    - {후보: BG, 축: beta_skew,    부모: BE}
    - {후보: BH, 축: seg_spread_BH, 부모: BG}
    - {후보: BI, 축: off_BI,       부모: BG}
    - {후보: BJ, 축: off_BJ,       부모: BG}
    - {후보: BK, 축: off_BK,       부모: BG}
    - {후보: BL, 축: "off 2축 동시", 부모: BG}
    - {후보: BN, 축: w_v6_inner,   부모: BL}
  🔴_자기검사_필수: |
    ① 축에 LB 점이 2개 이상이면 각각에서 푼 L 이 일치해야 한다 — 불일치를 상대오차로 보고.
       (w_ebm 은 AO·AR 두 점, alpha 는 BA·BB 두 점, w_v6_inner 는 AP·AQ·BN 세 점)
    ② BN 점에서 푼 L 이 exp_072 가 기록한 L = 2.8287251706490112e-05 와 일치해야 한다.
       불일치하면 stage2 구현이 틀린 것이다 — 정지하고 보고.
    ③ base 이동 보정항 mean(δ·(p_old − p_new)) 의 크기를 L 자체와 나란히 보고.
       보정항이 L 보다 크면 그 점은 **신뢰할 수 없다** — 목록에서 빼고 이유를 적는다.
  등급: "보정항/|L| < 0.3 이면 A등급, 0.3~1.0 은 B등급, ≥1.0 은 제외"

stage3_동시_해:
  해: "u* = G⁻¹L (A등급 축만 / A+B등급 축 둘 다 낸다)"
  보고:
    - "예측 이득 K·(2u*ᵀL − u*ᵀGu*) — A등급판·A+B판"
    - "🔴 naive 합산(각 축 조건부 꼭지점을 그냥 더한 것) 예측과 나란히 (S16)"
    - "축별 한계 기여 (그 축만 빼고 다시 푼 것과의 차)"
    - "G 의 조건수. 조건수가 1e6 을 넘으면 능형(ridge) 축소를 걸고 축소량을 보고"
    - "u* 가 각 상수의 물리적 범위를 벗어나는지 (alpha ∈ [0.5,2.0] assert 등 출하 코드의 제약)"
  🔴_금지: "예측 이득을 '측정'으로 적지 말 것 (S5). 하방도 대칭이라는 문장을 함께 적을 것"

stage4_신설축_진단:
  대상: "v6_CAT_vs_NN · v6_CAT_vs_LEAF · v6_CAT_vs_LGB"
  낼_것:
    - "G_jj 와 rms(δ) — 프로브 진폭 설계용"
    - "정직면(OOT 2024, 팀원 납품 벡터 + exp_071 p_nn) 위의 argmax 방향과 이득"
    - "🔴 S12 경고를 명시 인용할 것 — 다차원 가중 적합 축에 부호 신탁은 적용되지 않는다(BH 실측 −3.24)"
    - "각 축을 LB 1점으로 사려면 어느 진폭이 좋은지 (3차항 오차 < 예측 이득의 1%가 되는 최대 u)"
  🔴_금지: "L 이 없으므로 stage3 착륙 해에 넣지 말 것. 진단만."

