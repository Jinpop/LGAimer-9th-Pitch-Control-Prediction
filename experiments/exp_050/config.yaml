# 🔴 사용자 포괄 승인 (2026-08-15, "중간에 변동 생기면 다른 학습을 더 돌려도 좋아") — 무인 진행
exp_id: exp_050
date: "2026-08-15"
title: "exp_049의 arm 순서를 새 시드로 복제 — 75열(L_no_p6)이 81열보다 나은가"
base_exp: "exp_049 (arm 정의·피처·표 전부 승계)"

motivation:
  관측: >
    exp_049에서 `L_no_p6`(75열, `p6_*` 원확률 6열 제외)가 **+49.00722점 · 시드 sd 3.68263**,
    `A1`(81열 전체)이 **+41.13179점 · sd 22.72094**였다. 75열이 평균도 높고 **시드 분산이 6분의 1**이다.
  🔴_왜_그때_안_골랐나: >
    **측정 fold를 보고 고르는 것**이기 때문이다(§S8). 그래서 사전 등록대로 81열을 AL·AM에 실었다.
  🔴_반드시_같이_읽을_것: >
    **75 − 81 = +7.87543점은 우리 문턱 25.65339에 한참 못 미친다.**
    즉 exp_049는 "75가 81보다 유의하게 낫다"를 보인 적이 **없다.** 눈에 띈 것은 **분산**이고,
    이 실험이 묻는 것도 **평균 우열이 아니라 순서와 안정성이 새 시드에서도 재현되는가**다.
    ⚠️ 결과가 어느 쪽이든 **"75가 유의하게 낫다"로 서술하지 마라.**

changed_vs_control:
  the_one: "**시드만 바꾼다** — 42·7·2024 → **13·101·777**"
  불변: "arm 정의(81열 A1 / 75열 L_no_p6) · 셀 동결 · OOF 승계 · 스태커 1400 · 표(exp_037 `upto_2023`) · 마스크 · fold · CatBoost 파라미터 · 라이브러리"
  ⚠️_시드_출처: "13·101·777은 **배포 9시드에는 있으나 fold_2024 로컬 측정에는 쓰인 적이 없다**. 새 관측이다"

arms:
  A1_81: "67열 + `p6_*` 6 + `idea_matchup_pitch` 1 + `i3_anom_*` 7 = 스태커 입력 81열"
  L_no_p6_75: "위에서 `p6_*` 6열만 제외 = 75열"
  ⚠️_대조군_없음: >
    A0(67열)는 이번에 돌리지 않아도 된다 — 이 실험의 질문은 **두 arm의 차이**다.
    🔵 여유가 있으면 A0도 새 시드로 돌려 **셋의 순서**를 남겨라(선택).

pre_registered_decision_rule:
  🔴_값을_보기_전_등록: >
    **1차(주 판정)** — `L_no_p6 − A1`의 **부호**가 새 3시드 전부 양수인가.
    exp_049가 3/3이었으므로 여기서도 3/3이면 **6/6**이고, 그때만 다음 빌드의 팔을 75열로 바꾼다.
    **2차** — 각 arm의 시드 sd. exp_049는 3.68 대 22.72였다. 이 격차가 재현되는가.
  ⚠️_금지: >
    - **평균 차이에 유의성을 주장하지 마라** (문턱 미달이다)
    - 결과를 보고 시드·arm·문턱을 바꾸지 마라
    - 6시드를 합쳐 새 평균을 내되, **그것을 사후 문턱 판정에 쓰지 마라** (사전 등록은 부호다)

out_of_scope:
  - "배포 빌드 금지 · 셀 재학습 금지 · 새 피처 금지"
  - "🔵 `L_no_p6ALL`(`p6_*`와 그 파생까지 전부 제외)은 **이번 범위 아님** — exp_049 러너가 미측정으로 남긴 항목이고 별도 설계가 필요하다"

