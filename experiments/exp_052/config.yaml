# 🔴 사용자 승인 완료 (2026-08-15, "진행해봐") — 규칙 개정 동반 승인:
#    CLAUDE.md 불변 규칙 "현재 행 TrackMan 금지"에 **배포 모델(student) 입력 기준** 단서 추가.
#    teacher는 학습 시에만 존재하고 출하되지 않으므로 허용(운영진 08-14 명시 허용).
exp_id: exp_052
date: "2026-08-15"
title: "트랙맨 teacher 증류 — stage 0: 행 대응이 되는가, 그리고 상한이 있는가"
base_exp: "exp_048 A1 (student 계보) · exp_030 C5_B3 (구조)"
외부_입력: "data/trackman_history.csv (대회 제공, 1,793,079행 · 2019~2024 · 38열)"

# ---------------------------------------------------------------------------
# 이 실험이 묻는 것 — stage 0에서 죽일 수 있게 설계했다
# ---------------------------------------------------------------------------
motivation:
  아이디어: >
    teacher는 **그 투구의 실제 물리량**(구속·회전·무브먼트)과 **실제 구종 라벨**까지 보고 성공 확률을 추정한다.
    student는 우리 배포 팔 **그대로**(피처 축 무변경)이고 **타깃만** `λ·soft + (1−λ)·hard`로 바꾼다.
    CatBoost `CrossEntropy` 손실이 확률형 타깃을 받으므로 **구조 변경이 없다**.
  왜_이_대회에서_말이_되나: >
    우리 예측은 [0.38, 0.63]에 살고 AUC 0.54 — **거의 동전 던지기라 0/1 라벨의 대부분이 잡음**이다.
    특권 정보를 본 teacher의 확률은 각 행의 진짜 성공 확률에 더 가까운 과녁이고,
    잡음이 적은 과녁으로 배우면 같은 피처로도 분산이 준다. 이 대회 LB는 분산 축소에 후했다(Q 전이비 1.82569, 모수 0).
  🔴_반대_논거도_등재한다: >
    우리 승리 구성은 **강한 정규화(큰 잎)**라 잎 하나가 수백 행을 평균한다 —
    0/1 잡음이 **이미 상당 부분 상쇄**되고 있어 soft label의 여지가 신경망 대비 작을 수 있다.
    증류가 GBDT+대용량 테이블에서 소폭에 그치는 흔한 이유다. **어느 쪽이 이기는지가 이 실험의 질문이다.**
  exp_003_012와_충돌하지_않는다: >
    그때 기각된 것은 트랙맨을 **student의 입력 피처**(과거 집계·프로파일)로 넣는 형태다.
    이번은 **현재 행 물리량을 teacher만** 본다. **시험된 적 없는 경로다.**

# ---------------------------------------------------------------------------
# 🔴 STAGE 0 — 두 관문. 하나라도 실패하면 즉시 중단·보고하고 stage 1을 열지 않는다
# ---------------------------------------------------------------------------
stage0:
  G0a_행_대응:
    문제: >
      trackman에는 `pitcher_trackman_id`·`batter_trackman_id`가 있고 train에는 `pitcher_id`·`batter_id`가 있다.
      **직접 키가 없다.** 대회 규정상 id 매핑 추정은 **허용**(운영진 08-07·08-12 답변, scout_log).
    방법: >
      (season, game_month, game_dayofweek, inning, top_bottom, balls_before, strikes_before, outs_before,
      pitcher_hand, batter_hand) 튜플 + 팀 정보로 후보를 좁히고, **투수 단위 빈도 정합**으로 id 매핑을 추정한 뒤
      행 단위 유일 매칭을 시도한다. ⚠️ 방법 자체가 미검증이므로 **결과를 보고 방법을 고르지 말 것** —
      아래 판정 문턱을 **먼저** 등록한다.
    🔴_사전_등록_판정: >
      **유일 매칭률 ≥ 60% (train 전체 행 기준)** 이면 통과. 미만이면 **중단**.
      근거: 매칭 안 된 행은 teacher soft label이 없어 hard label로 남는데, 절반 이하만 증류되면
      λ 효과가 희석돼 stage 1이 측정력을 잃는다. ⚠️ **이 문턱을 결과를 보고 낮추지 마라.**
    측정할_것: "유일 매칭률 · 다중 매칭률 · 미매칭률 · 시즌별·game_type별 커버리지 · 매칭 행의 라벨 기저율이 전체와 다른지(선택 편향)"
  G0b_teacher_상한:
    🔴_대조군_설계가_핵심이다: >
      재야 하는 것은 **"student가 이미 가질 수 있는 것 위에 트랙맨이 더 보태는 증분"**이다.
      **상한 Δ = teacher(student 가용 피처 전부 + 트랙맨) − teacher(student 가용 피처 전부)**
      ⚠️ `teacher(47+트랙맨) − teacher(47)`로 재면 **"ins_*를 주면 좋아진다" 같은 이미 확보한 몫이 섞여**
      상한이 부풀고 자기기만이 된다. **반드시 위 식으로.**
    student_가용_피처: "스태커 입력 67열(47 base + OOF 4 + ins_* 16). ⚠️ AN 판정 전이라 14열은 제외 — 확정되면 후속에서 갱신"
    teacher_전용_추가:
      - "트랙맨 물리 8종: rel_speed · spin_rate · induced_vert_break · horz_break · extension · rel_height · rel_side · zone_speed"
      - "🔴 **실제 구종 라벨 3열**: tagged_pitch_type · auto_pitch_type · pitch_type_group — train 47열에 현재 투구 구종이 **없으므로** 순수 특권 정보다"
      - "⚠️ 14열(`p6_*` 구종 **예측**)은 teacher에 넣지 않는다 — teacher는 실제 구종을 보므로 상위 호환이라 무의미"
    측정_면: "fold_2023 내부(train ≤2022 → valid 2023), 시드 42 단독. **fold_2024는 열지 않는다**(stage 1 판정용으로 보존)"
    🔴_사전_등록_판정: >
      **상한 Δ ≥ 40점(환산)** 이면 stage 1 진행. 미만이면 **중단하고 축을 닫는다**.
      근거: 정보 병목으로 실현치는 상한의 일부이고, 그 위에 **잡음감소형 축의 블렌드 전달률 0.068(S4)**이 걸린다.
      40점 미만이면 블렌드 도달분이 측정 잡음과 구분되지 않는다.
      ⚠️ **상한은 실현치의 예측이 아니다** — "student가 표현 못 하는 몫은 전이되지 않는다"를 보고서에 명시할 것.
  G0c_리크_표면_사전_점검:
    - "teacher 입력에 라벨·라벨 파생이 없는지(열 접근 추적). ⚠️ 상시 단서 S10"
    - "매칭 조인이 **행별**인지 — test 프레임 통계·groupby 금지(규칙 2-4). stage 0은 train만 다루나 조인 코드가 그대로 stage 1로 간다"
    - "sentinel 금지 — 미매칭 행은 NaN + `has_tm` 플래그 열"
  eta: "50~80분. `pd.read_csv` 354MB(약 30~60초) + 매칭 탐색 + teacher fit 2회(67열 vs 78열, fold_2023 시드 42 — exp_047 실측 유닛 15~17분 기준 2개 병렬)"

# ---------------------------------------------------------------------------
# STAGE 1 — 조건부. G0a·G0b 둘 다 통과해야만 연다 (이 실험에서 실행하지 않는다)
# ---------------------------------------------------------------------------
stage1_조건부_설계만:
  🔴_이_실험의_범위가_아니다: "stage 0 결과를 사용자에게 보고하고 **별도 승인**을 받은 뒤 exp_053으로 연다"
  계획: >
    teacher OOF soft label을 **forward-chaining**으로 생성(시즌 s 행은 ≤s−1 학습 teacher가 매김 — 미래 참조 금지).
    셀·OOF 동결한 채 **스태커 타깃만** λ 혼합으로 재적합. λ는 **선행 블록(2022+2023)에서 선택**해 사전 등록,
    fold_2024 3시드로 판정(문턱 25.65339 그대로). 대조군 exp_048 A1.
  왜_스태커부터: "스태커 fit이 시드당 3~4분이라 λ 격자가 싸다. 채택되면 셀 4개로 확장"
  🟢_배포_시_이점: "추론 코드·피처 경로가 **한 줄도 안 바뀐다** → 검증 B단(새 부스터·같은 피처), AN에서 겪은 S11 함정(표 체제 범위 확대)도 없다"

out_of_scope:
  - "🔴 **stage 1을 실행하지 마라.** stage 0 두 관문 결과만 내고 멈춘다"
  - "🔴 **fold_2024를 열지 마라** — stage 1 판정용으로 보존"
  - "배포 빌드·제출물 생성 금지"
  - "student 피처 축 변경 금지 — 증류는 타깃 조작이고 피처와 독립이다"

audit:
  required: false     # stage 0 한정
  근거: "stage 0은 측정만이고 배포·제출 경로가 없다. 🔴 **stage 1(soft label = 타깃 파생 경로)은 감사 필수** — 위험 표면은 teacher OOF의 시간 경계와 매칭 조인의 as-of"

runtime:
  where: a5000
  expected_min: 65    # 50~80분
  규약: "fit당 threads 6 · 동시 3 상한 · nohup · 발사 전 pgrep·nvidia-smi 확인 · ETA 초과 시 즉시 갱신 보고"
