# 캠페인 5 — 사용자 제안 (2026-08-05), 지휘자 작성 · ✅ 사용자 승인·발사
exp_id: exp_014
date: "2026-08-05"
hypothesis: >
  성공률이 같은 투수도 '실패하는 모양'이 다르다. success+reverse+middle≈0.90 항등식에서
  실패의 구성비(좌우로 빠지는 타입 vs 가운데 몰리는 타입)를 명시 피처로 주면,
  축 정렬 분할로는 표현이 비싼 비스듬한 경계를 트리가 한 번에 가른다.
base_exp: "exp_010 D"        # ⚠️ 2026-08-05 갱신: 현재 최고 = 강규제 LightGBM
  # fold_2024 valid_all Brier 0.248261 (iter 750, P4 정직 보고치) / 환산 619.0
  # 참고: 같은 스펙 iter 1550 = 0.248247 (LB 807.33 제출본). 실험 비교는 P4 정직치 0.248261 기준.
  # base를 RF(exp_009 P0b)에서 바꾼 이유: exp_009·exp_012에서 "약한 base에서 통한 피처가
  # 강한 base에서 기각"되는 패턴이 두 번 나왔다. 반드시 현재 최고 base 위에서 측정한다.

rationale: >
  EDA §1 실측: 커리어 항등식 success+reverse+middle ≈ 0.900(±0.024), corr(success,reverse)=−0.874.
  즉 라벨의 실패는 '의도반대(reverse)'와 '가운데(middle)' 두 축으로 쪼개진다.
  그런데 모델이 보는 건 각 rate의 원값뿐이라, "실패 중 reverse 비중"이라는 비율은
  두 축의 비스듬한 경계가 되어 축 정렬 분할로는 계단을 수십 개 쌓아야 근사된다.
  RF는 분기마다 후보를 10개만 뽑으므로 그 계단을 쌓을 기회 자체가 적다 → 명시 피처가 유리.
  exp_009 교훈: 열 수 자체가 RF의 분기 후보 예산을 잠식하므로 **소수 정예로 유지**한다(65열 실패).

features:
  core:                       # 사용자 제안 2종 — 이 실험의 본체
    - "fail_shape = reverse_rate / (reverse_rate + middle_rate)   # 실패 중 reverse 비중"
    - "residual   = 1 − (success_rate + reverse_rate + middle_rate)  # 0.90 바깥 잔여분"
  extended:                   # 같은 발상의 자연스러운 확장 — arm으로 분리해 기여 분해
    - "middle_share_of_fail = middle_rate / (1 − success_rate)     # 전체 실패 대비 가운데 비중"
    - "recent_shape_prevN   = middle_prevN / (1 − success_prevN), N∈{1,3,5}  # 최근 폼의 실패 모양"
    - "shape_drift          = middle_share_prev5 − middle_share_career        # 최근 가운데로 몰리는 추세인가"
    - "batter_shape         = batter_middle_rate / (1 − batter_success_rate)  # 타자쪽 실패 모양"
    - "matchup_shape        = 투수 middle 성향 × 타자 middle 성향 (로그오즈 합 형태 검토)"
  notes: >
    ⚠️ 트리 계열별 차이: RF는 분기마다 후보를 mf개만 뽑아 열 추가의 잠식 효과가 컸으나(exp_009),
    LightGBM D안은 feature_fraction 0.7 + num_leaves 15라 잠식 양상이 다르다. core 2열은
    잠식 위험이 낮으니 A1·A2를 먼저 확실히 보고, 확장 arm에서 악화되면 즉시 멈춘다.
    ⚠️ iter는 exp_006 P4 정책 — 각 arm에서 fold_2023 valid_all argmin을 재실측해 fold_2024에 승계.
    valid 2024를 보고 고르지 말 것.
    ⚠️ 분모 보호: reverse+middle 또는 (1−success)가 0에 가까우면 결과를 **NaN으로 두고
    sentinel 채움 금지**(CLAUDE.md 규율). asof_pitcher_n이 작은 구간은 비율 자체가 노이즈이므로
    n 구간별 성능을 반드시 분해 보고할 것.
    ⚠️ 열 수 절제: core 2개 arm부터 시작해 단계적으로 추가. exp_009에서 65열이 예산 잠식으로
    역효과를 냈으므로, 확장 arm이 악화시키면 즉시 core만 남긴다.

arms:                         # 단계적 — 각 단계 최선만 다음으로
  - "A0: 대조군 재현 (exp_010 D, 47피처, 마스크) — 기준선 0.248261 일치 확인 필수"
  - "A1: A0 + fail_shape (1열)"
  - "A2: A1 + residual (2열)  ★사용자 제안 본체"
  - "A3: A2 + middle_share_of_fail, recent_shape_prev{1,3,5}, shape_drift"
  - "A4: A3 + batter_shape, matchup_shape"

preliminary_check:            # 학습 전에 먼저 확인 — 값싸고 정보가 크다
  - "fail_shape·residual의 투수별 분포: 실제로 투수마다 갈리는가, 아니면 상수에 가까운가"
  - "residual의 정체 추적: 0.90의 나머지 0.10이 무엇인지 ball_rate·strike_rate와의 관계로 추정 (ball+strike 항등식도 확인)"
  - "fail_shape 단독 타깃 상관·구간별 성공률 표 (신호가 있는지 학습 전 확인)"
  - "이 결과에 따라 A3·A4 진행 여부를 조정"

test_reproducibility:         # 규칙 2-4 — 사전 확인 완료
  status: "안전"
  reason: >
    파생에 쓰는 원본 컬럼(asof_pitcher_success/reverse/middle/ball/strike_rate,
    prev{1,3,5}_game_success/middle_rate, asof_batter_success/middle_rate)이
    **test.csv 48컬럼에 전부 존재**한다(exp_000_eda 확인). 따라서 test 행 하나만으로
    동일 계산이 가능하며, test 다른 행·전체 분포 참조가 원리적으로 불가능하다.
    5행 스텁으로 재현 경로를 실제 확인할 것.

validation:
  scheme: rolling-origin
  primary_metric: brier       # fold_2024 valid_all (R+F 전체)
  report_also:
    - "valid_R·valid_F 세그먼트"
    - "asof_pitcher_n 구간별(저n/중n/고n) 개선폭 — 비율 피처는 저n에서 노이즈"
    - "신규 피처 중요도 순위와 gain 점유율 (exp_009처럼 점유율만 높고 페이오프 0인지 확인)"
    - "최종 후보는 seed {42,7,2024} 반복 — delta가 시드 산포보다 큰지"

runtime:
  where: a5000
  expected_min: 45

targets:
  current_best: "exp_010 D — valid_all Brier 0.248261 (iter 750 P4 정직치) / 환산 619.0 · LB 807.33 실측"
  goal: >
    LB 1,061점. **환산계수 1.293 실측 확정**(2026-08-05 첫 제출: 로컬 624.5 → LB 807.33,
    exp_008 RF 앵커 1.323과 2.3% 차이)이므로 필요 로컬 Brier는 종전 추정 0.247157이 아니라
    **0.24776~0.24780**. 현재 대비 갭 **−0.00044~−0.00049** — exp_010이 한 번에 −0.000508을
    얻었으므로 도달 가능 범위.

overlap_note: >
  exp_011(asof 수축)이 같은 컬럼군을 다룬다. 그쪽은 **저n 노이즈를 줄이는** 방향이고
  이쪽은 **비율 구조를 펴는** 방향이라 직교하지만, 둘 다 성공하면 결합 시 수축된 rate로
  shape를 계산하는 형태가 자연스럽다. 1변수 원칙 유지를 위해 이번엔 원본 rate로만 계산하고,
  결합은 양쪽 결과 확인 후 별도 실험으로.
