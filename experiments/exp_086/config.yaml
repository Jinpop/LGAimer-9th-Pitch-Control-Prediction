exp_id: exp_086
date: 2026-08-23
title: "exp_085 새 팔 시드 4개 확장 — 진짜 신호인가 시드 평균 미구매인가"
학습_건수: "2 arm x 시드 3개 추가 = 6 fit (시드 42 는 exp_085 r2 재사용)"
제출물: "없음"

왜: |
  exp_085 가 관문 둘을 통과했으나 **판정이 기준선에 의존한다**:
    3원 기준선(796.04710) 위: F1_FM +38.82541(t 3.48) · F2_EMB +63.04251(t 4.35)
    최강 기준선(NN 4시드평균+AA67, 907.59956) 위: F1_FM +0.42433(t 0.39) · F2_EMB +1.90154(t 0.80)
  🔑 **그 기준선의 NN 은 4시드 평균이고 새 팔은 1시드다.** 같은 변동 등급(NN 1시드)에 놓으면
  두 팔 합쳐 +34.04579(t 3.09). exp_085 는 이 둘을 가르지 않았다.
  → **새 팔도 4시드 평균으로 올려 같은 조건에서 다시 잰다.** 이것이 그 질문의 유일한 직접 대조다.

면: "exp_085 와 동일 — fold_2024(train ≤2023 → valid 2024 valid_all 253,507행)"

레시피: |
  🔴 exp_085 r2 와 **완전히 동일**하게. epochs=25, sched_epochs=25, take="best", 조기 종료 없음
  (exp_064 nnlib.fit 승계 규약). r1 의 OneCycleLR 60에폭+patience 5 는 사고였고 쓰지 않는다.
  결측 처리도 r2 와 동일(62열 플래그 별도, 입력 폭 157). 바꾸는 것은 **시드뿐이다**.

arm: "F1_FM 과 F2_EMB 둘 다 확장한다. exp_085 는 상관 0.905 를 이유로 하나만 권했으나, 최강 기준선 위 이득은 F2 가 4.5배(+1.90 vs +0.42)이고 상관은 F1 이 낮아 어느 쪽이 나은지 추측할 근거가 없다. 6 fit 을 더 쓰는 비용이 사소하므로 데이터로 고른다"
시드: "42(재사용) + 7 + 2024 + 101 → 4시드 평균 로짓"

사전_등록_판정 (🔴 결과를 보고 바꾸지 않는다 — S8):
  기준선: "최강 기준선 = NN 4시드평균 + AA67 (0.75/0.25), 907.59956. **이것 하나로만 판정한다**"
  측정: "그 기준선 위에 4시드 평균 새 팔을 얹은 최적 가중 w* 와 이득, 투수 블록 부트스트랩 1000회 SE 로 t"
  통과: "어느 한 팔이라도 **t >= 2.0** → 본 배포 경로(3시드 채택 판정 + C단 패키징) 설계에 착수"
  기각: "둘 다 t < 2.0 → **이 계열 종료**. 대장에 기록하고 파라미터 재탐색 금지(낚시 방지, exp_054 판례)"
  ⚠️_주의: "t >= 2 는 '볼 가치가 있다'이지 채택이 아니다. LB 전이는 별개이고 이 계열 실적은 AX −0.4869 · AY −0.9928 이다"

부가_측정:
  - "두 팔을 **같이** 얹었을 때의 2원 동시 최적 가중과 이득 (S16 — naive 합산 금지, 동시 해로)"
  - "4시드 평균 후 기존 팔들과의 최대 |rho| (1시드 때 F1 0.866801 · F2 0.885631 에서 얼마나 움직이나)"
  - "시드별 단독 Brier 산포 — 새 팔의 시드 변동이 우리 NN 대비 큰지"

운영:
  ETA: "fit 6건 x 약 2.2분 = 계산 약 15분, GPU 2장 동시면 벽시계 8~12분. 세션 30분 이내"
  ⚠️ 서버: "build_CA 가 동시에 돈다. GPU 학습이므로 게이트(CPU)와 경합은 작으나 부하를 확인할 것"
  스레드: "exp_085 r2 와 동일 설정 고정"
