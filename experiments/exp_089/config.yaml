title: "딥 축을 잴 수 있는 면 만들기 — 딥 팔 구조 복제 + ≤2023 학습 + LB 눈금 보정"
학습_건수: "복제 검증 5 fit (≤2024) + 정직면 5 fit (≤2023) = 10 fit"
제출물: "없음 (면을 만드는 실험. 후보는 이 면 위에서 다음에 고른다)"

왜: |
  🔴 **S83**: LB +5.0813180433 을 산 팀원 딥 팔이 파트너 내부 로짓과 ρ **0.953905** 다 — 우리 기각선 0.95 위.
     딥 팔이 번 기전은 새 방향이 아니라 **같은 자리를 더 잘 맞히는 팔로 20%를 갈아끼운 것**이다.
     → 물어야 할 것은 "얼마나 다른가"가 아니라 **"같은 자리에서 더 나은가"**.
  🔴 **S84**: 그런데 그 물음을 잴 면이 없다. 팀원 딥 팔이 ≤2024 학습이라 **2023·2024 어느 해도 out-of-time 이 아니다.**
     exp_088 관문 B 가 통계량 0 으로 축퇴했다(우리 팔 `w*=0.000`, 딥 `w*` 는 격자 상한).
  🔑 **두 가지가 이걸 푼다**:
     ① 딥 팔 구조가 `deepf_s*.npz` 키(`m.0`~`m.10`·`ce.0`~`ce.4`·`w`·`b`)와 `prep.json`(`D`·`ED`·`lr`·`epoch`·`batch`)로 **전부 복원된다**
     ② 팀원이 08-21 에 준 **OOT 벡터 3종**이 파트너 팔의 ≤2023 판본이다
        (`~/Downloads/OOT벡터_1차.zip` `p_lgb`·`p_cat`·`p_leaf`·`p_v6_3arm_{renorm,rawW}`·`off` · `2차_pq.zip` `p_q` · `3차_pebm.zip` `p_ebm`, 각 253,523행)
  → **딥 팔의 ≤2023 판본만 우리가 만들면 모든 팔이 out-of-time 인 면이 처음 생긴다.**
     그 면에서 딥 교체의 이득을 재고, **LB 실측 +5.0813180433 과 대조해 이 축의 전이비를 눈금 잡는다.**
     그게 이 실험의 산출물이다 — 후보가 아니라 **자(尺)**.

stage0_구조복원:
  무엇: "npz 키·형상과 prep.json 에서 층 구성·활성·정규화·임베딩 차원·하이퍼를 복원. mate/deep_infer.py 의 순전파와 대조해 검증"
  게이트: "복원 구조로 만든 모델의 파라미터 형상이 npz 와 **키별로 완전 일치**. 하나라도 어긋나면 정지"

stage1_복제검증:
  무엇: "복원한 레시피로 ≤2024 전량(1,475,092행) 5시드 학습 → 팀원 npz 와 같은 프레임에서 예측 상관"
  게이트: "우리 복제본 5시드 평균 ↔ 팀원 5시드 평균 ρ >= 0.98. 미달이면 복원이 틀린 것이므로 정지하고 무엇이 다른지 보고"
  ⚠️: "바이트·가중치 일치는 요구하지 않는다 — 초기화 난수가 다르다. 요구하는 것은 **예측 상관**이다"

stage2_정직면:
  무엇: "같은 레시피로 **≤2023** 5시드 학습. 그러면 딥 팔이 fold_2024 에서 out-of-time 이 된다"
  면: "OOT 벡터로 파트너 내부 혼합을 재구성 + 우리 AA/S1/S2/T70 의 ≤2023 판본. **모든 팔이 out-of-time**"
  측정: "그 면에서 `z_mate' = (1-w)·z_mate + w·lg(p_deep_oot)` 의 w 격자 스윕(0~0.6, step 0.01) → 최적 w 와 이득, 투수 블록 부트스트랩 1000회 t"

stage3_눈금 (★이 실험의 산출물★):
  무엇: "stage2 의 w=0.20 에서의 정직면 이득과 **LB 실측 +5.0813180433** 의 비 = **이 축의 전이비**"
  왜: "S54·S78 이 보여줬듯 전이비는 축 계열마다 다르고 정직면은 최대 54배까지 부풀린다.
       이 축은 지금 유일하게 돈이 되는 축이므로 **그 자를 갖는 것이 다음 판단의 전제다.**"
  부가: "정직면 최적 w 와 LB 로 계산한 최적 w(0.1757, B=6.717) 를 나란히 적어 **정직면이 최적점을 어디로 옮기는지** 기록"

사전_등록 (🔴 결과 보고 바꾸지 않는다 — S8):
  정지점: "stage0 형상 불일치 → 정지 / stage1 ρ < 0.98 → 정지"
  🔴 금지: "이 실험은 후보를 만들지 않는다. 전이비가 크게 나와도 그 자리에서 zip 을 만들지 마라 — 자를 먼저 확정한다"
  🔴 크기예측금지: "정직면 이득에서 LB 이득을 추정해 적지 마라. stage3 의 비 자체가 산출물이고, 그 비를 쓰는 것은 지휘자다"

