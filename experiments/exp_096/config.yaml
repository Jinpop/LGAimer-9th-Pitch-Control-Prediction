exp_id: exp_096
title: "새 팔 추가 배터리 — 내부 슬롯 3자유도 (아키텍처 계열 + 시퀀스 팔)"
date: 2026-08-25
owner: orchestrator
training: yes    # exp_095 와 달리 학습이 있다. GPU 2레인 사용, CPU 는 빌더가 쓰므로 최소화.

배경:
  왜_이것인가: |
    남은 축 중 자릿수가 맞는 것은 팀 원장 기준 **팔 추가(전이계수 0.574)** 하나뿐이다.
    exp_095 가 딥 가중(w)·바깥 슬롯(v)·배포 경로 잔여 per-row 신호 셋을 전부 닫았고(S128·S129),
    사후 상수 축은 exp_078 이 닫았다(S19·S20). CJ·CL·CK·번들 재적합을 다 더해도 +6~7 인데
    마감 컷 추정 대비 부족분이 **+15 ~ +36** 이다. 한 자리를 메울 수 있는 것은 딥 팔급 추가뿐이다
    (딥 팔 실적: 정직면 +11.05 → LB +5.08, 전이 0.46).

  무엇이_아직_안_열렸나: |
    exp_091(22지점)·092(19지점)·093 이 딥 슬롯 안을 훑었으나 **바꾼 것은 시드·폭·깊이·dropout·wd·
    피처마스크·출력층**뿐이다. 한 번도 안 바꾼 것 셋:
      ① **아키텍처 계열** — 전부 같은 MLP 다. 어텐션/명시적 2차 상호작용은 미시도.
      ② **최적화 일정** — S98: LR 스케줄러가 아예 없다(상수 1e-3). 이건 팔 품질의 표준 손잡이고
         S103 환율이 `alone` 1점 = 이득 +0.19533 이라 품질 개선이 곧바로 값이 된다.
      ③ **입력 정보 구조** — 99열은 전부 shift(1) 롤링 **집계**다. 직전 K개 투구를 **순서대로** 보는
         팔은 집계가 지운 패턴(연속 실패, 구종 배열, 최근 급변)을 볼 수 있다. 이것만이
         '새 정보'이고 나머지는 '같은 정보의 다른 함수'다.

  ⚠️_역풍_솔직히: |
    S115: 같은 구조·다른 시드의 ρ 바닥이 0.92756 [0.91064, 0.93932]. 그 대역 안이면
    '시드만 바꿔 다시 구운 것'과 구별되지 않는다. exp_093 의 4셀 멀티헤드가 0.9365 로 그 대역에서 죽었다.
    S83: 그러나 **문턱은 ρ 가 아니다** — 딥 팔 자신이 ρ 0.9539 로 우리 옛 기각선 위인데 +5.08 을 벌었다.
    물어야 할 것은 "얼마나 다른가"가 아니라 **"같은 자리에서 더 나은가"** 다. 그래서 이 실험의
    사전 등록 문턱은 **혼합 이득 하나**이고 ρ·단독점수는 진단으로만 적는다.

측정면:
  면: "정직면 (OOT) — 전 팔 ≤2023 학습 → 2024 평가. exp_089/090/095 하니스 그대로."
  서버_자산:
    - "a5000:~/SungjinPark/exp090/  — OOT 1632스텝 딥 5시드 z 벡터 + abd 곡선 코드"
    - "a5000:~/SungjinPark/exp095/  — (w,v) 격자·부트스트랩·귀무 하니스"
    - "a5000:~/SungjinPark/exp089/work/  — z_mate, z_aa, z_T70, 정직면 라벨"
  🔴_재현_게이트_실패시_실험_무효:
    G1: "w=0, alpha=1 기준점 rc == 928.501461058684 (abs_diff 정확히 0.0)"
    G2: "(w=0.36, w2=0) 이득 == 13.714309769419287 (abs_diff 정확히 0.0)"
    G3: "(w=0.20, w2=0) 이득 == 11.05028248077349 (abs_diff 정확히 0.0)"

혼합_산술:
  내부_3자유도: "z_inner(w, w2) = (1 − w − w2)·z_mate + w·z_deep + w2·z_new,   w + w2 ≤ 1"
  전체: "z(w,w2) = alpha · [ 0.7·z_inner + 0.25244·z_aa + 0.04756·z_T70 ]"
  격자: "w ∈ {0.20, 0.24, …, 0.44} (7) × w2 ∈ {0.00, 0.02, …, 0.30} (16) = 112점 / 팔"
  진단_추가: "치환형 (w=0, w2 자유) 도 함께 낸다 — 딥을 통째로 갈아끼우는 경우"
  보고_규율: "고정 alpha · alpha 자유 · sd 맞춤 셋을 병기한다 (S25·S33). 판정은 고정 alpha."

stage0_가용성_검증:
  목적: "설계가 성립하는지 먼저 확인하고, 안 되는 갈래는 여기서 잘라낸다. 학습 전에 끝낸다."
  할것:
    - "정직면 하니스 재현 — 위 G1·G2·G3 셋. 실패하면 즉시 중단하고 보고."
    - |
      🔴 test.csv(2025) 에 실제로 있는 열을 전수 확인한다. 시퀀스 팔은 **test 에 존재하는 열만**
      쓸 수 있다. 현재 행 TrackMan 금지는 물론이고, 직전 행의 TrackMan 도 test 에는 아예 없으므로
      쓸 수 없다. train ∩ test 열 교집합을 실제로 계산해 목록을 낸다.
    - |
      시퀀스 팔이 성립하는지 판정: 투수별 직전 K=16 투구를 순서대로 붙였을 때
      ① 커버리지(직전 투구가 K개 미만인 행 비율) ② 쓸 수 있는 열 수 ③ 텐서 크기.
      **쓸 수 있는 열이 6개 미만이거나 커버리지가 60% 미만이면 stage2 를 접고 그 사실을 보고한다.**
  산출: "out/s0_feasibility.json"

stage1_아키텍처_계열:
  학습: "전부 OOT ≤2023, 5시드, exp_090 의 데이터비 1.324 로 스텝 정합(배포 2160 ↔ OOT 1632)"
  후보:
    A1_어텐션:
      설명: "피처 토큰 self-attention (FT-Transformer 축소판). 99열 → 토큰 임베딩 d=64, 블록 2개, 헤드 4개, 그 뒤 분류 헤드."
      왜: "트리도 우리 MLP 도 명시적 쌍 상호작용을 안 만든다. 계열이 다르면 ρ 가 시드 바닥(0.9276) 아래로 갈 여지가 있다."
    A2_LR스케줄:
      설명: "구조·시드·스텝 동일, LR 만 cosine 1e-3 → 1e-5 감쇠."
      왜: "S98 — 현재 스케줄러가 없다. 팔 손질이라 전이는 낮지만(0.1~0.16) 비용이 1시간이고 `alone` 개선이 곧 이득이다(S103 +0.19533/점)."
      역할: "🔑 이것은 **대조군**이기도 하다 — A1·A3 의 이득 중 얼마가 '계열'이고 얼마가 '그냥 더 잘 학습된 것'인지 가른다."
    A3_순위변환입력:
      설명: "구조 동일, 연속 입력을 표준화 대신 분위수-순위 변환(train 분위표 동결, ≤2023 에서만 적합)."
      왜: "같은 정보 위의 다른 함수 계열. 꼬리가 눌려 트리와 비슷해질 수도, 반대로 갈 수도 있다 — 부호를 모르므로 잰다."
  귀무_대조: |
    🔴 S104 — 각 후보의 이득을 **같은 학습 예산·같은 시드 수의 기준 MLP 재적합 5개**와 비교한다.
    A2 가 이 역할을 겸하나, A1·A3 는 파라미터 수가 달라지므로 파라미터 수를 맞춘 기준 MLP 도 하나 굽는다.
  ETA: "학습 A1 5시드 ~12분(GPU) · A2 5시드 ~2분 · A3 5시드 ~2분 · 대조 ~2분, 평가 격자 4×112점 ~10분 → 약 40분"

stage2_시퀀스_팔:
  설명: |
    투수별 **직전 K=16 투구**를 시간순으로 붙인 (K × F) 텐서를 입력으로 받는 팔.
    구조: 1D 인과 합성곱 2층 + 게이트, 또는 소형 인과 트랜스포머 1블록 → 풀링 → 현재 행 정적 피처와 결합 → 헤드.
    stage0 이 낸 열 목록만 쓴다.
  🔴_리크_규율_예외없음:
    - "직전 투구만. 현재 행은 시퀀스에 넣지 않는다 (엄격 shift(1))."
    - "시퀀스에 쓰는 열은 test(2025)에 실제로 존재하는 열만. TrackMan 계열은 현재 행이든 직전 행이든 전면 금지."
    - "타깃 파생 열을 시퀀스에 넣지 않는다. 직전 투구의 **결과 라벨**을 넣고 싶으면 그것은 타깃 파생이므로 별도 표기하고 그 판본을 따로 보고한다(둘 다 재도 되나 섞어 보고하지 않는다)."
    - "OOT 학습은 season ≤ 2023 행만. 시퀀스가 2024 행을 참조하면 즉시 중단."
    - "실험 종료 후 leak-auditor 필수 — 출하 판단 전에."
  왜_이것만_새_정보인가: |
    99열은 전부 집계다. 집계는 순서를 지운다. 직전 3구가 (실패, 실패, 성공) 인 것과 (성공, 실패, 실패) 인 것이
    같은 롤링 평균을 낸다. 그 차이는 현재 어떤 팔도 안 본다.
  ETA: "텐서 빌드 40~60분 · 5시드 GPU 학습 ~25분 · 평가 ~15분 → 약 1.7시간"

🔴_사전_등록_문턱:
  주의: "결과를 보고 바꾸지 않는다 (S8). 이 파일이 원본이고 발사 전에 확정됐다."
  기준점: "2팔 최적 (w=0.36, w2=0) = +13.714309769419287"
  PASS_조건_둘_다:
    - "격자 argmax 이득 − 13.714310 ≥ **+2.5**  (고정 alpha 기준)"
    - "기준점 대비 **짝지은 투수 블록 부트스트랩 t ≥ 2.0**"
  왜_2.5인가: "전이 0.478 을 곱하면 LB +1.2 — 검출한계 +1.4(팀 제76)에 근접. 이보다 작으면 출하해도 못 읽는다."
  왜_t문턱이_2.0인가: "exp_095 stage1 이 잔여 +2.664 를 냈으나 t 0.9466 에서 죽었다. 크기만 보면 또 같은 자리에서 속는다."
  FAIL_이면: "출하 후보를 만들지 않는다. 계열별 ρ·단독점수·S103 회귀 잔차를 남겨 다음 판단에 쓴다."
  진단으로만_적을_것: "ρ(z_new, z_mate) · ρ(z_new, z_deep) · 단독 점수 · S103 회귀 예측 대비 잔차 · 시드 간 ρ(S115 대역과 대조)"

자원_규율:
  - "🔴 GPU 2레인 사용. **CPU 는 최대 4코어까지만** — `build_CJKL` 게이트가 20코어 쿼터 중 15를 쓰고 있다."
  - "🔴 다른 세션의 추론 시간 측정을 깨지 않는다. 단독 추론 시간 측정은 하지 않는다."
  - "🔴 파일 삭제 0건. 외부 프로세스 kill 0건. 사용자 승인 없이는 어느 쪽도 하지 않는다."
  - "디스크 여유 297G(95% 사용). 시퀀스 텐서는 float16 으로 쓰고 20GB 를 넘기지 않는다."

