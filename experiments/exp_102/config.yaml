exp_id: exp_102
title: "유휴 자원으로 살 수 있는 것 — 학습량 혼합 딥 팔 + 고친 면 재판독 + L4 눈금"
date: 2026-08-25
owner: orchestrator
training: 있음 (딥 fit 12~20초 × 수십 건, GPU 가용)

전제_확인된_사실:
  채점서버: "NVIDIA L4 22.4GiB · CUDA 12.8 · 6 vCPU · 28GB RAM (`대회정보.md:104-106`)"
  예산: "추론 ≤600초 / 245,789행. 현 패키지 채점서버 환산 **약 116초** → 여유 **484초**. 우리 6스레드로는 775초"
  설치: "≤10분, 설치 목적 인터넷 허용 (`대회정보.md:99-103`)"
  zip: "≤10GB (해제 후 ≤32GB)"
  🔴_솔직한_전제: |
    **우리 제약은 계산이 아니라 신호다.** TabPFN(exp_101)이 GPU 에서 시간 관문을 통과하고
    신호에서 죽었다(Δ +0.1753 · t 0.2365). **GPU 는 신호를 만들지 않는다.**
    그러니 이 실험은 "GPU 로 뭘 할 수 있나"가 아니라 **"유휴 예산이 있어야만 살 수 있는 이득이 실재하는가"** 를 묻는다.

# ─────────────────────────────────────────────────────────────
축A_학습량_혼합_딥팔:      # 🔴 이것이 본론이다
  가설: |
    S99 실측 — **단독 성능이 꺾이는 지점과 혼합 이득이 꺾이는 지점이 다르다.**
    딥 팔 `ρ(z_mate)` 가 학습량에 따라 **0.934(816) → 0.914(1632) → 0.870(2720) → 0.816(3264)** 로 내려가고,
    단독은 1088 에서 정점(890.8)인데 혼합 이득은 1632 에서 정점이다.
    → **학습량이 서로 다른 체크포인트를 평균하면 단독은 유지하면서 `ρ` 를 내릴 수 있다.**
    S103 이 요구하는 유일한 조합(*"그보다 싸게 `ρ` 를 내리는 손잡이"*)이 이것일 수 있다.
    ⚠️ S72(시드 평균이 다양성도 깎는다)는 **같은 설정**의 시드 평균 이야기다. 여기는 설정이 다르다.
  🟢_왜_출하_가능한가: |
    팀원 `mate/deep_infer.py` 는 **가중치 파일 목록을 받아 평균**한다. 학습량이 다른 체크포인트를 넣는 것은
    **같은 코드 경로**다 — `.py` 를 한 줄도 안 고친다. 형상도 같다(S101 의 하드코딩 제약을 안 건드린다).
  설계:
    면: "정직면 OOT. 🔴 **exp_097 이 고친 f64 입력**(`a5000:~/SungjinPark/exp096/work/X_f64_oot23.npy`). 결함면 쓰지 마라(S134)."
    기준선: "고친 면 2팔 최적 **26.2698** (1632스텝 · w=0.43)"
    격자: |
      학습량 집합 S ⊂ {544, 816, 1088, 1360, 1632, 2176, 2720, 3264} 의 조합.
      각 지점 **5시드**(S72·S86 — 다양성은 같은 시드 수·같은 학습 구간에서 잰다).
      최소한 이것들을 재라: {1632} 단독(=기준) · {816,1632} · {1632,2720} · {816,1632,2720} ·
      {1088,1632,2176} · {816,1632,3264} · 균등 4~5지점.
      `w` 는 0.20~0.60 격자.
    🔴_귀무_대조_필수: |
      **같은 개수의 체크포인트를 *같은 학습량에서 다른 시드로* 뽑은 판본**을 반드시 붙여라(S104).
      예: {1632}×15시드 vs {816,1632,2720}×5시드씩. **개수가 같아야 한다.**
      이 대조가 없으면 "체크포인트를 늘려서 좋아진 것"과 "학습량을 섞어서 좋아진 것"을 못 가른다.
  🔴_사전등록_문턱:
    - "격자 argmax 이득 − 26.2698 ≥ **+2.0**"
    - "**그리고** 개수 맞춤 귀무 대조 대비 짝지은 투수 블록 부트스트랩 **t ≥ 2.0**"
    - "결과를 보고 바꾸지 않는다(S8)."
  진단으로만: "각 조합의 `ρ(z_mate)` · 단독 점수 · S103 회귀(`gain ~ ρ + alone`) 예측 대비 잔차"
  추론비용: "체크포인트 1개당 딥 팔 1스레드 약 8.2초(CG 실측 41.81초/5시드 → 115.66초/14시드). 채점서버 환산은 6스레드 ÷1.60 으로 낸다."

# ─────────────────────────────────────────────────────────────
축B_고친_면에서_기각_재판독:
  왜: |
    exp_091(22지점)·092(19지점)·093 이 딥 슬롯 안을 훑고 전부 기각했는데 **전부 결함면 위**였다(S134).
    exp_097 이 *"딥 관련 **크기** 판정이 전부 낮게 읽혔다"*(1.92배)고 했다. **순위까지 바뀌는지는 아무도 안 봤다.**
  할것: |
    exp_091·092 산출물에서 **상위 지점 몇 개만 골라** 고친 f64 입력으로 다시 재라(전부 다시 하지 마라).
    특히 ① 폭·깊이 계열 ② dropout 0.2(단독 +14.3 인데 혼합 −3.25 였던 지점) ③ exp_092 의 무작위 16열 마스크(+14.892).
    **순위가 뒤집히는 지점이 하나라도 있으면 그것이 이 축의 산출이다.** 없으면 "결함이 순위를 안 바꿨다"로 닫는다.
  문턱: "축A 와 동일(≥ +2.0 · t ≥ 2.0). 넘는 게 없으면 재판독 결과만 기록하고 닫는다."

# ─────────────────────────────────────────────────────────────
축C_L4_눈금:              # 값싸고, 앞으로 GPU 후보를 볼 때마다 필요하다
  왜: "🔴 **A5000 → L4 환산 계수가 우리 장부에 없다.** S122 는 CPU 눈금(우리 6스레드 ÷1.60)이고 GPU 는 미기록이다."
  할것:
    - "L4 와 A5000 의 공개 사양을 대조해 **연산 종류별 예상 비**를 표로 내라. 특히 **메모리 대역폭**(L4 약 300 GB/s vs A5000 약 768 GB/s)과 FP16/BF16 텐서 처리량."
    - "우리 워크로드가 **대역폭 병목인지 연산 병목인지** A5000 에서 실측해 판정하라(배치 크기를 바꿔가며 처리량 곡선)."
    - "🔴 **L4 실측은 불가능하다** — 추정임을 명시하고 **보수적 계수**를 하나 제시하라. 우리가 GPU 후보를 낼 때 쓸 눈금이다."
  ⚠️: "이 축은 판정 문턱이 없다. 눈금을 만드는 것이 목적이다."

자원_규율:
  - "🔴 **파일 삭제 0건 · 외부 프로세스 kill 0건** — 사용자 승인 없이는 어느 쪽도 하지 않는다."
  - "🔴 CPU 4코어 상한 — 같은 서버에서 후보 CQ 빌드가 게이트를 돌린다. GPU 2장은 자유롭게 써라."
  - "🔴 단독 추론 시간 측정은 CQ 게이트가 끝난 뒤 단독 창에서(S120)."
  - "디스크 여유 297G(95% 사용) — 20GB 넘기지 마라."

ETA:
  축A: "fit 약 40~60건 × 12~20초 + 격자 평가 → **90~120분**"
  축B: "상위 지점 재적합 + 평가 → 60분"
  축C: "사양 대조 + 처리량 곡선 → 30분"
  합계: "3~3.5시간"

