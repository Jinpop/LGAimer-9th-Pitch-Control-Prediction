🔴 규칙_정정이_왜_S8_위반이_아닌가: >
  ① exp_067 config 가 **"둘 다 만들어 차이를 재고 기록하라"** 고 명시했다 — 재는 것이 계획이었고
     그 결과에 따라 고치는 것이 그 측정의 목적이다. 채택 문턱을 옮겨 통과시킨 것이 아니다.
  ② 사전 등록값 25(완주)는 **성능 문턱이 아니라 배포 구성 선택**이다. 측정이 그것을 −238.61047점으로
     반증했고, 반증된 구성을 그대로 출하하는 것이 오히려 규율 위반이다.

🔴 리크가_아닌_이유_(소명용_정본): >
  2024 는 **배포 모델의 학습 범위 안**이다(배포는 ≤2024 전량 적합).
  "검증으로 하이퍼파라미터를 고르고 전체 데이터로 재적합한다" 는 표준 절차이며,
  test(2025) 는 이 경로 어디에도 들어오지 않는다. 고른 것은 **에폭 하나(스칼라)** 이고
  그 유도가 위 `k_유도` 에 전량 기록돼 있다.

