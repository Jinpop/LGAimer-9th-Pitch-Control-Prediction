exp_id: exp_087
date: 2026-08-23
title: "AA 팔 F 세그먼트 시드 확장 3 → 18 — 우리 팔의 유일한 남은 비대칭"
학습_건수: "5 모델 x 15 신규 시드 = 75 fit (F 세그먼트만)"
제출물: "성공 시 후보 CB (B단 — 새 부스터, 같은 피처·경계)"

왜: |
  출하 패키지 시드 수 실측 (2026-08-23, `submit_CA2_nact.zip` 직접 열어 셈):
    model/R/seed_*  → **18개** (1,3,7,13,17,42,77,101,123,555,777,999,2019,2024,2025,8191,31337,65537)
    model/F/seed_*  → **3개**  (42, 7, 2024)          ← 여기만 비어 있다
    mate/model_q    → 3개 · v6 CAT 4 · v6 NN 4 · EBM 3
  각 seed 디렉터리는 `cell_is_{both,mid_only,rev_only,wayoff_true}.cbm` + `stacker.cbm` 5개.

  🔑 **근거는 LB 실측이다**: 후보 Q 시드 **1→3 이 LB +15.02**, 적합식 `score(n) = 887.58 − 35.99/n`.
     이 식대로면 3→18 은 그 팔 눈금에서 **+10.0**.
  ⚠️ **그러나 F 는 test 행의 약 11% 뿐**이고, 잡음감소형 축의 블렌드 전달률 실측은 **0.068**(S4)이다.
     Q 확장은 그 전달률을 안 타고 +15.02 를 냈다 — **어느 쪽인지 로컬로는 못 가른다**
     (S78: 정직면이 CA2 축을 54배 부풀렸다). **이 실험은 만들기만 하고, 크기는 LB 가 정한다.**

면: "fold_2024 (train season ≤2023 → valid 2024, valid_all)"

레시피:
  동일성: "기존 F 시드 3개(42·7·2024)를 만든 것과 **완전히 동일한 레시피**. 바꾸는 것은 시드뿐이다.
      출하 부스터의 `get_all_params()` 를 읽어 파라미터를 그대로 복원하고, 그 차이가 `random_seed` 뿐임을
      기계로 증명하라(**B단 게이트**). 피처·경계·표·vocab 은 한 톨도 안 바꾼다."
  ⚠️_cbm_주의: ".cbm 은 재학습으로 바이트 재현되지 않는다 — 바이트 비교를 게이트로 걸지 마라(CLAUDE.md 명시).
      재현 검증은 **기존 시드 3개 중 하나를 같은 레시피로 다시 적합해 잎값 전체 float64 일치 +
      트리 수 + 피처 순서 + 기록 파라미터 블록 + learn_best_error 일치**, 그리고
      `model_guid`·`train_finish_time` 외 메타키가 하나라도 다르면 실패로 판정한다."
  신규_시드: "R 쪽 18개 중 F 에 없는 15개를 그대로 쓴다 — 1,3,13,17,77,101,123,555,777,999,2019,2025,8191,31337,65537"

사전_등록_판정 (🔴 결과를 보고 바꾸지 않는다 — S8):
  G1_재현: "기존 시드 하나 재적합이 위 '모델 동일' 조건 전항목 통과. **실패 시 즉시 정지** — 레시피 복원이 틀린 것이다"
  G2_파라미터: "신규 75 fit 의 `get_all_params()` 가 기존과 `random_seed` 만 다름"
  G3_F단독: "fold_2024 valid_F 에서 시드 18개 평균이 3개 평균보다 낫다. 🔴 이건 방향 확인일 뿐 채택 판정이 아니다 — S7 (F 쪽 변경을 valid_F 로 판정하지 않는다, 부호 4연속 어긋남)"
  G4_추론시간: "🔴 이것이 진짜 문턱이다. 현재 CA2 의 1스레드 최악이 374.10초 = 예산의 62.4% 다. F 시드 15개를 더하면 늘어난다. 1스레드 최악이 480초(80%)를 넘으면 시드 수를 줄인다 — 18 → 9 → 6 순으로 낮춰 480초 안에 드는 최대를 고른다. 그 판단 근거를 기록하라."
  판정: "G1·G2·G4 통과 → 후보 CB 빌드로 진행. G1 실패 → 정지하고 보고"

부가_측정:
  - "시드 n 별 valid_F Brier 곡선 (n=3,6,9,12,15,18) → `score(n) = a − b/n` 적합. b 가 R 쪽 35.99 와 비슷한가"
  - "추론 시간 대 시드 수 기울기 (초/시드) — 실측표에 추가"
  - "18시드 평균 예측과 3시드 평균 예측의 상관·최대 이동폭"

운영:
  ETA: "F 행은 train 의 약 11%(약 18만행)라 fit 당 빠르다. CatBoost CPU 87만행 cap3000 실측 3.2~13.5분 기준 
        18만행이면 fit 당 약 1~3분 → 75 fit 계산 75~225분, **동시 3개 병렬이면 벽시계 40~90분**. 
        여기에 재현 게이트·추론 시간 측정 30분. **세션 2~3시간.**
        실측이 ETA 를 넘으면 즉시 갱신 보고."
  스레드: "fit 당 6 고정, 동시 3개 (규약 #2)"
  🔴 파일_삭제: "금지. 산출물은 ~/SungjinPark/exp087/ 아래에만. 기존 build_*·audit_*·pack_* 은 읽기만"
  🔴 서버: "다른 세션 프로세스를 죽이지 마라. 추론 시간은 조용할 때 단독으로 재라"
