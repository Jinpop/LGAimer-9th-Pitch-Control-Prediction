exp_id: exp_061
date: "2026-08-20"
hypothesis: >
  exp_060 파일럿(1시드 837.06272)에서 남은 자유도 셋 — **용량(폭)** · **시드 평균** ·
  **분할 B** — 을 닫고, 배포 가능한 NN 팔을 만든다.
  파일럿이 답한 것: 학습 부족 아님(에폭 5 포화, 11~15 과적합).
  파일럿이 못 답한 것: **74,535 params 가 1,116,277행에 작지 않은가.**
base_exp: exp_060

🔴_이_실험이_겨냥하는_투입_형태: >
  **v6 팔 안쪽 NN 교체가 아니다.** 최상위 블렌드에 `+ c_nn·logit(p_nn)` 을
  **독립 팔**로 얹는 것을 겨냥한다.
  근거: 안쪽 교체는 비중 0.058 에 갇혀 팀원 로컬 측정 상한이 +1.88 이다.
  독립 팔이면 `c_nn` 이 사후 상수라 전이 부호 양수 계열(4/4)을 타고
  꼭지점 기계(AO·AZ·BG)가 그대로 걸린다.
  ⚠️ 이 실험은 **팔을 만드는 데까지**다. 배포 후보 빌드와 `c_nn` 프로브는 별건.

승계_고정_파일럿과_동일하게_둘_것:
  피처: "features_sp.txt 99열 (dense 95 + 범주 4 + cnt_state)"
  범주_임베딩: "5개 유지(base_state·game_type·양팀 id·cnt_state), edim 6. 선수 ID 임베딩 제거"
  층_수: >
    🔴 **4층 고정.** 출하 `mate/nn_infer.py` 의 `predict_nn` 이 층 인덱스를
    하드코딩한다(lin0→bn1→relu→lin4→bn5→relu→lin8→relu→lin10).
    층수를 바꾸면 출하 코드 재작성 = 감사 표면 확대 → 이번 판에서 하지 않는다.
  손실_옵티마: "BCEWithLogits · AdamW · OneCycleLR (파일럿 값 승계, 아래 스윕 대상 제외분은 고정)"
  frame_캐시: >
    `~/SungjinPark/exp060_nn/cache/frame99.parquet` (1,475,092×102) **재사용**.
    🔴 재사용 전 `provenance.json` 의 sha 4종을 재확인하라 —
    train.csv `d2081186…` · features_sp `783c650c…` · pipeline.py `a3181a10…` ·
    splits.py `5e8884ed…`. 하나라도 어긋나면 캐시를 버리고 재생성한다.

## ── stage 1: 용량 스윕 (seed 42 단독, 분할 A) ──
stage1_용량:
  목적: "폭이 대역을 바꾸는가. 파일럿 125-256-128-64-1 / 74,535 params 는 111만 행에 작다"
  격자:
    폭: [[256,128,64], [512,256,128], [1024,512,256], [768,384,192]]
    dropout: [0.30, 0.15]
  스케줄: "OneCycle 15에폭 **완주**(patience 무효) — 파일럿에서 patience 5 가 사이클 중간에 발동하는 상호작용이 관측됐다. full15 형태가 가장 깨끗한 수렴 측정"
  fit_수: 8
  정지점: >
    8개 중 파일럿(837.06272) 대비 **+10점 이상**인 구성이 하나도 없으면
    용량 축을 닫고 stage 2 를 파일럿 폭으로 진행한다. 파라미터 재탐색 금지(낚시 방지).
  🔴_max_lr: >
    폭을 키우면 최적 학습률이 내려간다. 각 폭에서 `max_lr ∈ {3e-3, 1e-3}` 2점만 본다
    (전면 탐색 금지 — 정지점 판정이 학습률 미탐색 탓이 되는 것을 막는 최소한).
    → stage 1 실제 fit 수 **16**.

## ── stage 2: 시드 평균 (stage 1 낙점 구성, 분할 A) ──
stage2_시드:
  시드: [42, 777, 2024, 101]        # 출하 NN 과 같은 4시드
  산출: "시드별 valid 2024 예측 + 4시드 산술평균(로짓 공간 — 출하 v6_infer 가 lg() 평균을 쓴다)"
  대조: "팀원 예비 실측 시드평균 이득 +21.6점(seed42 842.98 → 3시드 864.56). 우리 값이 그 자릿수인가"

## ── stage 3: 분할 B (부호 확인) ──
stage3_분할B:
  분할: "train 2020~2022 → valid 2023 중 game_type=='R' (219,839행)"
  마스크: "season<=2022 & game_type=='F' 제외 (동일)"
  🔴_as_of: >
    2023 행의 `ins_*`·`sp_*`·v6 파생 44열은 **season<2023 표**로 만들어야 한다.
    frame99 캐시는 연도별 루프로 만들어져 있으므로 **그대로 맞다** — 새로 만들지 마라.
    (팀원 요청문 §5-3 이 분할 B 앵커를 지정하지 않은 공백은 이 구조로 이미 닫힌다)
  목적: "두 분할 부호 일치 확인. 요청문 §5-1 — '한 분할에서 압도적이던 방법이 다른 분할에서 사라진 적이 있다'"
  판정: "부호가 갈리면 배포 빌드로 넘기지 않는다"

## ── stage 4: 배포 재적합 (≤2024 전체) ──
stage4_배포:
  조건: "stage 3 부호 일치 통과 시에만"
  학습: "train 전체(≤2024, 마스크 동일) 재적합, stage 1 낙점 구성 × 4시드"
  iter_정책: >
    🔴 조기 종료가 쓸 valid 가 없다. **분할 A 의 best epoch 를 그대로 쓴다**(행 수 비례 외삽 금지 —
    exp_033 에서 그 법칙이 반증됐고, 배포 셀 iter 가 두 번 쌓인 외삽임이 2026-08-16 에 드러났다).
    쓴 에폭 수와 그 근거를 metrics 에 명시.
  산출물: "출하 npz 포맷(emb{i}·mlp_{i}_weight/bias·mlp_{1,5}_running_mean/var) + meta.json 4벌"
  검증: "출하 predict_nn 사본으로 torch 대비 max_abs_diff — 파일럿 1.19e-07 자릿수 유지 확인"

