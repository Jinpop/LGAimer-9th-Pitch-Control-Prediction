  expected_min: 110
  eta_근거: >
    **파일럿 실측 기반** — fit 15에폭 완주 1시드 **0.84분**(에폭당 3.8초, 111만 행, batch 4096).
      · stage 1: 16 fit. 폭이 커지면 에폭 시간이 늘어난다(1024-512-256 은 파라미터 약 20배)
        → 보수적으로 fit당 평균 2.5분 = **40분**
      · stage 2: 4 fit × 낙점 폭 = **5~10분**
      · stage 3: 캐시 재사용, 4 fit + 표 없음 = **10분**
      · stage 4: ≤2024 전체(1,369,784행, 분할 A 대비 1.227배) 4 fit = **10~15분**
      · 변환·검증·상관 산출 = **10분**
      · 코드 작성·검증 = **25~35분**
    → **합 100~120분, 중앙 110분.** 캐시 sha 불일치로 frame99 재생성이 필요하면 **+6분**
      (파일럿 실측 stage1 3.5 + inssp 0.26 + assemble 0.31 + tm 0.09).
