감사: >
  이 실험 자체는 감사 불요(제출물 아님). **배포 후보로 빌드할 때 B단**:
  새 부스터(NN)·같은 피처 경계. `ins_*`·`sp_*` 는 출하 중인 감사 완료 경로이나
  **v6 44열 재구축 경로는 우리가 새로 만든 것**이므로 그 as-of 경계를 감사 대상에 넣을 것.
