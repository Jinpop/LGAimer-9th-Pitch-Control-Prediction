exp_id: exp_026
date: "2026-08-07"
title: "d_r 병용 + 손실 제거 + 귀속 가르기 + k 격자 확장 (전부 사후 변환, 학습 0건)"
hypothesis: >
  후보 J(LB 899.2884396705)가 신기록을 냈고 **β 축은 새 d에서도 닫혔다**(β* 0.5704,
  남은 여지 +0.033점). 남은 것은 `d` 자체를 더 좋게 만드는 것이다. 대기 중인 카드 넷이
  전부 **저장된 예측 위의 사후 변환**이라 학습이 필요 없으므로 한 실험으로 묶는다.

  ① **`d_r` 병용 (주력)** — 지금 쓰는 `d_s`는 성공률 편차다. `offset.py`의 `DEV_SPEC`에
     **`d_r`(의도 반대 비율의 편차)이 이미 구현돼 있으나 한 번도 배포된 적이 없다.**
     exp_018 사전조사에서 `d_r`은 참SD **5.20%p**·신뢰도 **0.80**으로, 현재 쓰는
     `d_s`(4.75%p / 0.69)보다 **오히려 강하다.** 무조건부와의 상관도 0.00으로 직교다.
     → `p' = clip(p + β_s·d_s + β_r·d_r)` 2항 보정이 1항보다 나은가.
  ② **투수손 2 미적중 백오프 제거 (순수 손실)** — exp_025 §10-2가 발견했다. 그 34,280행에서
     백오프가 **보정을 안 하느니만 못하다**(세 시드 부호 일치, 전체 환산 −0.24~−0.28점).
     끄기만 하면 되는 손실 제거다.
  ③ **`k400 × self` 대조 (귀속)** — exp_025가 확정 못 한 것. 절제 후 남는 이득 중 투수손 2
     몫(+3.45점)이 리그 타깃이 아니라 k 변경에서 왔다고 보이나 **k만 바꾼 대조가 없다.**
  ④ **k 격자 위쪽 확장** — exp_023/024에서 fold_2024 최소가 격자 경계(k=800)에 있어
     **곡선이 감싸지지 않았다.** ⚠️ 블록 선택면은 k=400에서 **내부 최소**이므로 확장의 근거는
     fold_2024 쪽이고 그건 규율상 선택에 쓸 수 없다 — **선택은 블록에서만** 한다.
base_exp: exp_024 arm B (`k400_league`) = 후보 J·K가 배포한 d

# ---------------------------------------------------------------------------
arms:
  - id: C0
    spec: "k=400 × league (= exp_024 arm B = 후보 J의 d)"
    role: "대조군 · 재현 게이트"
  - id: C1
    spec: "C0 + 투수손 2 **미적중 행**의 백오프 제거 (L을 그 행에만 0으로)"
    role: "순수 손실 제거. ⚠️ exp_025의 B_ph1only와 다르다 — 그건 투수손 2의 **적중 행까지** 껐다"
  - id: C2
    spec: "k=400 × self (하드 백오프)"
    role: "귀속 — C0 − C2 = 수축 대상 변경의 몫, C2 − (k111_self) = k 변경의 몫"
  - id: C3
    spec: "k=1600 × league"
    role: "격자 확장"
  - id: C4
    spec: "k=3200 × league"
    role: "격자 확장"
  - id: C5
    spec: "C0 + d_r 병용: `p + β_s·d_s + β_r·d_r`, d_r도 k=400 × league"
    role: "**주력.** 2항 보정이 1항보다 나은가"
  - id: C6
    spec: "C5와 동일하되 d_r만 k=65 (exp_018 사전조사의 분산분해값)"
    role: "d_r의 최적 k가 d_s와 다를 수 있다"
  - id: C7
    spec: "C1 + C5 (손실 제거 + d_r 병용)"
    role: "둘 다 유효하면 결합. ⚠️ 변인 둘이라 귀속 불가 — 그렇게만 서술"

# ---------------------------------------------------------------------------
d_r_construction:
  what: "`(pitcher_id, batter_hand)`의 **의도 반대 비율** 편차. 성공률이 아니라 실패 '방식'"
  source: >
    `offset.py`의 `DEV_SPEC["d_r"] = "pit_reverse_rate_vs_hand"`. 분자는 복원 라벨의
    marginal reverse(= `is_rev_only + is_both`)이며 `labels.py`로 복원한다.
    **이 경로는 exp_018·exp_019에서 이미 만들어졌고 감사를 거쳤다** — 새로 구현하지 말고 승계하라.
  prior_evidence:
    d_r: {true_sd_pp: 5.20, reliability: 0.80, corr_with_unconditional: 0.00, eb_k_prior: 65}
    d_s: {true_sd_pp: 4.75, reliability: 0.69, corr_with_unconditional: 0.01, eb_k_prior: 111}
    note: "exp_018 사전조사. 전 시즌 풀링이라 낙관치이며 as-of 규율 아래서는 낮아진다"
  joint_beta: >
    β_s와 β_r을 **동시에** 닫힌 해로 적합한다(2×2 정규방정식, 절편 없음).
    d_s와 d_r이 상관되어 있으면 단순히 각각 적합한 것과 다르다 — **둘의 상관을 반드시 보고**하라.
  leak_boundary: >
    복원 라벨은 **타깃 집계 전용**이다. `is_*` 컬럼이 설계행렬에 들어가면 즉시 abort(assert).
    d_r도 d_s와 **동일한 forward-chaining**(시즌 s의 표는 ≤ s−1)을 따른다.

# ---------------------------------------------------------------------------
selection_discipline:
  rule: >
    **선택이 필요한 것은 전부 블록(2022+2023)에서만 고른다.** fold_2024는 선택이 끝난 뒤
    읽는다. exp_023이 확립한 규율이며, 그때 "정직하게 고른 대가"가 2.66995점으로 측정됐다.
  applies_to: "④ k 확장(C3·C4) · ①의 변형 선택(C5 vs C6)"
  not_applies_to: >
    C1(손실 제거)과 C2(귀속)는 **선택이 아니라 사전 등록된 대조**다. 고르는 것이 아니라
    각각의 효과를 재는 것이므로 fold_2024 값을 그대로 보고한다.
  report_both: "블록 선택과 fold_2024 오라클 선택이 다르면 그 격차를 보고하라"

# ---------------------------------------------------------------------------
method:
  no_training: true
  reuse:
    fold_2024: "exp_024 `pred/` — B3 base × 시드 42/7/2024"
    blocks: "exp_024 `pred/` — 블록 2022·2023 × 시드 42/7/2024 (시드 42는 exp_022/023)"
    assert: "규약 #5 — sha256 대조 필수, 불일치 시 중단"
  code_reuse: >
    `experiments/exp_025/src/`(승계 6개 + `fit_ablate.py`)를 출발점으로 하라.
    **`backoff.py`(sha `4169d2dadd8a07dc…`)와 `dev_k.py`(sha `e1cd86dd2795a4d1…`)는
    바이트 보존**하고 sha를 기록하라. 둘 다 leak-auditor가 검증한 코드다.
  float_form: >
    편차는 **전개형** `d = (s − n·overall)/(n + k)`, 리그항은 `L·(k/(n+k))`로 쓴다.
    문자 그대로의 뺄셈형은 미적중에서 `k*x/k ≠ x`로 깨진다(exp_023 첫 발사가 그렇게 죽었다).
  seeds: [42, 7, 2024]

validation:
  primary_metric: "fold_2024 valid_all(R+F) Brier"
  gate: >
    C0가 exp_024 arm B를 재현해야 한다 — seed42 **0.24799968498605615**,
    seed7 **0.24801856644746204**, seed2024 **0.2480065100917605**, 각 abs_diff < 5e-6.
    exp_025는 이 게이트를 **abs_diff 정확히 0.0**으로 통과했다.
  as_of: >
    `train.csv`를 **두 번째로 읽어** `row_id → season` 지도를 따로 만들고 표 기여 행의
    시즌을 재조회하라. **런타임 assert를 근거로 삼지 말 것**(exp_022 감사 지적).
    d_r 표도 동일하게 검증하라 — **새 타깃 파생 집계다.**
  segments: "투수손 1/2 · 적중/미적중 · 셀 표본 수 구간별 (exp_024·025와 같은 형식)"
  adoption: >
    3시드 부호 일치 AND |평균Δ| ≥ 대조군(C0) 시드 std × 3. **완화 금지.**
    paired delta 자체의 std도 참고치로 병기.

runtime:
  where: a5000
  expected_min: 20                          # 15~25
  eta_basis: >
    exp_025 실측 — arm 5 × 시드 3 + 프로브 + 게이트 6 + as-of 재검증 = **계산 0.35분(21초)**,
    총 벽시계 9분. **arm을 2개에서 5개로 늘려도 계산 시간이 안 변했다**(비용은 CSV 로드 8초와
    표 생성 4초에 있다). 이번은 arm 8개 + **d_r 표 신규 생성**(groupby 1회 추가)이라
    계산 1분 미만. 코드 작성(2항 β 동시 적합이 새 코드)·게이트·집계·회수 포함 **15~25분**.

deliverables: [metrics.json, report.md, "src/ (승계분 sha)", "pred_*.npy (채택 후보)"]

audit:
  required: true
  why: >
    **`d_r`은 새 타깃 파생 집계다** — 복원 라벨의 marginal reverse에서 만드는 통계이며
    지금까지 배포된 적이 없다. CLAUDE.md 감사 필요 조건 '타깃 파생 피처 / 새 시계열 집계'에 해당.
    ⚠️ C1~C4는 기존 경로의 파라미터 변경이라 그 자체로는 감사 불요이나, 한 실험에 섞여 있으므로
    **d_r 경로에 초점을 맞춘 감사**를 실험 종료 후 수행한다.
  focus: "d_r 표의 forward-chaining · 복원 라벨의 설계행렬 격리 · 2항 β 동시 적합에 valid 누출 없는지"

risks:
  - "d_r 사전조사(참SD 5.20%p)는 전 시즌 풀링 낙관치다. as-of 아래서는 낮아진다 — exp_018에서 좌우타 축이 그랬다"
  - "d_s와 d_r이 상관되어 있으면 2항 적합의 이득이 1항보다 크지 않을 수 있다. **상관을 반드시 보고**"
  - "arm 8개를 fold_2024에서 보면 선택 편향이 생긴다 → selection_discipline으로 차단"
  - "C7은 변인 둘이라 귀속 불가. '이 조합의 효과'로만 서술"
  - "모든 수치는 로컬 iter 650·≤2023 기준. 배포는 iter 7700·≤2024. 그리고 로컬→LB 전이 비는 축마다 0.06~1.00으로 흩어져 있어 **예측 불가**다"
