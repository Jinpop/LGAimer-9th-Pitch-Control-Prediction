# ⚠️ 미승인 — 사용자 검수 대기 (2026-08-09 작성)
exp_id: exp_038
date: "2026-08-09"
title: "`idea` 2열을 R0에 단독으로 얹고, 두 열을 분해한다"
base_exp: "exp_037 (피처 생성·게이트·arm 레지스트리 전부 승계) · exp_030 (C5_B3 대조군)"

# ---------------------------------------------------------------------------
why: >
  exp_037의 LOO에서 `idea` 2열이 **단일 최대 기여(+12.28771점)**였다. 그런데 그 값은
  "나머지 20열이 다 있을 때 뺀 값"이고, **R0(우리 47열) 위에 단독으로 얹었을 때의 값은
  측정된 적이 없다.**

  그리고 두 열은 **비용 구조가 완전히 다르다** (`arms.py:38`, `featgen.py:206,213`):
    idea_cnt_te        = (balls, strikes) 타깃 인코딩       → 구종 모델 불필요, 사실상 공짜
    idea_matchup_pitch = COMBO[(투수손, 타자손, argmax P)]  → 시즌별 구종 모델 전체 필요
  → **어느 쪽이 일을 하는가**가 배포 비용을 가른다. `idea_cnt_te`가 대부분을 벌면
  22열 파이프라인도 구종 모델도 없이 얻는다. 반대면 파이프라인 전체를 져야 한다.

  ⚠️ **지휘자 정정 기록**: 2026-08-09 지휘자가 "`idea`는 카운트 타깃 인코딩이라 22열
  파이프라인 없이 얻을 수 있다"고 서술했는데 **절반만 맞았다.** 두 열 중 하나만 그렇다.
  이 실험은 그 절반을 분리해 낸다.

# ---------------------------------------------------------------------------
# 🔴 먼저 읽을 것 — 이 실험은 채택될 가능성이 낮다
# ---------------------------------------------------------------------------
honest_prior:
  threshold: >
    채택 문턱은 **R0 시드 σ × 3 = 46.61476점**(exp_037 실측, ddof=1). 22열 전체를 쓴
    최선 arm도 fold_2024에서 **+30.96222점**밖에 못 냈고 1.99265σ로 떨어졌다.
  expectation: >
    `idea` 단독의 fold_2023 값은 **+8 ~ +20점** 범위로 예상된다(계단 +17.53141은 p6·sit
    위에서, LOO +12.28771은 20열 위에서 잰 값이므로 단독값은 그 사이 어딘가일 가능성이
    높으나 **보장은 없다** — `sit`이 순서에 따라 부호까지 뒤집힌 전례가 있다).
    fold_2024 전이비 0.8714를 곱하면 **+7 ~ +17점**. → **문턱의 1/3 이하다.**
  therefore: >
    **이 실험의 산출물은 "채택 판정"이 아니라 "측정"이다.** 성공 기준은 "통과"가 아니라
    "두 열의 값어치를 분리해 냈는가"다. 그 구분을 리포트 첫 줄에 적어라.
  what_would_change_a_verdict: >
    문턱을 넘기려면 **분모**를 손봐야 하는데, 그건 규칙을 결과 보고 바꾸는 게 아니라
    σ 추정을 좁히는 별개 안건(사용자 선택지 ②)이며 **이 실험의 범위가 아니다.**
    ⚠️ 이 실험 결과를 보고 문턱이나 ddof를 바꾸자는 제안을 하지 마라.

# ---------------------------------------------------------------------------
stages:
  A_decompose:
    fold: "fold_2023 (train ≤2022 → valid 2023) · **seed 42** · 자기 조기 종료 · cap 1650"
    arms:
      - "A_idea   = R0 + idea_cnt_te + idea_matchup_pitch → 49열"
      - "A_cnt    = R0 + idea_cnt_te                      → 48열"
      - "A_match  = R0 + idea_matchup_pitch               → 48열"
    control: >
      **R0(47열) fold_2023 seed 42는 재실행하지 않는다.** exp_037이 이미 냈고
      (Brier `0.24867962923638576`) exp_030을 `abs_diff 0.000e+00`으로 재현했다.
      **sha 게이트로 승계**하고 그 사실을 기록하라.
    purpose: "① 단독값 측정 ② 두 열 분해 ③ 승격 arm의 iter 결정"
    caveat: >
      A_cnt + A_match의 Δ 합이 A_idea의 Δ와 같을 이유는 없다. **가법성을 가정하지 말고
      셋을 각각 보고하라.** 차이가 크면 그것이 두 열의 상호작용이다.

  B_promote:
    fold: "fold_2024 (train ≤2023) · **시드 42/7/2024**"
    arm: >
      ⚠️ **승격 arm은 `A_idea`로 사전 고정한다. Stage A 결과를 보고 고르지 않는다.**
      근거: 후보가 하나면 선택이 없고, 선택이 없으면 **선택 대가가 0**이다.
      exp_037은 9개 중 골라 4.56965점을 수축으로 잃었다. 그 대가를 이번엔 치르지 않는다.
      A_cnt·A_match는 **fold_2023 분해 전용**이며 승격 대상이 아니다.
    control: >
      **R0 fold_2024 3시드도 재실행하지 않는다.** exp_037 `res/`의 예측 sha256을
      게이트로 승계한다(0.24803936078925751 / 0.24798335833269680 / 0.24796480043729760,
      평균 0.24799583985308396 = 724.98404). ⚠️ **sha가 하나라도 어긋나면 중단하고 보고하라.**
    iter: "Stage A `A_idea`의 argmin × 스케일. ⚠️ **fold_2024 valid를 보고 정하지 마라**"
    adoption: "3시드 부호 일치 AND |평균Δ| ≥ R0 시드 std × 3 (**ddof=1**). 완화 금지"

# ---------------------------------------------------------------------------
# 🔴 iter 스케일 — exp_037 감사 N1이 지적한 곳
# ---------------------------------------------------------------------------
iter_scale:
  rule: >
    exp_037 `src/aggregate.py:282`가 `"stacker x1.281957"`을 **하드코딩**했는데 실제 값은
    **스태커 1.281968918819595 · 셀 1.281727935**로 서로 다르다. 반올림 iteration은 전부
    같아 수치 영향은 0이었으나 장부가 틀렸다.
  do: >
    이 실험은 **`res`의 `scale_full`/`scale_mode`를 읽어서** 쓴다. 하드코딩 금지.
    `metrics.json`에 **두 스케일을 각각 별도 키로** 적어라. 한 문장에 뭉뚱그리지 마라.

# ---------------------------------------------------------------------------
diagnostics:
  paired_delta_std:
    what: "시드별 (후보 − R0) Δ의 std도 계산해 보고하라"
    why: >
      exp_033에서 이 값(1.98187점)이 대조군 std보다 훨씬 작았다 — 즉 **후보와 대조군이
      같은 방향으로 함께 흔들린다.**
    ⚠️: >
      **이것은 판정 분모가 아니다.** 판정은 규칙대로 **대조군 시드 std**로만 한다.
      진단으로만 적고, 표에서 판정 분모와 나란히 놓지 마라.
  segments: "valid_R / valid_F 분리 보고. exp_037에서 이득이 F에 몰렸으므로 확인 가치가 있다"
  column_importance: "`A_idea` 승격 유닛에서 두 열의 gain 기여를 기록. 분해의 보조 증거"

# ---------------------------------------------------------------------------
method:
  inherit: >
    exp_037 `src/`를 **바이트 승계**한다 — `arms.py`(새 arm 3개만 추가) · `featgen.py` ·
    `b3_cat.py` · `b3_feat.py` · `labels.py` · `exp016_ref.py`. 전부 sha 기록.
  features: >
    ⚠️ **피처를 재생성하지 마라.** 서버 `~/SungjinPark/experiments/exp_037/featdir/`(205M)에
    이미 있고 감사를 통과했다. **parquet sha `312d0ccb…5acd4`를 대조**하고 그대로 쓴다.
    sha가 다르면 중단하고 보고하라.
  offset: "⚠️ 오프셋·캘리브레이션 **미적용**. exp_037과 같은 눈금을 유지한다"
  autonomy: >
    exp_037 `driver.sh` 패턴 그대로 — `setsid nohup` · 멱등 재개(sha 마커) ·
    `PROGRESS.jsonl` · `HEARTBEAT` 30초 · `set -uo pipefail`(`-e` 금지) ·
    유닛 실패해도 다음으로 진행. **에이전트는 단계 순서를 들고 있지 마라.**
  fix_N4: >
    감사 N4 반영 — `featgen.py:209`의 `nan_to_num(P, nan=-1)`을
    `assert not np.isnan(P).any()`로 교체하라. **사문이지만 NaN이 나면 argmax가 조용히
    클래스 0을 고른다.** ⚠️ 이건 변인이므로 `changed_vs`에 등재하라(현재 경로에서 발동
    이력 0건이므로 수치 영향은 없어야 하고, 있으면 그게 발견이다).

# ---------------------------------------------------------------------------
runtime:
  where: a5000
  expected_min: 90                          # 70~110
  eta_basis: >
    - 드라이버 작성 + 승계 sha 대조 + featdir 게이트: **20분**
    - Stage A 3유닛 (fold_2023, 동시 3개): exp_037 Stage B 실측 **19.25~23.71분/유닛**
      → 벽시계 **20~25분**. R0 재실행 없음(승계)
    - Stage B 3유닛 (fold_2024 1,116,277행, 동시 3개): exp_036 실측 **23.48/24.74/26.40분**
      → 벽시계 **26~30분**. R0 3시드 재실행 없음(sha 승계) — exp_037 대비 **6유닛 → 3유닛**
    - 회수 + 집계 + 리포트: **15분**
    → **81~90분, 범위 70~110분.**
  contention: "동시 3개 · fit당 스레드 6 고정. 서버 단독 사용"
  note: "⚠️ 실측이 110분을 넘으면 즉시 갱신 보고하고 원인을 밝힌다"

deliverables: [metrics.json, report.md, "src/ (승계 sha + arms 3개 추가)", "PROGRESS.jsonl", "curves/", "res/"]

# ---------------------------------------------------------------------------
audit:
  required: false
  why: >
    **exp_037이 감사를 통과한 피처를 그대로 재사용한다** — 새 피처 소스·새 조인·
    새 타깃 인코딩·새 시계열 집계가 **없다.** 변경은 ① arm의 열 선택 ② N4 assert 교체뿐이고,
    규약의 감사 생략 조건("이미 감사된 피처 경로 위의 변경")에 해당한다.
  gate_instead: "featdir parquet sha 대조 + R0 승계 sha 대조. **둘 중 하나라도 어긋나면 중단**"
  note: "⚠️ 이 결과가 제출로 가면 **제출 직전 감사는 예외 없이 필요**하다"

# ---------------------------------------------------------------------------
changed_vs_exp_037:
  - "1. arm의 열 집합: 22열 조합 → `idea` 2열 이하 (49/48/48열)"
  - "2. R0 대조군을 **재실행 대신 sha 승계** (fold_2023 seed42 + fold_2024 3시드)"
  - "3. `featgen.py:209` `nan_to_num(P, nan=-1)` → `assert` (감사 N4)"
  - "4. iter 스케일을 하드코딩 대신 `res`에서 읽음 (감사 N1)"
  - "5. 승격 arm이 **사전 고정** — Stage A 결과로 선택하지 않음 (선택 대가 0)"
  - "⚠️ 위 5개가 전부다. 딸려 바뀐 것(시드·라이브러리·행 수)이 생기면 여기에 추가하라"

risks:
  - "⚠️ **문턱을 넘을 가능성이 낮다**(`honest_prior` 참조). 그것은 실패가 아니라 예상된 결과이며, 산출물은 분해 측정이다"
  - "⚠️ **가법성 없음**: A_cnt Δ + A_match Δ ≠ A_idea Δ일 수 있다. 셋을 각각 보고하고 차이를 상호작용으로 서술하라"
  - "⚠️ **순서 의존의 전례**: `sit`은 계단 +7.23383 / LOO −6.01994로 부호가 뒤집혔다. 단독값이 계단·LOO 사이에 있으리라는 보장은 없다"
  - "R0 승계가 sha로 막히면 재실행 비용이 붙는다(+26~30분). 그 경우 중단하고 보고하라 — 임의로 재실행하지 마라"
  - "C5는 미튜닝 첫 시도값이다. 모든 수치는 그 설정 위에서만 유효하다"
