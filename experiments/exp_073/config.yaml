## ══════════════════════════════════════════════════════════════
## 가설 — 우리 모델은 결과만 보고 원인을 안 본다
## ══════════════════════════════════════════════════════════════
왜_이_소스: >
  `data/trackman_history.csv` (1,793,078행 · 2019~2024) 에 물리 계측 8종이 있다 —
  `rel_speed` · `spin_rate` · `induced_vert_break` · `horz_break` · `extension`
  · `rel_height` · `rel_side` · `zone_speed`.
  🔴 **우리 파이프라인은 이 중 어느 것도 쓰지 않는다.** `tagged_pitch_type` 으로 구종 라벨만 뽑아
  `pitchmodel6` 을 만들 뿐이다.
본_가설: >
  **`rel_height`·`rel_side` 의 산포 = 릴리스 포인트 일관성 = 커맨드.**
  릴리스가 흔들리는 투수는 원하는 곳에 못 던진다. 우리가 가진 피처는 전부
  **결과 비율**(성공률·반대율·볼률)이고 **원인 쪽 물리량은 하나도 없다.**
왜_기존_축들이_닫혔는지와_다른가: >
  exp_056(작업량)·exp_059(`sp_*`)가 닫힌 이유는 둘 다 **이미 있는 결과 지표의 더 시끄러운 대리물**
  이었기 때문이다(각 실험의 판정 참조). 이 축은 계열이 다르다 — 그래서 잔차화 검사가 결정적이다.

## ══════════════════════════════════════════════════════════════
## 🔴 stage 0 — 출하 실현 가능성. 스크린 **전에** 한다.
## ══════════════════════════════════════════════════════════════
왜_먼저: >
  BM 이 이 검사를 안 하고 32분을 쓰고 zip 없이 끝났다.
  🔴 **BI·BJ·BK 와 출하 비용이 다르다**: 그 셋은 이미 출하된 값(`ins_p_success` 등)으로
  방향 벡터를 만들어 `blend.json` 한 줄이면 됐다. TrackMan 축은 **새 표 파일**이 패키지에 들어간다.
확인할_것:
  Q1: "투수별 통계표 1개(CSV)를 패키지에 넣고 `script.py` 에서 읽어 행별 방향을 만들 수 있는가. 상이·추가 파일 몇 개가 되는가."
  Q2: "2025 test 행에 붙일 키가 `pitcher_id` 하나로 충분한가(추론 시점에 존재하는가)."
  Q3: "커버리지 — 표에 없는 투수 행 비율. 그 행은 오프셋 **0**(sentinel 금지)."
  Q4: "추론 시간 증가분. 현행 146초 대비."
🔴 정지점: "Q1 이 '아니오'이거나 새 조인·새 상수가 더 필요하면 **스크린을 돌리되 결과에 '출하 불가' 를 명시**하라. 축이 살아도 못 쓰면 그 사실이 결론이다."

## ══════════════════════════════════════════════════════════════
## stage 1 — as-of 집계표
## ══════════════════════════════════════════════════════════════
매핑: >
  🔴 **팀원 571쌍 `pitcher_id_map.csv` 를 정본으로 쓴다**
  (`scratchpad/p6/pitcher_id_map.csv`, sha256 90b8d376c61b3af3753a89ea8f052b19b3ea017c0051fed32bd875eafd82c67d).
  `rebuild_tables.py` 로 종단 검증된 유일한 판이라 Phase 3 소명이 이미 서 있다.
  부수로 우리 685판(`experiments/exp_002/out/pitcher_id_map.csv`)의 커버리지 차이만 기록.
as_of_규율: "🔴 시즌 Y 행의 집계는 **season < Y** 트랙맨 행만. 시즌별 표를 따로 만든다. 위반하면 이 실험 전체가 무효다."
집계_단위: "pitcher_id × (season < Y). 표본수 `tm_n` 도 함께 낸다."

## ══════════════════════════════════════════════════════════════
## stage 2 — 축 목록
## ══════════════════════════════════════════════════════════════
축:
  tm_rel_sd:       "sqrt(var(rel_height) + var(rel_side)) — 릴리스 2D 산포. **본 가설**"
  tm_rel_sd_wp:    "구종 **내** 산포의 투구수 가중평균 — 구종 믹스 효과 제거판"
  tm_speed_trend:  "직전 시즌 mean(rel_speed) − 그 이전 커리어 mean(rel_speed)"
  tm_speed_sd:     "sd(rel_speed)"
  tm_break_sd:     "sqrt(var(induced_vert_break) + var(horz_break))"
  tm_ext_mean:     "mean(extension)"
  tm_spin_mean:    "mean(spin_rate)"
대조군:
  ctrl_asof_psr:   "🔴 BJ 가 이미 LB 로 산 축(−3.0727297301, 꼭지점 +0.0058121). **교정용** — 이게 통과하는 것은 정상이고, '통과 = 흡수 안 됨' 으로 읽지 마라(exp_059 §주의)"
  perm_shuffle:    "투수 라벨 순열. ≈0 이 나와야 스크린이 작동하는 것이다"

## ══════════════════════════════════════════════════════════════
## stage 3 — 스크린 (exp_059 형식 승계)
## ══════════════════════════════════════════════════════════════
방법: "각 축을 중심화·표준화 → 현행 블렌드(BN) tr2024 잔차 `r0` 위에서 `M = mean(δ·r0)`, 투수 블록 부트스트랩 1000회로 t"
사전_등록_문턱: "🔴 **|t| ≥ 2**. 결과를 보고 바꾸지 않는다(S8)."
🔴 잔차화_검사_필수: >
  통과한 축을 **① `ctrl_asof_psr` 에 대해 ② 서로에 대해** 잔차화해 고유 성분의 t 를 다시 낸다.
  근거: exp_059 에서 `sp_pit_bhand_all` 이 t −2.03 으로 통과했다가 ctrl 잔차화 후 **+0.075 로 붕괴**했다(가짜).
  **잔차화 후 t 가 문턱 아래면 그 축은 죽은 것이다.** 원 t 만 보고 후보로 올리지 마라.
쌍상관: "통과 축 간 |r| 를 전부 내라. 0.8 이상이면 같은 축으로 합친다(exp_059 가 `d_form_eb`~`beta_ins_off` ρ 0.857 을 합친 전례)."
🔴 부호: >
  통과 축의 부호는 **프레임 부호 신탁이 1/3 인 계열**이다(S15 — 피처 방향 오프셋).
  방향을 프레임에서 확정했다고 적지 마라. 후보를 만들면 **LB 로 사서 읽는다.**

