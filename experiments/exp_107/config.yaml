exp_id: exp_107
title: "타깃 스무딩 / 자기 증류 — 딥 팔 슬롯 (장부의 마지막 미착수 축)"
date: 2026-08-26
type: 새 팔 (팔 추가 범주, 전이계수 0.574)

동기: |
  `EXPERIMENTS.md:135` 에 2026-08-17 부터 "미착수" 로 남아 있는 축이다. 그날 이렇게 적혔다 —
  "exp_053 타깃 평활/자기 증류가 유일한 미착수 축이며 측정된 신호가 가장 강하다
   (+30.3707 로컬 · std 의 7.35159배 · 부호 3/3, teacher 불필요).
   하이퍼파라미터 변경과 달리 타깃이 다르면 기존 팔들과의 상관이 낮아진다 — 이게 앙상블에 필요한 것이다."
  08-24 딥 팔이 오면서 묻혔고 그대로 잊혔다.

  🔑 우리가 exp_091~104 에서 돌린 39지점은 **전부 손잡이**(폭·깊이·dropout·wd·LR·시드·혼합)였고
  **전부 ρ 를 올렸다**(S72·S100·S103·S161·S162). 타깃을 바꾸는 축은 한 번도 안 했다.

  그때 없던 것 넷이 지금 있다:
    ① 고친 정직면(exp_097)  ② exp_104 하니스와 **실측 잡음**  ③ S103 교환율  ④ 시즌 전진 연쇄 OOF(S106)

축:
  A_라벨_스무딩:    "y → (1-e)·y + e·0.5,  e ∈ {0.02, 0.05, 0.10, 0.20}"
  B_자기_증류:      "y → (1-e)·y + e·p_self.  p_self = 같은 구조 딥 팔의 시즌 전진 연쇄 OOF 예측
                     (`~/SungjinPark/oof_new/stack_fold2024_seed*.npz`, 학습 행마다 out-of-time — S106).
                     🔴 커버리지 81.04%(2019 전 행이 구멍) — 미커버 행은 hard label 로 두고 그 비중을 보고할 것."
  C_혼합:           "A 최선 × B 최선"

  🔴 각 지점은 **자기 argmax 학습량**에서 평가한다(S183) — 고정 스텝에서 비교하면 수렴도 차이를 축의 공으로 읽는다.
  🔴 각 지점의 `w_deep` 도 자유로 둔다(S97: 팔을 바꾸면 꼭지점이 옮겨간다).

🔴 사전 등록 문턱 — 결과를 보고 바꾸지 않는다 (S8):
  이 화면의 잡음은 **추측하지 않는다. exp_104 가 실측했다** (S187):
    짝지은 부트스트랩 se 4.124  ⊕  적합-간 두 점 차 2.157  =  결합 1σ 4.654
  따라서:
    승격 = (혼합 이득 − 기준선) >= +9.31점  AND  t >= 2.0
  ⚠️ 기준선 26.2698 자체가 5뽑기 중 하나이고 평균보다 +0.783 위다(S187).
     **기준선을 서로소 5시드 묶음 3개로 다시 뽑아 평균을 쓰고, 그 사실을 보고에 적어라.**

귀무 대조 (🔴 개수 맞춤 + 둘 이상 — S104·S175·S179):
  N1  "라벨을 (season, 투수) 안에서 순열한 뒤 같은 e 로 스무딩"  → 스무딩의 *형태*만 남고 정보는 없다
  N2  "p_self 를 무작위 치환한 벡터로 대체"                      → 자기 증류의 *타깃 잡음*만 남는다
  N3  "같은 스텝·같은 시드 수의 무변형 복제본"                    → 🔴 사다리 맨 아래 항등 복제본(S135). 이게 없으면 귀속이 안 된다
  판정이 귀무 선택에 따라 뒤집히면 그건 판정이 아니다(S179).

반드시 함께 보고할 것:
  - `ρ(z_mate)` 와 **팔 단독 점수**를 지점마다 (S103 교환율로 예측한 값과 실측을 나란히)
      예측: Δgain ≈ −308.92·Δρ + 0.186·Δalone   (고친 면 재적합판 −289.78 / +0.186 도 병기)
      🔑 **이 축이 값을 하려면 `ρ` 를 내리는 단가가 15.82점보다 싸야 한다.** 그 계산을 명시적으로 내라.
  - 미커버 행 비중(B 축) · 스무딩이 실제로 바꾼 행 비중
  - 출하 가능성: 타깃 변경은 형상을 안 바꾸므로 `mate/deep_infer.py` 수정 0줄이어야 한다. **확인하고 적어라.**

게이트:
  - 기준선 재현: `train104.py` 기본 경로가 `exp097/z_F1632_f64o_s42` 와 **sha256 동일**
  - 면 재현: 배포점 `26.2698` / `baseline_w0_rc 928.501461058684`
  - 🔴 B 축 리크 게이트: `p_self` 가 그 행의 라벨을 안 봤음을 **실행으로** 증명 —
    season >= 2024 라벨을 전량 난수화해도 season-2024 의 `p_self` 가 비트 동일한가 (S171 방법, 양성 대조 포함)

자원: GPU 2장 자유(비어 있음). CPU 6코어 상한 — exp_106 잔여 작업이 돌고 있으니 남겨 둘 것.
ETA: 2~3시간. 근거 — 딥 fit 1건 약 12초(S94), 지점 약 12개 × 시드 5 × 학습량 3~4 ≈ 200 fit.
     ⚠️ exp_106 교훈: 격자·fit 은 예측 가능하나 **면 위 반복 최적화는 fit 당 1~15분**이다. 여기선 격자만 쓴다.
