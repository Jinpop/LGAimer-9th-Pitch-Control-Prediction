# 캠페인 7 — 사용자 선택 2026-08-06 ("iter 정책부터 손보고")
# 세부 설계는 지휘자 판단, 판단 내역을 design_decisions에 명시
exp_id: exp_017
date: "2026-08-06"
hypothesis: >
  P4(직전 fold argmin 무스케일 승계)는 곡선 모양이 fold 간에 비슷할 때만 성립한다.
  B3 스태킹에서 fold_2023 argmin(650)과 fold_2024 argmin(~2400)이 4배 어긋났고
  정책 비용이 15~43e-6(약 13점)에 달한다. 전이가 더 잘 되는 정책이 존재한다.
base_exp: "exp_016 B3"       # fold_2024 valid_all 3시드 평균 0.248208 (P4 iter 650)

# ─────────────────────────────────────────────────────────────
# 지휘자 설계 판단
# ─────────────────────────────────────────────────────────────
design_decisions:

  F1_문제의_정확한_규정:
    내용: >
      13점은 "배포 손실"이 아니다. P4 정책상 최종 제출 모델(≤2024 학습)은 **fold_2024의
      argmin을 승계**하므로(A는 1550, C는 1800이 그렇게 정해졌다) B3 제출 시 iter는 오라클
      근처가 된다. 13점은 **정직한 보고치와 오라클의 간극**이다.
      그럼에도 고칠 이유 두 가지:
        ① 보고치가 눌려 있으면 실험 간 비교가 왜곡된다(B3의 실제 값어치가 과소평가됨)
        ② fold_2023→2024 전이가 4배 어긋난다는 것은 **정책이 이 모델류에서 작동하지 않는다**는 신호이고,
           그렇다면 최종 모델의 iter(fold_2024 argmin 승계)도 2025에서 어긋날 수 있다.
           ②가 진짜 리스크다.

  F2_왜_어긋나는가_진단부터:
    가설_A: "학습량 차이 — fold_2023은 ≤2022(약 87만행), fold_2024는 ≤2023(약 112만행). 비 1.28배로는 4배를 설명 못 함"
    가설_B: >
      **스태킹 고유 문제** — B3의 OOF 스택 피처는 시간순 forward-chaining으로 만들어지므로
      fold_2023에서는 선행 시즌이 적어 스택 열의 품질이 낮고 NaN이 많다(2019는 선행 없어 전부 NaN).
      fold_2024에서는 스택 열이 더 좋아져 **더 많은 라운드를 감당한다.** 이 가설이 맞으면
      최종 모델(≤2024)에서는 스택이 더 좋아져 iter가 더 커야 한다 — 즉 fold_2024 argmin조차 과소일 수 있다.
    검증: "fold별 스택 열의 NaN 비율·OOF 예측 품질(AUC)을 산출해 대조. B0(스태킹 없음)에서도 같은 어긋남이 있는지 확인 — 없으면 가설 B 지지"

  F3_비용_절약_곡선_재사용:
    내용: >
      exp_016 metrics.json에 **안별·fold별 전체 iter 곡선**이 저장돼 있다. 아래 정책 대부분은
      **재학습 없이 곡선 위에서 오프라인 평가**가 가능하다(수 분). 재학습이 필요한 것은 lr 변경안뿐.
      1단계(오프라인) → 2단계(재학습)로 나눠 진행한다.

  F4_평가할_정책:
    P4_argmin: "현행 — 직전 fold valid_all argmin 무스케일 승계 (대조군)"
    P5_flat: "직전 fold 곡선에서 min +ε 이내인 구간의 **중앙값** iter 승계. ε는 {1e-6, 3e-6, 1e-5} 격자. argmin의 표본 노이즈에 덜 민감"
    P6_plateau: "직전 fold 곡선에서 '이후 K라운드 개선폭 < δ'가 처음 성립하는 iter. K∈{200,500}, δ∈{1e-6,3e-6}. 조기 정체 지점을 잡는다"
    P7_scale: "직전 fold argmin × (학습행수 비). exp_006에서 단일 이진 모델로는 기각됐으나 그때는 fold_2023이 F리그 라벨 단절로 왜곡된 상태였다(현재는 마스크 적용). 재검증 가치 있음"
    P8_trend: "**fold_2022·fold_2023 두 argmin의 추세로 fold_2024를 외삽.** 관측 2점이라 선형만 가능하나, 단조 증가 여부만 봐도 정보다"
    P9_lowlr: "lr 0.01 → 0.005로 낮추고 라운드 상한 2배. 곡선을 평탄화해 iter 선택의 민감도 자체를 낮춘다 — 근본 대응. **재학습 필요**"
    선정_근거: >
      P5·P6는 "argmin이 노이즈다"라는 가정, P7·P8은 "최적 iter가 학습량·시간에 따라 체계적으로 이동한다"는 가정,
      P9는 "선택 민감도를 없앤다"는 다른 축이다. 셋 다 다른 원인을 겨냥하므로 함께 본다.

  F5_평가_대상:
    내용: "B3(주 대상)와 B0(대조) 양쪽에 적용. B0에서도 같은 개선이 나오면 스태킹 고유 문제가 아니라 정책 일반의 문제다."
    지표: "각 정책이 고른 iter에서의 fold_2024 valid_all Brier. **정책은 fold_2024를 보지 않고 정해져야 한다** — 오라클은 상한 참조로만 표기."

  F6_판정:
    주지표: "fold_2024 valid_all Brier (정책이 고른 iter에서). 대조군 = P4의 B3 0.248191(seed42) / 0.248208(3시드 평균)"
    시드: "최선 정책은 seed {42,7,2024} 반복. exp_016에서 B3 delta가 시드 산포의 18배였던 것과 대비해 판정"
    필수보고: "각 정책의 선택 iter와 오라클 iter의 거리, 그리고 **오라클 대비 회수율**(정책 비용의 몇 %를 메웠는가)"

  F7_최종모델_함의:
    내용: >
      이 실험의 실질 산출물은 **"B3를 제출한다면 iter를 어떻게 정할 것인가"**의 답이다.
      P4를 따르면 fold_2024 argmin 승계인데, 가설 B가 맞으면 최종 모델(≤2024)의 스택이 더 좋아져
      **fold_2024 argmin조차 과소**일 수 있다. 이 경우의 권고안을 반드시 명시할 것.

validation:
  scheme: rolling-origin
  primary_metric: brier       # fold_2024 valid_all
  report_also: ["정책별 선택 iter·오라클 거리·회수율", "F2 진단 결과", "B0 vs B3 정책 반응 차이", "시드 산포"]

runtime:
  where: a5000
  expected_min: 50            # 1단계 오프라인 ~10분 + 2단계 lr 재학습
