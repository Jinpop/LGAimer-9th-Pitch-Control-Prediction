exp_id: exp_023
date: "2026-08-07"
title: "보정값 d의 구성 — 수축 상수 k × 수축 대상 격자"
hypothesis: >
  β 축은 LB에서 소진됐다(최적 0.4823, 현재 0.541136이 정점 초과, 남은 여지 +0.48점).
  남은 것은 **β가 곱해지는 대상 d를 어떻게 만드느냐**다. d에는 손대지 않은 손잡이가
  둘 있다.
  ① **수축 상수 k = 111** — exp_018이 전 시즌 분산분해로 정한 값이며 그 뒤 한 번도
     흔들어본 적이 없다. β가 로컬에서 과했던 것처럼 k도 어긋나 있을 수 있다.
     k는 β와 겹치지 않는다 — β는 전역 배율이고 k는 **셀 표본 수에 따라 다르게**
     작용한다(저표본 셀만 선택적으로 죽인다).
  ② **수축 대상** — 지금은 그 투수의 무조건부 비율 쪽으로 당긴다. 리그 편차
     `L(투수손, 타자손)` 쪽으로 당기면 미적중 셀이 자동으로 L을 받고 저표본 적중 셀도
     0이 아니라 L 쪽으로 간다. exp_022 BK2가 이 형태이며 로컬 **+15.12052점**으로
     배포된 하드 백오프(BK1f, +9.26423)보다 **+5.85629** 앞섰으나 제출된 적이 없다.
base_exp: exp_022 BK1f (= 배포 후보 H/I의 d 구성) — G0가 대조군이자 재현 게이트

# ---------------------------------------------------------------------------
# 현재 구성 (바꾸려는 대상)
# ---------------------------------------------------------------------------
current_construction:
  formula: |
    overall  = 그 투수의 무조건부 성공률
    shrunk   = (s_cell + k * overall) / (n_cell + k)        # k = 111
    d_s      = shrunk - overall                             # 셀이 비면 정확히 0
    d        = d_s + (셀 미적중) * L(ph, bh)                # 하드 백오프 (후보 H/I)
    p'       = clip(p + beta * d, 1e-6, 1-1e-6)
  k_source: "exp_018 prior_evidence, pit_success_rate_vs_hand → eb_k 111 (전 시즌 분산분해)"
  L_deployed_le2024: {"1|1": -0.0263, "1|2": 0.0212, "2|1": 0.0038, "2|2": -0.0036}
  lb_evidence:
    beta_curve: "3점으로 확정 — β* = 0.48230, 천장 +32.51265, 현재 0.541136에서 +32.02886"
    backoff_transfer_ratio: 1.0021
    beta_transfer_ratio: 0.0564

# ---------------------------------------------------------------------------
# 격자
# ---------------------------------------------------------------------------
grid:
  k: [0, 30, 55, 111, 200, 400, 800]
  shrink_target:
    - id: self
      desc: "그 투수의 무조건부 비율 쪽 (현행) + 미적중 행에 하드 백오프 L"
      formula: "d = (s_cell + k*overall)/(n_cell + k) - overall + (miss)*L"
    - id: league
      desc: "무조건부 + L 쪽 (exp_022 BK2 형태). 미적중이면 자동으로 L, 저표본이면 L 쪽"
      formula: "d = d_s + k*L/(n_cell + k)   [대수적으로 (overall+L) 쪽 수축과 동일]"
  n_arms: 14
  anchors:
    - "k=111 × self  = exp_022 BK1f = 배포 후보 H/I의 d → 재현 게이트"
    - "k=111 × league = exp_022 BK2 (로컬 +15.12052, 미제출)"
  k_zero_note: >
    k=0은 수축 없음(원시 셀 비율 − overall)이다. 저표본 셀에서 요동이 크므로 실패가
    예상되지만 **경계값으로 넣는다** — 곡선의 한쪽 끝을 고정해야 k의 형태를 읽을 수 있다.

# ---------------------------------------------------------------------------
# ★ 선택 규율 — 이 실험의 핵심 설계
# ---------------------------------------------------------------------------
selection_discipline:
  problem: >
    격자를 fold_2024에서 보고 고르면 **valid에 맞춰 고르는 것**이다. exp_022 BK2를
    "valid에서 선택됨, 귀속 불가"로 기록한 것이 정확히 이 사유였다. k 스윕은 같은
    위험을 14배로 키운다.
  rule: >
    **(k, target)은 선행 시즌 블록(2022·2023)에서만 고른다.** β 적합과 같은 규율이다.
    fold_2024는 **선택이 끝난 뒤 단 한 번** 읽는다.
  procedure:
    - "1) 각 (k, target)에 대해 블록 2022·2023에서 d를 만들고 β를 닫힌 해로 적합"
    - "2) 그 블록에서의 Brier 개선으로 **argmin (k, target)을 선택**"
    - "3) 선택된 조합 하나만 fold_2024에서 평가 — 이것이 헤드라인 수치"
    - "4) 전체 격자의 fold_2024 값도 산출하되 **진단용**으로만 보고. 오라클 β와 같은 지위 — 채택 판단에 쓰지 말 것"
  report_both: >
    블록 선택값과 fold_2024 오라클 선택값이 **다르면 그 사실 자체를 보고**하라.
    다르다면 "블록으로 고르는 것이 얼마나 손해인가"가 측정된다(β의 전이 효율 97%와
    같은 성격의 수치).

# ---------------------------------------------------------------------------
method:
  base_predictions:
    reuse: true
    fold_2024: "~/SungjinPark/experiments/exp_020/pred/pred_E0_B3_P4iter_seed42_fold_2024.npy"
    blocks: "~/SungjinPark/experiments/exp_022/pred/pred_B3_block_{2022,2023}_seed42.npy"
    why: "학습 불필요. 고정된 예측 위에 d만 바꿔 얹는 짝지은 비교라 base 시드 잡음이 차분에서 소거된다"
    sha_assert: "규약 #5 — 재사용 전 sha256 대조 필수, 불일치 시 중단"
  table_rebuild: >
    k를 바꾸면 수축표를 다시 만들어야 한다. 이는 groupby 재계산(초 단위)이지 학습이
    아니다. as-of 규율은 기존과 동일 — 시즌 s의 표는 시즌 ≤ s−1만 사용.
  beta: "arm마다 닫힌 해로 재적합. β는 변인이 아니라 각 d 분포에 대한 종속 산출값 — report에 명시"
  code_reuse: >
    `experiments/exp_022/src/{backoff.py, offset.py, fit_offset.py}`를 승계하고 k를
    파라미터로 노출하는 최소 수정만 한다. **리그표 산출 로직은 leak-auditor가 독립
    재계산으로 검증한 코드이므로 바이트 보존**하고 sha를 기록하라.

validation:
  primary_metric: "fold_2024 valid_all(R+F) Brier — 단, 선택이 끝난 조합에 대해서만"
  secondary: [valid_R, valid_F, "미적중/적중 세그먼트 분해", "저n/고n 셀 분해"]
  gate: "k=111 × self가 exp_022 BK1f를 재현해야 한다 — fold_2024 Brier 0.248037745와 abs_diff < 5e-6"
  seed: "42 단독. exp_022와 같은 사유 — 짝지은 비교라 base 시드 잡음이 소거되고, 3시드 문턱(3.37e-05)은 이 크기대에 검출력이 없다"

# ---------------------------------------------------------------------------
runtime:
  where: a5000
  expected_min: 30                          # 25~35
  eta_basis: >
    실측표 exp_022(같은 기계, 4 arm) = 계산 4.29분 / 벽시계 약 20분. 이번은 arm이
    14개이나 **블록 재생성이 불필요**하다(exp_022가 이미 저장했다 — 그때 ETA를 넘긴
    원인이 제거됐다). arm당 표 재구축 groupby + 닫힌 해 β + 평가 = 초~십수 초 단위.
    계산 8~12분 + 코드 수정·검증·집계 → 벽시계 25~35분.

deliverables:
  - metrics.json      # 격자 전체(블록 선택값 + fold_2024 진단값) + 선택 결과 + 세그먼트 분해
  - report.md
  - src/  (exp_022 승계분 sha 기록 포함)
  - "pred_*.npy (선택 조합)"

audit:
  required: false
  why: >
    새 데이터 소스·새 조인·새 타깃 파생 없음. 이미 감사된 exp_022 경로의 **파라미터
    변경**이며 리그표 산출 로직은 바이트 보존한다. CLAUDE.md 생략 조건에 해당.
  note: "제출로 갈 때는 예외 없이 감사. 특히 k가 바뀌면 수축표가 바뀌므로 배포 표를 새로 만들게 된다"

risks:
  - "k와 β가 부분적으로 상충한다 — k를 낮추면 d가 커지고 β 적합값이 따라 내려간다. 순효과만 읽을 것"
  - "격자 14개를 valid에서 보면 선택 편향이 생긴다 → 위 selection_discipline으로 차단"
  - "league 대상은 불안정한 투수손 2 셀(빈티지별 부호 뒤집힘)을 적중 행까지 퍼뜨린다. 로컬이 좋아도 이 위험은 남는다 — report에 반드시 병기"
  - "로컬 측정 iter 650 ≠ 배포 iter 7700. 모든 수치에 이 단서를 병기"

# ---------------------------------------------------------------------------
# 이 실험이 다루지 않는 열린 축 (사용자 지시 2026-08-07 — 끝나고 진행)
# ---------------------------------------------------------------------------
open_axes_deferred:
  - id: "③ d_r 병용"
    what: "`p + β_s·d_s + β_r·d_r` — 의도 반대 비율의 편차를 함께 사용"
    status: "`offset.py`의 DEV_SPEC에 `d_r`이 이미 구현돼 있으나 배포된 적이 없다"
    prior: "exp_018 사전조사 참SD 5.20%p·신뢰도 0.80, 무조건부와 상관 0.00 — d_s(4.75%p/0.69)보다 오히려 강하다"
  - id: "④ 다른 조건 축"
    what: "접전·이닝 깊이·불리한 카운트·홈원정·주자 유무를 조건으로 한 편차"
    status: "지휘자 사전조사 완료(2026-08-07, `analysis/`) — 각 참SD 1.2~2.3%p로 좌우타(4.75~5.20)의 절반"
    prior: "축끼리 상관 평균 0.116으로 거의 직교 → 다섯을 합치면 참SD 약 4.8%p로 좌우타와 맞먹으나 신뢰도가 0.22~0.37로 낮다"
  - id: "⑤ 로짓 공간 보정"
    what: "`p' = sigmoid(logit(p) + γ·d)` — 확률 공간 덧셈 대신"
    status: "`offset.py`에 `apply_logit`·`fit_gamma`가 이미 구현돼 있으나 배포된 적이 없다"
    prior: "현재 확률 범위 [0.29, 0.68]이라 경계 문제는 없다. 같은 d라도 확률 수준에 따라 다르게 작용하는 것이 차이"
  note: >
    **이 세 축을 EXPERIMENTS.md의 ⏳ 판정 유보/미착수 표로 옮길 것** (다음 recorder 실행 시).
    지금은 exp_021 LB 기록 작업이 대장을 잡고 있어 충돌을 피해 여기 적어둔다.
