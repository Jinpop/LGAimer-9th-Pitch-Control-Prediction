# 사용자 승인 완료 (2026-08-13, "둘 다 해봐") — 발사
exp_id: exp_046
date: "2026-08-13"
title: "시즌-내 폼 분해 — `asof` 커리어 누적을 당해 시즌분과 그 이전으로 가른다"
base_exp: "exp_030 (C5_B3 base·fold 정의·마스크) · exp_033 (fold_2024 저장 예측) · exp_024/exp_029 (오프셋 기계·k 격자 절차)"

# ---------------------------------------------------------------------------
# 🔴 이 실험이 사는 것 — 2025 정보가 합법적으로 들어오는 유일한 통로
# ---------------------------------------------------------------------------
discovery: >
  `asof_pitcher_n`은 **커리어 누적**이고(투수 20700: 2019 max 665 → 2020 min 666, 실측)
  `asof_pitcher_success_rate`는 소수 6자리라 `round(n × rate)`로 **누적 성공수가 정확히 복원**된다
  (train 1,475,092행 실측: 반올림 잔차 최대 0.0076).
  공개 test 5행에서 확인: 투수 21813은 train 끝 n=3084 → test 행 n=3465, 즉 **2025분 381구**가
  그 행의 `asof` 안에 들어 있다.

hypothesis: >
  현재 모델이 보는 `asof_pitcher_success_rate`는 **커리어 평균**이라 당해 시즌 성적이 극도로 희석된다.
  투수 21813의 경우 2025분 381구는 3,465구 중 **11%** 가중치뿐이다.
  → "원래 0.4895인 투수"와 "커리어 0.482인데 2025에 0.55로 던지는 투수"가 **모델 눈에 같은 값**이다.
  현재 행의 `n`·`rate`와 **train 유래 동결표**(투수별 직전 시즌말 `n`·성공수)만으로 둘을 가를 수 있다.
  **트리는 이걸 스스로 못 한다** — 투수별 상수 룩업이 필요한데 `pitcher_id`가 수치형이라 불가능하다.

# 🔴 규칙 2-4 준수 — 설계의 핵심이며 감사관이 가장 먼저 볼 곳
rule_2_4_compliance:
  what_each_test_row_uses:
    - "그 행 자신의 `asof_pitcher_n`·`asof_pitcher_success_rate`·`pitcher_id` (행 내 제공 컬럼)"
    - "train.csv에서만 만든 **동결 룩업표** (투수별 직전 시즌말 누적 n·성공수)"
  what_it_never_uses:
    - "test의 다른 행 — 일절 없다"
    - "test 프레임의 평균·분포·순서·빈도 — 일절 없다"
  structural_note: >
    이것은 **우리 오프셋 기계와 정확히 같은 구조**다(train 동결표 + 현재 행 산술).
    그 구조는 후보 F·H·I·J·K·M에서 감사·게이트를 반복 통과했다.
  ⚠️_금지_확인: >
    🔴 같은 컬럼으로 **다른 test 행을 참조하면 라벨이 복원된다**(train 실측: 99.893% 행, 정확도 100.0%).
    **그것은 규칙 2-4 위반이자 실격이며 이 실험은 하지 않는다.**
    본 설계는 **행 자신의 값만** 읽는다. 감사관은 `groupby`·`sort`·`shift`가 test 경로에
    존재하지 않음을 확인할 것.

# ---------------------------------------------------------------------------
# 피처 정의 — train과 test에서 뜻이 같아야 한다
# ---------------------------------------------------------------------------
feature_spec:
  frozen_tables: >
    시즌 경계마다 하나씩. 시즌 S의 행은 **S−1 시즌말** 표를 쓴다.
    표 = 투수별 `(n_end, S_end)`: 그 투수의 ≤S−1 마지막 행에서
    `n_end = asof_pitcher_n + 1`, `S_end = round(asof_pitcher_n × rate) + control_success`.
    ⚠️ **train 라벨을 쓴다** → 타깃 파생이므로 감사 대상. (오프셋 `d_s` 표와 같은 성격)
  per_row:
    - "S_career = round(asof_pitcher_n × asof_pitcher_success_rate)"
    - "n_season = asof_pitcher_n − n_end[pitcher]        # 당해 시즌 지금까지 투구수"
    - "S_season = S_career − S_end[pitcher]"
    - "rate_season = S_season / n_season                 # n_season > 0 일 때만"
    - "rate_prior  = S_end / n_end                       # 직전 시즌말 커리어 평균"
    - "d_form = rate_season − rate_prior                 # ★ 당해 시즌 폼 편차"
    - "d_form_eb = d_form × n_season / (n_season + k)    # EB 수축"
  new_columns: ["n_season", "rate_season", "d_form_eb", "has_form"]
  missing_policy: >
    🔴 sentinel 금지(CLAUDE.md). `n_season = 0`(시즌 첫 투구)이면 `rate_season`·`d_form_eb`는
    **NaN**으로 두고 `has_form = 0` 플래그를 별도 컬럼으로 준다.
    신인(`n_end = 0`)은 `rate_prior`가 없으므로 `d_form_eb = NaN`, `has_form = 0`.
    단 `rate_season`은 정의되므로 그 컬럼은 채운다 — **콜드스타트가 자동 해결되는 지점이다.**
  fold_parallelism: >
    fold_2024(train ≤2023 → valid 2024)에서 valid 행은 **2023말 표**를 쓴다.
    배포(train ≤2024 → test 2025)에서 test 행은 **2024말 표**를 쓴다. **구조가 대칭이다.**

# ---------------------------------------------------------------------------
# STAGE 1 — 진단 (학습 0건). 여기서 크기가 안 나오면 중단한다
# ---------------------------------------------------------------------------
stage1_diagnostic:
  🔴_무결성_게이트:                       # 하나라도 깨지면 stage 2로 가지 않는다
    G1: "모든 행에서 `0 ≤ S_season ≤ n_season`. 위반 행 수를 보고할 것 (기대 0)"
    G2: >
      **결정적 검사** — train 2024 행은 라벨이 있으므로 `rate_season`을 라벨에서 직접
      누적 계산할 수 있다. 분해값과 직접계산값이 **전 행 일치**해야 한다.
      불일치 행 수와 최대 절대차를 보고할 것 (기대 0행 / 0.0)
    G3: "`n_season`이 시즌 내에서 단조 증가하는지(투수별). 위반 시 `asof` 누적 가정이 깨진 것"
  측정할_것:
    - "커버리지: `has_form = 1` 행 비율 (fold_2024 valid 2024 기준). 세그먼트(R/F)별로도"
    - "`n_season` 분포 — 시즌 초반 행이 얼마나 얇은지가 EB k 선택의 근거"
    - "`d_form`의 **참SD** — 표본잡음 제거 후 투수 간 진짜 산포 (exp_018 절차 재사용)"
    - "★ **희석계수**: `d_form`이 기존 `asof_pitcher_success_rate`에 이미 얼마나 반영돼 있는가.
       `corr(d_form_eb, asof_pitcher_success_rate)`와 회귀계수. **이 값이 작을수록 증분 정보가 크다**"
    - "`d_form_eb` 구간별 실제 성공률 — 신호가 단조인지, 크기가 얼마인지"
    - "★ **이득 추정**: 검증된 공식 `이득(점) = 400309 × (확률공간 보정폭 sd)²`에 넣어 상한을 낸다.
       ⚠️ 이것은 **상한이지 배포 기대값이 아니다**(exp_042→후보 Z에서 확인된 규율)"
  중단_기준:                              # 🔴 값 보기 전 등록
    - "G1·G2·G3 중 하나라도 실패 → **중단**. 분해가 틀린 것이므로 stage 2 무의미"
    - "커버리지 < 50% → **중단**하고 보고. 오프셋 백오프로 갈 수 있으나 별건으로 설계"
    - "추정 이득 < 30점(팔 기준) → stage 2 보류하고 사용자 판단 요청"
    - "위 셋 다 통과 → stage 2 진행"
  eta: "20~30분 (학습 0건, 1.47M행 groupby·조인 위주)"

# ---------------------------------------------------------------------------
# STAGE 2 — 투입 형태 두 가지를 함께 잰다 (우리 이력이 이걸 요구한다)
# ---------------------------------------------------------------------------
stage2_arms:
  왜_두_형태인가: >
    🔴 **같은 정보인데 투입 형태가 판정을 뒤집은 전례가 있다** — 좌우타 조건부 성향은
    트리 피처(exp_018 A1)로는 2.42배로 **미달**이었는데 2단 오프셋(exp_019 C1)으로는
    9.48배로 **채택**됐다. 기전은 미검증이나 관측은 실재하므로 두 형태를 함께 잰다.
  arms:
    R0: "대조군 = exp_030 C5_B3 (47열, 무보정). 저장 예측 재사용 — 재학습 없음"
    A1: "트리 피처 형태 — 47열 + `n_season`·`rate_season`·`d_form_eb`·`has_form` = 51열"
    A2: "2단 오프셋 형태 — R0 예측 위에 `p' = clip(p + β_f · d_form_eb)`. 학습 0건"
    A3: "결합 — A1 위에 기존 오프셋 기계(`S400_league` d) 재적합. **A1이 통과할 때만**"
  seeds: [42, 7, 2024]
  k_grid: [100, 200, 400, 800, 1600]
  🔴_선택_규율: >
    **k와 β_f는 선행 블록(2022+2023)에서만 고른다. fold_2024는 고른 뒤에 읽는다.**
    exp_023이 정직하게 골라 −2.66995점을 물었고 exp_029가 −2.49173점을 물었다.
    그 대가를 이번에도 **측정해 보고**한다(fold 오라클 대비 격차).
  eta: "60~90분 (exp_030 실측 유닛표: C5_B3 fold_2024 유닛 3시드 동시 3개, 경합 1.2~1.5배)"

# ---------------------------------------------------------------------------
# 판정 — 🔴 값을 보기 전에 못 박는다
# ---------------------------------------------------------------------------
pre_registered_decision_rule:
  sigma_score: 8.55113                    # exp_044에서 잰 새 σ (n=9, ddof=1)
  threshold_3sigma: 25.65339              # 🔴 exp_045부터 적용되는 문턱, 이 실험도 여기
  rule: "3시드 **전부 부호 일치** AND |평균Δ| ≥ 25.65339점 → 채택"
  ⚠️: >
    🔴 **판정 후 σ·ddof를 바꾸지 않는다.** 분자를 본 뒤 분모를 고르는 것이
    exp_033/exp_036 ddof 사고의 본질이었다.
  블렌드_세금_주의: >
    🔴 **팔 기준 Δ를 블렌드 기대값으로 인용하지 마라.** 후보 AC 실측 전달률은
    잡음감소형 개선에서 **0.068**이었다. 새 신호는 상관을 덜 올리므로 약 **0.5**로 보나
    **그것도 추정이다**. 리포트는 **팔 기준 Δ만** 단정하고 블렌드 기대는 범위로 적는다.

# ---------------------------------------------------------------------------
# 변경 변인 — 대조군 대비 바뀐 것 전부 (CLAUDE.md 규율)
# ---------------------------------------------------------------------------
changed_vs_control:
  A1: ["입력 47열 → 51열", "(불가피) 셀·스태커 argmin 재산출 — 51열에는 exp_030 iter가 없다"]
  A2: ["예측 후처리 1항 추가 (부스터 불변)", "β_f 신규 적합"]
  ⚠️: >
    **A1의 iter 재산출은 피할 수 없는 딸림 변인이다** — 후보 S에서 이걸 계획 단계에 빠뜨려
    LB delta를 귀속 못 한 사고가 있었다(감사 N4). **미리 등록한다.**
    A1이 통과하면 "51열 + 자기 iter 조합의 효과"로만 서술한다.

# ---------------------------------------------------------------------------
# 감사 — 필수 (새 피처 경로 + 타깃 파생 + 새 조인)
# ---------------------------------------------------------------------------
audit:
  required: true
  focus:
    - "동결표가 **train 라벨**을 쓴다 — as-of 규율 위반이 없는지 (시즌 경계 밖 정보 유입 여부)"
    - "🔴 test 경로에 `groupby`/`sort`/`shift`/`cumsum`이 **없는지** — 있으면 규칙 2-4 위반 표면"
    - "fold_2024 valid 행의 표가 **2023말**인지 (2024 정보 유입 = 리크)"
    - "`round()`의 짝수 반올림이 `S_career` 복원을 흔드는지 (exp_044에서 실제로 사고가 났던 함수)"
    - "결측 처리에 sentinel이 섞이지 않았는지"

server: "A5000 (server.yaml), fit당 threads 6, 동시 3개 상한"
