exp_id: exp_095
title: 딥 팔 가중 기하 2자유도 + 배포 경로에서 버려지는 중간값 전수 조사
date: 2026-08-25
surface: 정직면(OOT-2024) — 전 팔 ≤2023 학습, 기준선 928.501461058684 (abs_diff 0.0 재현 필수)
학습: 없음. 전부 기존 산출물 위의 읽기 전용 계산이다.

동기:
  - CE 가 딥 학습량 축의 argmax 에 착륙했다(배포 2160 = OOT 1632, 데이터비 1.324).
    그 축은 소진이다. 그러나 w_deep 은 팀원의 720스텝 팔 꼭지점(0.14 부근)에 맞춰진 0.20 그대로다.
    exp_090 정직면: 1632 팔의 최적 w 는 0.36, w=0.20 이득 11.050 vs argmax 이득 13.714 → 정직면 잔여 +2.664.
  - 그리고 '안쪽 w_deep 을 올린다' 와 '딥에 바깥 슬롯을 준다' 는 같은 방향이 아니다.
    배포 산술은 z = c_mate*[(1-w)*z_mate + w*z_deep] + c_aa*z_aa + c_T70*z_T70 이라
    w 를 올리면 딥 계수 c_mate*w 가 오르는 만큼 z_mate 계수 c_mate*(1-w) 가 깎인다.
    바깥 슬롯은 z_mate 를 안 깎고 딥만 올린다. 2자유도 면에서 어디가 꼭지점인지 아무도 안 쟀다.
  - S55: 새 신호를 못 만든다는 판정과 이미 있는 신호를 못 꺼낸다는 판정은 다르다.
    팀원의 +2.6766924977 은 스태커 입력으로 이미 계산되던 Q 셀 4개를 꺼내 쓴 것이었다.
    같은 조사를 배포 경로 전체에 한 번도 안 돌렸다.

stage1_딥_가중_기하_2자유도:
  목적: (w_inner, v_outer) 평면에서 정직면 이득의 꼭지점을 찾고, 현 출하점 (0.20, 0)에서의 잔여를 잰다.
  면: z(w,v) = alpha_free * [ c_mate*((1-w)*z_mate + w*z_deep) + c_aa*z_aa + c_T70*z_T70 + v*z_deep ]
      - alpha 는 자유롭게 둔다(S25·S33: 척도 몫을 이득으로 오독하지 않기 위해). sd 맞춤 이득도 병기한다.
      - c_mate·c_aa·c_T70 은 배포값 고정. 재적합하지 않는다(그건 다른 축이다).
  격자: w ∈ {0.00,0.02,...,0.50} × v ∈ {0.00,0.02,...,0.30} — 26×16
  팔 벡터: exp_090 OOT 1632 5시드 평균 z_deep 재사용(sha 대조 후). 나머지 팔은 exp_089/090 이 쓴 것 그대로.
  보고: 각 격자점 이득 · argmax(w,v) · 출하점 (0.20,0) 이득 · 잔여 Δ
        · 짝지은 투수 블록 부트스트랩 t · jackknife se · sd 맞춤 이득
        · 1자유도 단면 두 개(v=0 고정 w 곡선 / w=0.20 고정 v 곡선)와 2자유도 argmax 의 차이
  중요: exp_090 의 abd 곡선(w 단독, v=0)을 이 코드로 재현해 11.050282/13.714310 과 맞는지 먼저 확인한다.
        안 맞으면 stage1 은 무효다.

stage2_배포_경로_중간값_전수_조사:
  목적: 배포 script.py 가 계산해 놓고 최종 로짓에 안 싣는 per-row 벡터를 전부 열거하고,
        각각이 정직면 잔차와 얼마나 상관되는지 잰다. (S55 재현 시도)
  절차:
    a) submit_CF_3axis.zip 의 mate/script.py · v6_infer.py · q_infer.py · aa_infer.py · deep_infer.py 를
       읽어 '계산되고 최종 z 에 안 들어가는 per-row 배열' 을 전수 열거한다.
       후보로 이미 아는 것: Q 셀 확률 5개 중 팀원 b 축이 안 쓴 것 · v6 내부 4팔의 개별 로짓
       · 딥 팔 3개 은닉층 활성 · 스태커 입력 열 · 백오프 미적중 표시자 · ins_p_n 등 폼 카운트.
       🔴 열거는 코드에서 한다. 기억이나 문서로 하지 않는다(G-LEDGER).
    b) 각 후보 벡터 x 에 대해 정직면에서 오프셋 축 하나를 만들고(중심화·표준화 후 z += s*x_std)
       꼭지점 이득 K*L^2/G 와 t 를 낸다.
    c) 🔴 귀무 대조 필수(S104): 같은 개수의 무작위 방향(정직면 잔차와 무관하게 생성)을 같은 절차로 돌린다.
       이름 붙인 후보가 무작위 대조를 못 이기면 그 후보는 없는 것이다.
    d) 🔴 정직면 부풀림 경고를 그대로 안고 보고한다: S54(실패유형 계열 19.4배)·S78(0.0184).
       크기는 믿지 말고 순위와 부호만 쓴다. LB 로 눈금 잡힌 축(딥 학습량 전이비 0.478)과의 상대 환산을 병기한다.
  보고: 후보 목록(코드 위치 포함) · 각 t · 무작위 귀무 분포의 상위 5% 지점 · 그것을 넘은 후보만 채택 후보로 표시

사전_등록_문턱:
  stage1: 2자유도 argmax 이득 − 출하점 (0.20,0) 이득 ≥ 2.0 이고 짝지은 부트스트랩 t ≥ 2.0 이면
          '출하 가치 있음'. 둘 중 하나라도 미달이면 기각하고 w_deep 을 건드리지 않는다.
  stage2: 무작위 귀무 200개의 상위 5% 지점을 넘는 후보만 보고. 안 넘으면 '없음' 으로 적는다.
  🔴 이 문턱은 결과를 보고 바꾸지 않는다(S8).

