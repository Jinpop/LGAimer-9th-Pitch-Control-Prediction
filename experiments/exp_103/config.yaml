exp_id: exp_103
title: "타자 폼 계열 — 구조적 공백을 메운다 (신호 선별 → 출하형 측정)"
date: 2026-08-26
owner: orchestrator
training: 있음 (GPU CatBoost 선별 + 딥/AA 팔 재적합)

배경:
  구조적_공백_실측: |
    test 원본 48열의 as-of 집계가 **투수·타자 비대칭**이다:
    - **투수 15열**: `asof_pitcher_n` · success/reverse/middle/ball/strike_rate ·
      **`prev1/3/5_game_success_rate`** · **`prev1/3/5_game_middle_rate`** · pitchmix 4
    - **타자 3열**: `asof_batter_n` · `asof_batter_success_rate` · `asof_batter_middle_rate` **뿐**
    우리 98열이 보탠 것도 **타자 2열**(`sp_bat_phand` 계열)뿐인데, **맞대결은 5열이나 팠다**
    (`idea_matchup_pitch`·`r2_pb_rev`·`r2_vs_cnt`·`r2_vs_te48`·`r2_sit_vs_te`).
    → **"타자가 최근 어떤 상태인가"가 통째로 비어 있다.**
  기전_가설: "잘 맞히는 타자에게 투수가 더 조심스럽게 던져 존을 벗어나는 공이 늘어난다. ⚠️ 야구 추론이고 우리가 검증할 대상이다."
  🔴_역풍_정직하게: |
    팀 원장은 **팔 손질(피처) 전이 10~16%** 로 적었다 — 로컬 +20 이어야 LB +2~3.
    다만 원장이 판 것은 용량·시드·기존 열 재배치이고 **이 계열을 팠는지는 불명**이다.
    그리고 **새 팔 추가는 57%** 다 — 확장 피처 위에 새 팔을 세우면 그쪽 계수가 붙는다.

# ─────────────────────────────────────────────────────────────
stage0_전제_검증:      # 🔴 여기서 깨지면 나머지가 전부 무의미하다
  0a_행_순서: |
    🔴 **`train.csv` 의 행 순서가 시간순인지 먼저 증명하라.** `game_id` 도 날짜도 없다.
    검사: `(season, pitcher_id)` 안에서 `asof_pitcher_n` 이 **단조 비감소**인가.
    `(season, batter_id)` 안에서 `asof_batter_n` 도 같은지. 위반 행 수를 세라.
    **위반이 있으면 그 비율을 보고하고, 5% 를 넘으면 실험을 중단하라** — 창 집계의 전제가 무너진다.
  0b_운영진_집계_역설계: |
    `asof_batter_success_rate` 가 **정확히 무엇의 평균인지** 역설계하라 — 시즌 내 누적인가 통산인가,
    분모가 무엇인가. 우리 창 집계가 그것과 **중복**이면 새 정보가 아니다.
    검사: 우리가 같은 정의로 재현했을 때 원본과 일치하는가(일치하면 정의를 안 것이고, 그 위에서 *창*만 달리한다).
  0c_리크_설계: |
    🔴 **현재 행의 라벨이 자기 피처에 절대 들어가면 안 된다.** 모든 창은 엄격 shift(1).
    배포는 **≤2024 동결표를 2025 행에 키로 붙이는 것**(`lookup_d` 와 같은 기전, 이미 감사 통과 경로).
    측정용 OOT 는 **≤2023 표 → 2024 행**.
  중단조건: "0a 위반 5% 초과 또는 0b 에서 완전 중복 판정 → 즉시 보고하고 중단."

# ─────────────────────────────────────────────────────────────
stage1_신호_선별:      # 값싸고 빠르다. 여기서 죽으면 stage2 없음.
  피처_설계: |
    투수 쪽에 있는 것을 타자 쪽에 대칭으로 만든다. 경기 경계가 없으므로 **직전 K개 투구 창**을 쓴다:
    - `bat_prevK_success_rate` (K ∈ {20, 50, 100, 200}) — 투수의 prev1/3/5경기에 대응
    - `bat_form_dev_K` = 창 rate − 통산 rate (**폼 = 기준선 대비 편차**)
    - `bat_prevK_n` (창 커버리지 — 표본 부족 행 표시)
    - `bat_phand_split_eb` — 타자 × 투수손 EB 수축 rate (기존 `sp_bat_phand` 와 중복 확인 필수)
    - `bat_count_state_rate` — 타자 × (balls, strikes) 상태별 rate, EB 수축
    🔴 **결측을 sentinel 로 채우지 마라** — 창이 안 차는 행은 **별도 결측 플래그 열**로.
  선별_방법: |
    **GPU CatBoost**(S124: CPU 대비 20배)로 ≤2023 학습 → 2024 평가. 세 판본:
    ① 기준선 (현 열) ② 기준선 + 타자 폼 열 ③ **개수 맞춤 귀무** — 같은 개수의
    **타자 열을 batter_id 안에서 순열**한 판본(값 분포는 같고 행 연결만 끊는다).
    🔴 **③이 없으면 판정이 성립하지 않는다**(S104: 이름 붙인 계열 제거가 무작위 제거보다 나빴던 전례).
  🔴_사전등록_문턱:
    - "②가 ①을 이기고 **동시에** ③을 이긴다 — 둘 다 짝지은 투수 블록 부트스트랩 **t ≥ 2.0**"
    - "결과를 보고 바꾸지 않는다(S8)"
  보고: "열별 중요도·②−③ 차이·어느 K 가 사는지. 그리고 기존 열과의 상관(중복 진단)."

# ─────────────────────────────────────────────────────────────
stage2_출하형_측정:    # stage1 통과 시에만
  두_갈래를_다_재라:
    A_기존팔_손질: "AA 팔(CatBoost, 형상 제약 없음)에 열을 추가. 전이 10~16% 예상."
    B_새팔_추가: |
      확장 피처 위에 **새 딥 팔**을 세워 3자유도 혼합(`(1−w−w2)z_mate + w·z_deep + w2·z_new`).
      🔴 **`mate/deep_infer.py` 가 `W0.reshape(256, 99, 96)` 로 입력 차원 99 를 하드코딩한다**(S101) —
      열이 늘면 그 파일을 고쳐야 한다. **고칠 수 있는지 먼저 확인하고 비용을 적어라.**
      전이 57% 예상이라 이쪽이 크다.
  면: "정직면 OOT. 🔴 exp_097 이 고친 f64 입력. 기준선 **26.2698**(2팔 최적, 1632스텝 w=0.43)."
  🔴_사전등록_문턱: "혼합 이득 − 26.2698 ≥ **+2.0** **그리고** 짝지은 투수 블록 부트스트랩 **t ≥ 2.0**"
  ⚠️: "ρ 로 판정하지 마라(S83). S103 회귀 잔차는 진단으로만."

🔴_감사:
  - "이 실험은 **새 피처 소스**다 — CLAUDE.md §5 위험 표면 기준으로 **leak-auditor 필수**다. 생략 불가."
  - "출하 후보로 갈 경우 그 전에 감사를 걸고, 실험 단계에서도 stage1 통과 시 리크 설계를 감사받아라."

자원_규율:
  - "🔴 파일 삭제 0건 · 외부 프로세스 kill 0건."
  - "🔴 CPU 4코어 상한 — 같은 서버에서 후보 CR 빌드가 게이트를 돌린다. **GPU 2장은 자유롭게**(GPU CatBoost 가 이 실험의 주력이다)."
  - "단독 추론 시간 측정은 CR 게이트가 끝난 뒤 단독 창(S120)."
  - "디스크 여유 297G(95%) — 20GB 넘기지 마라."

ETA:
  stage0: "45분 (행 순서 증명 + 운영진 집계 역설계가 대부분)"
  stage1: "45분 (GPU CatBoost 3판본)"
  stage2: "90분 (통과 시에만)"
  합계: "stage0·1 에서 막히면 1.5시간, 끝까지 3시간"

