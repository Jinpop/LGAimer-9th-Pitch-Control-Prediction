# ─────────────────────────────────────────────────────────────
🔴_정정_2026_08_26_사용자_지적:
  무엇: |
    원 stage1 설계의 `bat_prevK_*` 창 계열은 **배포 가능한 형태가 없다** — test 에서 창을 굴리면 규칙 2-4 위반이고,
    ≤2024 동결 스냅샷이면 폼이 아니다. 그리고 OOT 측정에서만 창을 굴리면 **측정-배포 불일치**가 된다(S136·S170).
  불변규칙: |
    추론에 쓸 수 있는 것은 ① 그 행 자신의 열(운영진 `asof_*` 포함) ② train 동결표의 키 조회 — **둘뿐**.
  대체_설계: |
    bat_form_dev     = asof_batter_success_rate − frozen_career_rate(batter_id)
    bat_form_dev_mid = asof_batter_middle_rate  − frozen_career_mid(batter_id)
    bat_n_growth     = asof_batter_n / frozen_n(batter_id)   ·   bat_n_delta = asof_batter_n − frozen_n
    bat_form_dev_eb  = bat_form_dev 를 bat_n_delta 로 EB 수축
    bat_phand_dev    = frozen_rate(batter_id, pitcher_hand) − frozen_career_rate(batter_id)
    bat_count_dev    = frozen_rate(batter_id, balls, strikes) − frozen_career_rate(batter_id)
    bat_base_dev     = frozen_rate(batter_id, base_state)    − frozen_career_rate(batter_id)
  자기검증_게이트: "KEEP 몇 행만 남기고 나머지 전 행 교체 → KEEP 행 피처 이동 **정확히 0.0**. 실패 시 중단."
  ⚠️: "stage0(행 순서·집계 역설계)은 동결표 제작에 필요하므로 그대로 유효하다 — train 안에서만 쓴다."
