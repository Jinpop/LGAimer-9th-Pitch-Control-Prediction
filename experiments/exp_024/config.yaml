exp_id: exp_024
date: "2026-08-07"
title: "exp_023 선택 arm(k400_league)의 3시드 승격 검증"
hypothesis: >
  exp_023이 선행 블록에서 정직하게 고른 `k=400 × league`가 배포 중인 d(`k=111 × self`)
  대비 fold_2024에서 **+15.23562점**(Brier −3.805964e-05)을 냈다. 이는 지금까지 d 축에서
  잰 것 중 가장 크다. 그러나 **시드 42 단독**이라 프로젝트 채택 문턱(3시드)을 통과한 적이 없다.
  이 실험은 그 하나의 미충족 조건만 채운다. **새 아이디어를 시험하지 않는다.**
base_exp: exp_023 (격자) · exp_022 BK1f = 배포 후보 H/I의 d

# ---------------------------------------------------------------------------
# 무엇을 새로 학습해야 하는가
# ---------------------------------------------------------------------------
what_must_be_trained:
  reason: >
    exp_023은 **시드 42의 저장된 B3 예측 3개** 위의 사후 변환이었다. 시드 7·2024에는
    그 예측이 없으므로 **base 예측을 새로 만들어야 한다.** 이것이 이 실험의 비용 전부다.
  units:
    - "fold_2024 base (B3 @iter 650, ≤2023 학습) × seed {7, 2024}"
    - "공급 블록 2022 (B3 @iter 170) × seed {7, 2024}"
    - "공급 블록 2023 (B3 @iter 650) × seed {7, 2024}"
  total: "3 유닛 × 2 시드 = 6 B3 실행"
  reuse: "시드 42는 exp_023·exp_022가 이미 산출 — sha 대조 후 재사용, 재학습 금지"
  measured_precedent: >
    exp_022 실측 — 블록 2022 1.58분 / 블록 2023 2.48분(둘 다 실사용 iter로 절단).
    fold_2024 base는 학습 구간이 더 커 그보다 길다.

# ---------------------------------------------------------------------------
arms:
  - id: A_control
    spec: "k=111 × self  (= exp_022 BK1f = 배포 후보 H/I의 d)"
    role: "대조군"
  - id: B_candidate
    spec: "k=400 × league  (= exp_023 블록 선택 arm)"
    role: "승격 후보"
  note: >
    **두 arm만 돌린다.** exp_023의 격자 14개를 다시 돌리지 않는다 — 이 실험은 선택된 조합의
    재현성을 묻는 것이지 재선택이 아니다.

# ---------------------------------------------------------------------------
# 판정 — 사전 등록, 완화 금지
# ---------------------------------------------------------------------------
adoption_criterion:
  registered_rule: >
    ① 3시드 paired delta의 **부호가 전부 같고** ② **|평균Δ| ≥ 대조군 시드 std × 3**.
    이것이 exp_018·exp_021에서 쓴 프로젝트 표준이며 **이번에도 그대로 적용한다.**
  also_report:
    - "**paired delta 자체의 시드 간 std**를 함께 보고하라. 같은 base 위의 짝지은 비교라 base 잡음이 차분에서 일부 상쇄되므로 이 값이 대조군 std보다 작을 것으로 예상된다. 두 수치를 나란히 적되 **판정은 등록된 규칙(대조군 std)으로 한다.**"
    - "exp_021 실측 참고: 단일 LGBM 대조군의 시드 std는 P10 1.12e-05 / 오라클 6.93e-06였다. B3 base의 std는 이 실험이 처음 잰다."
  reference_effect: "seed 42에서 Δ = −3.805964e-05 (환산 +15.23562점)"

# ---------------------------------------------------------------------------
# 진단 — 거의 공짜이므로 함께 잰다
# ---------------------------------------------------------------------------
diagnostics:
  reselect_per_seed:
    what: "시드 7·2024의 **블록에서 격자 선택을 다시 수행**해 argmin이 또 k400_league인지 본다"
    why: >
      exp_023의 선택은 **시드 42 블록 한 번**에서 이뤄졌다. 다른 시드의 블록도 같은 조합을
      고르면 선택 절차 자체가 견고하다는 뜻이고, 다른 것을 고르면 **선택이 시드에 흔들린다**는
      뜻이다. base 예측이 생기고 나면 격자 평가는 초 단위라 비용이 사실상 0이다.
    discipline: "이것은 **진단**이다. 이 결과로 arm을 바꾸지 말라 — 승격 대상은 k400_league로 고정이다."
  segments: "미적중/적중, 셀 표본 수 구간별(저n/중n/고n) — exp_023과 같은 분해를 시드별로"
  beta_stability: "arm·시드별 적합 β와 블록 간 β. exp_023 seed42: A 0.555535 / B 0.676950"

# ---------------------------------------------------------------------------
validation:
  primary_metric: "fold_2024 valid_all(R+F) Brier — arm B − arm A의 paired delta"
  secondary: [valid_R, valid_F]
  gates:
    - "seed 42 재현: arm A가 0.2480377446210693, arm B가 0.24799968498605615를 abs_diff < 5e-6으로 재현"
    - "as-of 독립 재검증 — exp_023과 동일하게 train.csv를 두 번째로 읽어 row_id→season 지도를 따로 만들고 표 기여 행의 시즌을 재조회. **런타임 assert를 근거로 삼지 말 것**(exp_022 감사 지적)"
  beta: "arm·시드마다 공급 블록에서 닫힌 해로 재적합. β는 변인이 아니라 종속 산출값"
  never: "valid 2024를 보고 k·target·β를 고르는 경로 없음"

# ---------------------------------------------------------------------------
runtime:
  where: a5000
  expected_min: 40                          # 30~50
  eta_basis: >
    실측표 exp_022 — 블록 2022 **1.58분** / 블록 2023 **2.48분**(B3, 실사용 iter 절단).
    fold_2024 base는 학습 구간이 커 5~9분으로 본다. 시드당 약 9~14분 × 2시드 = 18~28분 순차.
    규약 #2 동시 3개 병렬(fit당 threads 6 고정), 경합 1.35 → 8~13분.
    + 격자 재선택 진단(초 단위) + 집계·회수·검증 10~15분 → 벽시계 **30~50분**.
    ⚠️ exp_022에서 "학습 없음"으로 잡았다가 블록 재생성이 필요해 어긋난 전례가 있다.
    이번엔 **재학습이 필요함을 처음부터 계산에 넣었다.**

deliverables:
  - metrics.json      # arm×시드 Brier/환산 + paired delta + 두 std + 재선택 진단 + 세그먼트
  - report.md
  - src/  (exp_023 승계분 sha 기록)
  - "pred_*.npy (시드 7·2024 base 3종 + arm별 산출) — 다음 실험이 또 재학습하지 않도록 반드시 보존"

audit:
  required: false
  why: "exp_023과 동일 경로의 시드 반복. 새 소스·새 조인·새 타깃 파생 없음"
  note: "제출로 갈 때는 예외 없이 감사 — k가 바뀌면 배포 수축표를 새로 만들게 된다"

risks:
  - "예상 효과 3.806e-05가 대조군 시드 std의 3배 문턱을 넘을지 미지수다. exp_021의 단일 LGBM std(1.12e-05)라면 3.4배로 아슬아슬하게 통과하나 **B3 base의 std는 아직 아무도 재지 않았다**"
  - "통과하지 못하면 '측정 안 됨'으로 기록하고 채택하지 않는다. 기준을 사후에 낮추지 말 것"
  - "league 대상의 투수손 2 셀 불안정성(빈티지별 부호 뒤집힘)은 이 실험이 해소하지 못한다 — 결과와 함께 병기"
  - "로컬 iter 650 ≠ 배포 iter 7700. 모든 수치에 병기"
