exp_id: exp_019
date: "2026-08-06"
hypothesis: >
  exp_018에서 (pitcher × batter_hand) 조건부 편차의 정보는 실재하나 트리가 흡수하지 못했다.
  같은 정보를 **2단 선형/로짓 오프셋**으로 넣으면 트리 투입 대비 2.4배를 회수한다.
  단 그 회수가 성립하려면 **오프셋 계수가 선행 시즌에서 적합돼 valid 시즌으로 전이**되어야 한다.
  이 실험이 판정하는 것은 그 전이 가능성이다.
base_exp: exp_010 D (47열 강규제 LightGBM) · 진단 출처 exp_018

# ---------------------------------------------------------------------------
# 지휘자 진단 (exp_018 산출물로 실측, 2026-08-06) — 이 실험의 출발점
# ---------------------------------------------------------------------------
prior_diagnosis:
  data: "exp_018 pred_A0_seed42_fold_2024.npy (253,507행) + ≤2023 룩업표"
  d_s_definition: "수축 후 (pitcher, batter_hand) 셀 성공률 − 그 투수 무조건부 성공률"
  measurements:
    lookup_hit_rate_pct: 78.5
    sd_d_s: 0.01997
    ceiling_if_perfect: 3.13e-4          # E[d^2] × 적중률
    residual_slope_on_d_s: 0.614          # 0 = 모델이 이미 완전 반영 / 1 = 전혀 미반영
    theoretically_recoverable: 1.18e-4    # slope^2 × E[d^2] × 적중률
    achieved_by_tree_A1: 4.9e-5           # 회수 가능분의 41%
    posthoc_linear_crossfit: 1.18e-4      # ← 트리의 2.4배
    posthoc_linear_oracle_slope: 1.20e-4  # 교차적합과 거의 동일 = 기울기 안정
    logit_offset_coef: 2.474
    corr_d_s_d_r: -0.787                  # A2가 A1보다 나빴던 이유(중복 투입)
  decile_gap: >
    d_s 최하위 10%에서 A0가 4.10pp 과대예측, 최상위 10%에서 1.04pp 과소예측.
    A1(트리 투입)은 각각 3.27pp / 0.61pp까지만 줄인다.
  why_tree_fails_hypothesis: >
    d_s의 최적 사용은 **선형 가법 오프셋**인데 트리는 축 정렬 계단으로 근사한다.
    num_leaves 15(트리당 분할 14) · min_data_in_leaf 5000 · feature_fraction 0.7
    (트리의 30%는 이 열을 보지도 못함). exp_010에서 성능의 핵심이었던 강규제가
    바로 이 형태의 정보를 흡수하지 못한다. — **가설이며 이 실험이 검증하지 않는다.**
  CRITICAL_CAVEAT: >
    위 −1.18e-4는 **기울기를 2024 valid 행에서 적합**한 값이다(교차적합이라 과적합은
    아니나 valid를 봤다). **달성된 성과가 아니라 남은 헤드룸의 진단**이다.
    이 실험의 전부는 "선행 시즌에서 적합한 기울기가 전이되는가"이다.

# ---------------------------------------------------------------------------
model:
  stage1:
    type: lightgbm
    spec: "exp_010 D 그대로 — exp_018 A0와 동일. 재현 게이트 대상"
    params:
      objective: binary
      metric: binary_logloss
      learning_rate: 0.01
      num_leaves: 15
      min_data_in_leaf: 5000
      feature_fraction: 0.7
      bagging_fraction: 0.8
      bagging_freq: 1
      deterministic: true
      force_row_wise: true
      num_threads: 6
    num_boost_round_cap: 3000
  stage2:
    type: "선형 / 로짓 오프셋 (파라미터 1개)"
    form_linear: "p' = clip(p + beta * d, eps, 1-eps)"
    form_logit:  "p' = sigmoid(logit(p) + gamma * d)"
    fit_by: "잔차 최소제곱 (닫힌 해). 반복학습 없음 — 초 단위"
  seed: 42
  seed_repeats: [7, 2024]

# ---------------------------------------------------------------------------
features:
  stage1_input: "train.csv 47열. 변경 없음 (플래툰 열을 트리에 넣지 않는다 — exp_018 A1이 그 경로)"
  offset_variable:
    primary: d_s
    secondary: d_r
    note: >
      corr(d_s, d_r) = −0.787로 강하게 연결돼 있다. **둘을 동시에 넣지 마라** —
      exp_018 A2가 중복 투입으로 손해를 봤다. 각각 단독 arm으로 비교한다.
  lookup_table: "exp_018 src/features_platoon.py 그대로 재사용 (sha 보존). k = 111 / 65"
  missing: "룩업 미적중 행은 d = 0 (오프셋 없음). NaN을 0으로 '채우는' 것이 아니라 보정을 적용하지 않는 것"

# ---------------------------------------------------------------------------
# 이 실험의 심장 — 기울기를 어떻게 정직하게 적합하는가
# ---------------------------------------------------------------------------
slope_fitting:
  problem: >
    학습행의 잔차로 기울기를 적합하면 **0쪽으로 편향**된다. 트리가 이미 학습행에서
    투수 효과를 과적합해 흡수했기 때문이다. 반드시 out-of-sample 잔차가 필요하다.
  method: >
    시즌 forward-chaining (exp_016 B3 OOF와 같은 기계). 시즌 s의 잔차는 시즌 < s로
    적합한 stage1 모델에서 얻는다. 그 OOF 잔차들을 풀링해 기울기를 적합한다.
  fold_2024_concretely:
    - "stage1 최종: ≤2023 학습 → valid 2024 예측 (보고 대상)"
    - "기울기용 OOF: 2020~2023 각 시즌을 그 이전 시즌들로 적합한 모델이 예측"
    - "그 OOF 잔차에 d를 회귀 → beta_hat. valid 2024는 적합에 일절 참여하지 않음"
  runtime_assert: "기울기 적합에 쓰인 최대 시즌 < valid 시즌 — 매 fold 확인"
  never: "valid 잔차로 기울기를 고르거나 고르는 데 참고하는 경로를 만들지 마라"

# ---------------------------------------------------------------------------
arms:
  - id: C0
    desc: "무보정 대조군 (= exp_018 A0). 재현 게이트: P4에서 0.248261, abs_diff < 5e-6"
  - id: C1
    desc: "+ 선형 오프셋, d_s, 기울기 OOF forward-chaining 적합"
  - id: C2
    desc: "+ 로짓 오프셋, d_s (확률 경계 문제 회피)"
  - id: C3
    desc: "+ 선형 오프셋, d_r (reverse 편차 — A1이 실제로 쓴 변수)"

  arm_diff_note: >
    C0→C1은 오프셋 하나만 추가. C1↔C2는 스케일(선형/로짓)만 다름. C1↔C3는 변수만 다름.
    각 쌍이 단일 변인 대조다.

# ---------------------------------------------------------------------------
# 채택 여부와 무관하게 반드시 산출할 진단
# ---------------------------------------------------------------------------
diagnostics:
  D1_slope_stability:
    what: "시즌별 기울기 beta_s (2020·2021·2022·2023 각각) + 표준오차"
    why: >
      **이 실험의 핵심 판정.** 기울기가 시즌 간 흔들리면 exp_005 보정C와 같은 운명이다
      (그건 상수 오프셋을 시즌 추세로 외삽했다가 과녁을 넘겼다). 안정적이면 채택 가능.
    report: "추세가 있는지, 있다면 부호와 크기. 2024로의 외삽 오차 추정"
  D2_oracle_gap:
    what: "OOF 적합 기울기 vs valid 2024에서 적합한 오라클 기울기(0.614)의 차이"
    why: "전이 손실의 직접 측정. 오라클 대비 몇 %를 회수했는가"
  D3_b3_headroom:
    what: >
      exp_016 B3의 fold_2024 예측이 서버에 남아 있으면(`~/SungjinPark/experiments/exp_016/`)
      **같은 잔차 회귀를 B3 예측에 대해 수행**. 학습 없음, 수 초.
    why: >
      최종 제출은 B3 계보다. B3가 이미 이 정보를 흡수했다면 기울기가 0에 가까울 것이고,
      그렇지 않다면 헤드룸이 B3 위에도 존재한다. **다음 실험의 방향을 정하는 값.**
    if_missing: "예측 파일이 없으면 재생성하지 말고 '미확인'으로 보고하라"
  D4_coverage_effect:
    what: "룩업 적중 행 / 미적중 행으로 나눈 Brier 개선 분해"
    why: "적중률 78.5%를 올리는 것(exp_018 §7-2 백오프)의 기대 이득 추정"

# ---------------------------------------------------------------------------
validation:
  scheme: rolling-origin
  folds:
    - {train_until: 2021, valid: 2022}
    - {train_until: 2022, valid: 2023}
    - {train_until: 2023, valid: 2024}    # 주 판단 fold
  primary_metric: "fold_2024 valid_all Brier"
  secondary: [valid_R, valid_F]
  mask: "exp_004 마스크 유지"
  iter_policy:
    name: P10
    rule: "exp_018과 동일 (자기 fold_2023 argmin × 2.75). stage1은 arm 간 동일 모델이므로 iter도 동일"
    note: "C0~C3의 stage1은 **완전히 같은 부스터**다. 오프셋만 다르다 → iter 교락 없음"

  decision_rule:
    adopt_if: "3시드 전부 동부호 AND |평균Δ| ≥ 3 × C0 시드 std"
    caveat: >
      ⚠️ exp_018에서 C0(=A0)의 시드 std가 1.1e-05로 exp_016 B0(3e-06)의 3.7배였다.
      P10이 훨씬 큰 iter에서 보고하기 때문으로 보이나 **미검증**. 판정 시 이 분모를
      그대로 쓰되, 기준 미달이어도 '측정 안 됨'이지 '효과 없음'이 아님을 명시하라.

# ---------------------------------------------------------------------------
runtime:
  where: a5000
  expected_min: 30                          # 25~35
  eta_basis: >
    실측표 신규 행 '47~51열 강규제 LGBM cap3000 112만행 = 1.48~1.57분/fit'.
    stage1은 arm 공통이므로 3 fold × 3 시드 = 9 fit(14~15분) + 기울기용 OOF 4블록
    (65만~112만행 각 1회, 약 5분). stage2 적합·적용은 닫힌 해라 초 단위.
    진단 D1~D4 합쳐 약 5분. 총 25~35분.
  reuse: >
    exp_018 서버 산출물 `~/SungjinPark/experiments/exp_018/`에 전 arm·전 시드 pred가 있다.
    A0 예측을 재사용할 수 있으면 stage1 재학습을 줄여라 (단 재사용 시 sha 대조로 동일성 확인).

deliverables:
  - metrics.json
  - diagnostics.json      # D1~D4
  - report.md
  - src/{train.py, offset.py, features_platoon.py, labels.py}

audit:
  required: true
  when: "채택 시 제출 전 필수. 미채택이어도 코드 재사용 전 필요"
  why: "타깃 파생 룩업 + 2단 보정이라는 새 추론 경로. 배포 시 test 2025에 오프셋을 적용하는 코드가 규칙 2-4를 지키는지"

risks:
  - "exp_005 보정C 전례 — 상수 오프셋을 시즌 추세로 외삽했다가 과대보정(+3.0e-5). 이번은 상수가 아니라 계수지만 전이 실패 양상은 같을 수 있다"
  - "OOF 잔차의 기울기가 최종 모델(학습행이 더 많음)의 기울기와 다를 수 있다 — 학습량이 늘면 트리가 더 많이 흡수해 기울기가 작아질 것으로 예상(미검증)"
  - "룩업 미적중 21.5%에 오프셋 미적용 → 개선이 적중 행에 집중된다. D4가 이를 분해"
