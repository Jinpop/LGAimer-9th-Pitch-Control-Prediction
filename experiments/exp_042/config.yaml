# 사용자 승인 2026-08-11 "042 하이퍼 파라미터 탐색 진행하자"
exp_id: exp_042
title: "CatBoost C5_B3의 하이퍼파라미터를 처음으로 탐색한다 — 탐색 fold_2023 / 승격 검증 fold_2024"
date: "2026-08-11"

# ---------------------------------------------------------------------------
why: >
  **실험 39건(exp_000~exp_040) 중 모델 하이퍼파라미터를 탐색한 실험이 0건이다.**
  지금 배포 중인 값은 exp_027이 계열을 "flat 대 flat"으로 비교할 때 쓴 설정이 그대로 굳은 것이다:

      depth 6 · learning_rate 0.03 · l2_leaf_reg 10 · subsample 0.8 · one_hot_max_size 10
      bootstrap_type Bernoulli · boosting_type Plain · has_time true

  백본을 바꾸고(+65.3836235801), 모드 분해를 넣고(+46.0131232744), 오프셋·γ·시드·세그먼트를
  다 얹는 동안 **모델 자체의 설정은 한 번도 안 건드렸다.**

  🔴 **이 실험의 목적은 격차 메우기가 아니라 정지 작업이다.** 앞으로 재는 모든 것
  (시즌 가중·새 피처·앙상블)이 이 설정 위에서 판정된다. 대조군이 어긋나 있으면
  좋은 것이 기각되거나(exp_037 1.99265σ / exp_038 부호 1/3) 엉뚱한 것에 공이 돌아간다.
  exp_040이 이미 축들이 독립이 아님을 3/3 시드로 보였다.

  ⚠️ **기대 이득을 적지 않는다.** 1위권과의 격차 142.9408점을 이걸로 메운다는 근거는 없다.

# ---------------------------------------------------------------------------
# 🔴 fold-oracle 방지 — 이 실험의 설계 핵심
# ---------------------------------------------------------------------------
folds:
  search: "fold_2023 (train ≤2022 → valid 2023)"
  promote: "fold_2024 (train ≤2023 → valid 2024), 3시드"
  rule: >
    🔴 **fold_2024에서 설정을 고르지 않는다.** 고른 곳에서 잰 값을 인용하는 것이
    후보 O의 fold-oracle 결함이었다. 탐색은 fold_2023에서만, fold_2024는 **선택된 설정 하나**의
    확인용으로만 연다.
  ⚠️: "fold_2023 절대 Brier는 **환산하지 않는다** — ref가 2025 test 기저율이라 지시 대상이 없다. **Δ만 환산한다.**"

# ---------------------------------------------------------------------------
search:
  what: >
    **셀 이진 모델 하나에서 탐색한다.** 전체 C5_B3 스택은 유닛당 약 20분이라
    150 trial이 50시간이 되어 불가능하다. 셀 fit 단가는 실측 1.61~1.85분(exp_030)이다.
  cell_selection_rule: >
    **사전 등록**: 탐색 셀 = `experiments/exp_033/metrics.json`의 `block_provenance`에서
    **argmin iter가 가장 큰 셀** = `is_wayoff_true`(2022 s42 725 / s7 625).
    가장 오래 학습한다 = 맞출 신호가 가장 많다는 뜻이다.
    ⚠️ **산출물에서 직접 읽어 확인하고, 다르면 규칙대로 바뀐 셀을 쓰고 그 사실을 적어라.**
  objective: "그 셀의 fold_2023 valid 2023 **logloss**(학습 손실과 같은 눈금). Brier도 함께 기록"
  🔴_risk: >
    **셀 하나에서 좋은 설정이 스택 전체에서 좋다는 보장이 없다.** 이것이 이 설계의 가장 큰 약점이다.
    **그래서 승격 검증을 따로 둔다** — 그 단계가 이 가정을 시험한다.
    ⚠️ 승격이 실패하면 "HPO가 무효"가 아니라 **"셀 대리 탐색이 무효"** 다. 둘을 섞어 적지 마라.
  space:
    depth: "4 ~ 10 (정수)"
    l2_leaf_reg: "1 ~ 100 (로그 균등)"
    learning_rate: "0.01 ~ 0.10 (로그 균등)"
    subsample: "0.6 ~ 1.0"
    rsm: "0.5 ~ 1.0 (열 표본)"
    random_strength: "0.5 ~ 10 (로그 균등)"
    min_data_in_leaf: "1 ~ 200 (로그 균등)"
    one_hot_max_size: "2 ~ 64 (로그 균등, 정수)"
  fixed:
    - "`bootstrap_type=Bernoulli` · `boosting_type=Plain` · `has_time=true` · `loss_function=Logloss` — 고정. 이것들은 파이프라인 계약이지 튜닝 대상이 아니다"
    - "`iterations`는 탐색하지 않는다 — **cap 1650에서 자기 곡선 argmin으로 조기 종료**. ⚠️ argmin이 cap에 닿으면 그 trial은 **무효**로 표시하고 cap을 올려 다시 돌린다(cap 적응화 규칙)"
  budget:
    n_trials: 150                            # 사전 등록 — 결과를 본 뒤 늘리지 않는다
    sampler: "optuna TPE, seed 42 고정. ⚠️ optuna가 없으면 **seed 42 고정 무작위 탐색**으로 대체하고 그 사실을 적어라 — 설치 실패를 조용히 넘기지 마라"
    ⚠️: "**`[:N]` 같은 탐색용 상한을 걸지 마라.** 걸었으면 분모를 함께 찍어라(산출물 인용 규약 3)"

# ---------------------------------------------------------------------------
threads:
  calibration: >
    탐색 시작 전 **같은 셀 fit을 threads 6 / 3 / 2로 각 1회씩** 재라 (약 5분).
    실제 확장 계수를 보고 탐색 동시성을 정한다. 컨테이너 CPU 상한은 **20**이다
    (`nproc` 40은 호스트값이다 — `cpu.cfs_quota_us 2000000 / cpu.cfs_period_us 100000`).
  search_phase: >
    **스레드 고정 규약의 예외를 여기에만 적용한다.** 근거: 규약이 `fit당 threads 6`을 고정하는 이유는
    **인용되는 숫자끼리 비교가 깨지지 않게** 하기 위함인데, **탐색 단계의 시간은 어디에도 인용되지 않는다.**
    총 스레드는 20을 넘기지 않는다(예: 10-wide × 2, 또는 계측 결과가 가리키는 조합).
  promote_phase: "🔴 **threads 6 고정.** 이 숫자는 기존 실측과 비교되므로 예외 없다"

# ---------------------------------------------------------------------------
promotion:
  what: "탐색 1위 설정을 **셀 4개 + 스태커 전부에 동일 적용**하고 fold_2024 3시드로 대조군과 겨룬다"
  control: "현행 설정(depth 6 / lr 0.03 / l2 10 / subsample 0.8 / one_hot 10)"
  seeds: [42, 7, 2024]
  metric: "fold_2024 **valid_all(R+F) Brier** + 환산 점수. valid_R·valid_F는 보조"
  ⚠️_valid_F: >
    🔴 **valid_F로 판정하지 마라.** 2026-08-10~11에 F 세그먼트가 **세 번 연속 LB를 거꾸로 가리켰다**
    (V 전이비 0.0626 / W 부호 뒤집힘 / X 부호 뒤집힘). 이 실험은 **valid_R이 88.162%인 R 지배 측정**이라
    그 함정을 피하는 것이 장점이다. 세그먼트 값은 **기록만** 한다.
  adoption_rule: >
    **3시드 부호 일치 AND |평균Δ| ≥ 35.92257점** (σ 11.97419 × 3, n=9 경계 — exp_039 이후 등록 실험).
    ⚠️ **분자를 본 뒤 분모를 고르지 마라.**
  also_report: "탐색 1위와 상위 10개 설정, 파라미터별 중요도(있으면), 현행 설정이 탐색 순위에서 몇 등인지"

