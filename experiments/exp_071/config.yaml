## stage 3 — p_v6 완성 + w_v6 곡선 재실행
## ══════════════════════════════════════════════════════════════
p_v6: "expit(0.05·lg(p_lgb) + 0.68·lg(p_cat) + 0.15·lg(p_nn_ours) + 0.12·lg(p_leaf))"
🔴 항등_대조: "0.15 자리를 빼고 0.85 로 재정규화하면 팀원 `p_v6_3arm_renorm` 과 일치해야 한다(1 ulp 허용)."
재실행: >
  exp_070 의 **1축 조건부 `w_v6` 곡선**을 완성된 p_v6 로 다시 낸다.
  ★ 필요한 숫자: **`w_v6` 만 0.50→X, 나머지 5개 배포 고정**일 때의 Δ 와 argmax.
  exp_070 3종판 기준값: **Δ(0.70) = +4.61814, 부트 CI [+0.28392, +8.87803], 양수 98.1%**
  → 완성판에서 이 값이 **오르는가 내리는가**가 후보 BN 의 설계 변인이다.
🔴 편향_정정_기록: >
  exp_070 이 짚었다 — p_v6 3종판은 v6 를, p_q 1시드는 Q 를 각각 아래로 눌러 **`w_v6` 를 서로 반대로 민다.**
  이 실험은 **첫째만 고친다.** 둘째(p_q 1시드)는 남으므로 결과를 "이제 정확하다"로 적지 마라.

