## stage 2 — 학습
## ══════════════════════════════════════════════════════════════
마스크: "(s <= 2023) & ~((s <= 2022) & (g == 'F')) = **1,116,277행** → 예측 season==2024 전체 **253,507행**. 둘 다 assert."
구조: "159 → 256(BN) → 128(BN) → 64 → 1. edims [28,28,6,6,6,6,6]. 손실 BCEWithLogits."
🔴 우리가_새로_정하는_변인: >
  **학습 레시피는 아티팩트에 없다** — Dropout 확률·학습률·에폭·옵티마이저.
  사양서도 인정한다("Dropout 확률은 아티팩트에 남지 않는다").
  → 우리 exp_064/068 레시피를 그대로 쓴다: dropout 0.30 · AdamW wd 1e-4 · batch 4096 drop_last ·
    OneCycle max_lr 3e-3 **25에폭 스케줄 완주**.
  **이것은 우리가 도입한 변인이므로 반드시 열거해 기록하라.** 산출물은 "그 구조의 NN"이지 "그들의 NN"이 아니다.
에폭: >
  🔴 exp_068 교훈 적용 — 시드별 best epoch 을 기록하고 **중앙값 내림을 k 로 고정**해 그 판을 정본으로 낸다.
  best-epoch 판도 함께 만들어 차이를 재고 기록하되 **정본은 고정 k 판**이다.
  스케줄 길이는 25 그대로 두고 k 에서 꺼낸다(자르면 학습률 곡선이 달라져 별개 변인).
시드: [42, 777, 2024, 101]
