## ══════════════════════════════════════════════════════════════
## 가설 — 주최측 폼 피처에 뚫린 칸이 있다
## ══════════════════════════════════════════════════════════════
관측: >
  `train.csv` 가 주는 것:
    · 커리어 누적 5종 — `asof_pitcher_{success,reverse,middle,ball,strike}_rate`
    · **최근 1·3·5경기는 2종뿐** — `prev{1,3,5}_game_{success,middle}_rate`
  🔴 **반대방향·볼·스트라이크의 최근 경기 판이 없다.** 기복(경기 간 산포)도 어느 형태로도 없다.
왜_값이_있을_수_있나: >
  exp_048 이 `ins_*`(시즌 내 폼) 16열을 스태커에 넣어 팔 눈금 **+102.86**, 배포 **AI +17.63**
  (우리 역사상 최대 단일 이득)을 냈다. 그 기전은 "커리어 누적만 있던 자리에 **더 짧은 시간창**을 넣은 것".
  이 실험은 **같은 계열의 안 판 칸**이다 — 시간창은 더 짧고(경기), 종류는 안 준 3종이다.
🔴 왜_AN_처럼_되지_않나: >
  AN 은 `p6_*`·`i3_anom_*` 14열을 넣어 팔 +41.13 → 배포 **−1.23**(전이비 −0.0298)이었다.
  원인은 **팀원 Q 가 이미 그 정보를 갖고 있어서** 블렌드에 새것이 없었기 때문이다.
  이 축들은 Q 도 v6 도 안 가진 열이다(양쪽 다 `train.csv` 원본 열만 쓴다) — 그 점을 **검증 항목으로 넣는다**(stage 3).

## ══════════════════════════════════════════════════════════════
## 🔴 stage 0 — 배포 가능성. 설계 단계에서 이미 절반을 잘라냈다.
## ══════════════════════════════════════════════════════════════
이미_배제한_것: >
  **경기 내 폼 · 최근 N투구 창 · 최근 N경기(창이 test 안으로 넘어가는 형태)** —
  2025 test 행의 최근 창을 계산하려면 **다른 test 행을 읽어야 하므로 규칙 2-4 위반**이다.
  설계에서 잘랐다. 스크린에 올리지 마라.
살아남는_형태: >
  **투수별로 ≤2024 말에 얼린 스칼라 1개.** 학습 행은 시즌별 as-of(season < Y 말에 얼린 값),
  test 행은 2024 말 값. `ins_*`·`d_form_eb` 와 정확히 같은 배포 형태다.
확인할_것:
  Q1: "표 1개(pitcher_id 키)로 전 축을 실을 수 있는가. 상이·추가 파일 수는."
  Q2: "커버리지 — 표에 없는 투수 비율. 결측은 오프셋 0(sentinel 금지)."
  Q3: "🔴 `real5`(진짜 2025 행 5개) 커버리지도 함께 재라. exp_073 에서 대역 96.49% vs real5 20% 였다 — 대역은 상한이다."

## ══════════════════════════════════════════════════════════════
## stage 1 — 라벨 복원과 as-of 집계
## ══════════════════════════════════════════════════════════════
라벨_복원: >
  실패 유형 4셀은 **주최측 누적 as-of 비율 열을 차분해 복원**한 것이다(배포 `meta.json`
  `branches.R.recovered_labels` 참조). 🔴 **기존 복원 코드를 재사용하라 — 새로 만들지 마라.**
  AA 계보(exp_030/exp_037 featdir)에 있다. 재구현하면 이 실험이 그 코드의 검증이 돼버린다.
🔴 리크_규율: >
  이 축들은 **타깃 파생**이다. 시계열 집계는 **예외 없이 shift(1)** — 행 i 의 값은
  **그 투수의 i 이전 행만** 쓴다. 시즌 경계도 `season < Y` 로 assert.
  **이것이 이 실험의 유일한 치명적 실패 지점이다.**
집계_단위: "pitcher_id × (season < Y). 경기 순서는 `game_date` 없으면 `season·game_month·game_dayofweek` + 행 순서."

