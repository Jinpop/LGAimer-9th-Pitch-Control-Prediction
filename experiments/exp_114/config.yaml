exp_id: exp_114
title: 딥 학습량 × w_deep 2차원 argmax 재측정 (고친 정직면)
date: 2026-08-27
owner: orchestrator

배경:
  - CE 가 딥 학습량 720 -> 2160 으로 LB +4.8280402096 을 벌었다. 우리 단일 최대 이득이다.
  - 그 2160 을 고른 근거는 exp_090 의 학습량 곡선인데, 그 실험은 S134 결함면 위에서 돌았다.
  - 고친 면에서 다시 잰 학습량 지점은 exp_097 의 1632 하나뿐이다.
  - S145 실측 - 고친 면에서 딥 혼합 이득이 1.92배이고 w 곡선이 0.07~0.10 옮겨간다.
  - S97 - 학습량과 w_deep 은 같이 정해야 하는 두 손잡이다. 팔을 바꾸면 w 꼭지점도 옮겨간다.
  - 즉 (학습량, w) 2차원 argmax 가 결함면에서 (1632, 0.36) 이었고 배포는 (2160, 0.40) 이다.
    고친 면의 argmax 는 미측정이다.

목표: 고친 면에서 (스텝, w_deep) 2차원 격자를 훑어 배포점 (2160, 0.40) 대비 초과 이득을 잰다.

면_규약:
  - 반드시 exp_097 이 고친 f64 표준화 경로를 쓴다. prep089.py 의 f32 nanmean/nanstd 경로 금지.
  - 재현 게이트 - EXTRA 없이 seed42 1632스텝 재적합이 exp_097/z_F1632_f64o_s42 와 sha256 비트 동일.
    이것이 안 맞으면 그 자리에서 정지하고 보고한다.
  - 기준선은 배포 배치 (2160, 0.40) 이다. 각자 argmax 로 읽지 마라 (S220 - 인접 칸을 읽고 0.6점 과대평가한 사고).

격자:
  스텝: [1088, 1632, 2160, 2720, 3264, 4352]     # exp_090 고원 816~3264 을 위아래로 넘어서게
  w_deep: 0.20 ~ 0.60 (0.01 간격, 재학습 0)
  시드: 서로소 5시드 묶음. 스텝당 최소 1묶음.
  - S98 - LR 스케줄러가 없어 상수 lr 이므로 같은 시드면 긴 적합의 앞부분이 짧은 적합과 비트 동일하다.
    따라서 4352 를 한 번 굽고 중간 체크포인트를 떠서 스텝 지점을 공짜로 얻어라. 그렇게 못 하면 따로 굽는다.

사전_등록_문턱:
  1σ_측정: 판정 전에 반드시 서로소 5시드 묶음을 3개 이상 구워 묶음 간 sd 를 직접 재라.
           S187 - 팔을 바꾸는 변형의 결합 1σ 는 4.654 였다. 이 계열도 그 등급으로 예상하되 실측한다.
           문턱을 1σ 실측 전에 확정하지 마라. 1σ 를 잰 뒤 t >= 2.0 에 해당하는 점수로 못박고 결과를 보기 전에 config 에 적는다.
  판정량: (후보 지점의 이득) - (배포 배치 (2160, 0.40) 의 이득), 같은 시드 묶음 안에서 짝지어 잰다.
  LB_환산: 전이비 0.34818 (S111, exp_097 이 고친 면에서 다시 잡은 값. 결함면 0.4779 를 쓰지 마라).
  행동_문턱: LB 환산 >= +1.4 (검출한계) AND t >= 2.0. 둘 다 넘어야 후보를 만든다.

귀무_대조:
  - S230 - 개체 id 안 순열은 귀무가 아니다. 이 실험은 열을 안 바꾸므로 열 귀무는 불필요.
  - 대신 개수 맞춤 대조 - 스텝을 바꾸는 대신 시드만 바꾼 같은 개수의 묶음을 놓아라.
    스텝 축이 시드 재뽑기와 구별되는지가 판정의 전제다.

금지:
  - 캘프레임에서 L 을 재지 마라 (S217). 이 실험은 정직면 전용이다.
  - 팀원 솔버팩 프레임 금지 (S210).
  - 결과를 보고 격자를 위로 넓히는 것은 허용하되 (경계에 붙었을 때만) 문턱은 절대 안 건드린다 (S8).
  - 배포 (<=2024) 학습은 후보가 문턱을 넘었을 때만 돈다. 넘기 전에는 정직면 단독으로 판정한다.

재사용:
  - 서버 tmpfs 캐시 /dev/shm/e113 (2.0GB, X_f64o / codes / blocks) 가 살아 있다. NFS 로딩이 job 시간의 60% 라 이걸 쓰면 약 3배 빠르다.
    exp_113 이 SHMGATE 로 경로 이동이 z 를 안 바꿈을 확인했다. 지우지 말고 쓴다.

ETA: 1.5 ~ 2시간 (exp_113 실측 222 fit 56분 기준, 이 실험은 fit 수가 더 적고 w 격자는 재학습 0)

