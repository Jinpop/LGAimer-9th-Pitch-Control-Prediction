  🔴_G-LEDGER: "축의 증거를 판단하기 전에 원문 산출물을 확인하라. 이 실험이 두 번째 사례다."

남은_진짜_질문: |
  exp_097 은 배포점을 **OOT 1632 스텝**으로 잡았다(`deploy_steps_oot_equiv: 1632`).
  근거: 배포 CE 는 **6에폭 = 2160 배포스텝**(n=1,475,092, 360스텝/에폭)이고
        OOT 는 n=1,116,277 로 272스텝/에폭이라 6에폭 = 1632 — 즉 **에폭 정합**이다.
  이 config 는 배포점을 **OOT 2160 스텝**으로 잡으라 한다 — 즉 **스텝 정합**이다.
  두 관례가 정반대 답을 낸다:
    에폭 정합: 배포점이 정직면 argmax 바로 그 자리 -> 남은 이득 +0.118 (없음)
    스텝 정합: 배포점이 OOT 2160 -> exp_097 fix 곡선상 w0.40 에서 16.939 이고
               1632 의 26.151 보다 **9.21 낮다** -> LB 환산 약 +3.2 (큼)
  🔑 **그래서 exp_114 의 실질 내용은 argmax 재측정이 아니라 '관례 판정' 이다.**

  ⚠️ 전이비 0.34818 자체가 이 혼선 위에 있다 — exp_097 `CE_anchor` 가 부모를 스텝 정합(720),
     자식을 에폭 정합(1632)으로 잡은 **섞인 쌍**이다(비율 2.27배, 배포 실제 이동은 3배).
     일관된 쌍으로 다시 계산하면 에폭 정합 544->1632 = **0.24909**, 스텝 정합 720->2160 은
     2176 으로 근사해 **약 0.4235**. 판정은 config 지정대로 0.34818 로 하고 둘을 감도로 병기한다.

추가한_것:
  s4_scale: |
    관례를 **측정으로** 가른다. 같은 정직면(같은 valid 2024 · 같은 Z_MATE)에서 학습 행만
    50% / 75% / 100% 로 바꿔 혼합 이득의 최적 스텝 k*(n) 을 재고 k* ∝ n^p 를 적합한다.
      p ≈ 1 -> 에폭 법칙 (OOT 1632 가 배포 2160 의 상, 남은 이득 없음)
      p ≈ 0 -> 스텝 법칙 (OOT 2160 이 배포 2160 의 상, 남은 이득 큼)
    배포 n 으로 외삽해 배포 최적 스텝도 낸다. 비용 10 fit.
  묶음_5개: "exp_097 은 묶음 0 하나뿐이라 σ 가 없었다(부트스트랩만). 서로소 5시드 묶음 5개로 늘려 직접 잰다."
  체크포인트: "S98 을 이용해 4352 를 한 번 굽고 23개 스텝 지점을 뜬다."

