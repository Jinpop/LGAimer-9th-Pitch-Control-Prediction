    그 격자의 최고점은 `best_point_fix` = **(1632, w 0.43, gain 26.269817382706947)** 이고
    배포점 `deployed_point_fix` = (1632, 0.40, 26.15139685310237) 대비 **+0.1184 (부트스트랩 t 0.191)**,
