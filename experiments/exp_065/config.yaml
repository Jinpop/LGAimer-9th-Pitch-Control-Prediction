## 두 면에서 잰다
# ══════════════════════════════════════════════════════════════
면_A_정직면:
  구성: "z_A = w·logit(NN_oot) + (1−w)·logit(AA_oot). **양쪽 다 out-of-time** — 유일하게 공정한 면"
  재료:
    NN: "~/SungjinPark/exp064/out/preds/A99ship_seedavg.npy (+ 개별 4시드)"
    AA: "exp_048 A1@1400 3시드 out-of-time (exp_063 상관 블록이 쓴 그 벡터)"
  묻는_것: "🔴 **NN 이 AA 가 모르는 것을 아는가.** 최적 w_NN > 0 이면 그렇다."
  정지점: "🔴 최적 w_NN 이 0 이거나 AA 단독 대비 이득 < +3점 → **축을 닫고 보고**. 다음 면으로 가지 않는다."

면_B_현행면_하한:
  구성: >
    현행 5팔 블렌드에 NN 을 여섯째로 추가.
    z = 0.385·logit(v6) + 0.385·logit(Q) − 0.070·EBM + 0.25244·logit(AA) + 0.04756·logit(T70) + w·logit(NN)
    그 뒤 p = expit(α·z + β_skew·z² + d_adj) 의 **α·β_skew 재적합 → d_adj 재못박기**(확립된 순서).
  🔴_해석_규칙: "**이 값은 하한이다.** 동료 팔이 표본내라 NN 이 불리하다. '블렌드 이득 = 이 값' 으로 적지 마라."
  기존_가중_처리: "🔴 **두 형태 다 잰다** — ① 5팔 비율 고정하고 w 만 추가 ② 6팔 전체 재적합. 둘의 차가 재가중 여지다."

