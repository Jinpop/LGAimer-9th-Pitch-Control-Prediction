## 🔴 이 실험의 핵심 함정 — 측정면이 정직하지 않다
## ══════════════════════════════════════════════════════════════
함정: >
  `arms/*` 5팔(v6·Q·EBM·AA배포·T70)은 **tr2024 표본 내** 계측이다 — 배포 모델이 ≤2024 로
  적합됐고 tr2024 가 그 안에 있다. 반면 우리 exp_064 NN 은 **out-of-time**(≤2023 학습 → 2024 평가)이다.
  🔴 **표본내 팔과 out-of-time 팔을 같은 프레임에서 겨루게 하면 NN 이 부당하게 불리하다** —
  동료 팔들이 2024 를 이미 외웠으므로 NN 이 보탤 것이 없어 보인다.
  → 그러므로 **면 B 의 결과는 이득의 하한**이며, 그것을 "NN 의 값어치"로 적으면 틀린다.

