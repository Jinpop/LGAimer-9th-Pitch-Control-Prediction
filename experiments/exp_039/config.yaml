# ⚠️ 미승인 — 사용자 검수 대기 (2026-08-09 작성)
exp_id: exp_039
date: "2026-08-09"
title: "채택 문턱의 분모를 제대로 잰다 — R0 fold_2024 시드 3개 → 9개"
base_exp: "exp_037 (R0 3시드) · exp_030 (C5_B3)"

# ---------------------------------------------------------------------------
why: >
  **모든 채택 판정이 대조군 시드 std 위에 서 있는데, 그 std가 믿을 만하지 않다.**
  같은 C5_B3 구성 위에서 기록된 값이 이렇게 흔들린다:
      exp_030 기록 대조군  4.897825479068653e-06
      exp_036 argmin 지점  3.491428813285408e-05
      exp_037 R0           3.881562551959927e-05
  **약 8배 범위다.** 시드 3개짜리 표본표준편차는 자유도 2라 상대 추정오차가 약 50%다
  (`1/sqrt(2(n-1))`). 분모가 두 배 틀리면 판정이 통째로 뒤집힌다.

  실제로 뒤집혔다 — exp_033(ddof=1) 0.82137 FAIL vs exp_036(ddof=0) 1.00597 PASS가
  **같은 세 Brier**에서 나왔다. 그리고 그 FAIL 처리된 오프셋을 실제 제출하니
  LB에서 **+20.7432778366점**을 벌었다.

goal: "R0의 fold_2024 시드 σ를 **n=9**에서 추정한다. 규칙을 바꾸는 게 아니라 분모를 제대로 재는 것이다"

# ---------------------------------------------------------------------------
# 🔴 사전 등록 — 결과를 보기 전에 확정한다
# ---------------------------------------------------------------------------
pre_registration:
  seeds_new: [1, 13, 101, 777, 2025, 31337]
  seeds_existing: [42, 7, 2024]
  n_total: 9
  ⚠️_seed_choice: >
    **위 6개 시드는 결과를 보기 전에 이 파일에 확정된다.** 돌려보고 마음에 안 든다고
    바꾸거나 추가하지 마라. 유닛이 실패하면 그 사실을 기록하고 **n을 줄여서** 보고한다 —
    대체 시드를 뽑지 마라. 그게 시드 체리피킹이다.
  rule_unchanged: >
    **채택 규칙(3시드 부호 일치 AND |평균Δ| ≥ 대조군 σ × 3, ddof=1)은 바꾸지 않는다.**
    이 실험은 σ의 **추정치**를 개선할 뿐 규칙의 형태·배수·ddof를 건드리지 않는다.
    ⚠️ 결과를 보고 배수 3을 바꾸자는 제안을 하지 마라.
  scope_forward_only:
    statement: >
      **새 σ̂는 이 실험이 끝난 뒤 등록되는 실험에만 적용한다.** 이미 판정이 난 실험
      (exp_033·exp_036·exp_037)과 **현재 진행 중인 exp_038**은 각자 등록 시점의 σ로
      판정된 채 남는다.
    why: >
      분자를 본 뒤 분모를 고르는 것은 exp_033/exp_036의 ddof 사고와 **같은 죄**다.
      exp_038은 exp_037의 σ(3.881562551959927e-05 = 15.53825점, 문턱 46.61476점)로
      사전 등록됐고 그대로 판정된다.
    what_is_allowed: >
      새 σ̂ 아래에서 과거 판정이 어떻게 달라졌을지를 **명확히 '반사실'로 표시해**
      보고하는 것은 허용된다. 그것을 **판정으로 쓰는 것**이 금지된다.
      표에서 판정 열과 반사실 열을 절대 섞지 마라.

# ---------------------------------------------------------------------------
design:
  unit: "R0 (우리 47열, 추가 피처 0개) · fold_2024 (train ≤2023, 1,116,277행) B3-C5"
  what_varies: "**시드 하나뿐이다.** 열·iter 정책·셀·스태커·마스크·라이브러리 전부 동일"
  iter_policy: >
    exp_037 R0와 **동일 경로**: fold_2023 argmin × 스케일. ⚠️ 스케일은
    `res`의 `scale_full`/`scale_mode`에서 읽어라(감사 N1 — 하드코딩 금지).
    ⚠️ **시드마다 fold_2023을 다시 돌려 argmin을 새로 잡을 것인지**가 갈림길이다:
      - 시드가 iter까지 바꾸면 σ는 "시드 + iter 선택"의 합성 변동이 된다
      - iter를 고정하면 σ는 "적합 난수"만의 변동이다
    **후자를 택한다** — exp_037 R0가 쓴 iter를 **9시드 전부에 고정**한다. 근거: 채택
    판정에서 후보와 대조군은 각자 자기 iter 정책을 쓰므로, 우리가 알고 싶은 것은
    **같은 구성에서 시드만 바꿨을 때의 흔들림**이다. ⚠️ **이 선택 자체가 변인이며,
    "iter까지 흔들리는 σ는 이 실험이 재지 않는다"를 리포트에 명시하라.**
  reuse: >
    기존 3시드(42/7/2024)는 **재실행하지 않는다.** exp_037 `res/`·`pred/`의 sha로 승계.
    ⚠️ sha가 어긋나면 **중단하고 보고**하라 — 임의 재실행 금지.

questions:
  Q1: "n=9에서 σ̂는 얼마인가. n=3 값(3.881562551959927e-05)과 얼마나 다른가"
  Q2: >
    **σ는 한두 시드가 끌고 있는가.** 9개 Brier를 전부 나열하고, 각 시드를 하나씩 뺀
    jackknife σ̂를 내라. 하나 뺐을 때 σ̂가 크게 줄면 그 시드가 이상치다.
  Q3: >
    σ̂의 **신뢰구간**을 내라 (χ² 기반, n−1=8 자유도). n=3의 구간과 겹치는지 보고하라.
    ⚠️ 겹치면 "n=3 추정이 틀렸다"고 말할 근거가 없다는 뜻이다.
  Q4: >
    Brier 분포가 **정규에 가까운가, 치우쳐 있는가.** 9개면 눈으로 볼 수 있다.
    치우쳐 있으면 std 기반 문턱 자체가 적절한지에 대한 별개 안건이 생긴다
    (⚠️ **이 실험에서 결론 내지 마라. 관찰만 기록하라**).

# ---------------------------------------------------------------------------
method:
  inherit: "exp_037 `src/` 바이트 승계. 새 코드는 시드 루프와 집계뿐. 전부 sha 기록"
  features: >
    ⚠️ 피처 재생성 금지. R0는 추가 열이 0개이므로 `featdir`조차 필요 없다.
    exp_037 R0와 **완전히 같은 경로**임을 sha로 증명하라.
  autonomy: "exp_037 `driver.sh` 패턴 — `setsid nohup` · 멱등 재개 · PROGRESS.jsonl · HEARTBEAT · `set -uo pipefail`"
  concurrency: >
    **동시 3개 · fit당 스레드 6 고정.** ⚠️ **exp_038이 병행 중이다**(3fit × 6스레드 = 18).
    서버는 40코어이므로 합계 36스레드로 여유가 있으나 **더 늘리지 마라.**
    ⚠️ **exp_038 프로세스를 절대 kill하지 마라.** 원격 디렉터리는 `~/SungjinPark/experiments/exp_039/`로 분리한다.

runtime:
  where: a5000
  expected_min: 100                         # 80~140
  eta_basis: >
    - 드라이버 작성 + 승계 sha 대조: **15분**
    - 신규 6유닛 (fold_2024 1,116,277행, 동시 3개 → 2웨이브):
      exp_036 실측 **23.48/24.74/26.40분**/유닛 → 2웨이브 **50~55분**
    - ⚠️ **exp_038과 경합**: 실행시간 규약의 경합 계수 **1.2~1.5배** → **60~80분**
    - 집계(jackknife·χ² 구간) + 회수 + 리포트: **15분**
    → **90~110분, 범위 80~140분.**
  note: "실측이 140분을 넘으면 즉시 갱신 보고"

deliverables: [metrics.json, report.md, "src/ (승계 sha)", PROGRESS.jsonl, "res/ (9시드)"]

audit:
  required: false
  why: "exp_037 R0와 **완전히 동일한 경로**. 새 소스·조인·타깃 파생·피처 없음. 변인은 시드 난수뿐"
  gate_instead: "기존 3시드 예측 sha 대조. 어긋나면 중단"

changed_vs_exp_037_R0:
  - "1. 시드 6개 추가 (1/13/101/777/2025/31337)"
  - "2. iter를 시드별 재탐색 없이 **exp_037 R0 값으로 고정** (위 `iter_policy` 참조 — 이것이 σ의 정의를 좁힌다)"
  - "⚠️ 그 외 없다. 딸려 바뀐 것이 생기면 여기에 추가하라"

risks:
  - "⚠️ **σ̂가 더 커질 수도 있다.** 그러면 문턱이 올라가고 채택은 더 어려워진다. 그것도 정직한 결과이며, 작아지기를 기대하고 돌리는 게 아니다"
  - "⚠️ n=9여도 상대 추정오차는 약 26%다. **σ를 '확정'하는 실험이 아니라 '덜 틀리게' 만드는 실험**이다"
  - "iter 고정 선택 때문에 이 σ는 '적합 난수만의 변동'이다. iter 선택까지 포함한 변동은 더 클 수 있고 이 실험은 그것을 재지 않는다"
  - "exp_038과 경합해 양쪽 ETA가 함께 늘어날 수 있다. 수치는 영향받지 않는다(스레드 고정 + deterministic)"
