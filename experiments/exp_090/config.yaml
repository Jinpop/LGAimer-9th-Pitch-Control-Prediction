exp_id: exp_090
date: 2026-08-24
title: "딥 팔 학습량 훑기 — 정직면에서 고원을 찾고, 그 자리로 배포 팔을 다시 학습한다"
학습_건수: "OOT 훑기 약 8지점 x 5시드 = 40 fit + 배포 재학습 5 fit (fit 1건 약 12초)"
제출물: "배포 가중치 세트 (후보 빌드는 별도)"

왜: |
  🔴 **S94**: exp_089 실측 — 팀원 딥 팔이 `epoch 2`(720스텝)로 **LB +5.0813180433** 을 냈는데,
     같은 구조를 OOT 면에서 **816스텝으로 올리면 정직면 이득이 +0.948 → +8.731 (9.2배)**, t 는 0.40 → 3.25 다.
     **그 팔은 덜 학습됐다.**
  🟢 **fit 1건이 약 12초다.** 학습량을 축으로 훑는 것을 시간으로 기각할 이유가 없다.
  🔑 이건 새 신호를 찾는 게 아니라 **이미 +5 를 낸 것을 키우는 것**이다. 지금 우리 재고에서 유일하게 자릿수가 맞는다.

  ⚠️ **exp_089 가 남긴 한계 셋을 그대로 안고 간다**:
    ① 정직면 크기는 5.4배 어긋난다(전이비 +0.1866, 유일하게 변인 통제된 점)
    ② 꼭지점 **위치**는 대체로 맞는다(정직면 0.14 vs LB 유도 0.1757) — **위치를 쓰고 크기는 안 쓴다**
    ③ 우리 frame99 와 팀원 프레임이 94열 중 8열 다르다(`i3_anom_*`·`p6_*`) — 모든 측정에 실려 있다

stage1_OOT훑기:
  면: "exp_089 가 만든 정직면 그대로 (모든 팔 out-of-time, 기준점 928.501461058684 재현 확인됨)"
  축: "OOT 딥 팔의 **총 옵티마이저 스텝**. ≤2023 1,116,277행 · batch 4096 → epoch 당 약 272.5스텝"
  지점: "544, 720, 816, 1088, 1360, 1632, 2176, 2720 (약 epoch 2~10). exp_089 가 이미 잰 544·720·816·1088 은 **재사용하고 sha 대조**"
  시드: "5개 (exp_089 와 동일 집합)"
  측정: "각 지점에서 ① `w` 격자 0~0.6 step 0.01 스윕의 최적 `w` 와 이득 ② `w=0.20` 고정 이득 ③ 투수 블록 부트스트랩 1000회 t ④ 단독 재센터링 점수"
  🔴 과적합_감시: "스텝을 늘리면 어느 지점에서 꺾인다. **꺾이는 지점을 찾는 것이 이 단계의 목적**이다. 단조 증가로 끝나면 지점을 더 늘려라"

stage2_배포재학습:
  무엇: "stage1 의 고원 지점을 **행수 비로 환산**해 ≤2024 전량(1,475,092행)에서 5시드 재학습"
  🔴 환산_사전등록: |
    OOT 최적 스텝 s* 를 찾으면 배포 스텝 = s* x (1,475,092 / 1,116,277) = s* x 1.32144.
    ⚠️ **에폭으로 맞출지 스텝으로 맞출지가 애매하다** — 둘 다 계산해 나란히 적고,
    두 값이 다르면 **둘 다 학습해 배포 가중치를 두 벌 낸다**(고르는 것은 지휘자).
  산출물: "배포용 npz 5개(팀원 패키지와 같은 접힌 형식 `A`·`c0`·`T0..T4`·`m.{1,4,5,8,10}.*`) + prep.json"
  🔴 형식_게이트: "우리가 만든 npz 를 팀원 `mate/deep_infer.py` 가 **수정 없이** 읽고 돌려야 한다. 키 17개 형상 일치 + 종단 실행 rc=0"

사전_등록_판정 (🔴 결과 보고 바꾸지 않는다 — S8):
  통과: "stage1 에서 720스텝 대비 **정직면 이득이 유의하게 큰 지점**(t >= 2.0 이고 이득이 720 지점의 3배 이상)이 있으면 stage2 진행"
  기각: "없으면 이 축 종료. exp_089 의 816/1088 관측이 시드 잡음이었다는 뜻"
  🔴 크기예측금지: "정직면 이득에서 LB 이득을 추정해 적지 마라(S78: 54배 사례, S93: 이 축에서 5.4배). **위치와 부호만 쓴다.**"

