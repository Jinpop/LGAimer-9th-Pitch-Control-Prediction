exp_id: exp_025
date: "2026-08-07"
title: "k400_league 이득 중 얼마가 불안정한 투수손 2 셀에 얹혀 있는가"
hypothesis: >
  exp_024가 `k=400 × league`를 3시드로 승격시켰다(+14.73507점, 문턱의 4.4468배).
  그러나 **3시드 통과는 base 모델의 시드 잡음에 대한 이야기이지, 리그 계수가 표본 밖에서
  안정한가와는 별개다.**
  `league`는 적중 행 199,006개 **전부**에 리그 편차 L을 얹는데, 그중 **71.7%(181,677행)가
  투수손 2**이고 이 셀의 L은 빈티지마다 부호가 뒤집힌다:
  2020 −0.0077 → 2021 −0.00061 → 2022 −0.000041 → 2023 **+0.00017** → 2024 **+0.0024**.
  배포 표(≤2024)의 값은 최근 두 빈티지에만 의존하며 2025에서 다시 뒤집힐 근거를 배제할 수 없다.
  → **이득의 얼마가 그 불안정한 계수 위에 있는지 가른다.**
base_exp: exp_024 arm B (k=400 × league)

# ---------------------------------------------------------------------------
arms:
  - id: B_full
    spec: "k=400 × league, 리그표 4셀 전부 사용 (= exp_024 arm B, 승격된 구성)"
    role: "대조군 — exp_024 수치를 재현해야 한다"
  - id: B_ph1only
    spec: "동일하되 **L(투수손 2, ·) = 0으로 강제**. 투수손 1 행만 리그 보정을 받는다"
    role: "절제 arm — 불안정한 셀을 껐을 때 남는 이득"
  - id: A_deployed
    spec: "k=111 × self (배포 중인 d)"
    role: "기준선 — 세 arm을 같은 눈금에 놓기 위해"
  note: >
    **`B_full − B_ph1only`가 투수손 2 셀의 기여**이고, **`B_ph1only − A_deployed`가
    불안정한 계수 없이 남는 이득**이다. 후자가 크면 절제 판본으로 출하하는 선택지가 생긴다.

# ---------------------------------------------------------------------------
method:
  no_training: true
  reuse: >
    exp_024가 **B3 base 예측 7개를 `pred/`에 보존**했다(fold_2024 × 3시드 + 블록 × 2시드,
    시드 42 블록은 exp_022/023 것). 학습이 전혀 필요 없다. **sha 대조 후 재사용**(규약 #5).
  ablation_point: >
    리그표 산출은 그대로 두고 **적용 시점에 L[2,*] = 0.0으로 덮어쓴다.** 표 생성 코드
    (`backoff.py`)는 leak-auditor가 독립 재계산으로 검증한 것이므로 **바이트 보존**하고
    sha를 기록하라. 절제는 산출된 표에 대한 마스킹으로 구현한다.
  beta: "arm마다 공급 블록(2022+2023)에서 닫힌 해로 재적합. β는 변인이 아니라 종속 산출값"
  seeds: [42, 7, 2024]

validation:
  primary_metric: "fold_2024 valid_all(R+F) Brier"
  gate: >
    `B_full`이 exp_024 arm B를 재현해야 한다 —
    seed 42 **0.24799968498605615**, seed 7 **0.24801856644746204**,
    seed 2024 **0.2480065100917605**, 각각 abs_diff < 5e-6.
    `A_deployed`도 마찬가지(0.2480377446210693 / 0.24805404666887054 / 0.2480433978958496).
  segments: "투수손 1(71,830행) / 투수손 2(181,677행)를 반드시 나눠 보고. 적중/미적중도"
  never: "valid 2024를 보고 절제 여부나 β를 고르는 경로 없음"

# ---------------------------------------------------------------------------
# 함께 답할 것 — 빈티지 민감도
# ---------------------------------------------------------------------------
vintage_probe:
  what: >
    fold_2024용 리그표를 **≤2022 빈티지로 바꿔** 끼웠을 때 `B_full`의 fold_2024 성적이
    얼마나 흔들리는지 잰다. ⚠️ 이는 **as-of 규율 위반이 아니다** — ≤2022는 ≤2023보다
    **더 과거**이므로 리크 방향이 아니다. 오히려 "표가 낡으면 어떻게 되는가"를 재는 것이다.
  why: >
    2025 test에서 우리가 쓰는 표는 ≤2024다. 그 표가 2025에 대해 얼마나 낡았는지는 알 수 없지만,
    **한 시즌 낡은 표를 썼을 때의 손실**을 재면 민감도의 규모를 알 수 있다.
  discipline: "진단이다. 이 결과로 arm을 바꾸지 말라."

runtime:
  where: a5000
  expected_min: 12                          # 8~18
  eta_basis: >
    학습 없음. exp_023이 같은 기계로 격자 14 arm × 1시드를 **계산 0.4분**에 처리했고,
    exp_024의 `fit_arms`(2 arm × 3시드)는 **0.36분**이었다. 이번은 3 arm × 3시드 + 빈티지
    프로브라 계산은 1분 미만. 코드 수정·게이트·집계·회수 포함 **8~18분**.
    ⚠️ exp_024에서 벽시계 2시간 20분을 잃은 원인은 계산이 아니라 프로세스 확인 오류였다
    (§10). `pgrep` 패턴은 **ERE이므로 `\|`가 아니라 `|`**를 쓰고, 발사 직후 실제로 잡히는지
    검증하라.

deliverables: [metrics.json, report.md, "src/ (승계분 sha)", "pred_*.npy"]

audit:
  required: false
  why: "exp_024와 동일 경로. 새 소스·조인·타깃 파생 없음. 절제는 산출된 표의 마스킹"
  note: "제출로 갈 때는 예외 없이 감사"

risks:
  - "절제해도 이득이 거의 그대로면 → 투수손 2 셀은 사실상 무기여이고 위험만 안고 있던 셈. 절제 판본이 더 안전한 출하 후보가 된다"
  - "절제하면 이득이 크게 준다면 → +14.7점의 상당 부분이 부호가 흔들리는 계수 위에 있다는 뜻. 그 사실을 알고 출하 여부를 정해야 한다"
  - "어느 쪽이든 2025에서 실제로 어떻게 되는지는 이 실험이 답하지 못한다"
