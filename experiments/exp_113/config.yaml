사전등록:
  화면: exp_102 sA_mix.py / exp_097 sB1_rebase.py 정직면 혼합 (고친 f64 OOT 입력, S134)
  판정량: "argmax_{w,steps} gain(실제 열) − argmax_{w,steps} gain(N1 개수맞춤 무작위 열)"
  왜_N1_기준선: "열을 더하는 것 자체에 고정 대가가 있다 (S183: 3열에 약 −4점).
                무변형 기준선 대비로 읽으면 모든 피처 추가가 손해로 보인다."
  1σ_정의: "sqrt(짝지은 투수블록 부트스트랩 se² + 적합간 sd²).
            적합간 sd 는 이 화면에서 서로소 5시드 묶음 3개(PR·N1_PR @1632)로 직접 재되,
            exp_107 실측 '두 점 차' 2.1570652801242445 보다 작게 나오면 그 값을 쓴다(보수적)."
  크기_문턱: 2.4390243902439024      # = LB 검출한계 1.4 ÷ 팀 원장 '팔 추가' 전이계수 0.574
  t_문턱: 2.0
  승격: "둘 다 만족"
  귀무_셋: ["N1 = 기존 94열 중 무작위 k개를 (season,pitcher_id) 안 순열  ← 기준선",
            "N2 = 같은 열을 (season,pitcher_id) 안 순열",
            "N2b = 같은 열을 pitcher_id 안에서만 순열 (시즌 가로지름, 더 무름)"]
  귀무_뒤집힘: "둘 이상에서 판정이 뒤집히는지 본다 (S179)"
  기준선_94열: "서로소 5시드 묶음 5개 (seed 42..7 / 11..23 / 29..43 / 47..67 / 71..89),
                exp_097·exp_102 산출물 재사용. 단일 뽑기 26.2698 은 평균보다 +0.78 위다(S187)."

열_선별_규칙:   # 라벨을 안 보고, 결과를 보기 전에 확정
  ①: "기존 94열과의 max|ρ| <= 0.90"
  ②: "기존 94열의 선형 스팬 밖 분산 비율 1−R² >= 0.10
       (OLS 는 ≤2023 에서 적합, R² 는 2024 에서 — 표본 밖)
       🔑 근거: 딥 팔의 첫 은닉층은 수치 입력에 대해 정확히 선형이다
          (arch097.TokenMLP: t = x·w + b → concat → Linear).
          기존 열의 선형결합은 표현력을 한 톨도 안 늘린다."
  ③: "살아남은 것끼리 |ρ| > 0.95 면 앞의 것만 남긴다"
