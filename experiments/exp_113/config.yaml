exp_id: exp_113
title: "투수 in-season 분해 확장 → 딥 팔 입력 (99열 → 99+k)"
date: 2026-08-27
type: 팔 추가/확장 (전이계수 0.574 계열)

동기: |
  상수 축은 전부 긁어도 +3~8 이고 필요분은 +19.1 이다. 큰 것은 전부 팔에서 나왔다
  (팀원 딥 팔 +5.08 · 후보 CE 학습량 +4.83 · 팀원 sp 부호 +6.65).

  🔑 **장부가 어디를 파야 하는지 이미 적어 놨다 (S176, exp_103 부산물)**:
     "`ins_*` 계열의 값은 타자가 아니라 **투수 쪽**에 실려 있다 — `ins_p_success` 가 중요도
      1·2·6위인데 `ins_b_middle` 은 12위로 한 자릿수 차이다.
      **투수 in-season 분해를 더 파는 쪽이 자릿수가 크다.**"
  exp_103 은 **타자 쪽**을 파서 0 을 얻었다. S176 은 그게 반대쪽이었다고 말한다.

  🟢 **그리고 지금은 싸다** — S101 정정: 딥 팔에 열을 더하는 데 `mate/deep_infer.py` 수정 **0줄**
     (배포는 접힌 아티팩트를 쓰고 99 하드코딩이 `_fold` 안에만 있다). 바꿀 것은
     `prep.json` 의 NUM/mu/sd · `deepf_s*.npz` 의 `A` 형상 · `mate/script.py` 약 5줄.

  🔴 **S82 가 우리 8연속 실패를 분해했다** — 전부 ① 같은 67열 ② 바깥 블렌드 자리
     ③ ≤2023 측정용 학습이었다. 성공한 딥 팔은 ① 99열 ② 파트너 내부 로짓 교체 ③ ≤2024 전량.
     이 실험은 셋 다 성공 쪽 조건이다.

🔴 배포 가능성이 설계의 1번 제약 (S170):
  추론에 쓸 수 있는 것은 둘뿐이다 —
    ① 그 행 자신의 열 (운영진이 준 `asof_*` 포함)
    ② train 동결표를 키로 조회한 값
  **다른 test 행을 훑으면 규칙 2-4 위반(실격)이다.**
  `inseason.py` 가 이미 그 형태다 — `round(n·rate)` 로 통산 카운트를 복원하고
  train 동결 앵커와 차분한 뒤 EB 수축한다. **이 실험은 그것을 투수 쪽으로 넓힌다.**
  🔴 **자기검증 게이트**: KEEP 몇 행만 남기고 나머지 전 행을 교체했을 때
     KEEP 행 피처가 **정확히 0.0** 움직이는가.
  🔴 **시간축 게이트**(S171): season ≥ 2024 라벨을 전량 난수화해도 season-2024 피처가 비트 동일한가
     (양성 대조 = ≤2023 난수화는 움직여야 한다).

설계:
  0_먼저: |
    🔴 **`prep.json` 의 NUM 94열 + CAT 5열을 전수 읽어라. 비용 10분.**
    S174 가 정확히 이것을 안 해서 이미 출하된 `ins_b_*` 5열을 재발명했다.
    `inseason.py` 를 통독해 **투수 쪽이 지금 무엇을 이미 내놓는지** 목록으로 만들어라.
    그 목록에 없는 것만 후보다.
  A_후보열: |
    투수 in-season 분해의 미출하 성분. 예 — 구종 믹스 in-season 편차 · 실패유형별
    in-season 편차 · 최근 등판 창(`asof_pitcher_prev1/3/5_*`)과 통산 앵커의 차분 ·
    카운트/손 조합별 in-season 편차. **전부 위 배포 제약 안에서 만들 수 있는지 먼저 확인하라.**
    🔴 **기존 94열과 max|ρ| 를 내고 0.9 넘는 것은 버려라** (S174 의 준중복 함정).
  B_학습: |
    딥 팔에 열을 더해 재학습. **정직면(≤2023 → 2024)** 과 **배포(≤2024)** 둘 다.
    각 지점을 **자기 argmax 학습량**에서 평가(S183) · `w_deep` 자유(S97).

🔴 귀무 대조 (S104·S175·S183 — 다섯 번 판정을 뒤집었다):
  N1  "같은 개수의 무작위 열 추가"      → 🔴 **이게 기준선이다.** 기준선 대비가 아니라 이것 대비로 읽어라
  N2  "같은 열을 (season, pitcher_id) 안에서 순열"  → 형태만 남기고 정보 제거
  N3  "무변형 항등 복제본"              → 사다리 맨 아래(S135)
  🔴 귀무를 둘 이상 쓰고 판정이 뒤집히는지 보라(S179).

🔴 사전 등록 문턱 — 결과를 보고 바꾸지 않는다 (S8):
  🔴 **먼저 이 화면의 1σ 를 재라**(S187 — 같은 +2.5 가 계열에 따라 0.5σ 도 되고 2σ 도 된다).
     팔을 바꾸는 변형은 exp_104 실측 **4.654**, 열 3개 더하는 섭동은 exp_103b 실측 **1.19~2.70**.
     이 실험은 그 사이다 — **서로소 5시드 묶음 ≥3 개로 직접 재고 그 값을 쓴다.**
  승격 = `(실제 열 − N1 개수맞춤 무작위)` 가 `t ≥ 2.0` AND 크기가 **LB 환산 ≥ +1.4**(검출한계).
     전이비는 **팔 추가 0.574**(팀 원장). 정직면 요구치를 계산해 config 에 적고 시작하라.
  ⚠️ 기준선은 **서로소 5시드 묶음 ≥3 개의 평균**(단일 뽑기는 평균보다 +0.78 위다, S187·S194).

자원: GPU 2장. CPU 6코어. ⚠️ `exp_112` 가 CPU 2 를 쓰는 중 — 남겨 둘 것.
ETA: 3~4시간. 근거 — 딥 fit 약 12초(S94) · exp_104 가 486 fit 을 1시간 15분에 돌렸다.
     열 만들기 40분 + 스크린 2시간 + 게이트·기록 1시간.
산출물: experiments/exp_113/metrics.json + 보고

