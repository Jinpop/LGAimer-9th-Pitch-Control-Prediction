## 🔴 추가 과업 — exp_065·066 결론을 배포 가능한 팔로 재확인한다
## ══════════════════════════════════════════════════════════════
왜: >
  exp_065(면 A 908.27283)와 exp_066(914.75173, 게이트 6.626σ)은 전부 **exp_064 의 896.38369 판**으로 쟀다.
  exp_068 이 그것을 **배포 불가 상한**으로 판정했다(배포 가능한 판은 829.82499, −66.5586).
  🔴 **노선 A 의 근거가 그 두 실험이므로, 배포 가능한 팔에서도 살아남는지 지금 확인해야 한다.**
  같은 캐시 벡터 위 산술이라 비용이 거의 없다.
재확인_1: "NN(k=8) + AA67 — exp_065 면 A 재계산. 원래 w*=0.75 / 908.27283 / AA단독 대비 +108.39147"
재확인_2: "NN(k=8) + AA81 — exp_066 재계산. 원래 w*=0.67 / 914.75173 / AA단독 대비 +76.30864 / 6.626σ"
🔴 게이트_승계: "exp_066 사전 등록 그대로 — w>0 · AA81 단독 대비 ≥+3점 · 개별 4시드 부호 4/4 · 평균 ≥ 3×std(ddof=1). **문턱을 낮추지 마라.**"
🔴 함의_미리_적어둠: >
  **탈락하면 노선 A 의 근거가 사라진다.** 그 경우 C단 빌드로 넘어가지 말고 보고하라.
  통과하면 이득이 몇 %로 줄었는지 exp_066 대비로 적어라(exp_066 이 exp_065 대비 70.40% 였던 것과 같은 형식).

