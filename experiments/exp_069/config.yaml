못하는_것: >
  **"우리 NN 이 팀원 NN 보다 낫다" 를 말할 수 없다.**
  팀원의 out-of-time NN 벡터가 아직 없다(torch 미설치, 학습기 재작성 필요).
  이 실험이 비교하는 것은 **우리 NN vs NN 없음** 이다. 그 이상으로 읽지 마라.
  ⚠️ 두 NN 은 애초에 다른 모델이다 — 팀원 것은 159차원·임베딩 7개, 우리 것은 99열·임베딩 5개.

