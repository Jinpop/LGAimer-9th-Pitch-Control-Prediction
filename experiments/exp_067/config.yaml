## stage 1 — 배포 학습 마스크 확정
## ══════════════════════════════════════════════════════════════
문제: >
  exp_064 의 fold 마스크는 `(s <= 2023) & ~((s <= 2022) & (g == 'F'))` → 1,116,277행이었다.
  배포는 ≤2024 이므로 같은 규칙을 한 시즌 밀면 `~((s <= 2023) & (g == 'F'))` 가 된다.
  **추측하지 말고 검증하라.**
검증_게이트: >
  🔴 배포 팔의 실측 학습 행수는 **1,369,784** 다(`build_AY/logs/fit_42_T70.log` 의 `n_full`).
  train 전량이 1,475,092 이므로 차이는 105,308 행.
  **위 규칙이 1,369,784 를 정확히 재현하는지 대조하라.** 안 맞으면 규칙이 틀린 것이다 —
  맞는 규칙을 찾아 근거와 함께 보고하고, 못 찾으면 중단하라.

