## 🔴 stage 0 — 실현 가능성 게이트. 여기서 막히면 재학습을 하지 않는다.
## ══════════════════════════════════════════════════════════════
왜_먼저: >
  후보 BM 이 정확히 여기서 죽었다 — 출하 `aa_infer.py` 가 셀 확률을 함수 밖으로 안 내놔서
  32분을 쓰고 zip 없이 끝났다. **같은 실수를 반복하지 않는다.**
  ⚠️ 그때 든 진단 비용은 그대로 들었다("빌드 안 함 = 시간 0" 이 아니다) — 그래서 **가장 싼 검사부터** 한다.

묻는_것:
  Q1: "NN 의 99열이 **추론 시점 test 행에서** 실제로 만들어지는가."
  근거_기대: >
    `mate/pipeline.py` 가 v6·Q 를 위해 이미 그 열들을 test 에서 만든다(exp_062 가 우리 것과
    바이트 동일 확인, sha a3181a10a1c621524460f14bc06b3c7f188fe23955814bb5e5b890e0df3016c9).
    99열 = 그 44열 + ins 16 + sp 6 + 범주 5 + 나머지. **각 열이 어느 모듈에서 나오는지 전량 대조하라.**
  Q2: "빠진 열이 있는가. 있으면 몇 개이고 어느 모듈 소관인가."
  Q3: "출하 시 상이·추가 파일이 몇 개인가"  # script.py · nn 추론 코드 · npz 4벌 · meta
  Q4: "추론 시간. 현행 zip 실측 1분 30초 + NN 추론(exp_060 실측 2.35초). 제한 대비 여유는."
  Q5: "🔴 R/F 분기 규칙이 NN 에 정의돼 있는가. 없으면 그것은 **이번 턴에 새로 만드는 자유도**다(BM 중단 사유 2번과 같은 종류)."

🔴 정지_조건: >
  Q1 이 '아니오'이거나, Q2 의 빠진 열을 채우려면 **새 표·새 조인·새 상수**가 필요하면 —
  **중단하고 보고한다. stage 1·2 로 넘어가지 마라.**
  Q5 에서 새 자유도가 생기면 그것도 중단 사유다(사용자 판단 사항).

