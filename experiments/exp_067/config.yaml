mu_sd: "학습 분할에서만 계산"
🔴 에폭_선택_불가: >
  ≤2024 전량 학습에는 **out-of-time valid 가 없다**(2025 는 라벨이 없다).
  exp_064 는 valid 2024 로 best epoch 를 골랐다(sel_epoch 5~11로 시드마다 달랐다).
  배포에서는 그 장치가 없으므로 **에폭 선택 규칙을 미리 못 박아야 한다.**
  사전 등록: **OneCycle 25에폭 완주(take='last')**. 근거 — exp_060 실측에서 어닐링 구간이
  과적합을 만들었으나(valid 0.24779→0.24805) 그건 15에폭 예산이었고, exp_064 의 25에폭 구성은
  네 시드 모두 25에폭 완주 스케줄 위에서 측정됐다.
  ⚠️ **이 선택 자체가 변인이다.** exp_064 는 best-epoch 판이고 배포는 last-epoch 판이다.
  **둘 다 만들어 fold_2024 에서 차이를 재고 기록하라**(배포본은 last, 대조용으로 best 도 보관).

