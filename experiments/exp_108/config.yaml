exp_id: exp_108
title: "딥 팔 초기화 스케일 — exp_091~107 이 한 번도 안 훑은 축"
date: 2026-08-26
type: 팔 손질 (딥 슬롯) — 단 미시도

동기: |
  팀원 회신(2026-08-26)에 이 줄이 있었다:
    "제143이 이 방에서 직접 재빌드한 것(초기화 N(0, D^-0.5) → 833.70 → 872.39)"
  단독 +38.69 이고 우리 딥 팔 단독 864.84 를 넘는다.

  🔴 그리고 우리는 이 축을 한 번도 안 훑었다. exp_104 31지점 전수 확인:
     B=폭·깊이 · C=dropout·wd · D=열 마스크 · E=focal·라벨스무딩 · F=잔차 · G=멀티헤드.
     **초기화 없음.** exp_091·092·093·102·107 config 에도 없다.
  즉 "딥 슬롯 손잡이 폐쇄(0/31)" 는 이 축을 포함하지 않는다.

  🟢 출하된다 — 초기화는 학습에만 영향을 주고 형상을 안 바꾼다.
     `mate/deep_infer.py` 수정 0줄이어야 한다(exp_107 이 같은 성질을 확인했다).

축:
  A_스케일: |
    현 배포 초기화를 먼저 **코드에서 읽어 기록**하고(추측 금지), 그것을 기준으로 스케일을 훑는다.
    팀원이 쓴 N(0, D^-0.5) 를 반드시 포함할 것. 그 밖에 D^-0.25 · D^-0.75 · 현행×{0.5, 2}.
  B_학습량_교차: |
    🔴 초기화는 학습량과 상호작용한다(S94: 이 팔은 덜 학습됐다).
    각 초기화 지점을 **자기 argmax 학습량**에서 평가하라(S183). 최소 {816, 1632, 2720}.
  C_층별: |
    A 최선이 문턱 근처면 층별 스케일(입력층만 / 은닉만 / 출력층만)로 한 겹 더.
    A 가 명백히 죽으면 C 는 하지 마라.

  각 지점의 `w_deep` 도 자유로 둔다(S97).

🔴 사전 등록 문턱 — 결과를 보고 바꾸지 않는다 (S8):
  이 화면의 잡음은 실측돼 있다. exp_104 S187 = 4.654, exp_107 재측정 = 4.105.
  🔴 **보수적인 쪽(4.654)을 쓴다** → 승격 = (혼합 이득 − 기준선) >= +9.31 AND t >= 2.0
  ⚠️ 기준선은 **서로소 5시드 묶음 3개 이상의 평균**을 쓴다(단일 뽑기 26.2698 은 평균 25.4866 보다 +0.78 위다, S187·S194).

귀무 대조 (S104·S135·S179):
  N3  "무변형 항등 복제본"        → 🔴 사다리 맨 아래. 없으면 귀속이 안 된다
  N4  "같은 스케일을 *무작위 층 순서*로 적용"  → 스케일의 *형태*만 남긴다
  판정이 귀무 선택에 따라 뒤집히면 그건 판정이 아니다.

반드시 함께 보고할 것:
  - 지점마다 `ρ(z_mate)` · 팔 단독 · 혼합 이득 셋 다.
    🔴 **S103 교환율은 절대값에 쓰지 마라** — exp_107 이 평균 편의 +4.483 을 실측했다(상관 0.93, 순위만 유효).
  - 팀원 관측(833.70 → 872.39)이 **우리 면에서 재현되는가.** 재현 안 되면 그 사실 자체가 결과다
    (G-NNREPRO 와 같은 계열 — 방이 다르면 딥 수치가 안 맞는다는 기록이 이미 있다).
  - 출하 가능성: `mate/deep_infer.py` 수정 0줄 · `hid` 형상 불변 · `n_params` 불변. 확인하고 적어라.

게이트:
  - 기준선 재현: `train104.py` 기본 경로가 `exp097/z_F1632_f64o_s42` 와 sha256 동일
  - 면 재현: `baseline_w0_rc = 928.501461058684`
  - 초기화만 바꿨음의 증거: 같은 시드·같은 스텝에서 **초기화 스케일 1.0 판본이 기준선과 비트 동일**

자원: GPU 2장 자유. CPU 5코어 상한. 재학습은 딥 팔만(다른 팔 금지).
ETA: 1~1.5시간. 근거 — 딥 fit 1건 약 12초, 지점 약 8개 × 시드 5 × 학습량 3 ≈ 120 fit.
     exp_107 실측이 212 fit 에 약 1시간이었다.
