exp_id: exp_081
date: 2026-08-22
title: "수확 캠페인 종단 시뮬레이션 — '+5를 낸다'를 실제 라벨 위에서 입증한다"
학습_건수: 0
제출물: "없음. 슬롯 0"

왜_이것이_입증인가: |
  캠페인의 주장은 **전이 가정을 쓰지 않는다.** 지금까지 실패한 축은 전부 "한 면에서 추정 → 다른 면에 배포"였고
  전이비가 0.3929~0.5463 에 부호까지 갈렸다(S2). 캠페인은 **채점되는 그 집합에서 직접 L 을 산다.**
  → 따라서 **실제 라벨이 있는 고정 집합 위에서 같은 절차를 종단으로 돌리면 그 자체가 입증이다.**
  LB 를 대신할 고정 집합: 정직면 OOT 2024 (253,507행, 실제 라벨, 팔 전부 out-of-time).
  🔴 이것은 "정직면 이득"을 재는 것이 **아니다** — 정직면을 *채점 서버 역할*로 쓰는 것이다.

절차_LB와_동형으로:
  평가면_E: "정직면 OOT 2024 253,507행. 실제 라벨 보유. **여기서 가져오는 정보는 축당 스칼라 1개(점수)뿐이다.**"
  대리면_P: "보정 tr2024. G 를 여기서 계산한다 — 실전과 똑같이 **다른 프레임에서 온 G** 를 쓴다"
  🔴_규율: |
    ① E 의 라벨을 직접 보지 마라. 축 j 마다 **점수 하나**만 읽는다 (제출 1회 = 스칼라 1개).
    ② G_jj 는 반드시 **P** 에서 계산한다. E 에서 계산하면 실전보다 유리해져 입증이 무효다.
    ③ L_j = [g_j/K + u_j²·G_jj^P] / (2·u_j) — 실전 공식 그대로.
    ④ 착륙 u*_j = L_j / G_jj^P. 그 점의 **실제 점수를 E 에서 다시 재라.**
    ⑤ 축은 반드시 **직교화 후** 사용 (S19). 비대각 최대값을 보고하라.

stage1_실축_15방향:
  축: "exp_080 stage4 목록 + BR 진단이 확정한 q_league 4축 = q_beta · q_league{11,12,21,22} · cellres_u1 · 셀 8개 · v6_CAT_vs_NN"
  낼_것:
    - "축별 (u_probe · g_probe · 회수한 L · u* · 예측 이득 · **E 에서 실측한 이득**)"
    - "동시 착륙의 **예측 총액 vs 실측 총액**"
    - "🔴 G 를 P 에서 쓴 대가 — E 의 G 로 풀었을 때와의 차"
    - "잡음바닥 15 × K'·Brier/N' 와의 비교"

stage2_위약_대조:
  왜: "🔴 이게 핵심이다. '신호가 있어서 벌었다'와 '자유도를 사서 벌었다'를 갈라야 한다"
  방법: |
    같은 절차를, **신호가 없도록 만든 무작위 직교 방향 15개**로 R = 200회 반복한다.
    무작위 방향은 δ 공간에서 뽑되 이미 산 15축과 {1,x,x²} 에 직교화한다.
    각 회차마다 stage1 과 **완전히 같은 절차**(P 에서 G, E 에서 스칼라 1개씩, 착륙, 실측).
  낼_것:
    - "실현 총액의 분포 (평균·표준편차·5·50·95 분위)"
    - "**P(총액 ≥ 5.0)**"
    - "이론 예측 15 × K'·Brier/N' 와 평균의 차 — 일치해야 기계가 옳다"
  🔴: "위약이 평균 5.87 근처에서 나오면 **'아무 방향이나 15개 사면 +5.87'이 실측으로 입증된 것**이다"

stage3_슬롯_민감도:
  질문: "슬롯 수 m 을 5·10·13·15·20 으로 바꾸면 P(≥5) 가 어떻게 되는가"
  방법: "stage2 의 200회를 m 별로 재사용(부분집합) 하거나 재실행"
  낼_것: "m 별 (평균 · sd · P(≥5))  — 사용자가 슬롯 배분을 결정할 표"

stage4_정밀도_현실성:
  질문: "LB 가 소수점 10자리를 주는데 그 정밀도로 L 이 충분히 정확한가"
  방법: |
    stage1·2 의 g 를 **소수점 10자리로 반올림**해 다시 풀고 실현 총액이 얼마나 달라지는지.
    그리고 G^P 에 ±25%(계보 실측 프레임 간 산포) 오차를 인위로 넣어 손실을 재라.
  낼_것: "반올림 손실 · G 오차 25% 의 손실(이론은 (1−0.75)²=6%) · 둘의 합"

사전_등록_판정:
  A: "stage2 위약 평균 ≥ 5.0 이고 P(≥5) ≥ 0.6 → **캠페인은 입증됐다.** 슬롯만 있으면 +5 는 나온다"
  B: "위약 평균 3.0~5.0 또는 P(≥5) 0.3~0.6 → 부분 입증. m 을 늘려야 하는 양을 stage3 에서 읽는다"
  C: "위약 평균 < 3.0 → **환율 이론이 틀렸다.** 그 경우 이유를 규명하는 것이 이 실험의 산출이다"
  🔴: "결과를 보고 문턱을 바꾸지 않는다 (S8)"

