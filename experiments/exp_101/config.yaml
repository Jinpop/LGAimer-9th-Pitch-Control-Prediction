exp_id: exp_101
title: "TabPFN 팔 — 관문 3개 (규정·출하가능성 → 추론시간 → 신호)"
date: 2026-08-25
owner: orchestrator
training: 소량 (TabPFN 은 in-context 학습이라 gradient 학습이 없다)

배경:
  왜_다시_보나: |
    우리는 08-05 에 TabPFN 을 **"규모상 주력 불가"** 로 닫았다(`해커톤_전략.md:70`, `exp_000` EDA).
    🔴 **그 판단은 *주력 모델* 기준이었다. 지금 필요한 것은 주력이 아니라 팔 하나다.**
    - 팀 원장에서 **살아 있는 유일한 범주가 "팔 추가"**(전이계수 0.574)다.
    - exp_096 이 닫은 것은 *"같은 99열 위의 다른 MLP 아키텍처"*(어텐션·LR스케줄·순위변환·시퀀스)이지 **다른 모델 계열**이 아니다.
    - S103 교환율: `ρ` 0.01 = 팔 단독 15.82점. TabPFN 은 **합성 prior 로 사전학습된 완전히 다른 계열**이라
      우리 GBDT·MLP 군과 구조적으로 가장 멀다 — 지금까지 시도한 어떤 변형보다.
    - S83: 딥 팔 자신이 mate 와 `ρ 0.9539` 인데 +5.08 을 벌었다. **문턱은 "얼마나 다른가"가 아니라 "같은 자리에서 더 나은가"다.**
  규정_현황:
    - "`대회정보.md:61` — 사전학습모델은 **공개 가중치 + 비상업적 이용 허용 라이선스(MIT, Apache 2.0 등)만** 가능"
    - "`대회정보.md:161` — TabPFN 조건부 가능, **오프라인 로드(가중치 동봉) 필수**"
    - "정찰 08-20 — 운영진: synthetic-only TabPFN 공개 체크포인트는 **라이선스 조건 충족 시 가능**"
    - "⚠️ 미답변 질문 1건 — *비상업 한정* 라이선스 사전학습모델 가부(참가자 질의, 미답변). 이 실험 결과와 무관하게 사용자가 추적한다."

# ─────────────────────────────────────────────────────────────
관문A_출하가능성:      # 🔴 여기서 막히면 나머지는 볼 필요가 없다. 먼저 한다.
  A1_라이선스: |
    TabPFN(v2 이상) 가중치·코드의 **실제 라이선스 문구를 원문에서 확인**하라(패키지 `LICENSE` 파일, 모델 카드).
    MIT/Apache 2.0 계열이면 통과. **비상업 한정(NC)이면 🔴 관문 실패로 적고 중단**하라 —
    운영진 미답변 질문에 걸려 있어 우리가 판단할 수 없다.
  A2_라이브러리_봉인: |
    🔴 **채점 서버에는 Python 3.11 / numpy 1.26.4 / pandas 2.0.3 / sklearn 1.8.0 / torch 2.7.1 밖에 없다.**
    `pip install tabpfn` 이 안 된다. **모델 구조 코드를 zip 안에 넣고 `state_dict` 를 torch 로 직접 적재**해야 한다.
    → 실제로 해 보라: TabPFN 패키지에서 **추론에 필요한 모듈만 떼어내** 위 5개 라이브러리만으로 돌아가는지.
    돌아가면 그 최소 코드와 의존 목록을 산출물로 남겨라. **안 되면 관문 실패다.**
  A3_크기: "가중치 파일 크기. 현 zip 이 80.4 MB 다. 합쳐서 제출 가능한 크기인지 확인하라(대회 규격 확인)."
  A4_GPU_가정: |
    🔴 **채점 서버에 GPU 가 있다고 가정하지 마라.** 규격에 명시가 없다 — `대회정보.md`·`orchestration/scout_log.md` 를 확인하고,
    근거가 없으면 **CPU 전용으로 판정**한다. GPU 수치는 참고로만 병기하라.
  중단조건: "A1~A3 중 하나라도 실패하면 관문B 로 가지 말고 즉시 보고."

# ─────────────────────────────────────────────────────────────
관문B_추론시간:        # 🔴 이것이 진짜 관문이다.
  🔴_눈금: |
    **채점 서버 ≈ 우리 6스레드 ÷ 1.60** (S122 실측 4건 1.594~1.683). 보수적으로 재려면 ÷1.68.
    🔴 **1스레드로 채점 서버를 추정하지 마라** — 파이프라인마다 스레드 확장성이 달라 비 가 3.71~4.39 로 흩어진다.
    **반드시 6스레드로 재고, 단독 실행(경합 없는 창)에서 재라**(S120: 다른 세션이 붙으면 +13.5% 튄다).
  예산_실측근거:
    현_패키지_6T: "185.46초 (부모 CH, `build_CJKL` G4 단독 측정)"
    채점서버_환산: "115.9초 = 예산 600초의 19.3%"
    남는_여유: "채점서버 484초 → **우리 6T 로 775초**"
    🔴_판정선: "TabPFN 단독이 **우리 6T 542초(여유의 70%)를 넘으면 관문 실패**. 387초(50%) 이내면 여유 있음."
  측정_방법:
    - "test 프레임 **245,789행 전량**을 실제로 예측하는 시간. 부분 측정 후 곱하지 말고 전량을 돌려라."
    - "in-context 문맥 크기(학습 서브샘플 행수)와 앙상블 개수를 바꿔가며 **시간-정확도 곡선**을 내라 — 시간이 모자라면 어디를 깎을지 정해야 한다."
    - "청크 크기를 조정해 메모리 초과를 피하되, **청크가 test 다른 행을 참조하지 않는지** 확인하라(규칙 2-4)."
  🔴_규칙_2_4_경고: |
    **in-context 학습의 '문맥'은 반드시 train 에서 온 고정 표여야 한다.**
    test 행을 문맥에 넣으면 **즉시 실격**이다(규칙 2-4). 문맥은 빌드 시점에 동결하고 zip 에 넣는다.
    이 점을 코드 구조로 강제하고, 실험 종료 후 leak-auditor 감사 필수.

# ─────────────────────────────────────────────────────────────
관문C_신호:            # 관문 A·B 통과 시에만
  면: "정직면(OOT) — 전 팔 ≤2023 학습 → 2024 평가. 🔴 **exp_097 이 고친 f64 입력**을 써라(S134·S145)."
  기준선: "고친 면의 2팔 최적 = **26.2698** (1632스텝, w=0.43). 결함면 값 13.7143 을 쓰지 마라."
  혼합형태: "z_inner(w, w2) = (1−w−w2)·z_mate + w·z_deep + w2·z_tabpfn,  w+w2 ≤ 1 — exp_096 과 같은 3자유도 격자"
  🔴_사전등록_문턱:
    - "격자 argmax 이득 − 26.2698 ≥ **+2.5**"
    - "**그리고** 기준점 대비 짝지은 투수 블록 부트스트랩 **t ≥ 2.0**"
    - "결과를 보고 바꾸지 않는다(S8). exp_096 이 크기는 넘고 t 에서 죽은 전례가 있다."
  진단으로만: "ρ(z_tabpfn, z_mate) · ρ(z_tabpfn, z_deep) · 단독 점수 · S115 시드 대역(0.92756 [0.91064, 0.93932])과 대조"
  ⚠️_함정: "S72 — 다양성은 **같은 시드 수·같은 학습 구간**에서 재라. S86 — 학습 구간이 다르면 상관이 통과 쪽으로 편향된다."

자원_규율:
  - "🔴 파일 삭제 0건 · 외부 프로세스 kill 0건 — 사용자 승인 없이는 어느 쪽도 하지 않는다."
  - "🔴 CPU: 후보 CP 감사가 돌고 있다. **관문B 의 시간 측정만은 단독 창**에서 하고, 그 외에는 4코어 상한."
  - "GPU 2장은 비어 있다 — 관문A·C 의 탐색에 써도 되나 **관문B 판정은 CPU 6스레드**다."
  - "디스크 여유 297G(95% 사용). 가중치·문맥 표를 20GB 넘기지 마라."

