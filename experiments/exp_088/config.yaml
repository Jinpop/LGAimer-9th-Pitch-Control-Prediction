exp_id: exp_088
date: 2026-08-24
title: "두 번째 딥 팔 — 배포 학습량(≤2024)으로 다시 재고, 팀원 딥 팔과의 중복도부터 판정"
학습_건수: "2 arm x 5 seed = 10 fit (배포 학습량 ≤2024 전량)"
제출물: "중복도 관문 통과 시에만 후보 설계"

왜: |
  🔴 **S82**: 팀원의 token-MLP 딥 팔이 **LB +5.0813180433** 을 냈다. 우리가 새 팔 계열을 5번 닫은 판정이 반증됐다.
  우리 기각의 공통점은 ① 같은 67열 ② 바깥 블렌드 자리 ③ **측정용 ≤2023 학습**이었고,
  팀원 것은 ① 99열 ② 파트너 **내부** 로짓 20% 교체 ③ **≤2024 전량 1,475,092행 · 5시드**다.
  exp_085/086 은 F2_EMB 를 ≤2023 · 4시드로 재서 최강 기준선 위 t 1.473(문턱 2.0 의 74%)로 닫았다.
  → **같은 팔을 배포 학습량으로 다시 만든다.** 단 만들기 전에 **겹치는지부터** 본다.

  🔑 **소수점은 후순위다**(2026-08-24 사용자 지시). `w_deep` 꼭지점 잔여는 +0.10 으로 측정돼 접었다.
     크게 버는 것은 지금 **새 팔 하나 = +5.08** 뿐이 증명돼 있다.

stage0_중복도 (관문 — 학습 전에 답이 나오는 부분부터):
  무엇: |
    팀원 딥 팔의 **로짓**을 배포 대표 프레임(cov, 245,789행)에서 직접 뽑는다.
    `mate/deep_infer.py` 의 `predict_deep` 를 `~/SungjinPark/audit_deep/pkg/` 의 패키지 파일로 그대로 호출하면 된다.
    그다음 exp_085/086 이 이미 만든 우리 팔 예측(`~/SungjinPark/exp08{5,6}/out/preds/`)과 상관을 낸다.
  ⚠️ 주의: "exp_085/086 예측은 fold_2024(valid 2024) 면이고 팀원 로짓은 cov(배포형) 면이다 — 면이 다르면 비교 불가.
           같은 면에서 재라. 필요하면 우리 팔을 cov 프레임에 대해 추론만 다시 하라(학습 아님, 가중치는 저장돼 있다)."

stage1_배포학습 (stage0 통과 시에만):
  arm: "F1_FM · F2_EMB — exp_085 r2 레시피 그대로. 바꾸는 것은 **학습 구간뿐**(≤2023 → ≤2024 전량)"
  시드: "42, 7, 2024, 101, 777 (5개 — 팀원 딥 팔과 같은 수)"
  🔴 레시피_동결: "exp_086 이 쓴 기계 파생 방식을 그대로 쓴다 — 치환 목록을 명시하고 레시피 토큰이 diff 에 나오면 죽게 걸어라"

사전_등록_판정 (🔴 결과를 보고 바꾸지 않는다 — S8):
  관문_A_중복도:
    측정: "같은 면에서 우리 팔 로짓과 팀원 딥 팔 로짓의 |rho|"
    통과: "|rho| < 0.90 → stage1 진행"
    기각: "|rho| >= 0.95 → 그 팔 종료 (같은 신호를 다른 이름으로 만드는 것)"
    회색: "0.90 ~ 0.95 → 직교 성분의 크기를 함께 보고 지휘자 판단"
    근거: "exp_086 실측 — F2_EMB 는 4시드에서 우리 NN 과 0.9525, F1_FM 과 0.9367. 1시드 판본의 낮은 상관은 시드 잡음이었다(S72). 팀원 팔은 5시드이므로 **같은 시드 등급에서 재야 한다**"
  관문_B_증분:
    측정: "팀원 딥 팔이 이미 들어간 면 위에서 우리 팔을 추가했을 때의 최적 가중과 이득, 투수 블록 부트스트랩 1000회 t"
    통과: "t >= 2.0"
    🔴 한계: "이 면은 팀원 딥 팔이 ≤2024 학습이라 **표본 내**다 — 정직면이 아니다. 
             S78 실측대로 정직면 유도 기대치가 54배 부풀 수 있으므로 **이득의 크기를 예측해 적지 마라.**
             관문 B 는 **부호와 t 만** 본다."

운영:
  ETA: "stage0 (추론만) 20~40분. stage1 10 fit x 약 2.3분 = 계산 25분, GPU 2장으로 벽시계 15분 + 평가 30분. 
        **전체 세션 1.5~2.5시간.** 넘으면 즉시 갱신 보고"
  🔴 서버: "audit_deep 세션이 동시에 돈다. 그쪽 디렉터리를 건드리지 말고 프로세스를 죽이지 마라. 
            컨테이너 CPU 쿼터는 20코어다(S79)"
