exp_id: exp_079
date: 2026-08-21
title: "v6 내부 CatBoost 학습량 축 — 배포 최대 성분이 354그루로 과소학습인가"
학습_건수: "정직면 4적합(연장) + 배포 4적합(init_model 연장) = 8"
제출물: "없음 (곡선이 문턱을 넘으면 지휘자가 후보 BP 빌드를 지시)"

표적:
  대상: "mate/model/cat_{42,777,2024,101}.cbm — v6 내부 CatBoost 팔"
  실효_지분: "최종 로짓의 0.3665 (블렌드 단일 최대 성분)"
  실측_파라미터: |
    iterations 354 (4시드 전부 동일) · depth 6 · learning_rate 0.06 · l2_leaf_reg 10
    border_count 64 · subsample 0.8 (Bernoulli) · rsm 1 · min_data_in_leaf 1
    leaf_estimation_iterations 10 · boosting_type Plain · has_time false
    🔴 od_type·od_wait 가 get_all_params() 에 없다 = 조기종료 아님.
       354 는 검증으로 고른 값이 아니라 손으로 박은 예산이다.
  학습행: "배포 마스크 ~((season<=2022)&(game_type=='F')) = 1,369,784행 × 99열"
  왜_과소학습_의심: |
    depth 6 은 트리당 잎 최대 64개. 354그루 × 64 = 약 22,656 잎으로 1,369,784행을 덮는다.
    우리 스태커는 1400라운드로 돌고 있다.

선례:
  AG: "우리 R 갈래 스태커 655 → 1000 라운드 (9시드) → LB +5.8754557571. 라운드당 +0.01703점"
  AH: "1000 → 1400 → LB +1.7995995320. 라운드당 +0.0045점"
  기전: "배포 재적합은 fold 보다 학습행이 많으므로(1.23배) fold 에서 고른 예산보다 더 많은 용량을 원한다"
  차이_유리한_점: "AG 의 655 는 fold_2024 에서 고른 값이라 정직면이 편향돼 있었다. 354 는 어느 면에서도 고르지 않았으므로 **정직면이 이 축을 편향 없이 읽는다**"
  차이_불리한_점: "AG 때 우리 팔 지분 0.5 vs 지금 v6-Cat 0.3665 (0.73배)"

stage0_게이트:
  G0a_init_model_접두항등: |
    🔴 이 실험의 핵심 장치. CatBoost `init_model` 로 배포 cat_42.cbm 에서 이어 학습하면
    결과 모델의 앞 354그루가 배포본과 **같아야** 한다.
    검사: 연장 모델을 ntree_end=354 로 잘라 예측한 값이 배포 모델 예측과 **정확히 0.0** 차이.
    실패하면 이 설계가 성립하지 않는다 — 즉시 정지하고 보고. (from-scratch 재학습으로 대체하되
    그때는 변인이 둘(형제 이동 + 반복 수)임을 반드시 기록한다)
  G0b_마스크: "배포 학습 마스크 행수 1,369,784 재현. ⚠️ 0.9·N 역산으로 소명하지 말 것 (S17)"
  G0c_피처: "features_sp.txt 99열, 범주 인덱스 [4,10,13,14,45] 일치 (exp_077 G0b 재확인)"
  G0d_스레드_기록: "학습에 쓴 thread_count 를 metrics 에 명시 기록 (S17 — 스레드는 시드급 모델 변수다)"
  중단_조건: "G0a 실패 시 정지·보고"

stage1_정직면_곡선:
  프레임: "≤2023 학습 → 2024 예측 253,507행 (팀원 OOT 납품과 같은 면)"
  대조군: "🔴 팀원 배포본이 아니라 **우리가 같은 코드로 적합한 354그루**를 원점으로 쓴다 (형제 이동 제거)"
  방법: |
    ① 우리 코드로 ≤2023 마스크 4시드 적합, iterations 1600, 스냅샷 저장
       (exp_077 이 이미 ≤2023 시드 적합본을 남겼다면 init_model 로 이어 붙여 재사용 — 먼저 확인할 것)
    ② 트리 수 354·500·700·900·1200·1600 에서 각각 4시드 로짓평균 → p_cat
    ③ 그 p_cat 을 BO 출하 산술에 끼워 넣어 (다른 팔은 OOT 납품 벡터 그대로) 전체 블렌드 점수
    ④ 전역 재중심화 적용 (exp_078 stage4 와 같은 규약, 기준 928.50146 재현 확인)
  🔴_눈금_주의: "정직면 Δ 는 LB Δ 가 아니다 (S1·S2). 실측 전이 배율 0.3929~0.5463 을 함께 적되 단일 배율을 믿지 말 것"
  낼_것: "트리 수별 점수 곡선 + argmax + 곡선의 평탄 구간 + 시드별 곡선(부호 일치 여부)"

stage2_배포_연장:
  방법: "배포 cat_{seed}.cbm 을 init_model 로 이어 배포 마스크(≤2024)에서 목표 트리 수까지 연장"
  목표_트리수: "stage1 argmax 를 하한으로 삼되, 학습행 1.23배를 반영해 그 이상. 구체값은 stage1 결과로 정한다"
  🔴_변인: "정확히 하나 — 추가된 트리. 앞 354그루는 복사되므로 항등 앵커가 정확하다"
  낼_것: "연장 모델 4개 + 각 트리 수 스냅샷에서의 test 추론 시간 증가분(추론 예산 600초 대비)"

stage3_추론시간:
  🔴: "트리 수가 4배면 CatBoost 추론도 대략 4배다. 현 채점 서버 실측 146초(BO) 안에서
       v6-Cat 몫이 얼마인지 재고, 목표 트리 수에서의 예상 추론 시간을 반드시 산출하라.
       600초를 넘으면 그 트리 수는 쓸 수 없다."
  방법: "단독 실행으로 재고 ÷1.60 전이 계수 적용 (계보 6회 검증)"

사전_등록_판정:
  A: "정직면 곡선 argmax 가 354 보다 크고 그 이득이 ≥ +8점(정직면) → 후보 빌드 권고"
  B: "argmax > 354 이나 이득 +3~8 → 빌드 권고하되 기대치를 낮춰 보고"
  C: "argmax ≤ 354 또는 이득 < +3 → 축 종료"
  🔴: "결과를 보고 문턱을 바꾸지 않는다 (S8)"

운영:
  스레드: "적합에 쓴 thread_count 를 고정하고 기록. 동시 적합은 최대 3개, 적합당 6스레드"
  파일_삭제: "🔴 어떤 파일도 지우지 마라 (사용자 상시 지시). 산출물은 ~/SungjinPark/exp079/ 아래에만"
  워처: "하나만. pgrep 이 자기 ssh 명령줄을 잡지 않게 패턴을 좁힐 것"
