exp_id: exp_084
date: 2026-08-22
title: "q_league 2|2 축의 곡률 불확실성을 죽인다 — 이동폭을 정확히 고르기 위해"
학습_건수: 0
제출물: "없음 (내일 1발의 이동폭을 정하는 계산)"

왜: |
  후보 BS4 가 셀 `2|2` 를 +0.007603147866578647 옮겨 **+1.3177794334** 를 냈다(부모 BO 1115.9913864857).
  그 한 점으로 푼 최적점은 셀값 +0.1249 · 최대이득 **+11.4683**.
  🔴 그런데 곡률 G 를 **프레임 하나**(≤2023 표 → 2024 행, 미적중 21.4988%)에서만 쟀고,
  실제 대회 표본 5행은 **4/5 미적중(80%)** 이다. G 가 1·2·4배면 최적 이동폭이 0.128 → 0.066 → 0.035 로 바뀌고
  같은 Δ=0.04 의 이득이 **+6.03 / +5.13 / +3.33** 으로 갈린다.
  **이 3배 폭이 오늘 가장 큰 축의 유일한 불확실성이다. 그걸 죽인다.**

stage1_실제_미적중률_추정 (이 실험의 본론):
  질문: "배포(≤2024 표 → 2025 행)에서 개인 셀 미적중률이 얼마인가"
  🔴 방법 — 프레임 하나가 아니라 **연도별 추세**로 잡아라: |
    각 시즌 s ∈ {2020,…,2024} 에 대해, s 행 중 `(pitcher_id, batter_hand)` 가
    **≤(s−1) 표에 없는** 비율을 구한다. 표 생성 규약은 출하 `mate/model_q/meta.json` 의
    `offset.key_cols` · `lookup_d` 생성 절차를 그대로 따를 것.
    → 5점 추세를 얻고 **2025 로 외삽**한다.
  대조: "≤2023 표 → 2024 행에서 21.4988%(54,501/253,507) 가 재현되는지 먼저 확인. 안 되면 표 생성 규약을 잘못 읽은 것이다"
  ⚠️ real5: "실제 대회 5행의 4/5 미적중은 n=5 다. 21.5% 하에서 4개 이상 미적중일 확률을 계산해 병기하라 — 추세와 어느 쪽이 맞는지 판단 재료"
  낼_것: "연도별 미적중률 표 · 추세 · 2025 외삽값과 그 폭"

stage2_곡률_G:
  방법: "셀 `2|2` 의 δ 와 `K·G_jj` 를 **미적중률의 함수**로 낸다 — 프레임 넷(tr2024 대역·cov·band·≤2023 표) + stage1 외삽값에 해당하는 합성 프레임"
  🔑: "G 는 대략 (미적중률) × (그 셀 비중) 에 비례할 것이다. **그 관계가 실제로 성립하는지 확인하고 계수를 내라** — 그러면 외삽 미적중률에서 G 를 바로 계산할 수 있다"
  낼_것: "미적중률 대 K·G_jj 산점 + 적합 · 외삽 미적중률에서의 G 추정치와 폭"

stage3_이동폭_재선택:
  방법: "stage2 의 G 로 최적점과 이득 곡선을 다시 풀고, Δ 후보(0.02~0.10)별 예상 이득을 낸다"
  낼_것: "🔴 **권고 Δ 하나와 그 근거.** 그리고 G 추정 폭 아래에서 최악·최선 이득"
  ⚠️ 비선형: "1% 한계 Δ = 0.101704(BR 진단). 권고 Δ 가 그 절반을 넘으면 3차항 오차를 별도로 재라"

stage4_합이_0_인_구조:
  사실: |
    `league_dev` 는 손 종류 안에서 표본수 가중 합이 0 이다 (지휘자 실측):
      우완 155,477×(−0.02630110266550234) + 193,296×(+0.021155205173021163) ≈ 0
      좌완 490,570×(+0.003841565032476346) + 529,843×(−0.0035568207147814723) ≈ 0
    즉 손마다 자유도가 **2 가 아니라 1** 이고, `2|1` 올리기와 `2|2` 올리기는 **반대 방향**이다.
    우리는 둘 다 위로 밀었고 하나는 졌다(BS3 −0.19), 하나는 이겼다(BS4 +1.32).
  질문: "합을 0 으로 유지하는 반대칭 축(`2|2` 올리고 `2|1` 내리기)이 `2|2` 단독보다 나은가"
  낼_것: "반대칭 축의 δ·G·최적점·이득 vs `2|2` 단독. 지휘자 어림은 +1.44 대 +1.32 로 개선폭이 작다 — 확인하라"
  🔴: "출하 `mate/q_infer.py:117-120` 이 *zero-sum over bh within each ph* 를 주장한다(S48). `2|2` 단독 이동은 그 문장을 거짓으로 만든다 — 반대칭 축은 참으로 유지한다. 이 사실을 명시하라"

stage5_교차항:
  질문: "팀원 실패유형 축(`b`)과 우리 `2|2` 축이 독립인가 (S16)"
  방법: "두 δ 의 상관. `~/SungjinPark/exp082/` 에 b 의 δ 를, `~/SungjinPark/build_BR/src/diag_qleague.py` 에 q_league δ 를 만드는 코드가 있다"
  🔴: "|ρ| > 0.3 이면 팀원 것 위에 얹을 때 단순 합산이 위험하다 — 그 경우 2축 동시 해를 내라"

사전_등록_판정:
  A: "2025 외삽 미적중률의 폭이 ±5%p 안 → 권고 Δ 를 확정하고 BW 이동폭을 그 값으로 고친다"
  B: "폭이 ±5~15%p → Δ 0.04 유지(세 경우 모두 +3.3 이상인 자리)"
  C: "폭이 그보다 크거나 추세가 안 잡힘 → Δ 0.04 유지하고 이유를 적는다"
  🔴: "결과를 보고 문턱을 바꾸지 않는다 (S8)"

