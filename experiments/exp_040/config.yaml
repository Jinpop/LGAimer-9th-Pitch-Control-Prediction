# ⚠️ 미승인 — 사용자 검수 대기 (2026-08-09 작성)
exp_id: exp_040
date: "2026-08-09"
title: "피처를 얹은 뒤에도 오프셋·캘리브레이션이 살아 있는가 — 저장된 예측 위 사후 변환"
base_exp: "exp_037 (`L_no_sit` 예측) · exp_033/exp_036 (오프셋 β) · 후보 N (캘리브레이션 γ)"

# ---------------------------------------------------------------------------
why: >
  우리는 세 축에서 벌었고 **축끼리의 상호작용을 한 번도 재지 않았다.**
      모델 축   백본 교체        LB +65.3836235801
      보정 축   좌우타자 오프셋   LB +20.7432778366
      보정 축   전역 캘리브레이션 LB +24.7826954  (N − M)
      피처 축   팀원 22열        로컬 +30.96222 (문턱 미달)
  exp_037은 **오프셋·캘리브레이션을 일부러 끄고** 피처 축만 쟀다. 그래서
  **"피처가 오프셋을 잡아먹는가"는 여전히 미측정**이다.

  겹칠 이유가 있다. 우리 오프셋은 `(pitcher_id, batter_hand)` 편차이고,
  팀원 `i3_te48`은 `(투수손 × 타자손 × 카운트)` 타깃 인코딩이다 — **리그 수준 플래툰 vs
  투수별 편차.** 원리상 보완적이지만 실제로 겹치는지는 재봐야 안다.

cheapness: >
  🔴 **이 실험은 학습이 없다.** 서버에 예측 배열이 이미 있다:
      pred_R0_u2024_seed{42,7,2024}_st2.npy
      pred_L_no_sit_u2024_seed{42,7,2024}_st2.npy
  오프셋도 캘리브레이션도 **예측 벡터 위의 원소별 변환**이다. numpy 연산 몇 분이면 끝나고
  **학습 슬롯을 전혀 쓰지 않는다.** exp_036의 Q4가 같은 방식이었다.

# ---------------------------------------------------------------------------
design:
  bases: ["R0 (47열, 피처 없음)", "L_no_sit (63열, 팀원 피처)"]
  seeds: [42, 7, 2024]
  transforms:
    T0: "없음 (원본)"
    T1: "오프셋만 — p' = clip(p + β·d, 1e-6, 1−1e-6), `S400_self`, k=400, β **0.59072**"
    T2: "캘리브레이션만 — p'' = sigmoid(logit(p) + γ)"
    T3: "오프셋 + 캘리브레이션 (배포 순서: 오프셋 먼저, 그 위에 γ)"
  grid: "2 base × 3 시드 × 4 변환 = 24 평가. 전부 사후 변환"
  the_question: >
    **`L_no_sit`에서의 오프셋 이득이 `R0`에서의 이득보다 작은가.**
    작으면 피처가 오프셋을 일부 잡아먹은 것이고, 같으면 두 축이 독립이다.
    ⚠️ **이 차이 자체에도 시드 잡음이 있다.** 3시드 부호 일치를 확인하고,
    일치하지 않으면 **"측정 불가"로 보고하라 — 평균만 보고 결론 내지 마라.**

# ---------------------------------------------------------------------------
# 🔴 알려진 편향 — 결과에 반드시 병기하라
# ---------------------------------------------------------------------------
known_biases:
  beta_was_fitted_without_features:
    what: >
      β **0.59072**는 **피처가 없는 base**(exp_031 공급 블록 2022·2023 × 시드 42·7)에서
      적합됐다. `L_no_sit`의 잔차 구조는 다를 수 있으므로 그 arm에서 β는 **최적이 아니다.**
    direction: "미상. β가 크든 작든 이득이 과소평가될 수 있다"
    what_this_means: >
      **`L_no_sit`에서 오프셋 이득이 줄어도 그것만으로 '피처가 잡아먹었다'고 말할 수 없다.**
      'β가 안 맞는다'와 구별되지 않는다. **두 설명을 리포트에 나란히 적어라.**
    how_to_separate: >
      구별하려면 `L_no_sit`의 공급 블록(2022·2023)에서 β를 재적합해야 하고 그건 **학습이
      필요하다**(별건, exp_041 후보). ⚠️ **이 실험에서 하지 마라.**
  gamma_is_in_sample:
    what: >
      γ는 **fold_2024 자신의 실제 성공률에 평균을 맞춰** 푼다. 즉 채점되는 바로 그 데이터에서
      적합된다. 이득이 낙관적으로 나올 수 있다.
    why_it_is_still_meaningful: >
      γ는 **253,507행에 파라미터 1개**다. 과적합 여지가 사실상 없다. 그리고 실제 LB가
      확인했다 — 로컬 +22.24042 → LB **+24.7826954**로 **전이비 1.1143**, 즉 로컬보다
      더 벌었다. 낙관 편향이 있었다면 반대로 나왔어야 한다.
    still: "⚠️ 그래도 in-sample임을 표에 각주로 달아라. 숨기지 마라"
  no_new_seeds: "3시드다. exp_039가 σ를 다시 재고 있으나 **이 실험은 그 결과를 기다리지 않는다**"

# ---------------------------------------------------------------------------
adoption:
  ⚠️_this_is_not_an_adoption_experiment: >
    **채택 판정을 하지 않는다.** 오프셋·캘리브레이션은 이미 LB로 검증돼 배포 중이고,
    이 실험이 묻는 것은 **"피처 위에서도 유효한가"**라는 상호작용이지 새 후보의 채택이 아니다.
  what_to_report: "부호 일치 여부와 크기. 문턱 대입은 하지 마라"
  ⚠️_denominator: >
    문턱을 굳이 언급한다면 **exp_037 R0의 σ(15.53825점)**를 쓰고, exp_039의 새 σ̂를
    **쓰지 마라** — exp_039는 사전 등록상 **완료 후 등록되는 실험에만** 적용된다.

# ---------------------------------------------------------------------------
method:
  d_construction: >
    ⚠️ **전개형을 쓴다**: `d = (s − n·overall) / (n + k)`.
    **문자 그대로의 뺄셈으로 구현하면 깨진다**(`k*x/k ≠ x`). 리그 항은 `L·(k/(n+k))`.
    ⚠️ **exp_033/exp_036의 `dev_k.py`를 바이트 승계**하고 sha를 기록하라. 다시 쓰지 마라.
  gamma_solve: "시드별로 `mean(sigmoid(logit(p)+γ)) = 2024 실제 성공률`을 풀고, 3시드 평균 후 6자리 반올림 (후보 N과 동일 레시피)"
  observed_rate_2024: "⚠️ `train.csv`에서 직접 계산하라. 전사 금지"
  leak: >
    ⚠️ `d`는 **≤2023 표**에서만 만든다. test·2024 라벨로 만들지 마라.
    이 실험은 fold_2024 검증 행을 채점하므로 **표 생성 경계가 유일한 위험 표면**이다.
    exp_033에서 감사된 경로를 그대로 쓰고 sha로 증명하라.
  never: "제출물 생성 금지. 학습 금지. 서버 학습 프로세스 kill 금지"

runtime:
  where: "a5000 (또는 로컬 — 예측 배열만 있으면 된다)"
  expected_min: 20                          # 12~30
  eta_basis: >
    - 예측 배열 6개 회수 + sha 대조: **3분** (각 253,507 float64 ≈ 2MB)
    - `d` 표 생성 (승계 코드): **2분** — exp_036 Q4 실측 "1분 미만"
    - 24 평가 (원소별 변환 + Brier): **1분 미만**
    - 집계 + 리포트: **10분**
    → **15~20분, 범위 12~30분.**
  concurrency: "⚠️ **학습 슬롯 0.** exp_038·exp_039와 CPU 경합 없음"

deliverables: [metrics.json, report.md, "src/ (승계 sha)"]

audit:
  required: false
  why: "새 학습·새 피처 없음. `d` 생성 경로는 exp_033에서 이미 감사됨. 저장된 예측 위의 사후 변환"
  note: "⚠️ 이 결과가 제출 후보를 만들면 **제출 직전 감사는 예외 없이 필요**"

changed_vs_prior_measurements:
  - "1. 오프셋을 **피처가 있는 arm(`L_no_sit`)** 위에 처음 적용"
  - "2. 캘리브레이션을 **피처가 있는 arm** 위에 처음 적용"
  - "3. 오프셋+캘리브레이션 **동시 적용**을 fold_2024에서 처음 측정 (후보 N은 배포 빌드에서만 결합했다)"
  - "4. base는 exp_037 산출물 — 스태커 iter가 exp_030(481)이 아니라 fold_2023 argmin × 스케일이다"
  - "⚠️ 그 외 없다. 딸려 바뀐 것이 생기면 추가하라"

risks:
  - "⚠️ **β 미적합 문제와 축 겹침 문제가 분리되지 않는다**(위 `known_biases`). 결론을 하나로 단정하지 마라"
  - "⚠️ 두 base의 차이 자체에 시드 잡음이 있다. 3시드 부호가 갈리면 **측정 불가로 보고**하라"
  - "γ가 in-sample이다. LB가 반증하지 않았으나 각주는 반드시 달아라"
  - "`L_no_sit`은 채택 미달 arm이다. 여기서 오프셋이 잘 붙어도 **그 arm이 채택되는 것은 아니다**"
