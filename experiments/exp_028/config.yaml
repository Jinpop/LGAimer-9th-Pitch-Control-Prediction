method:
  no_training: true
  reuse:
    base_pred: "exp_024 `pred/` — B3 base × 시드 42/7/2024 (fold_2024) + 블록 2022·2023"
    dr_tables: >
      **exp_026 `src/fit_dr.py`가 `d_r` 개인표·리그표를 이미 만들었다.** 새로 구현하지 말고
      승계하고 sha를 기록하라. 그 코드는 as-of forward-chaining과 라벨 격리를 통과했다.
    assert: "규약 #5 — 재사용 전 sha256 대조 필수, 불일치 시 중단"
  float_form: >
    편차는 **전개형** `d = (s − n·overall)/(n + k)`, 리그항은 `L·(k/(n+k))`.
    문자 그대로의 뺄셈형은 미적중에서 `k*x/k ≠ x`로 깨진다(exp_023 첫 발사가 이렇게 죽었다).
  leak_boundary: >
    복원 라벨(`is_rev_only`·`is_both`)은 **타깃 집계 전용**이다. 설계행렬에 들어가면 즉시 abort.
    `d_r` 표도 `d_s`와 동일한 forward-chaining(시즌 s의 표는 ≤ s−1).
  seeds: [42, 7, 2024]

selection_discipline:
  rule: "선택이 필요한 것(A4의 k·대상, B3의 γ 격자)은 **공급 블록 2022+2023에서만** 고른다. fold_2024는 선택이 끝난 뒤 읽는다"
  not_selection: "A1·A2·B1은 사전 등록된 대조다 — 고르는 게 아니라 재는 것이므로 fold_2024를 그대로 보고"
  report_both: "블록 선택과 fold_2024 오라클 선택이 갈리면 그 격차를 점수로 보고하라"

