validation:
  primary_metric: "fold_2024 valid_all(R+F) Brier"
  gate: >
    A1이 exp_024 arm B를 재현해야 한다 — seed42 **0.24799968498605615**,
    seed7 **0.24801856644746204**, seed2024 **0.2480065100917605**, 각 abs_diff < 5e-6.
    A0(무보정)도 exp_024 기록과 대조하라.
  segments: "valid_R / valid_F · 투수손 1/2 · 적중/미적중 · 셀 표본 수 구간별"
  adoption:
    rule: "3시드 부호 일치 AND |평균Δ| ≥ 대조군(A1) 시드 std × 3. **완화 금지.**"
    also_report: >
      ⚠️ **paired delta의 std를 반드시 병기하라.** exp_026에서 이 문턱의 분모가 모든 arm이
      공유하는 base 시드 잡음이라 paired std보다 **10~140배** 컸다. 여기도 같은 구조다
      (arm들이 같은 base 예측을 공유한다). 문턱은 사전 등록된 것이므로 **이번 판정에서
      바꾸지 않는다** — 다만 두 수치를 나란히 내서 사용자가 정의를 재검토할 근거를 남겨라.
      문턱 정의를 바꾼다면 사전 등록 후 **앞으로만** 적용한다.

# ---------------------------------------------------------------------------
runtime:
  where: a5000
  expected_min: 20                          # 15~25
  eta_basis: >
    학습 0건. 실측 계보 — exp_025 `fit_ablate.py`(arm 5 × 시드 3 + 프로브 + 게이트) **0.35분**,
    exp_026 `fit_dr.py`(arm 8 × 시드 3 + `d_r` 표 신규 + groupby 9회) **0.52분**.
    exp_026이 갱신한 공식: `계산 0.4분 + 신규 집계표 1종당 약 3초 + 1.47M행 groupby 1회당
    약 0.5초 + 코드 작성 시간`.
    이번은 arm 8개 + A4 격자 18칸 + 로짓 경로. **`d_r` 표는 exp_026에서 승계**하므로 신규
    집계표가 없고, 격자는 벡터 연산이라 exp_023이 14칸을 0.4분에 처리한 선례가 있다.
    → **계산 0.5~0.7분.** 코드 작성이 벽시계의 대부분이나 `fit_dr.py`를 뼈대로 쓰고
    로짓 경로는 `offset.py`에 이미 있으므로 **12~20분**. 회수·집계 5분.
    → **15~25분.**
  contention: >
    ⚠️ **exp_027이 같은 서버에서 동시 3개 × 스레드 6(총 18)으로 학습 중이다**(40코어).
    이 실험은 코어 1개 · 30초대이므로 경합은 무시할 수준이나, **원격 작업 디렉터리를
    exp_027과 분리**하고(`~/SungjinPark/exp_028/`) 로그·산출물이 섞이지 않게 하라.
    exp_027의 프로세스를 kill하거나 그 디렉터리에 쓰지 마라.

deliverables: [metrics.json, report.md, "src/ (승계 sha + 신규분)", "pred_*.npy (채택 후보만)"]

audit:
  required: false
  why: >
    `d_r` 경로는 exp_026이 이미 만들었고 그때 감사 대상으로 등록됐으나 **채택 arm이 없어
    보류됐다**. 이 실험도 채택이 없으면 보류 유지. 로짓 경로는 기존 `offset.py`의 미사용 함수라
    새 소스·새 조인·새 집계가 아니다.
  trigger: >
    ⚠️ **A2·A3·A4 계열이 채택되어 제출로 가면 `d_r` 리크 감사가 선행 조건이다**(exp_026
    config `audit.required: true`가 아직 살아 있다). 감사 없이 `d_r`을 제출하지 마라.

risks:
  - "`d_r` 단독이 `d_s` 단독보다 나아도, 둘의 상관 −0.83 때문에 **둘을 합쳐 쓰는 길은 이미 막혔다**(exp_026). 즉 이건 '더하기'가 아니라 '갈아타기' 선택지다"
  - "로짓 카드는 p 산포가 좁으면 **구조적으로 무효**다. 산포를 먼저 재고, 좁으면 그 사실을 결론으로 적어라 — 억지로 이득을 찾지 마라"
  - "exp_018의 `d_r` 사전조사(참SD 5.20%p·신뢰도 0.80)는 **전 시즌 풀링 낙관치**다. as-of 규율 아래서는 낮아진다 — exp_018에서 좌우타 축이 실제로 그랬다"
  - "로컬 이득이 나와도 LB 전이 비는 축마다 0.06~1.00으로 흩어져 있어 **예측 불가**다. 네 축을 재는 동안 안정한 비를 못 찾았다"
  - "오늘 제출 슬롯은 1개 남았다. 채택이 나와도 **제출은 사용자 판단**이며 그 전에 packager와 (d_r이면) 감사가 붙는다"
