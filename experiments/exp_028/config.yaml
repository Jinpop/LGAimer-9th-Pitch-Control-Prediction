# 사용자 승인 2026-08-07 "값싼 카드 병렬 학습 돌려도 돼" — exp_027과 동시 진행
exp_id: exp_028
date: "2026-08-07"
title: "열린 축 둘 닫기 — `d_r` 단독 1항 · 로짓 공간 보정 (학습 0건, 사후 변환 전용)"
hypothesis: >
  exp_026이 `d_r` **2항 병용**을 기각했다. 그러나 기각의 원인은 `d_s`와 `d_r`의 상관 −0.83이며,
  이는 **2항 동시 적합이 좌표 재조정이 된다**는 이야기이지 `d_r` 자체가 못 쓴다는 이야기가 아니다.
  **`d_r` 단독 1항은 아직 재본 적이 없다.** 실패의 *방식*(의도 반대)이 성공 여부보다 투수
  개인차를 더 잘 담는다면, `p + β_r·d_r` 하나가 `p + β_s·d_s` 하나보다 나을 수 있다.
  exp_018 사전조사도 `d_r`의 참SD를 5.20%p / 신뢰도 0.80으로 봤다 — `d_s`(4.75%p / 0.69)보다 높다.

  둘째로 **보정을 확률 공간에서 더하는 것이 옳은 좌표계인가**를 한 번도 안 물었다.
  `offset.py`에 `apply_logit`·`fit_gamma`가 **구현돼 있으나 배포된 적이 없다.**
  → `p' = sigmoid(logit(p) + γ·d)`가 `p' = clip(p + β·d)`보다 나은가.

  두 카드 모두 **저장된 예측 위 변환이라 학습이 0건**이다. exp_027(밑단 가족 스크리닝)과
  축이 달라 귀속이 섞이지 않으므로 동시 진행한다.
base_exp: "exp_024 arm B (k=400 × league) = 후보 J·K가 배포한 d"

# ---------------------------------------------------------------------------
# 카드 ① — d_r 단독 1항
# ---------------------------------------------------------------------------
card_1_dr_solo:
  question: "`p + β_r·d_r` (1항) 이 `p + β_s·d_s` (1항) 보다 나은가"
  why_not_settled_by_exp_026: >
    exp_026이 잰 것은 **2항** `p + β_s·d_s + β_r·d_r`이다. 거기서 β_r은 단독 −0.367에서
    동시 적합 시 **+0.327로 부호가 뒤집혔고** β_s는 49% 부풀었다 — 두 축의 상관 −0.83 때문에
    회귀가 겹치는 부분을 한쪽에 몰고 다른 쪽으로 되뺀 것이다.
    **그 병리는 2항이라서 생긴 것이고 1항에는 없다.** 1항 β_r = −0.367은 안정한 부호이며
    "반대로 많이 빠뜨리는 투수는 성공 확률이 낮다"는 상식과 맞는다.
  arms:
    - id: A0
      spec: "무보정 (`p` 그대로)"
      role: "바닥"
    - id: A1
      spec: "`p + β_s·d_s`, d_s는 k=400 × league (= 후보 J의 구성)"
      role: "**대조군.** 현재 배포 중인 보정"
    - id: A2
      spec: "`p + β_r·d_r`, d_r도 k=400 × league"
      role: "**주력.** d_s와 같은 수축·백오프 아래서 축만 교체"
    - id: A3
      spec: "A2와 동일하되 d_r의 k=65 (exp_018 사전조사 분산분해값)"
      role: "d_r의 최적 k가 d_s와 다를 수 있다"
    - id: A4
      spec: "d_r 단독 × k 격자 [0, 30, 65, 111, 200, 400, 800, 1600, 3200] × 대상 {self, league}"
      role: "d_r 고유의 k·백오프 곡면. **선택은 블록에서만**"
  attribution_note: >
    A1 대비 A2는 **축 하나만** 다르다(같은 k, 같은 백오프 대상, 같은 1항 구조). 그래서
    `A2 − A1`을 "축 교체의 몫"으로 귀속할 수 있다. A3는 k도 다르므로 A2와만 비교하라.

# ---------------------------------------------------------------------------
# 카드 ② — 로짓 공간 보정
# ---------------------------------------------------------------------------
card_2_logit:
  question: "`sigmoid(logit(p) + γ·d)` 가 `clip(p + β·d)` 보다 나은가"
  code: "`offset.py`의 `apply_logit`·`fit_gamma`. **이미 구현돼 있고 배포된 적이 없다** — 새로 짜지 말고 승계하라"
  the_real_argument: >
    ⚠️ **"확률 공간은 clip에 눌린다"는 논거는 쓰지 마라 — 우리 경우 거짓이다.**
    후보 H 감사가 실측했다: 예측 이동폭 최대 β·|L| = 0.010514, clip 경계 여유 0.285 / 0.310.
    **clip은 한 번도 발화하지 않는다.** 그 논거로 로짓을 정당화하면 없는 문제를 고치는 것이다.

    진짜 논거는 좌표계 자체다. 확률 공간 덧셈은 **p가 얼마든 같은 폭으로 민다.** 로짓 공간
    덧셈은 `dp = γ·d·p(1−p)`라 **p가 극단일수록 덜 민다.** "이 투수는 이 손 타자에게 5%p 낫다"가
    p=0.50인 상황과 p=0.85인 상황에서 같은 크기여야 하는지는 **모델링 질문**이지 수치 안정성
    질문이 아니다. 오즈비로 일정한 게 맞다면 로짓이 옳은 좌표계다.
  the_honest_prior: >
    ⚠️ **거의 무효일 가능성이 높다.** Brier 0.248 · 기저 성공률 약 0.50이면 예측이 0.5 근처에
    몰려 있고, 거기서는 `p(1−p) ≈ 0.25`로 거의 상수라 **로짓 변환이 확률 공간의 선형
    재척도에 불과**해진다. 두 공간이 갈리려면 p의 산포가 커야 한다.
    → **먼저 `p`의 분포를 재라**(표준편차·1/99 분위·p(1−p)의 변동계수). 산포가 좁으면
    "두 공간이 갈릴 여지 자체가 없다"가 결론이고, 그건 **축을 닫는 값어치 있는 음성**이다.
    산포를 재기 전에 이득을 기대하지 마라.
  arms:
    - id: B1
      spec: "로짓 공간 × d_s (k=400 × league) — A1의 로짓 판본"
      role: "**주력 대조.** `B1 − A1` = 좌표계 교체의 몫"
    - id: B2
      spec: "로짓 공간 × d_r (k=400 × league) — A2의 로짓 판본"
      role: "축 교체와 좌표계 교체가 상호작용하는가"
    - id: B3
      spec: "로짓 공간 × d_s, γ를 블록 격자에서 재적합"
      role: "γ의 최적점이 β의 단순 환산과 다른가"
  gamma_fit: "β와 같은 방식 — 공급 블록(2022+2023)에서 닫힌 해. 로짓 공간에서는 정확한 2차가 아닐 수 있으므로 곡선을 저장하고 2차 근사의 잔차를 보고하라"

