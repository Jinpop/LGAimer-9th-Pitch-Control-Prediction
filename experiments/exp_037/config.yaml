# 사용자 승인 2026-08-08 "발사!" — 밤샘 자율 주행
exp_id: exp_037
date: "2026-08-08"
title: "팀원 피처 22열을 우리 base(C5_B3)에 이식 — 계단 + LOO, 서버 자율 드라이버"
base_exp: "exp_030 (C5_B3) · exp_033 (오프셋) · 팀원 exp_032 (피처 출처)"

hypothesis: >
  팀원 exp_032가 **피처 축**에서 +137점을 벌었다(657.4 → 794.49, LGBM base).
  우리는 **모델 축**(백본 +79.42, LB 전이 0.8232)과 **보정 축**(오프셋 +38.29 전이 0.5418,
  캘리브레이션 +22.24 전이 1.1143)에서 벌었다. **두 작업의 축이 겹치지 않는다.**
  → 팀원 22열을 우리 C5_B3 위에 얹으면 얼마가 남는가.

  ⚠️ **그대로 옮겨온다는 보장이 없다.** 겹칠 만한 곳이 셋 있다:
  ① 우리 B3는 실패모드를 분해한다 — `p6_*`(구종 예측)이 같은 신호를 이미 먹고 있을 수 있다
  ② 우리 오프셋은 (투수 × 타자손) 편차인데 팀원 `sit_*_dev`는 (투수 × 카운트/주자/득점권)
     편차다 — **같은 기전, 다른 축**. 하나가 다른 하나를 잡아먹을 수 있다
  ③ CatBoost의 범주 처리가 LGBM과 달라 `idea_matchup_pitch`(28수준)가 다르게 작동할 수 있다

# ---------------------------------------------------------------------------
# 🔴 리크 경계 — 이 실험의 위험은 전부 여기 있다
# ---------------------------------------------------------------------------
leak_boundary:
  why_this_matters: >
    **팀원 `pipeline.py`를 그대로 쓸 수 없다.** 그 테이블들은 팀원의 fold 경계로 만들어졌다.
    우리 fold(2022/2023/2024)와 블록(2021/2022/2023)에 맞춰 **전부 다시 생성**해야 한다.
    이 실험은 **새 피처 소스(트랙맨) · 새 조인 · 새 타깃 인코딩 셋**을 도입하므로
    규약상 **감사 생략 조건에 해당하지 않는다.**
  rules:
    - "시즌 s의 행이 쓰는 모든 표는 **≤ s−1**에서만 만든다. 예외 없음"
    - >
      **`p6_*` 구종 모델도 마찬가지다.** 시즌 s 행의 구종 확률은 **≤ s−1 트랙맨으로 학습한
      모델**이 내야 한다. 시즌 경계마다 모델을 따로 학습하라. 한 모델을 전 시즌에 쓰면 리크다.
    - "`cnt_te`·`te48`·`sit_*`·`anom_cnt`는 **타깃 인코딩**이다 — 전부 ≤ s−1"
    - "2019는 선행 시즌이 없다 → **NaN 유지.** sentinel(0·−1·평균)로 채우지 마라"
    - >
      **복원 라벨(`is_*`)은 여전히 타깃 전용**이다. 새 피처가 그것과 섞이지 않는지 확인하라.
      설계행렬 진입 시 abort.
    - "현재 행 TrackMan 물리량 사용 금지 — `p6_*`는 **예측값**이지 관측값이 아니다. 입력은 test에 존재하는 8열뿐"
  verification:
    - "`train.csv`를 **두 번째로 읽어** `row_id → season` 지도를 따로 만들고 표 기여 행의 시즌을 재조회. **런타임 assert를 근거로 삼지 말 것**"
    - "각 피처 열이 (season, 조회키) 안에서 상수인지 group-constancy 검증"
    - "**재현 게이트**: 2024를 test처럼 취급해 ≤2023 표로 피처를 재생성하고 학습 때 쓴 것과 전수 대조(팀원이 한 검증과 같은 형태)"

# ---------------------------------------------------------------------------
# 🔴 자율 주행 — 에이전트가 죽어도 계산이 안 끊기게
# ---------------------------------------------------------------------------
autonomy:
  why: >
    어젯밤 API 오류 6번 + 세션 재시작 1번이 났는데 **서버 잡은 한 번도 안 죽었다**(계산 손실 0).
    손실은 전부 **"에이전트가 오케스트레이션을 들고 있었다"**에서 나왔다 — 에이전트가 죽으면
    "다음에 뭘 돌릴지"가 같이 사라졌다. **오케스트레이션을 서버로 내린다.**
  requirements:
    - "**드라이버 스크립트 하나**가 전 유닛을 끝까지 순차 실행한다. `setsid nohup`으로 발사"
    - "**멱등 재개** — 유닛 산출물이 있고 sha가 맞으면 건너뛴다. 재발사해도 이미 한 일을 다시 안 한다"
    - "**진행 상태를 디스크에** — `PROGRESS.jsonl`에 유닛별 시작·종료·결과 한 줄씩 append"
    - "**하트비트** — `HEARTBEAT`에 30초마다 타임스탬프. '살았나 죽었나'를 에이전트 없이 판정 가능하게"
    - "유닛 하나가 실패해도 **다음 유닛으로 넘어간다.** 실패를 `PROGRESS.jsonl`에 기록하고 마지막에 요약"
    - "`set -uo pipefail` (유닛 실패가 전체를 죽이면 안 되므로 `-e`는 쓰지 않는다 — 대신 유닛별 exit code를 기록)"
  agent_role: "에이전트는 **드라이버 작성·발사·회수·리포트만** 한다. 단계 순서를 들고 있지 마라"

# ---------------------------------------------------------------------------
# 단계
# ---------------------------------------------------------------------------
stages:
  A_features:
    what: "우리 fold 경계로 22열 재생성 + 시즌별 구종 모델 학습"
    output: "시즌별 피처 parquet + 표 + 구종 모델. sha 기록"
    gate: "재현 게이트(위 verification 3번) 통과 전에는 학습으로 넘어가지 마라"

  B_ladder:
    fold: "fold_2023 (train ≤2022 → valid 2023) · **seed 42** · 자기 조기 종료 · cap 1650"
    rungs:
      - "R0 = 우리 47열 (대조군)"
      - "R1 = R0 + p6 (6열) → 53열"
      - "R2 = R1 + sit (6열) → 59열"
      - "R3 = R2 + idea (2열) → 61열"
      - "R4 = R3 + i3 (8열) → 69열"
    note: >
      ⚠️ **팀원 순서를 그대로 쓴다** — 우리 Δ를 팀원 Δ(+53.6 / +17.7 / +43.5 / +22.2)와
      같은 눈금으로 나란히 놓기 위해서다. **단 팀원은 fold_2024에서, 우리는 fold_2023에서 잰다.**
      절대 수준은 섞지 말고 **Δ만** 비교하라.
    caveat: "계단의 Δ는 **순서 의존**이다. '이 묶음의 단독 효과'가 아니라 '앞 단들 위에서 더한 효과'로 적어라"

  C_loo:
    fold: "fold_2023 · seed 42"
    arms: "R4에서 p6 / sit / idea / i3를 **하나씩 뺀** 4개"
    why: >
      계단은 '쌓을 때의 값', LOO는 '뺄 때의 값'이다. **둘이 그 묶음의 값어치를 위아래로 감싼다.**
      순서 의존성을 이렇게 다룬다.
    note: "⚠️ `idea`는 `p6`에서 파생된다 — p6를 빼면 idea도 자동으로 빠진다. 그 사실을 기록하라"

  D_promote:
    fold: "fold_2024 (train ≤2023) · **시드 42/7/2024**"
    arms: "R0(대조군) + **계단·LOO에서 고른 최선 1개**"
    selection: >
      ⚠️ **선택은 fold_2023에서만.** fold_2024는 선택이 끝난 뒤 읽는다.
      iter는 fold_2023 argmin × 1.2820으로 고정 — **fold_2024 valid를 보고 정하지 마라.**
    adoption: "3시드 부호 일치 AND |평균Δ| ≥ R0 시드 std × 3 (**ddof=1**). 완화 금지"

# ---------------------------------------------------------------------------
conventions_registered_today:
  seed_std_ddof: >
    **ddof=1 (표본 표준편차)로 고정한다.** 2026-08-08 지휘자 결정 — exp_033(ddof=1)과
    exp_036(ddof=0)이 같은 세 Brier에 반대 판정을 내는 사고가 있었고 어느 쪽도 사전 등록된
    적이 없었다. 시드 3개는 표본이고 불편추정량은 ddof=1이다. **앞으로만 적용, 소급 금지.**
  threshold_level: "3σ 유지. '과보수적인가'는 별개 미해결 안건이며 결과를 보고 바꾸지 않는다"

# ---------------------------------------------------------------------------
method:
  model: "C5 규격 그대로 — `experiments/exp_027/src/train.py`의 `ARMS[\"C5\"]`에서 읽어라"
  architecture: "B3 스태킹 그대로 — `experiments/exp_030/src/b3_cat.py` 승계"
  offset: "⚠️ 이 실험은 **오프셋·캘리브레이션을 적용하지 않는다.** 피처 축만 잰다. 보정은 별도"
  inherit: "`labels.py`·`exp016_ref.py`·`features_platoon.py` 등 승계 모듈 바이트 보존 + sha 기록"
  source_of_features: >
    `~/Downloads/submit_v4_matchup_anom.zip`의 `pipeline.py`(팀원 exp_032).
    **로직은 승계하되 fold 경계는 우리 것으로 다시 짠다.** 원본 sha를 기록하라.

runtime:
  where: a5000
  expected_min: 300                         # 240~360
  eta_basis: >
    - Stage A 피처 생성 + 시즌별 구종 모델 5개(LGBM 다항 250라운드): **30~50분**
    - Stage B 계단 5유닛 (fold_2023, 자기 조기 종료): exp_033 실측 19.5분/유닛,
      동시 3개 → **35~45분**
    - Stage C LOO 4유닛: 동일 → **30~40분**
    - Stage D 승격 2 arm × 3시드 = 6유닛 (fold_2024, 1,116,277행): exp_036 실측
      23~26분/유닛, 동시 3개 → **50~60분**
    - 드라이버 작성 + 재현 게이트 + 회수·리포트: **60~90분**
    → **240~360분 (4~6시간).**
  concurrency: "동시 3개 · fit당 스레드 6 고정. 서버 단독 사용"

deliverables: [metrics.json, report.md, "src/ (승계 sha + 신규 피처 파이프라인)", "PROGRESS.jsonl", "curves/", "pred/ (승격 arm)"]

audit:
  required: true
  why: >
    **새 피처 소스(트랙맨) · 새 조인 · 새 타깃 인코딩 셋**을 도입한다. 규약의 감사 필요 조건
    '새 피처 소스·새 조인 / 타깃 파생 피처 / 새 시계열 집계'에 전부 해당한다.
  when: "학습이 끝난 뒤. 지휘자가 별도로 호출한다"
  focus: "시즌별 구종 모델의 as-of · 타깃 인코딩 3종의 ≤s−1 · 2019 NaN 유지 · 복원 라벨 격리"

risks:
  - "⚠️ **팀원 이득이 우리 base에서 사라질 수 있다.** B3의 모드 분해가 `p6_*`를, 우리 오프셋이 `sit_*_dev`를 이미 먹고 있을 수 있다. 그 경우 '두 작업이 같은 신호를 다른 방식으로 잡고 있었다'가 결론이고 그것도 값어치가 있다"
  - "⚠️ **as-of 재구성이 이 실험의 진짜 난이도다.** 팀원 코드를 그대로 쓰면 리크다. 재현 게이트를 통과하기 전에는 학습으로 넘어가지 마라"
  - "계단 Δ는 순서 의존이다. LOO와 함께 읽어야 한다"
  - "fold_2023에서 고르고 fold_2024에서 읽으므로 **정직한 선택의 대가**가 발생한다. 그 값을 보고하라"
  - "C5는 미튜닝 첫 시도값이다. 피처가 늘면 최적 하이퍼파라미터가 달라질 수 있으나 **이 실험의 변인이 아니다**"
