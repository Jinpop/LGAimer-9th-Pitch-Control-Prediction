# 사용자 승인 대기 중 — 미발사
exp_id: exp_045
date: "2026-08-12"
title: "NN 계열 개시 — 엔티티 임베딩 + MLP, 그리고 CatBoost와의 상관·볼록성 실측"
base_exp: "exp_030 (C5_B3 base 예측·fold 정의·마스크) · exp_033 (fold_2024 저장 예측 .npy)"

# ---------------------------------------------------------------------------
# 🔴 이 실험이 사는 것은 NN 점수 하나가 아니라 '섞을 값이 있는가'다
# ---------------------------------------------------------------------------
hypothesis: >
  CatBoost C5는 `pitcher_id`(792) · `batter_id`(830)를 **수치형**으로 쓴다(exp_027 C5 스펙,
  cat_features에서 명시적으로 제외). 즉 ID를 **크기 순서로 쪼개는** 분할만 가능하고, 엔티티
  자체의 정체성은 못 배운다. **NN 임베딩은 여기를 정면으로 다르게 쓴다.**
  또 GBDT는 축 정렬 분할의 합이라 **부드러운 상호작용**(예: `li` × `score_diff` × 주자상태의
  연속적 결합)을 계단으로만 근사한다. MLP는 이걸 다른 방식으로 근사한다.
  → **가설: NN은 단독 점수에서 CatBoost에 질 것이다. 그러나 상관이 충분히 낮으면 섞을 값이 있다.**

# ---------------------------------------------------------------------------
# 🔴 사전 등록 — 판정 기준을 값 보기 전에 못 박는다
# ---------------------------------------------------------------------------
pre_registered_decision_rule:
  formula: "볼록성 > 실력격차 / 2  (후보 X·팀원 v6×Q 실측에서 도출)"
  measured_priors:
    - "후보 X (같은 계열끼리): 볼록성 +9.70205, 격차 66.17 → **졌다** (−23.38199)"
    - "팀원 v6×Q (계열 다름, ρ 0.913): 볼록성 약 +29, 격차 4.69 → **이겼다** (+26.87)"
    - "팀원 실측 상관: LGB↔Cat 0.9489 / **NN↔Cat 0.8653** (NN이 1−ρ 기준 2.6배 독립)"
  readings:                                # 🔴 값을 보기 전에 등록한다
    - "격차 < 58점 **그리고** ρ < 0.90  →  **앙상블 유망.** 다음 단계는 가중치 적합(fold_2023)"
    - "격차 < 58점, ρ ≥ 0.90            →  다양성이 얇다. NN 아키텍처를 바꿔 다시 잰다"
    - "격차 58~150점, ρ < 0.85          →  **애매.** 볼록성을 직접 실측해 식에 넣어 판정한다"
    - "격차 > 150점                     →  ⚠️ **NN 자체를 더 키운다.** 이 상태로는 섞어도 진다"
  ⚠️: "🔴 **위 네 구간을 값을 본 뒤 고치지 마라.**"

# ---------------------------------------------------------------------------
# σ 경계 — 이 실험부터 새 σ가 적용된다
# ---------------------------------------------------------------------------
sigma:
  applies: "🔴 **exp_044에서 재측정된 새 σ가 exp_045(이 실험)부터 적용된다.**"
  value_score: 8.55113                     # n=9, ddof=1
  threshold_3sigma: 25.65339
  ⚠️: >
    ⚠️ **단 이 σ는 CatBoost arm에서 잰 값이다.** NN의 시드 간 분산은 **더 클 가능성이 높다**
    (초기화·드롭아웃·배치 순서가 전부 확률적). **NN 자체의 σ를 이 실험에서 따로 재고**,
    NN 채택 판정에는 그 값을 쓴다. CatBoost σ를 NN에 그대로 적용하지 마라.

# ---------------------------------------------------------------------------
# 모델 스펙
# ---------------------------------------------------------------------------
model:
  family: "엔티티 임베딩 + MLP (torch 2.7.1+cu128, GPU)"
  target: "control_success 직접 이진. **B3 셀 분해를 흉내내지 않는다**"
  why_not_b3: >
    다양성의 원천은 **아키텍처**여야 한다. B3 구조를 그대로 복제하면 같은 편향을 다른 도구로
    재현하게 되고, 그게 바로 후보 X가 실패한 이유(같은 계열끼리는 볼록성이 안 나온다)다.
    ⚠️ B3-NN은 이 실험이 유망 판정을 받은 뒤의 **후속 선택지**로 남긴다.

  embeddings:
    pitcher_id:      {cardinality: 792, dim: 16}
    batter_id:       {cardinality: 830, dim: 16}
    pitcher_team_id: {cardinality: 13,  dim: 4}
    batter_team_id:  {cardinality: 13,  dim: 4}
    base_state:      {cardinality: 8,   dim: 4}
    🔴_oov: >
      **미등장 ID 전용 버킷(index 0)을 둔다.** 2024 valid에는 2023까지 없던 투수·타자가 있다.
      vocab은 **train 구간에서만** 만든다(fold_2024면 ≤2023). ⚠️ **valid/test를 보고 vocab을
      만들면 리크다.** OOV 버킷은 sentinel 채우기가 아니라 **학습되는 '미지' 범주**다.
    small_binaries: "`top_bottom` `game_type` `pitcher_hand` `batter_hand` `runner_on_*`는 0/1 수치로 그대로"

  numeric:
    count: "약 38열 (49열 − row_id − target − 임베딩 5열 − 소이진 다수는 수치로 유지)"
    scaling: "**QuantileTransformer(output_distribution='normal')**"
    🔴_leak_surface: >
      **스케일러는 train 구간에서만 fit하고 valid/test에는 transform만 한다.**
      fold_2024면 ≤2023에서 fit. ⚠️ 전체에 fit하면 리크다 — **감사 필수 항목**.
    🔴_missing: >
      **결측을 sentinel로 채우지 않는다** (CLAUDE.md 규약). 실측 결측:
      `asof_pitcher_prev{1,3,5}_game_*` 5열 각 29,185행(1.98%), `asof_{pitcher,batter}_*` 각 792/830행.
      처리: ① **결측 플래그 열을 별도 생성**(`{col}_isna`, 0/1) ② 값 자리는 train **중앙값**으로
      채운다. 플래그가 있으므로 모델이 '채워진 값'과 '실제 값'을 구별할 수 있다.
      ⚠️ 플래그 없이 채우면 규약 위반이다.

  architecture:
    trunk: "임베딩 concat + 수치 → [512, 256, 128] MLP"
    activation: "GELU"
    norm: "BatchNorm1d (첫 층 입력 제외)"
    dropout: 0.2
    output: "1 logit → sigmoid"
  training:
    loss: "BCEWithLogitsLoss"
    optimizer: "AdamW(lr 1e-3, weight_decay 1e-4)"
    scheduler: "CosineAnnealingLR"
    batch_size: 8192
    max_epochs: 40
    early_stopping: "valid Brier 기준 patience 5, best 복원"
    🔴_early_stop_fold: >
      **early stopping은 그 fold의 valid로 한다.** fold_2023 실험은 2023으로, fold_2024 실험은
      2024로. ⚠️ 이건 **탐색용 fold(2023)에서만 자유롭다** — fold_2024의 epoch 수를 그대로
      배포에 쓰면 fold-oracle이다(후보 O의 결함). **배포 epoch은 fold_2023 argmin에서 유도**하고
      그 사실을 리포트에 적어라.

# ---------------------------------------------------------------------------
# 검증 설계
# ---------------------------------------------------------------------------
validation:
  folds: "**fold_2023(train≤2022→valid 2023)과 fold_2024(train≤2023→valid 2024) 둘 다**"
  why_both: >
    🔴 **앙상블 가중치는 fold_2023에서 적합하고 fold_2024에서 검증해야 한다.**
    fold_2024에서 가중치를 고르면 그건 fold-oracle이고, 승격 판정 fold를 태워먹는 것이다.
    두 fold를 다 만들어두지 않으면 다음 실험이 학습부터 다시 해야 한다.
  masks: "exp_004 마스크·fold 정의·평가 코드를 **읽어 승계**하라. 전사 금지"
  metric: "valid_all Brier가 유일한 판정 기준. valid_R·valid_F는 보조 기록"
  expected_n: "fold_2024 valid_all = 253,507 (exp_016 `EXPECTED_2024`와 대조해 assert)"
  seeds: "**3시드 (42, 7, 2024)** — 채택 판정이 아니라 방향 판정이므로 3으로 시작"
  🔴_sigma_nn: "3시드로 NN 자체의 시드 간 표준편차(ddof=1)를 재고 점수 환산해 기록하라"

# ---------------------------------------------------------------------------
# 🔴 이 실험의 핵심 산출물 — 상관과 볼록성
# ---------------------------------------------------------------------------
ensemble_measurement:
  catboost_side: >
    exp_033의 fold_2024 저장 예측을 쓴다:
    `pred_C5B3_offset_S400_self_fold2024_seed{42,7,2024}.npy`.
    ⚠️ **이 파일들의 행 순서·길이가 NN 예측과 같은 정렬인지 먼저 assert하라.**
    다르면 정렬 키(row_id)로 맞추고 그 사실을 기록하라.
  compute:
    - "① **격차**: NN 3시드 평균 점수 − CatBoost 3시드 평균 점수 (fold_2024 valid_all)"
    - "② **상관 ρ**: 두 예측 벡터의 Pearson. **로짓 공간과 확률 공간 둘 다** 기록"
    - "③ **볼록성**: w를 0~1로 21등분해 `w·NN + (1−w)·Cat` 혼합의 Brier 곡선 전체를 기록.
       볼록성 = (선형보간 기대값 − 실제 최소값)을 점수로 환산"
    - "④ **fold_2023 최적 w**로 fold_2024를 채점한 값 — **이것이 실제 배포 시 얻을 값의 추정**"
  🔴_upper_bound_warning: >
    **③의 fold_2024 최적 w에서 나온 이득은 상한이지 배포 예측이 아니다** — 후보 Z에서 실측된
    구조와 같다(시드 평균화가 잡음 큰 쪽을 더 돕고, 사후 보정이 이미 닫힌 편향을 다시 못 닫는다).
    **④가 정직한 추정치다. 리포트에 둘을 나란히 적고 ③을 배포 기대값으로 서술하지 마라.**
  conversion: "모든 Brier에 `100000 × (1 − Brier/0.2498069)` 환산 점수 병기, 최대 5자리, ±0.20 주석"

# ---------------------------------------------------------------------------
# 자원 — GPU를 처음 쓴다
# ---------------------------------------------------------------------------
resources:
  gpu: "**A5000 ×2, 현재 유휴.** torch 2.7.1+cu128 설치 검증 완료(2026-08-11)"
  policy: >
    🟢 **NN은 GPU를 써도 깨지는 비교가 없다** — 새 계열이라 CPU 실측 앵커가 존재하지 않는다.
    (CatBoost는 GPU 불가: `rsm on GPU is supported for pairwise modes only`, 당선 설정이 rsm 사용)
  cpu: "데이터 전처리만 CPU. **threads 6 이하**로 묶어라 — 다른 작업과 경합 가능"
  parallel: "2 GPU에 **fit 2개까지 동시**(각 1 GPU 전용). 그 이상 금지"

# ---------------------------------------------------------------------------
runtime:
  expected_hours: "2.5 ~ 4.0"
  🔴_no_prior_measurement: >
    ⚠️ **NN 실측이 `실행시간_실측.md`에 없다. 이 ETA는 실측 곱셈이 아니라 구조 기반 추정이다.**
    그 사실을 명시하고, **끝나면 실측값을 표에 반드시 추가하라.** 초과하면 즉시 갱신 보고.
  eta_basis: >
    - 데이터 파이프라인(로드·vocab·스케일러·결측 플래그) + 캐시: **50분** (코드 작성이 지배)
    - 아키텍처 정찰 (seed 42 단독, 구성 5~6개 × fold_2023): 1.22M행 / batch 8192 = 149 step,
      MLP 소형이라 GPU에서 epoch당 5~10초 × 40 epoch = **fit당 4~7분** → **35분**
    - 본 측정 (최종 구성 × 3시드 × 2 fold = 6 fit, 2 GPU 병렬): **25분**
    - 상관·볼록성 계산 + 리포트: **40분**
    - 여유(GPU 첫 사용 시행착오·OOM·정렬 불일치): **30분**

audit:
  required: true
  why: "🔴 **새 전처리 경로다** — 스케일러·vocab·결측 플래그가 전부 새 리크 표면. CLAUDE.md 감사 필요 조건에 해당"
  scope:
    - "ⓐ **스케일러가 train 구간에서만 fit되는가** (fold_2024면 ≤2023)"
    - "ⓑ **vocab이 train 구간에서만 만들어지는가** — valid의 미등장 ID가 OOV로 가는지 실제로 확인"
    - "ⓒ **결측 중앙값이 train 유래인가**"
    - "ⓓ early stopping이 그 fold의 valid를 쓰되, **배포 epoch이 fold_2024에서 유도되지 않았는가**"
    - "ⓔ 현재 행 TrackMan 물리량 미사용 · 시계열 집계 shift(1) 준수"

do_not:
  - "⚠️ **제출물 빌드·zip·제출 금지.** 이 실험은 측정이다"
  - "🔴 **fold_2024로 아키텍처·epoch·가중치를 고르지 마라** — 탐색은 fold_2023 단독"
  - "🔴 **결측을 플래그 없이 채우지 마라**"
  - "🔴 **vocab·스케일러를 전체 데이터에서 만들지 마라**"
  - "⚠️ **사전 등록한 네 구간 해석을 값을 본 뒤 고치지 마라**"
  - "⚠️ CatBoost σ(8.55113)를 NN 채택 판정에 그대로 쓰지 마라 — NN σ를 따로 재라"
  - "⚠️ exp_044 작업 영역을 건드리지 마라"
