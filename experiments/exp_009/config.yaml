  notes: "프로파일 결측은 SimpleImputer(median)를 타는 운영진 파이프라인 특성상 sentinel화됨 — has_profile 플래그 컬럼을 반드시 추가해 결측 정보를 보존할 것"
validation: {primary_metric: brier, note: "fold_2024 valid-R, 대조군 = exp_008 R2 0.248455"}
