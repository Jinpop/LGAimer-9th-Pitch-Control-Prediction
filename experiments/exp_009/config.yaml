# 캠페인 4 — 지휘자 작성 2026-08-05
exp_id: exp_009
date: "2026-08-05"
hypothesis: "마스크 RF(0.248455)를 새 base로 삼고 trackman 프로파일 65피처를 붙이면, 강한 base 위에서도 우리 피처가 값어치를 한다"
base_exp: "exp_008 R2"        # 변경 1개: 프로파일 조인
