# 🔴 사용자 승인 대기 — 미발사
exp_id: exp_047
date: "2026-08-13"
title: "시즌-내 폼 분해의 확장 — 나머지 아홉 rate 컬럼 + 궤적/편차 분리"
base_exp: "exp_046 (분해 절차·동결표·감사 통과 코드) · exp_030 (C5_B3 base) · exp_045 이후 σ"

# ---------------------------------------------------------------------------
# 왜 이 실험인가 — 두 개의 서로 다른 근거
# ---------------------------------------------------------------------------
motivation:
  근거1_광맥이_한_컬럼뿐: >
    exp_046은 `asof_pitcher_success_rate` **하나**만 분해했고 +45.17점(트리)을 얻었다.
    같은 희석이 걸린 rate 컬럼이 **아홉 개 더** 있다 — 전부 커리어 누적이다.
  근거2_한_덩어리를_둘로: >
    🔴 **2026-08-13 사용자 지적에서 나온 설계 변경.** 지휘자가 train 전수로 재보니
    `d_form`의 분산이 **연도 4.18% / 투수 주효과 46.09% / 투수×시즌 상호작용 49.73%**로 갈린다
    (투수-시즌 1,184셀, n 가중). **투수 주효과는 궤적(노화·성장)이고 상호작용은 올해만의 것**인데
    지금은 계수 `β_f` 하나로 함께 밀린다 → **한쪽 과소, 다른쪽 과대 보정**이 구조적으로 일어난다.
  기존_열과의_중복_실측: >
    `d_form_eb` vs 커리어 성공률 r=−0.1395 / 직전1경기 +0.2424 / 직전3경기 +0.3543 /
    **직전5경기 +0.3823**. 네 열 전부로 회귀하면 **R²=0.2972** → **증분 70.3%**.
    ⚠️ exp_046의 +45.17은 이 네 열을 **이미 가진** 47열 base 대비 증분이라 중복은 차감된 상태다.
    이 실험도 같은 base 위에서 잰다.

# ---------------------------------------------------------------------------
# 축 목록 — 11개를 진단하고, 통과한 것만 학습에 올린다
# ---------------------------------------------------------------------------
axes:
  A_나머지_rate_9열:
    분해_대상: >
      투수 결과 4: `asof_pitcher_reverse_rate` · `middle_rate` · `ball_rate` · `strike_rate`
      투수 구종 3: `asof_pitcher_fastball_rate` · `breaking_rate` · `offspeed_rate`
                   (분모는 `asof_pitcher_pitchmix_n` — `asof_pitcher_n`이 아니다. 확인할 것)
      타자 2: `asof_batter_success_rate` · `asof_batter_middle_rate` (분모 `asof_batter_n`)
    절차: "exp_046 `form_decomp.py`와 동일 — `round(n × rate)` 복원 → 직전 시즌말 동결표 차감 → EB 수축"
    ⚠️_구종_비율_주의: >
      셋의 합이 1에 가까우므로 **셋을 다 넣으면 공선성**이다. 진단에서 확인하고
      **둘만 넣거나 로그비(log-ratio)로 변환**한다. 무작정 셋 다 넣지 말 것.
    ⚠️_타자_컬럼_주의: >
      `asof_batter_success_rate`는 **그 타자가 상대한 투구들의 성공률**이라 타자 실력보다
      상대 투수 구성을 반영할 수 있다. 진단에서 이 해석 위험을 명시적으로 다룰 것.
  B_궤적_편차_분리:                       # ★ 사용자 지적에서 나온 축
    정의: >
      `traj[pitcher]` = 그 투수의 **과거 시즌들** `d_form`의 n 가중평균 (train 전용, as-of)
      `dev`  = 당해 시즌 `d_form` − `traj`
      둘을 **각자 EB 수축**한다 (수축 상수를 따로 잡는 것이 이 축의 요점).
    가설: "궤적은 2025로 이어지고 편차는 표본이 얇으면 대부분 잡음이다 — 다른 수축이 필요하다"
    커버리지_주의: >
      `traj`는 **선행 시즌 2개 이상**이 있어야 정의된다. 신인·2년차는 결측이므로
      `has_traj` 플래그를 별도 컬럼으로 준다. **sentinel 금지.**

# ---------------------------------------------------------------------------
# STAGE 1 — 진단 (학습 0건). 여기서 걸러야 stage 2가 좁아진다
# ---------------------------------------------------------------------------
stage1_diagnostic:
  무결성_게이트:                          # exp_046 G1~G3와 동형, 컬럼마다 반복
    G1: "모든 행에서 `0 ≤ S_season ≤ n_season`. 컬럼별 위반 행 수 보고 (기대 0)"
    G2: "🔴 **결정적** — 라벨/원자료로 직접 누적한 값과 분해값이 전 행 일치. 컬럼별로"
    G3: "구종 3열의 합이 1인지, 분모가 `pitchmix_n`인지 실측 확인"
  컬럼마다_측정할_것:
    - "커버리지 (`has_form=1` 비율), 세그먼트 R/F별"
    - "희석계수 — 기존 열이 당해 시즌분을 얼마나 담고 있는가 (exp_046은 19.5%였다)"
    - "참SD (표본잡음 제거 후)"
    - "🔴 **증분 R²** — 47열 base가 가진 관련 열 전부로 회귀했을 때의 잔여. exp_046 성공률 축은 70.3%였다"
    - "**축 간 상관 행렬** — 아홉 축이 서로 얼마나 겹치는지. 이게 선별의 주 근거다"
    - "이득 추정 = `400309 × (확률공간 보정폭 sd)²` — 🔴 **상한이지 배포 기대값이 아니다**"
  B축_추가_측정:
    - "`traj`와 `dev`의 상관 (직교해야 설계가 성립)"
    - "`traj` 커버리지 (선행 2시즌 필요)"
    - "각자의 최적 EB 수축 상수 — **선행 블록에서만** 고른다"
    - "`traj`가 기존 열(커리어·직전N경기)로 얼마나 설명되는지"
  선별_기준:                              # 🔴 값 보기 전 등록
    - "증분 R² 잔여 < 30% → **탈락** (기존 열이 대부분 갖고 있다)"
    - "추정 이득 < 10점 → **탈락**"
    - "다른 채택 축과 |r| > 0.7 → **둘 중 추정 이득이 큰 쪽만** 남긴다"
    - "위를 통과한 축이 0개면 **stage 2 없이 종료**하고 보고한다"
    - "통과 축이 5개를 넘으면 **상위 4개만** stage 2로 올린다 (열 예산 보호, 아래 참조)"
  eta: "30~45분 (학습 0건, 11축 × 1.47M행 분해·회귀)"

# ---------------------------------------------------------------------------
# STAGE 2 — 트리 피처로만 투입. 오프셋 형태는 이번엔 만들지 않는다
# ---------------------------------------------------------------------------
stage2:
  🔴_왜_트리_피처만인가: >
    **2026-08-13 사용자 방향 전환**: 보정치를 더 쌓지 않고 모델링에 집중한다.
    근거는 우리 장부에 이미 있다 — 후보 Z 분해에서 모델 이득 +7.41496이 보정 사슬을 지나며
    ①+7.41 → ②+3.92 → ③+0.89 → ④**−2.73**으로 소멸했고 LB가 그 방향을 확인했다(−5.55).
    exp_040도 같은 것을 쟀다(오프셋 +38.3→+27.4, 캘리브레이션 +21.4→+9.5).
    exp_046 자신이 결정적이다 — **A1(트리)와 A2(오프셋)를 같이 넣으면 −20.16**이고
    트리가 신호의 **91%를 흡수**한다. 둘은 대체재다.
    → **보정은 저차원 편향만 고친다. 판별력을 올리는 변경은 트리 쪽에 넣어야 흡수되지 않는다.**
  arms:
    R0: "대조군 = exp_030 C5_B3 (47열). 저장 예측 재사용 — 재학습 없음"
    F1: "47열 + exp_046 성공률 분해 4열 (= exp_046 A1 재현). **이번 실험의 실질적 대조군**"
    F2: "F1 + stage 1 선별 축들"
    F3: "F1의 성공률 축을 **궤적/편차로 쪼갠 판본** (B축) — 열 수는 늘지만 축 수는 같다"
    F4: "F2 + F3 결합 — F2·F3가 **둘 다** 통과할 때만"
  seeds: [42, 7, 2024]
  🔴_열_예산_보호: >
    exp_003(65열)·exp_009는 **열 수가 분기 후보 예산을 잠식**해 죽었다. 반대로 exp_021은
    "기전 없는 11열"을 빼자 **오히려 나빠졌다**(비단조). **두 관측이 동시에 성립하는 단순 모형은 없다.**
    → 무더기 투입 금지, stage 1 선별 통과분만. 그리고 **F2는 LOO(하나씩 빼기)로 각 축의 몫을 낸다** —
    계단(전진 추가)만으로 묶음을 채택하지 않는다(exp_037 `sit` 부호 뒤집힘 교훈).
  🔴_스태커_cap: >
    **exp_046 A1은 스태커 argmin이 3시드 전부 곡선 경계에 붙어 검열됐다**(`curve_argmin_is_interior: false`)
    — 즉 +45.17은 하한이다. 이번엔 **cap을 넉넉히 올려 내부 극값을 확보**하고,
    경계에 닿으면 그 사실을 arm별로 보고한다. exp_036 절차 참조.
  eta: "45~70분 (arm 3~4개 × 3시드, 동시 3개·fit당 threads 6, 경합 1.2~1.5)"

# ---------------------------------------------------------------------------
# 판정 — 사전 등록
# ---------------------------------------------------------------------------
pre_registered_decision_rule:
  sigma_score: 8.55113
  threshold_3sigma: 25.65339             # exp_045부터 적용, 이 실험도 여기
  rule: "3시드 전부 부호 일치 AND |평균Δ| ≥ 25.65339점 → 채택"
  대조군: "🔴 F1(= exp_046 A1)이 대조군이다. R0 대비 Δ를 이 실험의 성과로 적지 말 것 — 그건 exp_046이 이미 잰 것이다"
  ⚠️: "판정 후 σ·ddof를 바꾸지 않는다"
  선택_규율: "EB 수축 상수·축 선별은 **선행 블록(2022+2023)에서만**. fold_2024는 선택 후에 읽는다. 정직한 선택의 대가를 측정해 보고한다"

changed_vs_control:
  ⚠️_불가피한_딸림_변인: >
    열 수가 바뀌면 **셀·스태커 iter가 재산출된다**. exp_046에서 등록했던 것과 같은 성격이고
    후보 S에서 이걸 계획 단계에 빠뜨려 LB delta를 귀속 못 한 사고가 있었다. **미리 등록한다.**
    → 채택 시 "N열 + 자기 iter 조합의 효과"로만 서술한다.

audit:
  required: true
  focus:
    - "🔴 test/valid 적용 경로에 `groupby`·`sort`·`shift`·`cumsum`·`pd.factorize`·`np.unique(season)`이 없을 것"
    - "⚠️ **라벨 복원 경로가 실재한다** — 인접 두 행 차분으로 라벨이 100% 복원된다(감사관 독립 실측 99.846%). 이 실험은 아홉 컬럼에 같은 산술을 쓰므로 표면이 아홉 배다"
    - "동결표가 시즌 경계를 넘지 않는지 (fold_2024 valid는 2023말 표)"
    - "`traj` 계산이 **과거 시즌만** 보는지 — 당해 시즌이 섞이면 리크"
    - "결측에 sentinel이 없는지 (`has_form`·`has_traj` 플래그 구조)"

server: "A5000 (server.yaml), fit당 threads 6, 동시 3개 상한"
