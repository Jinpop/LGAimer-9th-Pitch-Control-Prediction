exp_id: exp_109
title: "CT `sp` 축 한 점 풀이 — 프레임 곡률 + LB 한 점"
date: 2026-08-26
type: read-only 측정 (재학습 0 · 슬롯 0)

동기: |
  팀원 후보 CT 가 우리 CR 위에서 **LB 1150.869939105 (+6.6519071210)** 를 냈다.
  같은 날 같은 계열의 SP-OFFSET 이 **−15.63** 이었고 CT 는 그 부호를 뒤집은 것으로 보고됐다.

  지휘자가 "같은 크기 걸음의 부호 반전" 을 **가정**하고 잔여 +0.26 을 계산했다.
  🔴 그 가정을 빼고 프레임에서 직접 풀면 답이 확정된다.
  S147: 캘프레임 곡률이 LB 두 점 해를 **0.63% 안에서 재현**한다 — `G` 는 프레임이 LB 보다 정확하다.
  S153: 그 축·그 기반의 LB 점이 있으면 한 점 풀이 오차가 **2.0%**(CJ→CN), 없으면 자릿수가 틀린다(CP, 10배).
  → **`G` 는 프레임에서, `L` 은 LB 한 점에서.** 슬롯을 쓰지 않는다.

단계:
  1_diff: |
     `~/Downloads/submit_CT_spflip_onCR.zip` vs `submissions/submit_CR_q12land.zip` **전수 diff**.
     🔴 파일 이름이나 후보명으로 내용을 추정하지 마라(S130: `submit_CF_3axis.zip` 이 내부적으로 CH 였다).
     바뀐 파일·키·값을 전부 열거하고, **걸음의 완전정밀도 값**을 기록하라.
     ⚠️ 바뀐 것이 하나가 아니면 그 사실을 먼저 보고하라 — 아래 산술이 단일 축을 전제한다.
  2_delta: |
     캘프레임에서 `δ = logit(p_CT) − logit(p_CR)` 을 행별로 재라.
     `K·G_jj = K·mean(δ²)` (K = 400309.19882517256).
     🔴 **S57 곡률 법칙으로 교차검증**: `A = K·G_jj / (f(1−f))` 가 **10,900 ± 3%** 안인가.
        `f` = 그 방향이 발동하는 행 비중(직접 세라 — S150 이 30초면 된다고 적었다).
        법칙 밖이면 **전파 배율 오류**를 의심하라(S75: CA 빌더가 7.15배, 지휘자가 4.93배 틀린 적 있다).
  3_solve: |
     `gain(u_CT) = K·(2·u_CT·L − u_CT²·G) = +6.6519071210` 에서 `K·L` 을 푼다.
     → `u* = K·L / K·G` · 최대이득 `K·L²/G` · **잔여 = 최대이득 − 6.6519071210**
     🔴 **`L` 을 걸음으로 나누지 마라**(S166). 옳은 형태: `K·L = (gain + K·G·u²) / (2u)`
  4_check: |
     SP-OFFSET(−15.63) 걸음을 알아낼 수 있으면 **두 점 해**로 교차검증하라.
     그 zip 이 없으면 "같은 크기 부호 반전" 가정 하의 값(K·G·u² 4.49 · K·L·u 5.57 · 최대 6.91)과
     프레임 해를 나란히 놓고 **가정이 맞았는지** 판정하라.
  5_cross: |
     🔴 후보 CS 의 카운트 축 δ 와 이 축 δ 의 `ρ`.
     세그먼트별로도 낼 것(S71: `beta_by_segment` 를 타면 합산 ρ 가 정반대로 읽힌다).
     S109 실측이 6방향에서 naive 합산 **13.6% 과대**였다.
  6_step: |
     잔여가 의미 있으면(**≥ +1점**) 최악최대화 걸음을 내라 — `G` 불확실 ±11.15%(S69).
     `u = K·L / (1.1115 · K·G)`. S155 가 이 규율로 세 번 이득을 냈다.
     🔴 `G` 과소가 과대보다 **2.78배 비싸다**(S43) — 짧게 서는 쪽으로 틀려라.

🔴 하지 말 것:
  - 슬롯을 쓰지 마라. 이건 측정이다.
  - zip 을 만들지 마라.
  - **팀원 축이다.** 잔여를 우리가 물지 말지는 지휘자가 정한다 — 측정만 하고 보고하라.

자원: CPU 2코어. GPU 금지(exp_108 사용 중). 재학습 0.
