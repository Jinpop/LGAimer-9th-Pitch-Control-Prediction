exp_id: "117"
title: "2023 레짐 경계 — 리그 셀 레벨 이동 전수 스캔 (CS3 계열 확장)"
date: 2026-08-28
owner: orchestrator
lb_slots_used: 0
retraining: 0
learning: 0

why: |
  우리가 이긴 축들의 공통점은 **팔이 구조적으로 못 배우는 것**이다.
    · `sp_*` 주체×상황 EB 셀 → 트리는 주체별 상호작용을 EB 수축해 기억 못 한다  (exp_116 이 이 계열을 닫았다)
    · **CS3 카운트 시즌 추세 (+0.78666) → 🔑 트리는 학습 창 밖으로 외삽을 못 한다**
  외삽 계열은 **카운트 한 칸만** 팠다.

  🔴 팀 원장 제60 이 *"season 외삽 구조축 / 수준 외삽"* 을 기각했는데 **CS3 가 반례**다.
  차이가 원문에 있다 — CS3 는 12칸 OLS 시즌 기울기의 **★방향만★** 쓰고(12개 자유 파라미터 아님),
  강한 칸 하나(3-0)에서만 **레벨**을 쓴다. 자유 파라미터로 풀면 제26 이 닫은 자유도 폭발로 돌아간다.

  그리고 3-0 이 외삽되는 이유가 실측으로 있다 (팀원 답변 §Q3):
    2019 −0.02717 · 2020 −0.02397 · 2021 −0.02781 · 2022 −0.03029 · 2023 −0.00734 · 2024 −0.00213
  **한 시즌 튄 게 아니라 2023 에 레벨이 한 번 이동해 2024 까지 유지된다.**
  같은 2023 경계에서 `game_type F` 도 깨졌다(제188: .7087 → .4729, R 은 .55→.49 매끄러움).
  → **2023 이 레짐 경계다.** 그 경계에서 이동한 리그 셀이 카운트 말고 또 있는지 아무도 안 훑었다.

question: |
  train 48열로 정의 가능한 리그 셀 중, **2023 에 라벨 편차의 레벨이 이동하고 2024 까지 유지된** 것이 또 있는가.
  있으면 그중 배포 축(특히 CS3 카운트 추세)에 직교하는 것이 있는가.

not_covered_by: |
  🔴 이 스캔이 기존 폐쇄 넷 **어디에도 안 들어간다** — 발사 전 확인 사항이다.
   · exp_095 (21후보 전원 귀무 아래) = **이미 계산되고 버려지는 per-row 중간값**. 새 표가 아니다.
   · exp_116 (22축 통과 0)         = **주체 키** 스플릿 셀. 이번은 주체 키가 없다.
   · 제60 (season 외삽 기각)        = **전역 수준 외삽**. 이번은 셀 조건부이고 방향만 쓴다.
   · 제26 (카운트 12셀 부분)        = 카운트 계열은 **이미 CS3 가 가져갔다** — 양성 대조로만 쓴다.

cells_to_scan: |
  전부 **현재 행 열**로만 정의한다(2025 test 에 존재, 트랙맨 0열, 규칙 2-4 행별 조회).
  단일 축 (리그 셀, 주체 키 없음):
    base_state(8) · outs_before(3) · num_runners_on(4) · inning 구간(≤3/4-6/7+) ·
    top_bottom(2) · game_type(2) · pitcher_hand×batter_hand(4) · score_diff 구간(5) ·
    li 구간(train 동결 4분위) · game_month(6~7) · game_dayofweek(7) ·
    asof_pitcher_n 구간(경험, train 동결 4분위) · 구종믹스 우세군(fastball/breaking/offspeed)
  2원 교차 (셀 수가 60 이하인 조합만):
    handedness(4) × outs(3) · handedness(4) × base_state(8) · outs(3) × base_state(8) ·
    count(12) × handedness(4)   ← 🔴 카운트가 들어간 것은 CS3 직교 잔차에서 다시 잰다

method: |
  각 셀 c, 각 시즌 y 에 대해:
    dev(c,y) = logit(라벨 평균 | 셀 c, 시즌 y) − logit(라벨 평균 | 시즌 y)      # 시즌 주효과 제거
  그리고 **레벨 이동 통계** 셋을 낸다:
    ① shift  = mean(dev[2023..2024]) − mean(dev[2019..2022])
    ② hold   = |dev[2023] − dev[2024]|            (작아야 유지다)
    ③ pre_sd = sd(dev[2019..2022])                (이동 전이 평평해야 한다)
  🔴 판정은 ①만으로 하지 않는다 — **①이 크고 ②가 작고 ③도 작아야** "2023 에 한 번 이동해 유지" 다.
  3-0 실측이 그 형태다: ① 큰 이동 · ② 0.0052 · ③ 0.0026.

controls:
  positive:
    - "카운트 3-0 셀 — 위 여섯 시즌 값(−0.02717 … −0.00213)을 재현할 것"
    - "game_type F — 제188 의 .7087 → .4729 붕괴를 재현할 것"
  negative:
    - "셀 크기를 정확히 보존한 무작위 재배정, 시드 5개 → 널 바닥을 측정한다"
    - "🔴 S269 — 이 통계에도 널 바닥이 있다고 가정하고, 문턱을 널 위에서 잡는다"
  note: |
    🔴 양성 대조 둘이 재현되지 않으면 **거기서 멈추고 보고한다**(S135).
    재현 판정의 허용 오차를 **측정 전에 선언**한다.

threshold_preregistered: |
  🔴 결과를 보고 바꾸지 않는다 (S8).
  1단 — 통과 조건 전부:
    ① shift 의 |z| ≥ 널 5시드 분포의 p95
    ② hold ≤ pre_sd × 1.5          (이동 후 유지)
    ③ 셀 표본 ≥ 20,000행 (2023·2024 각각)
  2단 — 1단 통과분만:
    CS3 카운트 추세 + 배포 4축에 대한 **직교 잔차**에서 shift 통계를 다시 낸다.
    🔴 exp_116 에서 최고 후보가 잔차화로 −80% 붕괴했다. 이 단계가 진짜 관문이다.
  3단 — 2단 생존분만:
    exp_115 방식으로 자기 곡률 `q` 를 라벨 없이 실측하고 천장 `A'²/4q` 를 낸다.
    검출한계 **+1.4** 를 넘는 것만 프로브 후보로 보고한다.

deployment_check: |
  🔴 S170 — 배포 취득처를 먼저 못 박는다.
  셀 정의는 전부 현재 행 열이고 표는 train 에서 동결한다. `li`·`score_diff`·`asof_pitcher_n` 의
  구간 경계는 **train 에서 동결**해 값을 명시한다 — 배포에서 test 분위수를 다시 계산하면 규칙 2-4 위반이다.
  ⚠️ **외삽 규약**: CS3 와 동일하게 **기울기 방향만** 쓰거나, **한 칸의 레벨만** 쓴다.
  셀별 자유 파라미터를 적합하지 않는다(제26 이 닫은 형태다).

eta: "train 1,475,092행 집계 · 셀 정의 약 17종 · numpy 벡터화. 20~40분. exp_116 실측 3.7분이 눈금."
