exp_id: exp_091
date: 2026-08-24
title: "딥 팔 훑기 2 — 시드 수·구조·정규화. 학습량은 고원에 고정"
학습_건수: "약 150~250 fit (fit 1건 약 12초)"
제출물: "없음 (통과 지점의 배포 가중치는 다음 빌드에서)"

왜: |
  exp_090 이 **학습량 축 하나만** 훑어 720스텝이 고원 밖임을 t +3.59 로 확인했다.
  그런데 그 실험이 손대지 않은 손잡이가 셋 더 있고, **GPU 두 장이 놀고 fit 이 12초**다.
  🔑 지금 우리 재고에서 **딥 축만이 자릿수가 맞는다**(+5.08, 기존 축과 최대 |ρ| 0.107, max|δ| 가 q_league 의 67배).
     그 축을 여러 방향으로 한 번에 훑는 것이 지금 가장 값싼 큰 걸음이다.

  ⚠️ **exp_090 이 남긴 사실 둘을 전제로 쓴다**:
    ① 고원은 816~3264 스텝이고 **그 안에서는 서로 구별 안 된다**(전부 최고점 대비 t < 2.0)
    ② **5시드 평균이 1시드보다 체계적으로 낫다**(1632: +11.05 vs +9.29, 시드 간 sd 3.1)

면: "exp_089/090 이 만든 정직면 그대로. 기준점 928.501461058684 를 abs_diff 0.0 으로 재현 확인 후 시작"
고정: "학습량 = OOT 1632스텝(고원 argmax). 프레임·mu/sd·어휘·batch·lr 상수 1e-3 고정"

축_셋:
  A_시드수:
    지점: "5, 10, 15, 20 (기존 5시드에 새 시드 15개 추가)"
    왜: "exp_090 실측 — 5시드평균이 1시드평균보다 +1.76 낫고 시드 간 sd 가 3.1 이다. 아직 포화 안 했을 수 있다"
    ⚠️: "S72 — 시드 평균은 잡음과 함께 **다양성도 깎는다**. ρ(z_mate) 를 시드 수별로 함께 기록할 것"
  B_구조:
    지점: "폭 x{0.5, 1, 2} · 깊이 {현행, +1층, −1층}. 현행 = 256-…(npz 형상에서 복원)"
    왜: "팀원은 구조를 한 번도 안 훑었다(하이퍼는 S22 에서 골라 동결). 학습량 하나가 9.2배였으니 구조도 볼 값이 있다"
    시드: "각 지점 5시드"
  C_정규화:
    지점: "dropout {0, 현행, 2배} · weight decay {0, 현행, 10배}"
    왜: "고원이 넓은 것(816~3264)은 정규화가 듣고 있다는 뜻일 수 있다. 그러면 더 밀 수 있다"
    시드: "각 지점 5시드"

측정 (모든 지점 공통):
  - "w 격자 0~0.6 step 0.01 최적 w 와 이득 · w=0.20 고정 이득"
  - "투수 블록 부트스트랩 1000회 t — 🔴 exp_090 과 **같은 rng 시드(20260824)·같은 추출 순서**를 써서 짝지은 비교가 되게 할 것"
  - "딥 팔 단독 재센터링 점수 · ρ(z_mate)"
  - "🔴 S99: 단독 최고점과 혼합 최고점이 다를 수 있다 — 둘을 따로 적어라"

사전_등록_판정 (🔴 결과 보고 바꾸지 않는다 — S8):
  기준: "exp_090 의 1632스텝·5시드·현행 구조 = 혼합 이득 +13.714 (argmax w 0.36)"
  통과: "그 기준 대비 **짝지은 부트스트랩 t >= 2.0** 인 지점. 고원이 평평하므로 t < 2.0 은 '더 낫다'고 말하지 않는다"
  기각: "전 지점 t < 2.0 → 현행 구조·5시드가 이 계열의 실용 최적. 축 종료하고 기록"
  🔴 크기예측금지: "정직면 이득을 LB 로 환산해 적지 마라 — 이 축 전이비가 −0.57 ~ +1.77 로 하나로 안 나온다(S93). **위치와 부호와 t 만 쓴다**"

