exp_id: exp_104
title: "새 화면으로 팔 공간 재훑기 — 결함면에서 내린 기각 42건 재판독 + TabPFN 재개"
date: 2026-08-26
owner: orchestrator

왜_지금:
  도구가_생겼다: |
    exp_103b 가 **정직면 혼합 화면을 피처·팔 스크린으로** 쓸 수 있음을 보였다(S181):
    **1σ 1.19~2.70점**(`t≥2` 요구 2.38~5.40) · **20 fit 을 2분 48초**. 100지점이 한 시간이다.
    지금까지의 훑기는 **느린 데다 결함면 위**였다.
  기각이_무효일_수_있다: |
    exp_091(22지점)·092(19지점)·093 이 전부 **결함면**(`season` sd 가 13.8배 틀린 입력, S134) 위였다.
    exp_102 축B 가 5지점만 다시 재서 **확대 배율이 지점마다 1.542~2.318 로 다르고 15쌍 중 8쌍에서 순위가 뒤집힌다**(S163)는 것을 보였다.
    **나머지 37지점은 아무도 다시 안 봤다.**
  자릿수: |
    LB +18 이 필요하고 팔 추가 전이 0.574 → **로컬 +31**. 새 화면이 1σ 2 로 잰다.
    피처(0.13, +138 필요)·가중(0.247, +73)은 자릿수가 안 맞는다. **팔 추가만 남았다.**

🔴_공통_규율:
  면: "정직면 OOT · **exp_097 이 고친 f64 입력**(`a5000:~/SungjinPark/exp096/work/X_f64_oot23.npy`). 결함면 금지."
  기준선: "**26.2698** (2팔 최적 · 1632스텝 · w=0.43). 결함면 13.7143 금지."
  시드: "전부 **5시드**(42/777/2024/101/7). 다양성·상관은 같은 시드 수·같은 학습 구간에서만 비교(S72·S86)."
  🔴_학습량_동반: |
    **S183: 고정 스텝에서 열·용량을 늘리면 그 자체로 약 −4점을 치른다**(S94 — 팔이 덜 학습됐다).
    그러니 **각 변형을 스텝 {816, 1632, 2720} 최소 3지점에서 굽고 자기 argmax 로 비교하라.**
    고정 스텝 비교만 하면 모든 확장이 손해로 보인다.
  🔴_사전등록_문턱:
    - "혼합 이득 − 26.2698 ≥ **+2.5**"
    - "**그리고** 짝지은 투수 블록 부트스트랩 **t ≥ 2.0**"
    - "결과를 보고 바꾸지 않는다(S8)."
  🔴_불확실성_보고: |
    **부트스트랩 t 만 적지 마라**(S178: 그것은 적합-간 잡음을 못 본다).
    **기댓값이 같아야 하는 판본을 최소 3개** 돌려 **적합-간 sd 를 직접 재고** 두 성분을 합쳐 보고하라.
  판정: "🔴 ρ 로 판정하지 마라(S83). ρ·단독점수·S103 회귀 잔차는 진단으로만."

# ─────────────────────────────────────────────────────────────
축A_기각_42건_재판독:      # 🔴 본론. 여기가 값이 크다.
  대상: |
    `experiments/exp_091/metrics.json`·`exp_092/metrics.json`·`exp_093/metrics.json` 에서
    **결함면에서 기각된 지점을 전수 열거**하고, exp_102 축B 가 이미 다시 잰 5지점을 빼고 재판독하라.
    계열: 폭·깊이 · dropout · weight decay · 시드 수 · LR 일정 · 피처 마스크(무작위/이름) · 4셀 멀티헤드 · 잔차 학습(exp_092 축 F·F0).
  🔑_우선순위: |
    결함면에서 **기준선에 가까웠던 지점**부터 하라 — 확대 배율이 지점마다 다르므로(1.542~2.318)
    **결함면에서 근소하게 졌던 것이 고친 면에서 이길 가능성**이 가장 크다.
    특히 **exp_092 축 F0**(2019 제외, `w=0.20` 에서 exp_091·092 통틀어 최고 11.879 · 시드 잡음 절반 · t +0.02 로 문턱 미달)이 1순위다.
  ⚠️_출하_가능성: "폭·깊이는 팀원 `.py` 를 고쳐야 한다(S101 — **입력 차원은 아니고 폭·깊이만**). 통과하면 비용을 적어라."

# ─────────────────────────────────────────────────────────────
축B_TabPFN_재개:
  왜: "exp_101 이 **2지점**(문맥 20k 단일 · 배깅 5×20k)만 재고 닫았다. 딥 슬롯은 42지점을 훑고 닫았는데 이건 얇다."
  두_손잡이:
    B1_피처_부분집합: |
      TabPFN v2 는 **열이 많으면 성능이 떨어진다**. 우리가 99열을 통째로 먹였다.
      상위 20/30/40/50열로 줄여 **단독과 `ρ` 를 함께** 재라 — **배깅이 아니라서 `ρ` 를 안 올릴 수 있다**(exp_101 에서 배깅이 `ρ` 를 +0.1717 올렸다).
      🔑 **이것만이 두 관문(신호·시간)을 동시에 미는 손잡이다** — 열이 줄면 시간도 준다.
    B2_부분_행_전문가: |
      전 행이 아니라 **우리 팔들이 가장 엇갈리는 5~10% 행에만** 태운다. 시간이 그만큼 준다.
      다양성이 가장 값진 자리에 집중하는 설계이고 한 번도 안 해봤다.
  🔴_시간_관문: |
    **채점 서버 = NVIDIA L4**. A5000 → L4 보수 계수 **2.94배**(S164, 대역폭 한계). 예산 여유 **484초**.
    exp_101 실측: 배깅 1개 A5000 **207초** → L4 보수 **609초 = 이미 초과**.
    **B1·B2 가 시간을 얼마나 줄이는지 A5000 에서 실측하고 ÷2.94 로 환산해 보고하라.**
    ⚠️ 신호 관문을 통과해도 시간에서 죽으면 후보가 안 된다 — **둘 다 적어라.**

