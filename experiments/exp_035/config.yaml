# 사용자 승인 2026-08-08 — 재측 범위 "전부 다시"
exp_id: exp_035
date: "2026-08-08"
title: "LGBM에서 재봤던 보정 축 전부를 CatBoost base 위에서 다시 재기 (학습 0건)"
base_exp: "exp_030 (C5_B3) · exp_033 (곡면·β 기준선)"

hypothesis: >
  구 base(LGBM_B3)에서 보정 축을 여럿 재고 대부분 닫았다. 그러나 **닫은 근거가 base에
  종속인 것이 이미 둘 확인됐다**:
  ① exp_029가 백오프 대상 선호를 "축 종속"이라 했는데 exp_033에서 **base 종속**이기도 함이 관측됐다
     (구 base `league` → 새 base `self`).
  ② 오프셋의 몫 자체가 base가 좋아지자 **74.45241 → 38.28802점(51.43%)**으로 줄었다.
  → **구 base에서 기각한 축들도 새 잔차 위에서는 다를 수 있다.** 전부 다시 잰다.

  ⚠️ **반대로, base와 무관하게 불변인 것도 있다.** `d_s`와 `d_r`의 상관 −0.83은
  **편차표가 라벨에서만 만들어지므로 base와 무관**하다. 그 사실이 무엇을 함의하는지는
  각 arm에서 따로 판정한다 — 미리 결론 내지 말 것.

# ---------------------------------------------------------------------------
arms:
  - id: R0
    spec: "무보정 C5_B3"
    role: "바닥. exp_030 재현 게이트"
  - id: R1
    spec: "exp_033의 블록 선택 칸 `S400_self` @ β 0.59072"
    role: "**대조군.** 이 실험의 모든 Δ 기준"

  # --- 축 ① 로짓 좌표계 (구 base에서 −0.19370점, 구조적 무효로 기각) ---
  - id: LG1
    spec: "로짓 공간 × d_s, `sigmoid(logit(p) + γ·d)`, γ는 공급 블록 닫힌 해"
    role: >
      **재측 근거**: exp_033이 새 base의 `p` 산포가 **8.38% 넓다**고 실측했다
      (sd 0.038065 → 0.041254, 범위 [0.383,0.635] → [0.333,0.658]).
      두 좌표계가 갈리는 폭은 `p(1−p)`의 변동에서 나오므로 산포가 넓어지면 여지가 커진다.
      ⚠️ 다만 새 base의 `p(1−p)` 변동계수는 **0.009439로 여전히 1% 미만**이라 큰 기대는 금물.
  - id: LG2
    spec: "LG1 + γ 블록 격자 재탐색"
    role: "γ 최적점이 β의 단순 환산(β/mean(p(1−p)))과 다른가 — 구 base에서는 0.06% 차이였다"

  # --- 축 ② d_r (구 base에서 단독 −38.85058점, 2항 미달로 기각) ---
  - id: DR1
    spec: "`p + β_r·d_r` 단독 1항, d_r도 k·대상을 자체 격자에서 선택"
    role: "구 base에서 −38.85058점으로 크게 졌다. 새 잔차에서도 그런가"
  - id: DR2
    spec: "`p + β_s·d_s + β_r·d_r` 2항 동시 적합"
    role: >
      구 base에서 β_r이 단독 −0.367 → 동시 +0.327로 **부호가 뒤집혔고** β_s가 49% 부풀었다.
      **두 축의 상관 −0.83은 base 무관이므로 같은 병리가 예상되나, 계수 값은 잔차에 따라 달라진다.**
      ⚠️ **상관을 반드시 재측정해 보고하라** — 구 값을 전사하지 말 것.

  # --- 축 ③ 투수손 2 리그항 절제 (구 base에서 이득의 83.5% 유지, 불안정 셀) ---
  - id: AB1
    spec: "R1과 동일하되 **L(투수손 2, ·) = 0**"
    role: >
      구 base에서 그 셀의 리그 계수는 빈티지마다 부호가 뒤집혔다(2022 −0.000041 → 2023 +0.00017
      → 2024 +0.0024). 절제해도 이득의 83.5%가 남았다. **새 base에서 그 비율은?**
    note: "⚠️ 새 base의 선택 칸이 `self`라 리그항이 미적중 행에만 붙는다 — 절제 대상 행 수가 구 base와 다르다. 반드시 행 수를 보고하라"
  - id: AB2
    spec: "R1과 동일하되 **투수손 2 미적중 행의 백오프만 제거**"
    role: "exp_026 C1과 같은 형태. 구 base에서 그 행들의 백오프는 순손실이었다"

  # --- 축 ④ 백오프 커버리지 변형 (exp_022 계열) ---
  - id: BK1
    spec: "미적중 행에만 리그항, 적중 행은 순수 개인 편차 (하드 백오프)"
    role: "구 base 후보 H의 구성. 새 base 선택이 `self`이므로 이것과 가까워졌다 — 차이를 명시하라"
  - id: BK2
    spec: "적중 행까지 리그항을 수축 비율로 투입 (소프트) = `S400_league`"
    role: "exp_033의 fold 오라클 칸. 블록은 self를 골랐으나 폭이 0.069점뿐이었다"

# ---------------------------------------------------------------------------
selection_discipline:
  rule: "선택이 필요한 것(DR1의 k·대상, LG2의 γ)은 **공급 블록 2022+2023에서만**. fold_2024는 선택 후 진단"
  not_selection: "LG1·DR2·AB1·AB2·BK1·BK2는 **사전 등록된 대조**다 — 고르는 게 아니라 재는 것이므로 fold_2024를 그대로 보고"

method:
  no_training: true
  reuse:
    fold_2024: "exp_030 `pred/` 3개 — sha256 대조 후 재사용"
    blocks: "exp_033 `pred/` 블록 재생성분 4개(`_st3`) — **exp_030의 손상된 블록이 아니라 이쪽을 써라**"
    code: "exp_033 `src/grid_c5.py` + exp_028 `src/fit_solo.py`(d_r·로짓 경로) 승계, sha 기록"
  float_form: "전개형 `d=(s−n·overall)/(n+k)`, 리그항 `L·(k/(n+k))`. 미적중 d=0.0 assert"
  leak: "복원 라벨은 타깃 전용(설계행렬 진입 시 abort). as-of forward-chaining. `train.csv` 2차 읽기로 독립 재검증"
  seeds: [42, 7, 2024]

validation:
  primary_metric: "fold_2024 valid_all(R+F) Brier"
  gate: >
    R0가 exp_030을, R1이 exp_033을 재현해야 한다. 기대값은 각 `metrics.json`에서 **읽어** assert.
    R1 기대 = 0.24790019374272 (763.27205), R0 기대 = 0.24799583985308 (724.98404).
  adoption: >
    3시드 부호 일치 AND |평균Δ| ≥ 대조군(R1) 시드 std × 3. **완화 금지.**
    ⚠️ **문턱 배수와 std 배수를 이름 붙여 구별**해 보고하라. paired std도 병기.
  caution: >
    ⚠️ **이 base의 시드 std가 크다**(exp_033에서 대조군 문턱 46.61476점). 구 base에서 통과하던
    크기가 여기선 미달일 수 있다. **문턱을 낮추지 말고 미달이면 미달로 보고하라.**

# ---------------------------------------------------------------------------
staleness_warning: >
  ⚠️ **exp_034가 같은 시간에 base의 iter를 교정하고 있다.** 성공하면 이 실험의 base가
  낡은 것이 된다. 그러나 ① 축의 **방향**(어느 축이 이롭고 해로운가)은 대체로 전이되고
  ② 승자만 새 base에서 다시 재는 비용이 **1분 미만**이라 지금 재는 것이 낭비가 아니다.
  **리포트에 "이 수치는 exp_030 구성의 base 위에서만 유효하다"를 명시하라.**

runtime:
  where: a5000
  expected_min: 35                          # 25~45
  eta_basis: >
    학습 0건. 실측 계보 — exp_025 0.35분 / exp_026 0.52분 / exp_028 1.10분 / exp_033 격자 0.638분.
    이번은 arm 10개 + DR1 자체 격자 + LG2 γ 격자 → **계산 1~1.5분**.
    `d_r` 표와 로짓 경로는 exp_028에서 **승계**하므로 신규 집계표가 적다.
    나머지는 전부 코드 작성(승계 둘 접합) **20~35분** + 회수·리포트 8분.
    → **25~45분.**
  contention: >
    ⚠️ **exp_034가 같은 서버에서 학습 중이다.** 원격 디렉터리를 `~/SungjinPark/experiments/exp_035/`로
    분리하고 `OMP_NUM_THREADS=2`로 돌려라. **exp_034 프로세스를 kill하지 마라.**

deliverables: [metrics.json, report.md, "src/ (승계 sha + 신규)", "curves/ (DR1 격자·γ 격자)", "pred/ (채택 후보만)"]

audit:
  required: false
  why: "감사된 경로 위의 사후 변환. 새 소스·조인 없음"
  but: "⚠️ **`d_r` 계열이 채택되면 exp_026의 `d_r` 리크 감사 요구가 살아난다 — 제출 전 선행 조건**"

risks:
  - "구 base에서 기각된 것이 새 base에서도 기각될 공산이 크다. **그래도 재는 것이 옳다** — 이미 두 축에서 base 종속이 관측됐다"
  - "`d_s`–`d_r` 상관 −0.83은 base 무관(편차표가 라벨에서만 만들어짐)이라 DR2의 병리는 재현될 가능성이 높다. **그래도 상관을 실측해 보고하라 — 전사 금지**"
  - "로짓은 `p(1−p)` 변동계수 0.009439로 여전히 1% 미만이라 무효일 공산이 크다. **산포를 먼저 재고 억지로 이득을 찾지 마라**"
  - "arm 10개를 fold_2024에서 보면 선택 편향이 생긴다 → selection_discipline으로 차단"
  - "C5는 미튜닝 첫 시도값이다. 모든 수치는 그 설정 위에서만 유효하다"
