# ⚠️ 초안 — 사용자 검수 대기. 발사하지 않았다.
exp_id: exp_033
date: "2026-08-08"
title: "새 base(C5_B3) 위에서 오프셋 축 재측정 — 블록 iter 교정 + k×대상 전면 재훑기 + β 적합"
base_exp: "exp_030 (C5_B3, fold_2024 무보정 0.24799583985308396 = 724.98404)"

hypothesis: >
  exp_030이 밑단을 CatBoost C5로 갈아끼워 **무보정 상태로 724.98404**를 냈다. 이는 오프셋을
  전부 얹은 구 base의 최고 관측(exp_026 C7, 723.54875)을 이미 넘는다.
  구 base에서 오프셋은 **+74.45241점**을 벌었다(exp_028 A1−A0). 그만큼이 새 base 위에서도
  남는다면 큰 폭이 열린다. **그러나 전이는 예측 불가다** — 지금까지 잰 네 축의 로컬→LB 전이 비가
  0.06~1.00으로 흩어져 있었고, base가 바뀌면 잔차 구조 자체가 바뀐다.

  ⚠️ **그리고 구 base에서 고른 `k=400 × league`를 그대로 옮길 수 없다.**
  ① exp_029가 **백오프 대상 선호는 축에 종속적**임을 확정했다(`d_s`는 league, `d_r`은 self).
     축이 아니라 **base**가 바뀌어도 같은 위험이 있다 — 오프셋이 태우는 것은 base의 **잔차**다.
  ② 지금 β 0.5704와 k=400은 전부 **LGBM_B3의 잔차 위에서** 골라진 값이다.
  → **곡면을 처음부터 다시 훑는다.**

# ---------------------------------------------------------------------------
# ⚠️ 먼저 고쳐야 할 것 — exp_030이 남긴 블록 결함
# ---------------------------------------------------------------------------
blocker:
  what: >
    **β는 공급 블록(2022+2023)에서 적합하는데, exp_030의 블록 2022 예측이 손상돼 있다.**
    ① C5_B3가 그 블록에서 LGBM_B3보다 **180~210점 나쁘다**(fold_2024에서는 +79점 좋은데 뒤집힌다)
    ② 고정 iter **282**가 자기 곡선 최소점(**110 / 130**)을 크게 지나
       **−102.5 ~ −126.5점의 정책비용**을 문다.
  diagnosis: >
    ②가 ①의 유력한 원인이다. iter 282는 "stage 1 fold_2023 argmin 375 × 학습행 비율
    653,728/870,752 = 0.751"에서 나왔다. **행 수에 선형으로 스케일하는 정책이 CatBoost에서,
    특히 작은 데이터에서 깨진다** — 실제 최소점은 110~130으로 정책값의 **1/3 수준**이다.
    ⚠️ 이건 exp_030만의 문제가 아니라 **iter 승계 정책 자체에 대한 관측**이다.
  fix: >
    **블록 2022·2023을 각자의 조기 종료로 다시 만든다.** 스케일 정책을 쓰지 않고 블록마다
    자기 곡면에서 argmin을 뽑는다. ⚠️ **이건 valid 오염이 아니다** — 블록은 β 공급용이고
    fold_2024가 아니다. 블록 자신의 곡선에서 고르는 것은 exp_024가 이미 한 방식이다.
  cost: "블록 4유닛(2022·2023 × 시드 42·7). 작은 데이터라 유닛당 3~6분, 동시 3개 → 10~15분"

# ---------------------------------------------------------------------------
stages:
  A_block_fix:
    what: "블록 2022·2023 × 시드 42/7을 각자 조기 종료로 재생성. cap 1650"
    check: >
      **재생성 후 C5_B3가 블록에서 LGBM_B3를 여전히 지는지 확인하라.**
      ① 여전히 진다면 → iter가 원인이 아니고 **작은 데이터에서 C5가 약한 것**이다.
         그 사실이 β 적합의 신뢰도에 직접 걸리므로 반드시 보고하라.
      ② 순서가 뒤집혀 이긴다면 → 정책비용이 원인이었고, **iter 승계 정책을 고쳐야 한다**는
         일반 교훈이 남는다(다른 실험에도 적용).
    invariant: "argmin이 cap에 닿으면 그 유닛은 무효. cap 올려 재실행"

  B_grid:
    what: "새 base 위에서 `d_s`의 k × 대상 곡면을 전면 재훑기"
    grid: "k [0, 30, 55, 111, 200, 400, 800, 1600, 3200] × 대상 {self, league}, 시드 42/7/2024"
    discipline: >
      **선택은 공급 블록에서만.** fold_2024는 선택이 끝난 뒤 읽는다.
      **구 base의 k=400 × league를 기본값으로 가정하지 마라** — 그건 다른 잔차 위의 답이다.
      곡면이 양쪽에서 감싸지는지 판정하고, 안 감싸지면 격자를 늘려라.
    also: "구 base 곡면(exp_029)과 **나란히** 보고하라 — 두 곡면이 얼마나 다른지가 그 자체로 관측이다"

  C_beta:
    what: "선택된 칸에서 β를 공급 블록 닫힌 해로 적합, fold_2024 3시드 평가"
    curve: >
      β 곡선이 **정확한 2차**인지 확인하라(구 base에서는 그랬다). 아니면 clip이 걸렸거나
      다른 일이 벌어진 것이다 — **`p`의 분포와 clip 발화 행 수를 반드시 보고**하라.
      ⚠️ 새 base의 `p` 산포는 구 base(sd 0.038065, 범위 [0.383, 0.635])와 다를 수 있다.
    compare:
      - "무보정 C5_B3 = 724.98404 (exp_030 3시드 평균)"
      - "구 base 완전 보정 = exp_028 A1 720.01460"
      - "구 base 무보정 = exp_028 A0 645.56219 → 오프셋이 벌어준 +74.45241점"

# ---------------------------------------------------------------------------
what_this_does_not_do:
  - "감사 — 채택되면 **제출 전 예외 없이** 별도 호출. CatBoost 감사 표면 셋이 이제 실제 후보 경로에 있다"
  - "zip 빌드 · 제출 — 사용자 판단"
  - "C5 하이퍼파라미터 탐색 — 미튜닝 첫 시도값이라 여지가 있으나 **이 실험의 변인이 아니다**"
  - "exp_030의 미해결(fold_2023 vs fold_2024 상호작용 부호 모순, 스태커 OOF 열 중요도) — 별도"

method:
  reuse:
    fold_2024: "exp_030 `pred/` 3개 — **sha256 대조 후 재사용**, 재학습 금지"
    code: "exp_030 `src/b3_cat.py`(블록 재생성용) + exp_029 `src/grid_ds.py`(격자용) 승계, sha 기록"
  float_form: "전개형 `d=(s−n·overall)/(n+k)`, 리그항 `L·(k/(n+k))`. 미적중 d=0.0을 k 격자 전부에 assert"
  leak: "복원 라벨은 타깃 전용. as-of forward-chaining(시즌 s의 표는 ≤s−1). `train.csv` 2차 읽기로 독립 재검증"
  seeds: [42, 7, 2024]

validation:
  primary_metric: "fold_2024 valid_all(R+F) Brier"
  gate: >
    무보정 C5_B3가 exp_030을 재현해야 한다 — 3시드 각 abs_diff < 5e-6.
    기대값은 `exp_030/metrics.json`에서 **읽어** assert하라(전사 금지).
  adoption: "3시드 부호 일치 AND |평균Δ| ≥ 대조군 시드 std × 3. 완화 금지. paired std 병기"
  caution: >
    ⚠️ **C5_B3의 시드 std가 구 base의 7.9배**다(3.88e-05 vs 4.90e-06). 문턱이 그만큼 높아지므로
    구 base에서 통과하던 크기가 여기서는 미달일 수 있다. **문턱을 낮추지 말고 그대로 적용**하고,
    미달이면 미달로 보고하라.

runtime:
  where: a5000
  expected_min: 45                          # 35~60
  eta_basis: >
    - Stage A 블록 4유닛: exp_030 실측에서 블록 유닛은 작은 데이터라 유닛당 3~6분,
      동시 3개 → **10~15분**
    - Stage B 격자 18칸 × 3시드: 학습 0건. exp_029 실측 **0.58분**(20칸×3시드) → **1분 미만**
    - Stage C β 적합·평가: 닫힌 해, **1분 미만**
    - 코드: 승계 둘을 접합하는 수준 → **20~30분**
    - 회수·집계·리포트: **10분**
    → **35~60분.**

deliverables: [metrics.json, report.md, "src/ (승계 sha + 신규)", "pred/ (블록 재생성분 + 채택 후보)", "curves/ (블록 곡선 + k 곡면 + β 곡선)"]

audit:
  required: false
  why: "이 실험 자체는 감사된 오프셋 경로 + exp_030 base. 새 소스·조인·타깃 파생 없음"
  but: "⚠️ **제출로 가면 예외 없이 감사**. CatBoost 표면 셋(미지 범주의 test 처리 / ordered TS 학습구간 밖 참조 / 추론 코드 행 독립성)이 이제 실제 후보 경로에 있다"

risks:
  - "블록 재생성 후에도 C5_B3가 블록에서 지면 **β 적합의 토대가 흔들린다.** 그 경우 β를 블록 2023 단독으로 재는 선택지가 있으나 규약 #6(최신 2개)에서 벗어나므로 사용자 판단 사항이다"
  - "새 base의 잔차 구조가 달라 **오프셋이 구 base만큼 못 벌 수 있다.** +74.45점이 재현된다는 보장은 없다"
  - "곡면이 구 base와 다른 칸을 가리키면 그것 자체가 관측이나, **두 base의 곡면을 섞어 해석하지 말 것**"
  - "C5는 미튜닝이므로 이 실험의 모든 수치는 **C5의 이 설정 위에서만** 유효하다"
