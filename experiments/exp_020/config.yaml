exp_id: exp_020
date: "2026-08-06"
hypothesis: >
  exp_019 C1의 2단 오프셋(−1.04e-04)은 exp_010 D 위에서 측정됐다. 최종 제출 계보는
  exp_016 B3(모드 스태킹)다. **B3가 이미 이 정보를 흡수했는가, 아니면 오프셋이 그 위에도
  더해지는가.** exp_019 D3가 예측 파일 부재로 미확인으로 남긴 바로 그 값이다.
base_exp: exp_016 B3 · 오프셋 기계는 exp_019 C1

primary_question: >
  B3 잔차를 d_s에 회귀한 기울기 β_B3가 얼마인가.
  β_B3 ≈ 0 → B3가 흡수했다 (오프셋 추가 이득 없음, C1과 B3는 같은 정보를 다르게 쓴 것)
  β_B3 ≈ 0.45 (A0 수준) → 전혀 안 흡수했다 (가법, 결합 시 ~0.24810 기대)
  중간 → 부분 흡수, 그 비율이 곧 결합 이득
  **어느 쪽이 나오든 다음 제출의 스펙이 결정된다.**

# ---------------------------------------------------------------------------
# 비용 때문에 exp_019에서 의도적으로 벗어난 점 — 결과를 보기 전에 등록한다
# ---------------------------------------------------------------------------
preregistered_deviations:
  - id: DEV1
    what: "시드 42 단독 (exp_019는 3시드)"
    why: "B3 1회가 12~34분이라 3시드면 2~5시간. 부호와 크기를 먼저 본다"
    consequence: >
      **시드 판정 불가.** 사전 등록 기준(3시드 동부호 AND 3×시드std)을 적용할 수 없다.
      이 실험의 산출은 **채택 판정이 아니라 β_B3의 크기 추정**이다.
      채택하려면 시드 반복이 별도로 필요하다 — report에 명시할 것.
  - id: DEV2
    what: "β 풀링 블록 = 2022 + 2023 (exp_019는 2020~2023)"
    why: "블록 2020·2021은 B3 fit이 2회 더 필요해 24~68분이 추가된다"
    consequence: >
      exp_019 D5에 따르면 A0 잔차에서 2022+23 풀링 β는 0.525로 사전등록 풀링 0.450보다 크다.
      **B3에서도 같은 방향이면 β_B3가 과대 추정될 수 있다.**
      비교 공정성을 위해 **A0에 대해서도 같은 2022+23 풀링 β를 재산출해 나란히 보고**하라
      (exp_019 pred 재사용, 학습 없음). 그것이 이 실험의 정직한 대조군이다.
  - id: DEV3
    what: "B3 셀 모델 iter는 exp_016 fold별 값을 그대로 승계"
    why: "exp_016 재현이 목적이지 iter 재탐색이 아니다"

# ---------------------------------------------------------------------------
model:
  stage1:
    spec: "exp_016 B3 그대로 — 셀 모델 4개 + OOF 스택 4열 + 스태커"
    params: "exp_010 D 파라미터 (lr 0.01 · num_leaves 15 · min_data 5000 · ff 0.7 · bagging 0.8/1)"
    reproduction_gate:
      what: "fold_2024 B3 valid_all Brier @iter 650(P4) = 0.248191, @2800(오라클) = 0.248176"
      tolerance: 5e-6
      on_fail: "즉시 중단·보고"
  stage2:
    spec: "exp_019 C1 그대로 — p' = clip(p + β·d_s, eps, 1-eps), 절편 없음"
    reuse: "exp_019/src/offset.py, exp_019/src/features_platoon.py를 sha 보존해 사용"
  seed: 42

# ---------------------------------------------------------------------------
required_b3_runs:
  - {block: 2022, train: "≤2021", predict: 2022, use: "β 적합용 OOF 잔차"}
  - {block: 2023, train: "≤2022", predict: 2023, use: "β 적합용 OOF 잔차"}
  - {block: 2024, train: "≤2023", predict: 2024, use: "보고 대상 (주 판단 fold)"}
  note: "3회. 각 회가 셀 모델 4개 + 내부 OOF + 스태커를 포함한다"

arms:
  - id: E0
    desc: "B3 무보정 (재현 게이트 대상). fold_2024 valid_all"
  - id: E1
    desc: "B3 + 선형 오프셋 × d_s, β는 블록 2022+2023 풀링"
  - id: E2
    desc: "(참고) B3 + 오프셋, β를 valid 2024에서 적합한 **오라클** — 상한 표시용, 채택 근거 아님"

# ---------------------------------------------------------------------------
diagnostics:
  D1_beta_b3:
    what: "β_B3 (블록 2022+2023 풀링) 및 블록별 개별값, 표준오차"
    compare_to: "같은 블록 풀링으로 재산출한 β_A0 (exp_019 pred 재사용, 학습 없음)"
    report: "β_B3 / β_A0 비율 = B3가 남긴 헤드룸의 비율"
  D2_absorption:
    what: >
      B3의 스택 4열이 d_s와 얼마나 상관되는가 (특히 p_is_rev_only — corr(d_s,d_r)=−0.787이므로
      스택 열이 조건부 정보를 간접 운반할 수 있다). 상관·부분상관 보고.
    why: "β_B3가 작다면 '왜 작은가'의 기전 후보"
  D3_combination:
    what: "E1의 Δ vs C0. 그리고 B3 단독 Δ + C1 단독 Δ 와 비교해 가법성 판정"
    report: "가법 / 부분중복 / 상쇄 중 무엇인지 수치로"
  D4_coverage:
    what: "룩업 적중/미적중 분해 (exp_019 D4와 같은 형식)"

# ---------------------------------------------------------------------------
validation:
  primary_metric: "fold_2024 valid_all Brier"
  secondary: [valid_R, valid_F]
  mask: "exp_004 마스크 유지"
  iter_policy: "exp_016과 동일하게 P4로 재현 게이트를 통과시킨 뒤 P10 값도 산출"
  slope_leak_assert: "β 적합에 쓰인 최대 시즌 < valid 시즌 — 런타임 확인"
  never: "valid 2024 잔차로 β를 고르는 경로 금지 (E2는 상한 표시 전용이며 선택에 쓰지 않는다)"

runtime:
  where: a5000
  expected_min: 85                       # 50~120
  eta_basis: >
    실측표 'B3 스태킹 1 (seed×fold) = 12~34분' × 3회 = 36~102분.
    **후보 E 빌드가 같은 서버에서 동시 진행**하므로 경합 계수 1.2~1.5 적용 → 43~153분.
    오프셋 적합·진단은 닫힌 해라 초 단위. 중앙 추정 85분.
  contention_warning: "동시 실행 중인 후보 E 빌드와 CPU를 나눈다. 실측이 ETA를 넘으면 즉시 보고"

deliverables: [metrics.json, diagnostics.json, report.md, "src/", "pred/"]

audit:
  required: true
  when: "채택해 제출 경로에 넣기 전. 이번 실험 자체는 exp_019 코드 재사용이라 표면이 같다"

risks:
  - "DEV1로 시드 판정이 불가하다 — 채택 결정에 쓰지 마라"
  - "DEV2로 β가 과대 추정될 수 있다. A0 동일 블록 대조가 그 보정선이다"
  - "B3 재현 게이트가 실패하면(exp_016 이후 코드가 흘렀다면) 전부 무효 — 먼저 확인할 것"
