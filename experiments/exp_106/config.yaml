exp_id: exp_106
title: "현 팔 구성에서 앙상블 가중 전면 재적합 — 고친 정직면"
date: 2026-08-26
owner: orchestrator
type: read-only refit (재학습 0)

동기: |
  사용자 질의: "앙상블 비율 조정도 최적인지 체크해야되지 않나?"
  장부 확인 결과 현 배포 가중은 전부 낡은 좌표에서 적합됐다.
    - exp_078(15축 동시 적합, "재고 비어 있음") = 08-21 17:45  → 딥 팔은 08-24 도착
    - exp_095(가중 격자 416점, v=0)          = 08-25 10:16  → exp_097 이 08-25 13:06 에 그 면의 결함을 찾음.
                                                              S134 가 재판독 대상으로 명시, 미수행
    - w_ebm / 안쪽 w_v6                      = 08-16, 좌표에 딥 팔 없음
  그리고 S141 척도 법칙상 w_deep 0.20 → 0.40 이 mate 내부 축 진폭 단위를 (1-w_deep) 배로 밀어,
  그 축들이 자기 꼭지점의 0.60 자리에 서 있다(각자 최대이득의 15.6% 누수).
  S123(후보 CG, LB -3.04)의 유력 기전이 바로 "팔을 바꿨는데 가중을 안 다시 풀었다" 이다.

면: |
  exp_104 `surface104.py` 의 고친(f64) 정직면. BASE_RC 앵커 통과 필수.
  🔴 결함면(exp_089~095) 수치를 인용 금지(S134). 결함면 값과의 대조는 §5 에서만, 재판독 목적으로만.

축 (전수 열거 — 없는 것을 지어내지 말고 실제 패키지에서 읽어 확정할 것):
  루트:
    - blend.json  w_v6      (파트너 팔 지분, 현 0.7)   # 우리 최상위. 안쪽 w_v6 와 이름 충돌 주의(S36·S117)
    - blend.json  c_aa      (현 0.25244)
    - blend.json  c_T70     (현 0.04756)               # S70: stage-2 팔이라 오프셋을 안 받는다
    - blend.json  alpha
  mate 내부:
    - mate/model/blend.json  w_v6   (안쪽 v6:Q, 현 0.6668397489)
    - mate/model/blend.json  w_ebm  (현 -0.1)
    - mate/model/blend.json  w_deep (현 0.40)
  종속: d_adj 는 매 지점에서 재유도(자유도로 세지 않는다)

절차:
  1. 배포점 재현: 현 상수로 정직면 점수를 내고, 딥 팔 2160스텝 5시드·AA 6시드 등 현 팔 구성과 일치함을 확인.
     게이트 — 배포 산술 재현 항등 앵커(같은 세션, S13).
  2. 축별 1자유도 조건부 스윕 → 각 축의 배포점 잔여.
  3. 전축 동시 적합(결합 argmax). 🔴 S44: Gram 조건수가 크면 np.linalg.solve 금지, 고윳값 절단(rcond 1e-10) 사영.
  4. 🔴 sd 맞춤 이득 병기 필수(S25·S33) — 가중 축 이득의 대부분은 정보가 아니라 척도이고,
     척도 몫은 alpha 로 사는 것이며 그 통로는 exp_078 잔여 +0.2546 으로 거의 닫혀 있다.
     척도를 걷어낸 뒤 부호가 뒤집히는 축을 명시할 것(exp_080 에서 실제로 뒤집힌 전례 있음).
  5. 재판독: 같은 스윕을 결함면에서도 돌려 exp_095 의 v=0 결론이 고친 면에서 유지되는지 판정.
     🔴 결함면 *순위*를 인용하지 말 것(S163) — 판정만 낸다.
  6. 직교성: 각 축 δ 와 exp_078 15축 기저의 ρ. 새 자유도인지 소진된 공간인지(S19).
  7. mate 내부 / 루트 구분을 결과표에 명시(S141). 내부 축은 φ 미식별(S142)이므로
     "전량 착륙" 을 권고하지 말 것 — 부분 걸음만.

잡음 측정 (🔴 S178 — 부트스트랩만으로 판정 금지):
  - 개수 맞춤 귀무: 같은 개수의 무작위 직교 방향으로 같은 절차를 돌린다(≥200회, exp_081 방식).
  - 적합-간 sd: 시드/표본을 바꾼 판본 ≥3 으로 직접 측정. 보고 1σ = sqrt(boot_sd^2 + fit_sd^2).
  - 🔴 귀무를 둘 이상 쓰고 판정이 뒤집히는지 볼 것(S179).

사전 등록 문턱 (🔴 S8 — 결과를 보고 바꾸지 않는다):
  후보로 승격: (결합 argmax - 배포점) >= +2.5 점  AND  sd 맞춤 후에도 >= +1.5 점  AND  t >= 2.0
  ⚠️ 기대 자릿수 고지: 팀 원장 가중 축 전이계수 0.247 → 정직면 +2.5 는 LB 약 +0.62.
     이 실험의 값은 "크게 번다" 가 아니라 ① 낡은 가중이 점수를 흘리고 있는지 확인 ② S134 재판독 완료 다.
     문턱 미달이면 "가중은 현 팔 구성에서도 자기 자리에 있다" 로 닫고 더 안 판다.

자원: CPU 2코어 상한. GPU 금지(exp_104 가 두 장 다 쓰는 중). 재학습 0.
ETA: 1.5~2시간 (스윕은 저장 벡터 대수 · 귀무 200회가 지배).
산출물: experiments/exp_106/metrics.json + report.md
