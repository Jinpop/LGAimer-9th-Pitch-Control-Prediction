title: "Q 팔 시드 확장 18개 — 팀원 정품 빌더(qdeploy3.py) · CPU 재현 증명 후 GPU 생산"
학습_건수: "CPU 검증 seed 42·7 각 25모델 · GPU 생산 18시드 × 25모델 = 450 fit"
제출물: "없음 — 모델 파일만 팀원에게 인계 (조립·mu 재유도·d_adj 는 팀원 몫)"

왜: |
  팀원 인계팩 `Q_18seed_kit_v2.zip` 의 배포급 Q 빌더로 시드를 3 → 18 로 늘린다.
  기대값은 팀원 제91 블렌드 직접 실측 천장(3→∞) +0.35 에서 역산한 **+0.29** —
  팀 검출한계 +1.4 의 1/5. 이 숫자를 키우지 않는다.

변인 (🔴 둘이다 — 팀원은 "시드만" 을 기대하고 있다):
  1: "시드 3 → 18"
  2: "CatBoost CPU → GPU (task_type='GPU', A5000)"
  근거: 18개를 전부 GPU 로 구우면 자기들끼리는 동질. 기존 CPU 3시드와 섞으면 안 된다.

