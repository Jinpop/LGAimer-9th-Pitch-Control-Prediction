exp_id: exp_082
date: 2026-08-22
title: "실패유형 오프셋 축 — b 꼭지점 풀기 + c 축 첫 특성화"
학습_건수: 0
제출물: "없음 (지휘자가 결과로 후보 2건 빌드를 지시)"

왜_최우선인가: |
  팀원 `submit_BO_offset_bonly.zip` 이 BO(1115.9913864857) 대비 **+2.6766924977** 로 팀 신기록
  1118.6680789834 을 냈다. 오늘 우리가 산 축들의 꼭지점 이득이 +0.15 수준인데 이 축은
  **절반만 사고 +2.68** 이다.
  🔴 그리고 이 축은 내가 08-20 에 후보 BM 으로 닫은 그 축이다 — 내 판단이 틀렸다.
  🔑 `b = −0.05` 는 실렸고 **`c = 0.0` 은 안 실렸다.** 두 자리가 즉시 열린다.

산술_출하본에서_읽음: |
  z = alpha·u + beta_skew·u² + d_adj + b·(lg_mr − mu_mr) + c·(lg_wo − mu_wo),  u = logit_mix
  lg_mr = logit(clip(p_mr, 1e-6, 1-1e-6)),  p_mr = (p_is_mid_only + p_is_rev_only + p_is_both)/S
  lg_wo = logit(clip(p_wo, ...)),           p_wo = p_is_wayoff_true/S
  S = p_mr + p_wo + max(0, 1 − p_mr − p_wo)
  시드별로 만든 뒤 **로짓 평균** (팀원 규약).
  상수: b −0.05 · c 0.0 · mu_mr −0.45376277509804325 · mu_wo −2.0056142032773767
        d_adj 0.028693042338963914 (오프셋 켠 뒤 재해) ← BO 는 0.02875748759679648

stage0_게이트:
  G0a: "팀원 zip 의 mate 경로를 보정 프레임(tr2024)에 돌려 `lg_mr`·`lg_wo` 를 뽑고, 그 값으로 재구성한 최종 예측이 **팀원 산술과 일치**하는지 (b=−0.05, c=0)"
  G0b: "b=0·c=0 으로 두면 **BO 예측이 정확히 재현**되는가 (항등 앵커의 계산판)"
  G0c: "팀원 `d_adj` 0.028693042338963914 를 우리 용해기로 **독립 재유도**. |diff| < 1e-15"
  중단: "하나라도 실패하면 정지·보고. 이후 단계 금지"

stage1_b_꼭지점:
  방법: |
    u = b − 0 = −0.05 (BO 기준 이동량).  g = +2.6766924977 (실측).
    δ_b = ∂p_final/∂b 를 BO base 에서 수치미분(중심차분).  G_bb = mean(δ_b²).
    L = [g/K + u²·G_bb] / (2u),   u* = L/G_bb,   최대이득 = K·L²/G_bb.
  🔴 프레임_주의: "S49 — K·Q 는 프레임 조건부다. 대역(tr2024)·cov·band·real5 **네 프레임 전부**에서 G 를 내고 그 폭을 보고하라. 꼭지점 해도 프레임별로 낼 것"
  낼_것: "b* · 최대이득 · 남은 몫(현 −0.05 대비) · 프레임별 폭 · 2차 근사 오차(비선형)"

stage2_c_축_특성화:
  질문: "c 는 한 번도 안 샀다. 살 값이 있는가"
  낼_것:
    - "rms(δ_c) · K·G_cc · **b 축과의 |ρ|** · 기존 15축 + q_beta/q_league/셀 축과의 최대 |ρ|"
    - "🔴 `K·Q = 1` 진폭과 그 **0.2배**(S42 매수 규약)"
    - "비선형 1% 한계 진폭"
    - "정직면 이득 — 원값과 **sd 맞춤값 둘 다** (S25·S33: 척도분을 빼지 않으면 alpha 와 두 번 산다)"
  🔴: "`lg_wo`(멀리 빗나감)와 `lg_mr`(방향 오류)이 얼마나 다른 정보인지가 핵심이다. corr(lg_mr, lg_wo) 를 반드시 내라"

stage3_동시_해:
  방법: "b·c 2축 그람으로 `u* = G⁻¹L` — 단 c 의 L 은 아직 없다. **b 만 아는 상태의 조건부 해**와 **c 를 산 뒤의 동시 해 식**을 둘 다 내라"
  🔴: "c 의 L 이 없으므로 c 를 착륙에 넣지 마라. 진폭 설계만."

사전_등록_판정:
  A: "b 남은 몫 ≥ +0.5 또는 c 가 새 방향(최대 |ρ| ≤ 0.5)이고 sd맞춤 정직면 ≥ +2.0 → 후보 2건 빌드"
  B: "둘 중 하나만 → 그것만 빌드"
  C: "둘 다 아니면 이 축 종료하고 기존 캠페인 순서 복귀"
  🔴: "결과를 보고 문턱을 바꾸지 않는다 (S8)"

운영:
  스레드: "OMP 계열 전부 6"
