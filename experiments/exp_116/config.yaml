threshold_preregistered: |
  🔴 결과를 보고 바꾸지 않는다 (S8).
  ρ_중앙값 ≥ 0.25 인 축만 다음 단계로 보낸다 (출하된 4쌍의 최저 = pit_ball3 0.254).
  그 축들에 대해서만 exp_115 방식으로 **천장을 측정**한다 (라벨 0개·LB 0슬롯):
    자기 곡률 q 실측 → λ 눈금(연도전이) → 천장 = A'²/4q
  천장이 검출한계 **+1.4** 를 넘는 축만 프로브 후보로 보고한다.

next_step_if_pass: |
