why: |
  2026-08-28 에 사후 상수 축 셋을 실측으로 닫았다(타자 주효과 CW −2.6410708540 ·
  딥 학습량 CY −1.5412224990 · rmac FC −1.4603140511). 상수 공간이 소진됐다.
  그런데 같은 날 유일하게 이긴 것은 `splits.py` 계열의 새 셀 위 작은 프로브였다
  (CZ +3.4821813385). 이 계열의 LB 총합은 +10.13 (CT +6.6519 · CZ +3.4822), 3발 2승.
  🔑 그런데 `splits.py` 는 (주체 × 상황) 쌍을 **4개만** 선별했다
  (연도전이 ρ: 투수×타자손 0.515 · 타자×투수손 0.414 · 투수×2스트 0.284 · 투수×3볼 0.254).
  48개 원본 열에서 나올 수 있는 쌍은 12개가 더 있고 아무도 안 쟀다.

object: |
  🔴 대상은 `splits.py` 의 객체 **그대로**다 — 잔차 셀이 아니다.
    lrate = (ls + k*league) / (ln + k);  lgc = logit(lrate) − logit(league)
    rate  = (cs + k*p_all[:,None]) / (cn + k)
    D     = (logit(rate) − logit(p_all)[:,None]) − lgc[None,:]
  즉 **라벨 EB 수축(k=75) + 주체 주효과 제거 + 리그 셀효과 제거** 다.
  팀 원장의 제59(잔차 구조 70종 셀, 연도전이 0) · 제98(잔차 아틀라스 107셀)은
  **잔차 위에 지은 다른 물건**이므로 그 기각이 이 객체에 자동 적용되지 않는다.
  ⚠️ 단 제81(경기 내 부하·이닝 민감도 ρ −0.027/+0.036 기각)은 이닝 축과 겹친다 —
  그래서 이닝 축을 **음성 대조**로 넣는다. 그것이 낮게 나와야 스크린이 믿을 만하다.

metric: |
  연도전이 상관 ρ — `splits.py` 헤더가 4쌍에 쓴 것과 **같은 지표**.
  창 A(season ≤ Y) 로 지은 D 와 창 B(season = Y+1) 로 지은 D 를
  같은 (주체, 셀) 키에서 상관. 표본수 가중. 연도쌍 전부에서 내고 중앙값·범위 보고.

