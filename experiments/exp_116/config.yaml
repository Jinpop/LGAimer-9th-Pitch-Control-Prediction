deployment_check: |
  🔴 S170 — 배포 시점 취득처를 먼저 못 박는다.
  후보 전부가 **2025 test 에 있는 현재 행 열**만 쓴다(`num_runners_on`·`outs_before`·
  `strikes_before`·`balls_before`·`li`·`score_diff_pitcher_team`·`top_bottom`·
  `inning`·`batter_team_id`·`pitcher_team_id`·`pitcher_id`·`batter_id`).
  표는 train 에서 동결한다. 트랙맨 0열. 출하된 `sp_*` 축과 **완전히 같은 형태**다.
  규칙 2-4: 행별 조회뿐, 다른 test 행이나 전체 분포를 안 읽는다.

