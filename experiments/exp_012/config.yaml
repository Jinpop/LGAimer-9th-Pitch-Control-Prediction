# 캠페인 4 — 지휘자 작성 2026-08-05
exp_id: exp_012
date: "2026-08-05"
hypothesis: "라벨이 '의도 대비 위치'인 만큼, trackman의 투구 위치·무브먼트 산포(제구 일관성)가 정적 프로파일 65피처보다 훨씬 강한 신호를 담고 있다"
base_exp: "exp_002"           # 프로파일 2세대 — 데이터 자산 + 검증
method:
  notes: >
    exp_002 매핑 사전을 재사용해 투수별 심화 지표를 산출한다. exp_003의 프로파일은
    구속·회전 위주였고 gain 1.5%에 그쳤다. 이번엔 '제구' 자체를 겨냥:
      - 투구 위치(plate_x/z 계열)의 표준편차·분위폭 = 커맨드 일관성
      - 존 중앙 투입률·존 이탈률 (라벨 실패 정의 ①②와 직결)
      - 카운트 상태별(유리/불리) 위치 산포 차이 = 압박 하 제구 붕괴 지표
      - 구종별 무브먼트 일관성(IVB/HB의 std), 릴리스 포인트 반복성
      - 좌우타자 상대별 분리 지표
    trackman 실제 컬럼 30개를 먼저 확인하고 가용 지표만 산출할 것(없는 컬럼은 보고).
    전부 2024년 말 컷오프 정적 테이블(test 재현 가능), fold 검증은 fold별 as-of 재산출.
validation: {primary_metric: brier, note: "exp_008 R1(RF) 위에 조인해 delta 측정 — 강한 base 기준 판정"}
runtime: {where: a5000, expected_min: 45}
