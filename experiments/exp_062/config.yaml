exp_id: exp_062
date: "2026-08-20"
hypothesis: >
  exp_060/061 이 NN 을 학습시킬 때 쓴 **v6 파생 44열**과, 배포 추론에서 출하 v6 파이프라인이
  자기 표로 계산해 주는 **같은 44열**이 정의상 일치하는가.
  어긋나면 **모델이 학습 때와 다른 피처를 보게 된다** — NN 후보의 빌드 선행 조건이다.
base_exp: exp_061

🔴_이것은_실험이_아니라_게이트다: >
  채택/기각 판정을 하는 실험이 아니다. **NN 을 후보로 빌드해도 되는지를 가르는 검사**이고,
  통과하지 못하면 NN 후보를 만들지 않는다. exp_060 러너가 스스로 신고한 위험이며
  (`report.md` §44열 재구축 — "팀원 학습 행렬과의 동일성은 보장되지 않는다"),
  지휘자가 exp_061 report §지휘자 판정 2번에 **빌드 선행 조건**으로 등재했다.

배경: >
  `features_sp.txt` 99열 중 **44열**(p6 6 · sit 6 · idea 2 · i3 8 · rt/r2/cg 22)은 train.csv 에 없다.
  - **학습 쪽(우리)**: exp_060 이 출하본 `pipeline.py`(sha `a3181a10a1c621524460f14bc06b3c7f188fe23955814bb5e5b890e0df3016c9`)의
    `build_tables`/`build_pitch_model`/`build_anom_table`/`apply_*` 를 그대로 import 해
    **연도별 as-of(hist = season < Y)** 로 재구축했다. 캐시 `~/SungjinPark/exp060_nn/cache/frame99.parquet`.
  - **추론 쪽(출하)**: 배포 zip 의 `mate/` 자식 프로세스가 `model/tables/` 의 **얼린 표**로 계산한다.
  두 경로가 같은 값을 내는지 **한 번도 대조한 적이 없다.**

  ⚠️ 러너가 신고한 구체적 위험 둘:
   ① 구종모델 라벨 매핑을 러너가 정했다 — `tagged_pitch_type` 무모호 표기만(1,722,459/1,793,078행 유지),
      Undefined/Other/Sweeper 드롭. **팀원이 무엇을 썼는지 모른다.**
   ② 매핑 대상 선택도 러너 결정 — exp_052 검증 매핑 685명.

## ── 검사 설계 ──
프레임: >
  **train season==2024 행 253,507개** — 이유 셋:
   ① 우리 학습 캐시(frame99)에 그 행들의 44열이 이미 있다
   ② 출하 경로를 그 행에 돌릴 수 있다(대회 test 가 아니어도 코드는 같다)
   ③ 🔴 **대역(band) 프레임을 쓰지 마라** — 시즌 경계 의존 피처가 축퇴한다(계보 사고 4회, 최근 BI).

비교_A_정의_일치:
  방법: >
    출하 zip(`submit_BG_joint_vertex.zip` 또는 `submit_BL_joint_axes.zip`, 어느 쪽이든 `mate/` 동일)을 풀어
    그 안의 v6 피처 생성 경로를 **2024행에 대해** 실행하고, 44열을 뽑아
    `frame99.parquet` 의 같은 행·같은 열과 대조한다.
  ⚠️_as_of_정합: >
    🔴 **출하 표는 `upto_2024`(≤2024)이고 우리 학습용 2024행은 `season<2024` 표로 만들었다.**
    이 둘은 **원래 다르다** — 그러니 단순 대조하면 반드시 어긋난다.
    올바른 비교는 둘 중 하나다:
     (a) 출하 코드에 **`upto_2023` 표를 물려** 2024행을 계산 → 우리 학습본과 같은 as-of → **값이 같아야 한다**
     (b) 우리 재구축 코드에 **`upto_2024` 표를 물려** 2024행을 계산 → 출하본과 같은 as-of → **값이 같아야 한다**
    **(a)를 주 경로로 하고 (b)를 교차 확인으로 쓴다.** 어느 쪽이든 as-of 를 맞추지 않은 대조는 무의미하다.
  판정: >
    열별 `max|diff|` · `mean|diff|` · 정확 일치 행 비율. **44열 전부** 보고.
    🔴 **"거의 같다"로 적지 마라** — 열마다 수치를 낸다.

비교_B_예측_영향:
  방법: >
    A 에서 차이가 나온 열이 있으면, **그 차이가 NN 출력에 얼마를 움직이는가**를 잰다.
    exp_061 배포 npz(`~/SungjinPark/exp061_nn/out2/nn99_d*.npz`, 4시드)를
    ① 우리 재구축 44열 ② 출하 경로 44열 두 입력으로 각각 추론해 예측 차를 낸다.
  판정_눈금: >
    로짓 공간 `max|Δ|`·`mean|Δ|`, 그리고 **환산 점수로 얼마인가**.
    ⚠️ 확률 이동폭은 점수로 직접 환산되지 않는다 — 이동이 정답 쪽인지 모르기 때문(S9 계열).
    대신 **fold_2024 valid 에서 두 입력의 Brier 차**를 직접 재서 환산하라. 그건 측정이다.

## ── 사전 등록 판정 ──
통과: >
  44열 전부 `max|diff| < 1e-6`(부동소수 수준) → **정의 일치. NN 후보 빌드 가능.**
조건부: >
  일부 열이 어긋나되 **비교 B 의 Brier 차가 |1점| 미만** → 빌드 가능하되
  **BUILD_PLAN 에 어긋난 열과 그 크기를 명시**하고 감사 대상에 넣는다.
실패: >
  Brier 차 |1점| 이상 → 🔴 **NN 후보를 만들지 않는다.**
  대신 선택지 둘을 보고한다: (i) 출하 경로 44열로 NN 을 **재학습**(fit 0.84분 × 4시드 = 약 6분, 캐시 재생성 필요)
  (ii) NN 을 v6 자식 안이 아닌 다른 위치에 넣는 설계 변경.
🔴_문턱_사전_등록: "이 문턱은 결과를 보고 바꾸지 않는다(S8)."

